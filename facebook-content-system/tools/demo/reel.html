<!doctype html>
<html><head><meta charset="utf-8">
<!-- Demo Reel renderer. render_reel.mjs injects window.__TL (timeline.json)
     and calls setup() once, then renderAt(t) for every frame. Every style is a
     pure function of t, so frames can be rendered in any order. -->
<style>
:root{--ink:#111418;--paper:#F6F5F1;--accent:#10B981;--accent-ink:#06291F;--warn:#F59E0B;--stop:#EF4444;
  --muted:#6B7280;--line:#2A2F36;--card:#1A1F26;--deep:#0B0E12;--text:#F3F4F6;--soft:#9CA3AF;--dash:#3A414B}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:var(--ink);
  font-family:Inter,'DejaVu Sans',sans-serif;color:var(--text);-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
.abs{position:absolute}
#bg{position:absolute;inset:0;background:
  radial-gradient(900px 700px at 12% 22%,rgba(16,185,129,.11),transparent 62%),
  radial-gradient(900px 900px at 92% 88%,rgba(16,185,129,.07),transparent 60%),var(--ink)}
#grid{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.065) 1.6px,transparent 1.8px);background-size:40px 40px}
#tag{left:65px;top:282px;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:28px;letter-spacing:.08em;
  padding:10px 22px;border-radius:999px;text-transform:uppercase}
#handle{right:65px;top:291px;color:var(--soft);font-weight:600;font-size:26px}
#ost{left:65px;width:950px;top:368px;display:flex;justify-content:center}
#ost .ostb{background:rgba(26,31,38,.94);border:2px solid var(--line);border-radius:26px;padding:18px 34px;font-weight:800;
  font-size:66px;line-height:1.12;letter-spacing:-.01em;text-align:center;max-width:900px}
.a{color:var(--accent)} .r{color:var(--stop)}
#stage{left:65px;top:560px;width:950px;height:450px}
#cap{left:65px;width:950px;top:1052px;height:196px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;font-weight:800;font-size:58px;line-height:1.16;letter-spacing:-.005em}
#cap .w{color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.55),0 0 20px rgba(0,0,0,.65)}
#cap .w.on{color:var(--accent)}
svg.i{fill:none;stroke:currentColor;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.layer{position:absolute;inset:0}
.center{display:flex;align-items:center;justify-content:center}
.chip{display:inline-flex;align-items:center;gap:10px;border-radius:999px;padding:10px 22px;font-weight:700;font-size:30px;
  background:var(--card);border:2px solid var(--line)}
.cursor{display:inline-block;width:4px;height:1em;background:var(--accent);vertical-align:-.12em;margin-left:3px}
.mono{font-family:'DejaVu Sans Mono',monospace}

/* D01-R2 three boxes */
.box{position:absolute;width:270px;height:340px;border-radius:28px;border:4px dashed var(--dash);background:rgba(26,31,38,.65)}
.bh{position:absolute;top:22px;left:0;right:0;display:flex;align-items:center;justify-content:center;gap:12px}
.num{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:26px;background:var(--line)}
.bt{font-weight:800;font-size:29px;letter-spacing:.06em}
.bi{position:absolute;top:84px;left:0;right:0;height:190px}
.bi > *{position:absolute;left:0;right:0;top:0;bottom:0;display:flex;align-items:center;justify-content:center}
.bs{position:absolute;bottom:22px;left:0;right:0;text-align:center;font-weight:700;font-size:28px;color:var(--soft)}
.row3{display:flex;flex-direction:column;gap:12px;align-items:flex-start;padding-left:34px}
.row3 div{display:flex;align-items:center;gap:14px;font-size:30px;font-weight:700}
.arrow{position:absolute;width:70px;height:40px;top:180px;color:var(--accent)}
.canvas{position:absolute;left:0;top:30px;width:950px;height:340px;border-radius:28px;background:var(--deep);border:2px solid var(--line);
  background-image:radial-gradient(rgba(255,255,255,.09) 1.5px,transparent 1.7px);background-size:28px 28px}
.node{position:absolute;width:132px;height:132px;border-radius:26px;background:var(--card);border:4px solid var(--accent);top:84px;
  display:flex;align-items:center;justify-content:center;color:#fff}
.nl{position:absolute;top:236px;width:240px;text-align:center;font-size:27px;font-weight:700;color:var(--text)}
.check{display:flex;align-items:center;gap:28px;height:104px;border-radius:24px;background:var(--card);border:2px solid var(--line);padding:0 30px;
  font-size:50px;font-weight:800;position:absolute;left:0;width:950px}
.cb{width:62px;height:62px;border-radius:14px;border:4px solid var(--dash);display:flex;align-items:center;justify-content:center;color:var(--accent-ink)}
.stamp{position:absolute;left:95px;top:120px;width:760px;height:170px;white-space:nowrap;border:10px solid var(--accent);border-radius:26px;color:var(--accent);
  display:flex;align-items:center;justify-content:center;font-weight:900;font-size:88px;letter-spacing:.04em;background:rgba(17,20,24,.82)}
.composer{position:absolute;left:0;top:10px;width:950px;height:170px;border-radius:28px;background:var(--card);border:2px solid var(--line);
  display:flex;align-items:center;gap:24px;padding:0 30px}
.avatar{width:84px;height:84px;border-radius:50%;background:linear-gradient(135deg,#1f9d77,#0f5e48);flex:none}
.input{flex:1;height:96px;border-radius:48px;background:var(--deep);border:2px solid var(--line);display:flex;align-items:center;padding:0 32px;font-size:38px;font-weight:600}
.mchip{position:absolute;top:230px;width:300px;height:150px;border-radius:24px;background:rgba(16,185,129,.10);border:3px solid var(--accent);
  padding:20px 22px;display:flex;flex-direction:column;gap:8px}
.mchip b{font-size:24px;letter-spacing:.08em;color:var(--accent)} .mchip span{font-size:32px;font-weight:700;line-height:1.15}

/* D16-R2 prompt */
.blk{position:absolute;top:0;width:215px;height:112px;border-radius:24px;border:4px dashed var(--dash);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px}
.blk .L{font-weight:900;font-size:58px;line-height:1;color:var(--dash)} .blk .n{font-weight:700;font-size:24px;color:var(--dash);letter-spacing:.04em}
.pcard{position:absolute;left:0;top:134px;width:950px;height:316px;border-radius:28px;background:var(--card);border:2px solid var(--line);padding:24px 32px;overflow:hidden}
.ph{display:flex;align-items:center;gap:14px;font-size:24px;font-weight:700;color:var(--soft);letter-spacing:.06em}
.ptask{margin-top:12px;font-size:42px;font-weight:700;color:#fff}
.pd{position:absolute;left:32px;right:32px;top:124px;bottom:18px}
.pd > *{position:absolute;inset:0}
.plab{font-size:24px;font-weight:800;letter-spacing:.1em;color:var(--accent);margin-bottom:10px}
.ptext{font-size:38px;font-weight:600;line-height:1.25}
.hl{border-radius:8px;padding:0 4px}
.ba{position:absolute;left:0;width:950px;border-radius:28px;padding:26px 32px;background:var(--card);border:3px solid var(--line)}
.ba .k{font-size:26px;font-weight:800;letter-spacing:.08em;margin-bottom:12px}
.ba .t{font-size:36px;font-weight:700;line-height:1.25}
.big{position:absolute;top:30px;width:215px;height:215px;border-radius:30px;background:var(--accent);color:var(--accent-ink);display:flex;
  flex-direction:column;align-items:center;justify-content:center}
.big .L{font-size:110px;font-weight:900;line-height:1} .big .n{font-size:30px;font-weight:800}

/* D05-R1 list */
.card5{position:absolute;left:65px;top:372px;width:950px;height:430px;border-radius:32px;background:var(--card);border:3px solid rgba(239,68,68,.55);padding:34px 40px}
.never{display:inline-block;background:var(--stop);color:#fff;font-weight:800;font-size:24px;letter-spacing:.1em;padding:8px 16px;border-radius:10px}
.numc{position:absolute;left:40px;top:110px;width:140px;height:140px;border-radius:50%;border:7px solid var(--stop);display:flex;align-items:center;
  justify-content:center;font-weight:900;font-size:84px;color:var(--stop)}
.ttl{position:absolute;left:214px;top:104px;width:560px;font-weight:800;font-size:60px;line-height:1.08;color:#fff}
.mask{position:absolute;left:40px;right:40px;bottom:36px;height:96px;border-radius:20px;background:var(--deep);border:2px solid var(--line);
  display:flex;align-items:center;padding:0 30px;font-size:36px;color:var(--soft)}
.ic5{position:absolute;right:40px;top:30px;color:var(--stop)}
.pill{position:absolute;top:842px;width:178px;height:72px;border-radius:20px;border:3px solid var(--dash);display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:36px;color:var(--dash)}
.chatm{position:absolute;left:0;top:20px;width:950px;height:420px;border-radius:30px;background:var(--card);border:2px solid var(--line)}
.paper{position:absolute;left:75px;top:20px;width:800px;height:400px;border-radius:18px;background:var(--paper);color:var(--ink);padding:36px 44px;
  box-shadow:0 30px 60px rgba(0,0,0,.45)}
.paper h3{margin:0 0 26px;font-size:42px;font-weight:800}
.prow{position:relative;font-size:38px;font-weight:600;height:62px;display:flex;align-items:center;gap:12px}
.ph1{position:relative;display:inline-block}
.strike{position:absolute;left:-4px;right:-4px;top:50%;height:6px;background:var(--stop);transform-origin:left center;border-radius:3px}
.tok{display:inline-block;background:var(--accent);color:var(--accent-ink);font-weight:800;border-radius:10px;padding:2px 14px}
.lrow{position:absolute;left:0;width:950px;height:70px;border-radius:20px;background:var(--card);border:2px solid var(--line);display:flex;align-items:center;gap:22px;
  padding:0 22px;font-size:40px;font-weight:700}
.lnum{width:50px;height:50px;border-radius:12px;background:var(--stop);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:30px}
</style></head>
<body>
<div id="root">
  <div id="bg"></div><div id="grid"></div>
  <div id="tag" class="abs"></div>
  <div id="handle" class="abs">@Asif.myself.page</div>
  <div id="stage" class="abs"></div>
  <div id="ost" class="abs"><div class="ostb"></div></div>
  <div id="cap" class="abs"></div>
</div>
<script>
const TL = window.__TL;
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const E = {
  out: x => 1 - Math.pow(1 - x, 3),
  io: x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2,
  back: x => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); },
  lin: x => x,
};
// eased progress of an animation that starts at a and lasts d seconds
const P = (t, a, d = .35, e = E.out) => e(clamp((t - a) / d));
// visible between a and b with fades
const vis = (t, a, b, fi = .25, fo = .25) => Math.min(P(t, a, fi), 1 - P(t, b - fo, fo, E.lin));
const B = i => TL.beats[i];
const beatAt = t => { let k = 0; TL.beats.forEach((b, i) => { if (t >= b.start) k = i; }); return k; };
// start time of the first word in beat b that matches re
function cue(b, re, off = 0) {
  const w = TL.words.find(w => w.beat === b && new RegExp(re, 'i').test(w.w));
  return (w ? w.s : B(b).vo_start) + off;
}
function el(tag, cls, parent, html) {
  const n = document.createElement(tag); if (cls) n.className = cls;
  if (html !== undefined) n.innerHTML = html; (parent || document.body).appendChild(n); return n;
}
function S(n, o = {}) {
  if (o.o !== undefined) { n.style.opacity = o.o; n.style.visibility = o.o <= 0.001 ? 'hidden' : 'visible'; }
  const x = o.x || 0, y = o.y || 0, s = o.s === undefined ? 1 : o.s, r = o.r || 0;
  n.style.transform = `translate(${x}px,${y}px) scale(${s}) rotate(${r}deg)`;
}
function hex(c) { c = c.replace('#', ''); return [0, 2, 4].map(i => parseInt(c.substr(i, 2), 16)); }
function mix(a, b, p) { const A = hex(a), Bc = hex(b); return `rgb(${A.map((v, i) => Math.round(v + (Bc[i] - v) * p)).join(',')})`; }
function typed(t, a, text, cps = 26) {
  const n = Math.floor(clamp((t - a) * cps, 0, text.length));
  const blink = n < text.length || Math.floor(t * 2) % 2 === 0;
  return esc(text.slice(0, n)) + (t >= a && blink ? '<span class="cursor"></span>' : '');
}
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');
const ICON = {
  chat: '<path d="M8 9h32a4 4 0 0 1 4 4v17a4 4 0 0 1-4 4H21l-9 7v-7H8a4 4 0 0 1-4-4V13a4 4 0 0 1 4-4z"/>',
  dots: '<path d="M8 9h32a4 4 0 0 1 4 4v17a4 4 0 0 1-4 4H21l-9 7v-7H8a4 4 0 0 1-4-4V13a4 4 0 0 1 4-4z"/><path d="M15 21.5h.1M24 21.5h.1M33 21.5h.1" stroke-width="5"/>',
  form: '<rect x="9" y="4" width="30" height="40" rx="4"/><path d="M16 15h16M16 23h16M16 31h9"/>',
  clock: '<circle cx="24" cy="24" r="19"/><path d="M24 13v11l7 5"/>',
  sheet: '<rect x="5" y="8" width="38" height="32" rx="4"/><path d="M5 18.5h38M5 29h38M18 8v32"/>',
  box: '<path d="M24 4 42 13v22L24 44 6 35V13z"/><path d="M6 13l18 9 18-9M24 22v22"/>',
  phone: '<rect x="13" y="3" width="22" height="42" rx="5"/><path d="M21 39h6"/>',
  bell: '<path d="M12 34V22a12 12 0 0 1 24 0v12l4 4H8z"/><path d="M20 42a4 4 0 0 0 8 0"/>',
  check: '<path d="M10 25l9 9 19-20"/>',
  key: '<circle cx="15" cy="31" r="9"/><path d="M21.5 24.5 41 5M34 12l5 5M29 17l4 4"/>',
  card: '<rect x="3" y="10" width="42" height="29" rx="4"/><path d="M3 19h42M10 31h11"/>',
  id: '<rect x="3" y="8" width="42" height="32" rx="4"/><circle cx="16" cy="21" r="5"/><path d="M8 33c1.5-4 4.5-5.5 8-5.5s6.5 1.5 8 5.5M29 18h10M29 25h10"/>',
  users: '<circle cx="18" cy="16" r="7"/><path d="M4 41c1-8 6-12 14-12s13 4 14 12"/><circle cx="34" cy="17" r="5"/><path d="M34 28c5 0 9 3 10 10"/>',
  filelock: '<path d="M28 4H12a4 4 0 0 0-4 4v32a4 4 0 0 0 4 4h24a4 4 0 0 0 4-4V16z"/><path d="M28 4v12h12"/><rect x="17" y="27" width="14" height="10" rx="2"/><path d="M20 27v-3a4 4 0 0 1 8 0v3"/>',
  bookmark: '<path d="M12 4h24v40L24 33 12 44z"/>',
  warn: '<path d="M24 5 45 42H3z"/><path d="M24 19v11M24 36v.5"/>',
  arrow: '<path d="M4 20h56M46 8l14 12-14 12"/>',
  shield: '<path d="M24 4 41 10v13c0 10-7 17-17 21C14 40 7 33 7 23V10z"/><path d="M16 24l6 6 11-12"/>',
  clip: '<rect x="9" y="8" width="30" height="36" rx="4"/><rect x="17" y="4" width="14" height="8" rx="2"/>',
  send: '<path d="M5 24 43 6 33 42l-9-14z"/><path d="M24 28 43 6"/>',
  q: '<circle cx="24" cy="24" r="19"/><path d="M18.5 18a6 6 0 1 1 8.5 5.5c-2 1-3 2.3-3 4.5M24 34v.5"/>',
};
const svg = (name, size, sw) => `<svg class="i" width="${size}" height="${size}" viewBox="0 0 48 48"${sw ? ` style="stroke-width:${sw}"` : ''}>${ICON[name]}</svg>`;
const arrowSvg = (w = 70, h = 40) => `<svg class="i" width="${w}" height="${h}" viewBox="0 0 64 40" style="stroke-width:5">${ICON.arrow}</svg>`;

/* ---------------------------------------------------------------- common */
const ost = document.querySelector('#ost'), ostBox = document.querySelector('#ost .ostb');
const cap = document.querySelector('#cap'), stage = document.querySelector('#stage');
let ostBeat = -1, capPage = -1, scene;

function ostHTML(s) {
  if (scene.ost && scene.ost[s] !== undefined) return scene.ost[s];
  // accent the symbols and a short leading label such as "1 ·" or "G ·"
  const m = s.match(/^(\S{1,2}) · (.*)$/);
  const body = t => esc(t).replace(/(→|=|↓|\+)/g, '\u0000$1\u0001');
  let h = m ? `\u0000${esc(m[1])}\u0001 · ${body(m[2])}` : body(s);
  return h.replace(/\u0000/g, '<span class="a">').replace(/\u0001/g, '</span>');
}
function renderOST(t) {
  const i = beatAt(t), b = B(i);
  if (scene.noOst && scene.noOst.includes(i)) { S(ost, { o: 0 }); return; }
  if (i !== ostBeat) {
    ostBox.innerHTML = ostHTML(b.ost); ostBeat = i;
    for (const fs of [66, 60, 56]) {  // one line if it fits at 56 px or more
      ostBox.style.fontSize = fs + 'px';
      if (ostBox.offsetHeight < fs * 1.12 * 1.5 + 40) break;
      if (fs === 56) ostBox.style.fontSize = '62px';
    }
  }
  const p = P(t, b.start, .22);
  S(ost, { o: p, y: 26 * (1 - p), s: .96 + .04 * p });
}
function renderCaps(t) {
  let k = -1;
  TL.pages.forEach((pg, i) => { if (t >= pg.s && t < pg.e) k = i; });
  if (k !== capPage) {
    cap.innerHTML = k < 0 ? '' : TL.pages[k].lines.map(l => '<div>' + l.map(i => `<span class="w" data-i="${i}">${esc(TL.words[i].w)}</span>`).join(' ') + '</div>').join('');
    capPage = k;
  }
  if (k < 0) return;
  const pg = TL.pages[k], p = P(t, pg.s, .12);
  S(cap, { o: p, s: .97 + .03 * p });
  cap.querySelectorAll('.w').forEach(n => {
    const w = TL.words[+n.dataset.i];
    n.classList.toggle('on', t >= w.s - .03 && t < w.e + .06);
  });
}

/* ---------------------------------------------------------------- D01-R2 */
const SC = {};
SC['D01-R2'] = {
  setup() {
    const L = this.L = {};
    L.boxes = el('div', 'layer', stage);
    this.box = [0, 1, 2].map(k => {
      const b = el('div', 'box', L.boxes);
      b.style.left = (k * 340) + 'px'; b.style.top = '30px';
      b.innerHTML = `<div class="bh"><span class="num">${k + 1}</span><span class="bt">${['TRIGGER', 'STEPS', 'RESULT'][k]}</span></div><div class="bi"></div><div class="bs"></div>`;
      return b;
    });
    this.arr = [0, 1].map(k => { const a = el('div', 'arrow', L.boxes, arrowSvg()); a.style.left = (270 + k * 340) + 'px'; return a; });
    const bi = this.box.map(b => b.querySelector('.bi'));
    this.sub = this.box.map(b => b.querySelector('.bs'));
    this.i1 = ['dots', 'form', 'clock'].map(n => el('div', '', bi[0], svg(n, 120)));
    this.i1row = el('div', '', bi[0], `<div style="display:flex;gap:16px">${svg('chat', 62)}${svg('form', 62)}${svg('clock', 62)}</div>`);
    this.q2 = el('div', '', bi[1], `<span style="color:var(--dash)">${svg('q', 120)}</span>`);
    this.rows = el('div', 'row3', bi[1]);
    this.r2 = [['sheet', 'save'], ['box', 'check'], ['dots', 'reply']].map(([ic, tx]) => el('div', '', this.rows, `<span class="a">${svg(ic, 52)}</span>${tx}`));
    this.rows.style.justifyContent = 'center';
    this.q3 = el('div', '', bi[2], `<span style="color:var(--dash)">${svg('bell', 120)}</span>`);
    this.ph = el('div', '', bi[2], `<div style="display:flex;gap:26px">${[0, 1].map(k => `<div class="ph" style="position:relative;display:flex;flex-direction:column;align-items:center;gap:6px">
      ${svg('phone', 104)}<span style="position:absolute;top:-6px;right:-10px;width:42px;height:42px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center">${svg('check', 28, 5)}</span>
      <span style="font-size:24px;font-weight:700">${['customer', 'you'][k]}</span></div>`).join('')}</div>`);
    this.phs = this.ph.querySelectorAll('.ph');
    // n8n-style canvas
    L.canvas = el('div', 'layer', stage);
    const cv = el('div', 'canvas', L.canvas);
    el('div', 'abs', cv, '<span style="font-size:24px;font-weight:700;color:var(--soft)">n8n workflow</span>').style.cssText += 'left:28px;top:20px';
    this.lines = el('div', 'abs', cv, `<svg width="950" height="340" style="position:absolute;left:0;top:0"><path id="ln1" d="M219 150 C 290 150, 340 150, 409 150" stroke="#10B981" stroke-width="5" fill="none"/><path id="ln2" d="M541 150 C 610 150, 660 150, 734 150" stroke="#10B981" stroke-width="5" fill="none"/><circle id="pkt" r="10" fill="#fff"/></svg>`);
    this.nodes = [['dots', 'New message', 87], ['sheet', 'Save + check', 409], ['send', 'Send reply', 734]].map(([ic, tx, x]) => {
      const n = el('div', 'node', cv, svg(ic, 66)); n.style.left = x + 'px';
      const l = el('div', 'nl', cv, tx); l.style.left = (x + 66 - 120) + 'px';
      return [n, l];
    });
    // checklist
    L.check = el('div', 'layer', stage);
    this.ck = ['Same start?', 'Same steps?', 'Same end?'].map((tx, k) => {
      const r = el('div', 'check', L.check, `<span class="cb"></span>${tx}`); r.style.top = (24 + k * 128) + 'px'; return r;

    S(this.safe, { o: P(t, sf, .2), s: .6 + .4 * P(t, sf, .4, E.back) });
    // end: same help, no risk -> which one have you pasted?
    S(L.end, { o: P(t, b7 + .6, .2) });
    const wh = cue(7, '^Which') - .2;
    S(this.same, { o: Math.min(P(t, b7 + .6, .25), 1 - P(t, wh - .1, .2)), s: .8 + .2 * P(t, b7 + .6, .4, E.back) });
    S(this.list, { o: P(t, wh, .2) });
    const sweep = Math.floor(((t - wh - .9) / .55) % 5 + 5) % 5;
    this.lrows.forEach((r, k) => {
      S(r, { o: P(t, wh + .07 * k, .2), x: 40 * (1 - P(t, wh + .07 * k, .35)) });
      const on = t > wh + .9 && sweep === k;
      r.style.borderColor = on ? '#EF4444' : ''; r.style.background = on ? 'rgba(239,68,68,.14)' : '';
    });
  },
};
