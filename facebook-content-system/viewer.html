<html lang="en">
<head>

<style>
:root{--bg:#f7f7f5;--card:#ffffff;--ink:#1d1f23;--muted:#5d636e;--line:#e3e4e8;--accent:#0f766e;--accent-ink:#ffffff;--reel:#eef2ff;--reel-ink:#3730a3;--img:#ecfdf5;--img-ink:#065f46;--warn:#92400e;--code:#f1f2f4}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121417;--card:#1b1e23;--ink:#e8e9ec;--muted:#a0a6b1;--line:#2c3038;--accent:#2dd4bf;--accent-ink:#0b1514;--reel:#232a4a;--reel-ink:#c7d2fe;--img:#12312a;--img-ink:#a7f3d0;--warn:#fbbf24;--code:#23272e}}
:root[data-theme="dark"]{--bg:#121417;--card:#1b1e23;--ink:#e8e9ec;--muted:#a0a6b1;--line:#2c3038;--accent:#2dd4bf;--accent-ink:#0b1514;--reel:#232a4a;--reel-ink:#c7d2fe;--img:#12312a;--img-ink:#a7f3d0;--warn:#fbbf24;--code:#23272e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 16px}
h1{font-size:18px;margin:0 0 8px}
.controls{display:flex;flex-wrap:wrap;gap:8px}
select,input{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);min-width:0}
input{flex:1 1 180px}
main{max-width:980px;margin:0 auto;padding:12px 16px 48px}
.day{margin:20px 0 6px;font-weight:700;color:var(--muted);font-size:13px;letter-spacing:.04em;text-transform:uppercase}
details{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:8px 0;overflow:hidden}
summary{cursor:pointer;padding:12px 14px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;list-style:none}
summary::-webkit-details-marker{display:none}
.pill{font-size:12px;padding:2px 8px;border-radius:999px;font-weight:600;white-space:nowrap}
.reel{background:var(--reel);color:var(--reel-ink)}.image{background:var(--img);color:var(--img-ink)}
.meta{color:var(--muted);font-size:13px}
.topic{font-weight:600;flex:1 1 300px}
.body{padding:0 14px 14px}
dl{display:grid;grid-template-columns:140px 1fr;gap:6px 12px;margin:8px 0}
dt{color:var(--muted);font-size:13px}dd{margin:0}
@media (max-width:600px){dl{grid-template-columns:1fr}dt{margin-top:6px}}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:640px}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{background:var(--code);font-size:12px;color:var(--muted)}
pre{white-space:pre-wrap;background:var(--code);padding:10px;border-radius:8px;font:13px/1.45 ui-monospace,Menlo,Consolas,monospace;margin:6px 0}
button{font:inherit;font-size:13px;padding:4px 10px;border-radius:8px;border:1px solid var(--line);background:var(--accent);color:var(--accent-ink);cursor:pointer}
ul{margin:4px 0;padding-left:20px}
a{color:var(--accent)}
.vol{color:var(--warn);font-size:12px}
h4{margin:14px 0 4px;font-size:14px}
</style>
</head>

pture + a second angle.", "day": 2, "slot": "R1", "time": "13:30", "slot_no": 2, "date": "2026-10-13", "spec": "Reel 9:16 · 1080×1920 · H.264 MP4 · 30 fps · AAC 48 kHz · safe box x65–1015 / y270–1250 · burned-in captions y1050–1250 · cover title inside centre 1080×1350", "post_no": 6, "caption_full": "Router blinking red? Don't type it. Show it to AI.\n\nGemini Live has a camera mode: open Gemini → tap Live → turn on the camera, then ask out loud.\nIt's free on Android and iPhone.\n\nI use it for:\n• blinking router lights\n• bills I don't understand\n• English forms\n• error screens\n\nOne rule: never show passwords, bank cards or ID numbers on camera.\nAnd double-check any fix before you change settings. AI can be wrong.\n\nKeep this for the next thing in your house that blinks, beeps or confuses you.\n\n#GeminiAI #AItips #techtips", "pillar_name": "Hidden features & tools", "src": [{"t": "Gemini gets more personal, proactive and powerful (I/O 2025)", "u": "https://blog.google/products/gemini/gemini-app-updates-io-2025/", "p": "Google Blog (+ Gemini Apps Help 'Talk naturally with Gemini Live')", "d": "2025-05-20", "v": false}], "wps": 2.47}, {"id": "D02-I2", "type": "image", "series": "What It Means For You", "pillar": "NEWS", "format": "News card", "topic": "5 AI updates from September 2026 that actually matter", "human_problem": "So much AI news that you can't tell which updates actually affect you.", "objective": "Timeliness + shares; positions the page as current", "hook": "5 AI updates from September that actually matter", "main_idea": "Only five of September's AI updates change what normal users can do; here they are with who can use them.", "takeaway": "Only a few September updates change what normal users can do, and some are paid-only.", "value": "Plain-language summary of five verified updates, each with availability.", "cta": "Ask which update viewers will try first (genuine question).", "cta_type": "question", "visual_concept": "Numbered news list with : "Lots of AI news in September. These 5 actually change what you can do:\n\n1. Gemini Notebook (the tool formerly called NotebookLM) can now make ~60-second video summaries in 80+ languages, plus quizzes and flashcards from your notes.\n2. ChatGPT Images 2.5 (8 Sep): draw a rough sketch, and it turns it into a finished image. Also faster.\n3. Gemini skills (30 Sep): save an instruction once, use it with “/”. Gems start turning into skills on 17 November.\n4. Gemini app for Windows: Alt + Space opens it over any app.\n5. OpenAI dots (29 Sep): always-on agents. Only ChatGPT Pro and Business Premium for now.\n\nWhich one will you try first?\n\n#AInews #ChatGPT #GeminiAI", "pillar_name": "Current developments", "src": [{"t": "Sharpen your study routine with new Gemini Notebook tools", "u": "https://blog.google/innovation-and-ai/products/gemini-notebook/new-study-tools-september-2026/", "p": "Google Blog", "d": "2026-09", "v": false}, {"t": "Introducing ChatGPT Images 2.5", "u": "https://openai.com/index/introducing-chatgpt-images-2-5/", "p": "OpenAI", "d": "2026-09-08", "v": true}, {"t": "Let skills in Gemini tackle your most repetitive tasks", "u": "https://blog.google/products-and-platforms/products/gemini/automate-tasks-with-skills/", "p": "Google Blog (+ Gemini Apps Help 'About the transition from Gems to skills')", "d": "2026-09-30", "v": true}, {"t": "Google Is Replacing Gemini Gems With Skills Nov 17", "u": "https://www.techrepublic.com/article/news-gemini-gems-skills-migration/", "p": "TechRepublic (also 9to5Google, 2026-09-27 and 2026-09-30)", "d": "2026-09-30", "v": true}, {"t": "The Gemini desktop app is now available for Windows", "u": "https://workspaceupdates.googleblog.com/2026/09/the-gemini-desktop-app-is-now-available-for-Windows.html", "p": "Google Workspace Updates", "d": "2026-09", "v": false}, {"t": "Introducing dots", "u": "https://openai.com/index/introducing-dots/", "p": "OpenAI (help article \"Getting started with your dot\"; TechCrunch 2026-09-29)", "d": "2026-09-29", "v": true}], "wps": null}, {"id": "D02-R2", "type": "reel", "series": "AI Myth Check", "pillar": "LIT", "format": "Green screen + diagram", "topic": "Why AI makes things up (and the one prompt that catches it)", "human_problem": "Trusting a confident AI answer and repeating something that turns out to be fake.", "objective": "Trust + shares; teaches safe use", "hook": "AI gave me a source. It doesn't exist.", "open_loop": "Why would AI invent a source that doesn't exist?", "main_idea": "AI predicts likely words, so it can produce realistic-looking fake sources; grounding + asking for exact quotes catches it.", "takeaway": "AI predicts likely words, so ask it to quote the exact line behind every claim.", "value": "Simple explanation of hallucination, the five hot-spot types, and the 'quote the exact line' check.", "payoff": "3–16 s: it predicts what a source looks like; 25–35 s: the quote-the-line check catches it.", "cta": "Follow for more AI Myth Checks.", "cta_type": "follow", "visual_concept": "Asif over a green-screen of a chat containing a fake citation; animated 'next-word' probability bars; 'NOT FOUND' stamp.", "runtime": 40, "retention": {"hook": "A personal, specific failure (a source that doesn't exist) that every AI user fears and wants explained.", "curiosity": "Viewers want to know why a tool would invent something; the reason arrives at second 3.", "visual_progression": "A fake citation assembles piece by piece, then gets stamped NOT FOUND.", "usefulness": "Ends with a concrete check prompt viewers can use today.", "novelty": "Most people think AI 'searches' facts; learning it predicts words reframes every answer they've seen.", "save_share": "Strong 'send to a friend who trusts ChatGPT blindly' energy."}, "script": [{"t": "0-3", "vo": "AI gave me a source. It doesn't exist.", "ost": "A source that doesn't exist", "vis": "Asif holding his phone: an AI answer with a neat book citation; quick cut to an empty search result."}, {"t": "3-7", "vo": "It wasn't lying. It predicts the next likely word.", "ost": "It predicts the next word", "vis": "Animation: a sentence builds word by word with small probability bars."}, {"t": "7-12.5", "vo": "Ask for a source it doesn't have, and it predicts what a source looks like.", "ost": "predicts what a source LOOKS like", "vis": "A citation assembles: author → title → year → page."}, {"t": "12.5-16", "vo": "Real-looking author. Real-looking title. Doesn't exist.", "ost": "looks real ≠ is real", "vis": "Search result page → 'NOT FOUND' stamp."}, {"t": "16-20", "vo": "That's a hallucination. Confident, fluent, and wrong.", "ost": "Hallucination = confident + wrong", "vis": "Label slides in; Asif points at it."}, {"t": "20-25", "vo": "It happens most with exact numbers, dates, quotes, links and laws.", "ost": "numbers · dates · quotes · links · laws", "vis": "Five icons pop in sequence."}, {"t": "25-30", "vo": "The fix: turn on web search, or give it your own document.", "ost": "Fix: search ON or give it the source", "vis": "Screen recording: toggling search; uploading a PDF."}, {"t": "30-35", "vo": "Then ask: “Quote the exact line you used for each claim.”", "ost": "“Quote the exact line for each claim.”", "vis": "Typed prompt; answer shows quoted lines highlighted."}, {"t": "35-40", "vo": "No quote, no trust. Follow for more AI myth checks.", "ost": "No quote = no trust", "vis": "Asif to camera; series tag 'AI Myth Check'."}], "caption": "AI gave me a perfect-looking source. It doesn't exist.\n\nLanguage models generate the most likely next words. Ask for a source they don't have, and they can generate something that looks like a source: real-looking author, real-looking title, doesn't exist. That's a hallucination.\n\nHighest risk: exact numbers, dates, quotes, links and laws.\n\nThe check I use:\n1. Turn on web search, or upload the document yourself.\n2. Ask: “Quote the exact line you used for each claim.”\nNo quote, no trust.\n\nFollow for more AI Myth Checks.\n", "hashtags": ["AIliteracy", "ChatGPT", "AItips"], "sources": [], "production_notes": "Create the fake-citation example yourself by asking an AI for 'a source' on an obscure claim with search off; record it. Show the real search result returning nothing. Don't name or shame a specific tool; the behaviour applies to all.", "day": 2, "slot": "R2", "time": "21:00", "slot_no": 4, "date": "2026-10-13", "spec": "Reel 9:16 · 1080×1920 · H.264 MP4 · 30 fps · AAC 48 kHz · safe box x65–1015 / y270–1250 · burned-in captions y1050–1250 · cover title inside centre 1080×1350", "post_no": 8, "caption_full": "AI gave me a perfect-looking source. It doesn't exist.\n\nLanguage models generate the most likely next words. Ask for a source they don't have, and they can generate something that looks like a source: real-looking author, real-looking title, doesn't exist. That's a hallucination.\n\nHighest risk: exact numbers, dates, quotes, links and laws.\n\nThe check I use:\n1. Turn on web search, or upload the document yourself.\n2. Ask: “Quote the exact line you used for each claim.”\nNo quote, no trust.\n\nFollow for more AI Myth Checks.\n\n#AIliteracy #ChatGPT #AItips", "pillar_name": "AI literacy & safety", "src": [], "wps": 2.23}, {"id": "D03-I1", "type": "image", "series": "Explain It Simply", "pillar": "AU", "format": "Glossary card", "topic": "Learn n8n in 4 words: trigger, node, credential, execution", "human_problem": "Opening n8n for the first time and understanding nothing on the screen.", "objective": "Educate future automation buyers; saves", "hook": "Learn n8n in 4 words", "main_idea": "Four terms explain almost every n8n screen.", "takeaway": "Trigger, node, credential and execution explain most of what you see in n8n.", "value": "Plain definitions of trigger, node, credential and execution, including the security habit of keeping logins in credentials.", "cta": "Save it before you open n8n for the first time.", "cta_type": "save", "visual_concept": "Four tiles shaped like n8n nodes connected by a line, each holding one term and definition.", "design": {"headline": "Learn n8n in 4 words", "body": ["Trigger: what starts the workflow (new message, form, schedule).", "Node: one step. Read, decide, write or send.", "Credential: your saved login to an app, kept separate from the steps.", "Execution: one run of the workflow, with a log of every step."], "footer": "Know these four and any n8n screen starts to make sense.", "layout": "Dark background. Headline top. Four rounded-rectangle 'node' tiles in a 2×2 grid connected by a thin line (left→right, top→bottom), each with the term in accent colour and the definition below. Footer at bottom."}, "caption": "n8n looks complicated until you know 4 words.\n\nTrigger: what starts the workflow: a new message, a form, a time of day.\nNode: one step: read data, decide, write, send.\nCredential: your saved login to an app. Keep keys and passwords here, never typed inside a node.\nExecution: one run of the workflow. Open it to see exactly what happened at each step.\n\nSave this before you open n8n for the first time.\n", "hashtags": ["n8n", "automation", "nocode"], "sources": [], "production_notes": "Draw node tiles in the brand style, not as copies of n8n's UI. The 'never typed inside a node' line is a deliberate security habit; keep it.", "day": 3, "slot": "I1", "time": "09:30", "slot_no": 1, "date": "2026-10-14", "spec": "Feed image 4:5 · 1440×1800 PNG (sRGB) · text ≥90 px from edges · headline ≥88 px, body ≥44 px · ≤75 words on image", "post_no": 9, "caption_full": "n8n looks complicated until you know 4 words.\n\nTrigger: what starts the workflow: a new message, a form, a time of day.\nNode: one step: read data, decide, write, send.\nCredential: your saved login to an app. Keep keys and passwords here, never typed inside a node.\nExecution: one run of the workflow. Open it to see exactly what happened at each step.\n\nSave this before you open n8n for the first time.\n\n#n8n #automation #nocode", "pillar_name": "Automation & n8n", "src": [], "wps": null}, {"id": "D03-R1", "type": "reel", "series": "Before → After", "pillar": "PA", "format": "Before/after split screen", "topic": "Show, don't describe: paste examples to get your style", "human_problem": "AI-written posts and emails that sound nothing like you.", "objective": "Saves; practical writing win", "hook": "Sounds nothing like you? Stop describing your style.", "open_loop": "If describing your style doesn't work, what does?", "main_idea": "Adjectives like 'friendly but professional' are guesses; 2–3 real examples make AI match your style.", "takeaway": "Paste examples of your own writing instead of describing the style you want.", "value": "A reusable 'same style as these' prompt + the warning that AI copies mistakes too.", "payoff": "10.5–24 s: pasting 2–3 of your own posts gives a draft with your length, words and sign-off.", "cta": "Save it for your next caption or email.", "cta_type": "save", "visual_concept": "Split screen: left = adjective prompt + stiff output; right = pasted examples + matching output with features circled.", "runtime": 35, "retention": {"hook": "A direct instruction that contradicts how most people prompt ('stop describing').", "problem_solution": "Shows the stiff result first, then the fix, inside 20 seconds.", "visual_progression": "Left/right split fills in step by step; matching features get circled on the right.", "payoff": "The final output visibly matches the user's own sentence length, words and sign-off.", "usefulness": "Works for emails, captions, product descriptions and reports, with the prompt in the caption."}, "script": [{"t": "0-3", "vo": "Sounds nothing like you? Stop describing your style.", "ost": "AI doesn't sound like you?", "vis": "Asif to camera; screen splits into two halves."}, {"t": "3-7", "vo": "Most people type: “Make it friendly but professional, short, with energy.”", "ost": "“friendly but professional…”", "vis": "Left half: adjective prompt typed; output appears."}, {"t": "7-10.5", "vo": "AI reads those words a hundred different ways.", "ost": "adjectives = guesses", "vis": "Left output: stiff phrases highlighted in yellow."}, {"t": "10.5-15", "vo": "Instead, paste two or three things you already wrote and liked.", "ost": "Paste 2–3 of YOUR examples", "vis": "Right half: two old posts pasted in."}, {"t": "15-19.5", "vo": "Then say: “Write the new one in the same style as these.”", "ost": "“Same style as these.”", "vis": "Right half: the instruction typed."}, {"t": "19.5-24", "vo": "Look. Same sentence length, same words you use, same sign-off.", "ost": "your length · your words · your sign-off", "vis": "Right output appears; three matching features circled."}, {"t": "24-28", "vo": "It works for emails, captions, product descriptions, even reports.", "ost": "emails · captions · products · reports", "vis": "Quick montage of four document types."}, {"t": "28-32", "vo": "One tip: only paste examples you'd be happy to sign.", "ost": "Only paste your best", "vis": "Asif to camera."}, {"t": "32-35", "vo": "Because AI copies everything, including your mistakes.", "ost": "It copies mistakes too", "vis": "Small smile; end frame."}], "caption": "AI never sounds like you? Stop describing your style. Paste it.\n\n“Friendly but professional” can mean 100 things to AI. Your own examples mean one thing.\n\nTry:\n“Here are 3 posts I wrote and liked: [paste]. Write a new post about [topic] in the same style: same length, same tone, same sign-off.”\n\nOnly paste examples you'd sign. AI copies the mistakes too.\n\nSave this for your next caption or email.\n", "hashtags": ["AItips", "ChatGPT", "copywriting"], "sources": [], "production_notes": "Use 2–3 of Asif's real past posts as the examples (they're his, so no rights issue). Record both outputs live. Circles drawn in the edit, accent colour.", "day": 3, "slot": "R1", "time": "13:30", "slot_no": 2, "date": "2026-10-14", "spec": "Reel 9:16 · 1080×1920 · H.264 MP4 · 30 fps · AAC 48 kHz · safe box x65–1015 / y270–1250 · burned-in captions y1050–1250 · cover title inside centre 1080×1350", "post_no": 10, "caption_full": "AI never sounds like you? Stop describing your style. Paste it.\n\n“Friendly but professional” can mean 100 things to AI. Your own examples mean one thing.\n\nTry:\n“Here are 3 posts I wrote and liked: [paste]. Write a new post about [topic] in the same style: same length, same tone, same sign-off.”\n\nOnly paste examples you'd sign. AI copies the mistakes too.\n\nSave this for your next caption or email.\n\n#AItips #ChatGPT #copywriting", "pillar_name": "Practical AI", "src": [], "wps": 2.46}, {"id": "D03-I2", "type": "image", "series": "Hidden Button", "pillar": "HF", "format": "Hidden feature card", "topic": "ChatGPT Temporary Chat: when to use it", "human_problem": "Wanting to ask AI something without it staying in your history or changing what it remembers.", "objective": "Saves + privacy awareness", "hook": "Don't want this chat saved? Use Temporary Chat", "main_idea": "Temporary Chat keeps a conversation out of history and memory; useful for one-offs, tests and screen-sharing.", "takeaway": "Temporary Chat keeps a conversation out of ChatGPT's history and memory, but it is not for secrets.", "value": "Four concrete uses + the Aug 2026 personalization option + the limit (still not a place for secrets).", "cta": "None. The privacy reminder is the closing line.", "cta_type": "none", "visual_concept": "Simple UI-style mock of a chat window with a dotted 'temporary' outline (drawn, not a screenshot), four use cases beside it.", "design": {"headline": "Don't want this chat saved? Use Temporary Chat", "body": ["One-off questions you don't want in your history.", "Testing a prompt without changing ChatGPT's memory of you.", "Sharing your screen without old chats showing.", "New (Aug 2026): choose personalized or unpersonalized before you start.", "It never saves new memories. Still no passwords or ID numbers."], "footer": "Source: OpenAI Help Center, checked Oct 2026", "layout": "Light background. Left 40%: drawn chat-window icon with dashed border labelled 'Temporary'. Right 60%: five short rows with check icons (last row with a caution icon). Footer small, bottom."}, "caption": "Don't want a ChatGPT conversation saved? There's a mode for that, and most people never use it.\n\nLook for the Temporary chat option at the top of a new chat.\n\nGood for:\n• one-off questions you don't want in your history\n• testing a prompt without changing what ChatGPT remembers about you\n• sharing your screen without old chats showing\n\nSince 27 Aug 2026 you can choose before starting: personalized (uses your existing memory and instructions) or unpersonalized.\nEither way, it doesn't create new memories.\n\nTemporary doesn't mean secret. Still no passwords or ID numbers.\n", "hashtags": ["ChatGPT", "privacy", "AItips"], "sources": ["openai_temp_chat", "openai_release_notes"], "production_notes": "Draw the UI as a simplified icon; don't screenshot. Re-check the toggle's location in the current ChatGPT app before posting (UI moves often).", "day": 3, "slot": "I2", "time": "18:30", "slot_no": 3, "date": "2026-10-14", "spec": "Feed image 4:5 · 1440×1800 PNG (sRGB) · text ≥90 px from edges · headline ≥88 px, body ≥44 px · ≤75 words on image", "post_no": 11, "caption_full": "Don't want a ChatGPT conversation saved? There's a mode for that, and most people never use it.\n\nLook for the Temporary chat option at the top of a new chat.\n\nGood for:\n• one-off questions you don't want in your history\n• testing a prompt without changing what ChatGPT remembers about you\n• sharing your screen without old chats showing\n\nSince 27 Aug 2026 you can choose before starting: personalized (uses your existing memory and instructions) or unpersonalized.\nEither way, it doesn't create new memories.\n\nTemporary doesn't mean secret. Still no passwords or ID numbers.\n\n#ChatGPT #privacy #AItips", "pillar_name": "Hidden features & tools", "src": [{"t": "Temporary chat in ChatGPT", "u": "https://help.openai.com/en/articles/8914046-temporary-chat-in-chatgpt", "p": "OpenAI Help Center", "d": "2026-08", "v": false}, {"t": "ChatGPT — Release Notes", "u": "https://help.openai.com/en/articles/6825453-chatgpt-release-notes", "p": "OpenAI Help Center", "d": "2026-09", "v": true}], "wps": null}, {"id": "D03-R2", "type": "reel", "series": "Build Log", "pillar": "SVC", "format": "Screen demo + face cam", "topic": "The Messenger assistant I built in n8n (and the check most DIY bots skip)", "human_problem": "Customers message late at night, you reply hours later, and the sale goes to someone faster.", "objective": "First proof of skill; Messenger leads", "hook": "Two AM: “Price?” You reply at ten.", "open_loop": "How do you answer at 2 AM without staying awake?", "main_idea": "A 4-step n8n Messenger assistant: verify it's really Meta → ignore echoes → AI reply with per-customer memory → send in seconds.", "takeaway": "A safe Messenger assistant checks requests, remembers each customer and replies in seconds, while people handle orders and payments.", "value": "Shows what a safe auto-reply looks like, and what it should never do (payments, stock promises).", "payoff": "9–33.5 s: the four-step assistant; the last shot shows the 2:07 AM question answered at 2:07.", "cta": "Message 'AUTOMATE' with your top customer questions.", "cta_type": "message", "visual_concept": "Phone notification at 2:07 AM → Asif face-cam over his real n8n canvas, zooming node by node; phone shows the reply arriving.", "runtime": 51, "retention": {"hook": "A two-line story every seller has lived: the question at 2 AM and the late reply.", "relatability": "Late-night 'price? delivery charge?' messages are a daily reality for Facebook sellers.", "problem_solution": "The lost sale is shown first, then the system that prevents it, then its honest limits.", "visual_progression": "The camera moves node by node through a real canvas, so the build visibly advances.", "novelty": "The signature check is something most viewers have never heard of, and it separates this from 'simple bots'.", "payoff": "The final shot answers the opening: the 2:07 AM message is replied to at 2:07."}, "script": [{"t": "0-2.5", "vo": "Two AM: “Price?” You reply at ten.", "ost": "2 AM: “Price?” · You: 10 AM", "vis": "Phone lock screen 02:07: Messenger 'Price? Delivery charge?'; clock jumps to 10:04 as a reply is typed."}, {"t": "2.5-5.5", "vo": "By then, they may have bought elsewhere.", "ost": "Sale gone", "vis": "Reply shows 'Seen', no answer back (dramatized example)."}, {"t": "5.5-9", "vo": "So I built a Messenger assistant in n8n.", "ost": "My fix: built in n8n", "vis": "Asif face-cam bubble bottom-left over the n8n canvas (node names only)."}, {"t": "9-14.5", "vo": "Step one: a message arrives, and it checks the message really came from Meta.", "ost": "1 · Is it really from Meta?", "vis": "Zoom on 'Verify Signature' → 'Signature OK?' nodes."}, {"t": "14.5-18.5", "vo": "A lot of DIY bots skip this. It stops fake requests.", "ost": "Most DIY bots skip this", "vis": "Simple animation: a fake request bounces off a shield."}, {"t": "18.5-23.5", "vo": "Step two: it ignores its own replies, so it never talks to itself.", "ost": "2 · Ignore its own echoes", "vis": "Zoom on 'Is Message?' node."}, {"t": "23.5-29", "vo": "Step three: an AI agent writes a short reply and remembers this customer's chat.", "ost": "3 · Short reply + memory per customer", "vis": "Zoom on 'AI Agent' with 'Simple Memory' attached."}, {"t": "29-33.5", "vo": "Step four: the reply goes back through Messenger. Seconds, not hours.", "ost": "4 · Reply in seconds", "vis": "Phone: reply bubble appears in the chat."}, {"t": "33.5-38.5", "vo": "What it shouldn't do: confirm payments or promise stock it can't see.", "ost": "Not for: payments · stock promises", "vis": "Asif full screen, serious tone."}, {"t": "38.5-44", "vo": "For orders, I connect it to your sheet and hand the chat to a human.", "ost": "Orders → your sheet → a human", "vis": "Diagram add-on: Sheets icon + person icon appended to the flow."}, {"t": "44-48.5", "vo": "Need this for your page? Message me the word AUTOMATE.", "ost": "Message: AUTOMATE", "vis": "Asif to camera; Messenger icon animates."}, {"t": "48.5-51", "vo": "And keep the two AM customers.", "ost": "Keep the 2 AM customers", "vis": "Phone: the 02:07 question answered at 02:07."}], "caption": "2 AM: “Price?” You reply at 10 AM. By then, they may have bought somewhere else.\n\nSo I built a Messenger assistant in n8n:\n1. It checks the message really came from Meta (a signature check many DIY bots skip)\n2. It ignores its own replies so it never loops\n3. An AI agent writes a short reply and remembers each customer's conversation\n4. The reply goes out in seconds\n\nWhat it should NOT do: confirm payments or promise stock it can't see. For orders, I connect it to your Google Sheet and hand the chat to a person.\n\nNeed one for your page? Message me “AUTOMATE” and send the 3 questions customers ask you most.\n", "hashtags": ["n8n", "MessengerAutomation", "AIautomation"], "sources": [], "production_notes": "Film Asif's real 'Facebook Messenger AI Auto Reply' workflow, zoomed so only node names show. NEVER show the Config node (it holds the page token and app secret) or any webhook URL. Use a test Page/test account for the 2 AM chat. Confirm you're happy to offer the 'order sheet + human handoff' add-on before posting.", "day": 3, "slot": "R2", "time": "21:00", "slot_no": 4, "date": "2026-10-14", "spec": "Reel 9:16 · 1080×1920 · H.264 MP4 · 30 fps · AAC 48 kHz · safe box x65–1015 / y270–1250 · burned-in captions y1050–1250 · cover title inside centre 1080×1350", "post_no": 12, "caption_full": "2 AM: “Price?” You reply at 10 AM. By then, they may have bought somewhere else.\n\nSo I built a Messenger assistant in n8n:\n1. It checks the message really came from Meta (a signature check many DIY bots skip)\n2. It ignores its own replies so it never loops\n3. An AI agent writes a short reply and remembers each customer's conversation\n4. The reply goes out in seconds\n\nWhat it should NOT do: confirm payments or promise stock it can't see. For orders, I connect it to your Google Sheet and hand the chat to a person.\n\nNeed one for your page? Message me “AUTOMATE” and send the 3 questions customers ask you most.\n\n#n8n #MessengerAutomation #AIautomation", "pillar_name": "Work with me (n8n services)", "src": [], "wps": 2.51}, {"id": "D04-I1", "type": "image", "series": "AI Myth Check", "pillar": "LIT", "format": "Checklist", "topic": "5 hot spots where AI answers go wrong", "human_problem": "Not knowing which parts of an AI answer you can safely trust.", "objective": "Saves + trust", "hook": "Check these 5 things in every AI answer", "main_idea": "AI errors cluster in five predictable places; check those and use the rest as a draft.", "takeaway": "AI mistakes cluster in numbers, dates, names and quotes, links, and laws, so check those first.", "value": "A 5-item verification checklist.", "cta": "Save it next to your AI app.", "cta_type": "save", "visual_concept": "Checklist with five warning icons and a 'how to check' hint per line.", "design": {"headline": "Check these 5 things in every AI answer", "body": ["Numbers: prices, percentages, totals. Recalculate.", "Dates: 'latest', 'this year', deadlines.", "Names & quotes: real person? Real words?", "Links & sources: click them. Some don't exist.", "Laws & rules: they differ by country. Ask a local expert."], "footer": "Use AI answers as a first draft, not the final word.", "layout": "Light background. Headline top. Five rows with amber warning icons, bold category word, short how-to-check text. Footer as a full-width band at the bottom."}, "caption": "AI mistakes aren't random. They show up in the same 5 places.\n\n✔ Numbers: recalculate prices, percentages and totals.\n✔ Dates: “latest” and “this year” are often out of date.\n✔ Names & quotes: check the person exists and said it.\n✔ Links & sources: click them. Some are invented.\n✔ Laws & rules: they change by country. Ask someone local.\n\nUse AI answers as a first draft, not the final word.\n\nSave this next to your AI app.\n", "hashtags": ["AIliteracy", "AItips", "factcheck"], "sources": [], "production_notes": "Checklist template. This image pairs conceptually with D02-R2 (posted 2 days earlier) but adds the checklist. Don't reuse that Reel's visuals.", "day": 4, "slot": "I1", "time": "09:30", "slot_no": 1, "date": "2026-10-15", "spec": "Feed image 4:5 · 1440×1800 PNG (sRGB) · text ≥90 px from edges · headline ≥88 px, body ≥44 px · ≤75 words on image", "post_no": 13, "caption_full": "AI mistakes aren't random. They show up in the same 5 places.\n\n✔ Numbers: recalculate prices, percentages and totals.\n✔ Dates: “latest” and “this year” are often out of date.\n✔ Names & quotes: check the person exists and said it.\n✔ Links & sources: click them. Some are invented.\n✔ Laws & rules: they change by country. Ask someone local.\n\nUse AI answers as a first draft, not the final word.\n\nSave this next to your AI app.\n\n#AIliteracy #AItips #factcheck", "pillar_name": "AI literacy & safety", "src": [], "wps": null}, {"id": "D04-R1", "type": "reel", "series": "Explain It Simply", "pillar": "AU", "format": "Diagram explainer + talking head", "topic": "Why some bots reply instantly: the webhook (a doorbell)", "human_problem": "Wondering why some automated replies feel live while others lag for minutes.", "objective": "Authority; loop for rewatches", "hook": "Some bots reply instantly. Others take minutes. Why?", "open_loop": "What makes the fast bot fast? (answered at 3 s, explained by 24 s)", "main_idea": "Polling = checking the door every 5 minutes; a webhook = a doorbell that rings your automation the moment something happens.", "takeaway": "A webhook lets an app tell your automation the moment something happens, instead of checking again and again.", "value": "A clear analogy for a term that blocks many beginners, tied to Messenger replies.", "payoff": "28–32 s: the fast bot isn't smarter; it just has a doorbell, a webhook.", "cta": "Follow for the next 'Explain It Simply'.", "cta_type": "follow", "visual_concept": "Door animation: a person walking to the door repeatedly (polling) vs a doorbell ringing (webhook); Messenger → bell → n8n node.", "runtime": 32, "retention": {"hook": "Starts from something viewers have noticed (instant vs slow bots) and asks why.", "curiosity": "The answer word 'webhook' arrives at second 3, but what it means only becomes clear by second 24.", "visual_progression": "Split phones, then a door animation, then the real Messenger → n8n flow.", "payoff": "The ending answers the opening question in one memorable line: not smarter, just a doorbell.", "usefulness": "Viewers learn why live replies need webhooks, a term they will see in every automation tool."}, "script": [{"t": "0-3", "vo": "Some bots reply instantly. Others take minutes. Why?", "ost": "Instant vs 5 minutes. Why?", "vis": "Split screen: two phones get the same message; left replies at once, right shows a spinner."}, {"t": "3-7", "vo": "The fast ones use a webhook. Think of a doorbell.", "ost": "Webhook = doorbell", "vis": "Asif beside an animated front door."}, {"t": "7-11", "vo": "Without a doorbell, you'd check the door every five minutes.", "ost": "No bell: check every 5 min", "vis": "Animated person walks to the door again and again; clock spins."}, {"t": "11-15", "vo": "That's called polling. It's slow, and it wastes your time.", "ost": "= polling (slow)", "vis": "Person slumps; 'polling' label."}, {"t": "15-19", "vo": "With a doorbell, the visitor tells you the moment they arrive.", "ost": "Bell: they tell YOU", "vis": "Ding animation; door opens instantly."}, {"t": "19-24", "vo": "A webhook is that bell. When a customer messages, Messenger rings your automation.", "ost": "Messenger → rings → n8n", "vis": "Messenger icon → bell → n8n Webhook node lights up."}, {"t": "24-28", "vo": "Instantly. No checking, no delay.", "ost": "Instant", "vis": "Millisecond counter ticks; reply bubble appears."}, {"t": "28-32", "vo": "So the fast bot isn't smarter. It just has a doorbell.", "ost": "Not smarter. Just a doorbell.", "vis": "Back to the split phones; a small doorbell icon appears on the fast one."}], "caption": "Why do some bots reply instantly while others take minutes? A doorbell.\n\nWithout a bell, you'd walk to the door every 5 minutes to check. That's “polling”: slow and wasteful.\nWith a bell, the visitor tells you the moment they arrive.\n\nA webhook is that bell for software. When a customer messages your page, Messenger “rings” your automation instantly. The fast bot isn't smarter. It just has a doorbell.\n\nFollow for the next Explain It Simply.\n", "hashtags": ["n8n", "automation", "webhook"], "sources": [], "production_notes": "Motion template 'Explain It Simply'. Keep the last frame identical to the first for the loop. Use a generic door illustration (own design or licensed vector).", "day": 4, "slot": "R1", "time": "13:30", "slot_no": 2, "date": "2026-10-15", "spec": "Reel 9:16 · 1080×1920 · H.264 MP4 · 30 fps · AAC 48 kHz · safe box x65–1015 / y270–1250 · burned-in captions y1050–1250 · cover title inside centre 1080×1350", "post_no": 14, "caption_full": "Why do some bots reply instantly while others take minutes? A doorbell.\n\nWithout a bell, you'd walk to the door every 5 minutes to check. That's “polling”: slow and wasteful.\nWith a bell, the visitor tells you the moment they arrive.\n\nA webhook is that bell for software. When a customer messages your page, Messenger “rings” your automation instantly. The fast bot isn't smarter. It just has a doorbell.\n\nFollow for the next Explain It Simply.\n\n#n8n #automation #webhook", "pillar_name": "Automation & n8n", "src": [], "wps": 2.44}, {"id": "D04-I2", "type": "image", "series": "Steal This Prompt", "pillar": "PA", "format": "Prompt card", "topic": "Think in Bangla, get it in English: 4 bilingual prompt lines", "human_problem": "Thinking clearly in Bangla but struggling to write professional English.", "objective": "Shares in Bangladesh; relatability", "hook": "Think in Bangla. Get it in English.", "main_idea": "AI works as translator and editor; four lines cover the common bilingual needs.", "takeaway": "Write in Bangla and let AI produce clear English, then learn from the changes it shows you.", "value": "Four copy-paste lines for Bangla↔English writing, editing and client messages.", "cta": "Send it to a friend who writes to foreign clients.", "cta_type": "share", "visual_concept": "Prompt card with a small 'বাংলা → English' tag; four quote chips.", "design": {"headline": "Think in Bangla. Get it in English.", "subhead": "4 lines to use AI as your translator and editor", "body": ["“I'll write in Bangla. Reply in simple English.”", "“Fix my English but keep my meaning. Show what you changed.”", "“Translate this for a client in the US. Polite, not stiff.”", "“Give me both: the English version + a Bangla explanation.”"], "footer": "Read it before you send it. You're still the editor.", "layout": "Light background. Small tag top-left 'বাংলা → English'. Headline + subhead. Four quote chips stacked with numbers. Footer bottom."}, "caption": "You don't need perfect English to write good English with AI.\n\n4 lines I'd use:\n1. “I'll write in Bangla. Reply in simple English.”\n2. “Fix my English but keep my meaning. Show what you changed.”\n3. “Translate this for a client in the US. Polite, not stiff.”\n4. “Give me both: the English version + a Bangla explanation.”\n\nLine 2 is the one that teaches you. Read the changes, and next time you'll make fewer of them.\n\nSend this to a friend who writes to foreign clients.\n", "hashtags": ["AItips", "freelancing", "EnglishWriting"], "sources": [], "production_notes": "Use a font with proper Bengali glyph support for the tag (e.g. Noto Sans Bengali). Check rendering on Android before posting.", "day": 4, "slot": "I2", "time": "18:30", "slot_no": 3, "date": "2026-10-15", "spec": "Feed image 4:5 · 1440×1800 PNG (sRGB) · text ≥90 px from edges · headline ≥88 px, body ≥44 px · ≤75 words on image", "post_no": 15, "caption_full": "You don't need perfect English to write good English with AI.\n\n4 lines I'd use:\n1. “I'll write in Bangla. Reply in simple English.”\n2. “Fix my English but keep my meaning. Show what you changed.”\n3. “Translate this for a client in the US. Polite, not stiff.”\n4. “Give me both: the English version + a Bangla explanation.”\n\nLine 2 is the one that teaches you. Read the changes, and next time you'll make fewer of them.\n\nSend this to a friend who writes to foreign clients.\n\n#AItips #freelancing #EnglishWriting", "pillar_name": "Practical AI", "src": [], "wps": null}, {"id": "D04-R2", "type": "reel", "series": "What It Means For You", "pillar": "NEWS", "format": "Green screen + talking head", "topic": "OpenAI's 'dots': always-on agents explained", "human_problem": "AI only helps while you're chatting, so ongoing work stops the moment you close the app.", "objective": "Timeliness + authority on agents", "hook": "ChatGPT now keeps working after you close it.", "open_loop": "Can I use it? (answered at 27 s)", "main_idea": "Dots are always-on ChatGPT agents with their own cloud computer that pursue a goal and report back; Pro/Business Premium only for now.", "takeaway": "Dots are always-on ChatGPT agents for Pro and Business Premium users, so start them on low-risk jobs.", "value": "What it is, how it works, who can use it, and a sensible way to start (low-risk jobs).", "payoff": "27–36 s: only Pro and Business Premium for now; 36–41 s: start it on low-risk jobs.", "cta": "Follow for updates when it reaches more plans.", "cta_type": "follow", "visual_concept": "Asif over a self-captured screenshot of the official announcement; simple goal → dot → report diagram; plan badges.", "runtime": 45, "retention": {"hook": "'Keeps working after you close it' is a new idea for most chatbot users and gets an instant 'how?'.", "novelty": "Launched one week ago (29 Sep 2026); most viewers haven't seen a plain explanation yet.", "usefulness": "Answers the practical questions people actually have: what is it, who gets it, how to start safely.", "curiosity": "'Not for everyone, yet' at second 3 makes viewers wait to see if they can use it.", "payoff": "Ends with a clear personal take (start with low-risk jobs) instead of hype."}, "script": [{"t": "0-3", "vo": "ChatGPT now keeps working after you close it.", "ost": "Works after you close the app", "vis": "Asif on green screen over the official 'Introducing dots' page (own screen capture)."}, {"t": "3-7", "vo": "They're called dots. Launched September 29. Not for everyone, yet.", "ost": "‘Dots’ · 29 Sep 2026", "vis": "Date highlighted on the page."}, {"t": "7-12.5", "vo": "A dot is an always-on agent. You give it a goal, not a single question.", "ost": "A goal, not a question", "vis": "Diagram: 'Goal' card slides into a dot icon."}, {"t": "12.5-17.5", "vo": "It has its own cloud computer, so it can keep going between chats.", "ost": "Own cloud computer", "vis": "Cloud + laptop icon; progress bar keeps moving while the chat window closes."}, {"t": "17.5-23", "vo": "You set what it can do alone, and it brings results back for review.", "ost": "You set limits · it reports back", "vis": "Checklist of permissions; a 'Review' card returns."}, {"t": "23-27", "vo": "You can reach it in ChatGPT, Slack or Teams.", "ost": "ChatGPT · Slack · Teams", "vis": "Three neutral app icons."}, {"t": "27-32", "vo": "Who gets it? For now, only ChatGPT Pro and Business Premium.", "ost": "Pro + Business Premium only", "vis": "Plan badges; Free/Plus greyed out."}, {"t": "32-36", "vo": "Free, Go and Plus users don't have it yet.", "ost": "Not on Free, Go or Plus (yet)", "vis": "Asif shrugs."}, {"t": "36-41", "vo": "My take: start with low-risk jobs. Not your money or inbox.", "ost": "Start low-risk", "vis": "Asif to camera, serious."}, {"t": "41-45", "vo": "Follow, and I'll tell you when it reaches more plans.", "ost": "Follow for updates", "vis": "End card."}], "caption": "ChatGPT can now keep working after you close the app, but not for everyone yet.\n\nWhat they are (launched 29 Sep 2026):\n• An always-on agent: you give it a goal, not a single question\n• It has its own cloud computer, so it keeps going between conversations\n• You decide what it can do on its own; it brings results back for review\n• Reachable in ChatGPT, Slack and Teams\n\nWho can use it: ChatGPT Pro (outside the EEA, Switzerland and the UK) and Business Premium. Enterprise can try a beta if an admin turns it on. Not on Free, Go or Plus yet.\n\nMy take: give a new agent low-risk jobs first. Keep your money and your inbox out of it for now.\n\nFollow and I'll post when it reaches more plans.\n", "hashtags": ["ChatGPT", "AIagents", "AInews"], "sources": ["openai_dots"], "production_notes": "Capture the announcement page from your own screen (commentary use). Re-check plan availability the day before posting. If dots have reached Plus/Free by then, re-record beats 7–8.", "day": 4, "slot": "R2", "time": "21:00", "slot_no": 4, "date": "2026-10-15", "spec": "Reel 9:16 · 1080×1920 · H.264 MP4 · 30 fps · AAC 48 kHz · safe box x65–1015 / y270–1250 · burned-in captions y1050–1250 · cover title inside centre 1080×1350", "post_no": 16, "caption_full": "ChatGPT can now keep working after you close the app, but not for everyone yet.\n\nWhat they are (launched 29 Sep 2026):\n• An always-on agent: you give it a goal, not a single question\n• It has its own cloud computer, so it keeps going between conversations\n• You decide what it can do on its own; it brings results back for review\n• Reachable in ChatGPT, Slack and Teams\n\nWho can use it: ChatGPT Pro (outside the EEA, Switzerland and the UK) and tion": "Looking for NotebookLM? It has a new name: Gemini Notebook.\n\nRenamed on 16 July 2026. Same product, same notebooks, nothing to move.\n\nWhat it does: you add your own sources (PDFs, notes, websites, YouTube links) and it answers from them, pointing to where each answer came from.\n\nNew in September: ~60-second video summaries in 80+ languages, plus quizzes and flashcards.\n\nIf an older tutorial says “NotebookLM”, it's talking about this tool.\n\nSend this to the classmate who still calls it NotebookLM.\n", "hashtags": ["GeminiNotebook", "NotebookLM", "studytips"], "sources": ["google_notebook_rename", "google_notebook_study", "google_notebook_youtube"], "production_notes": "Use the product name as text only; no Google logos. Verify 'free to start' on the current pricing page the day before posting.", "day": 5, "slot": "I1", "time": "09:30", "slot_no": 1, "date": "2026-10-16", "spec": "Feed image 4:5 · 1440×1800 PNG (sRGB) · text ≥90 px from edges · headline ≥88 px, body ≥44 px · ≤75 words on image", "post_no": 17, "caption_full": "Looking for NotebookLM? It has a new name: Gemini Notebook.\n\nRenamed on 16 July 2026. Same product, same notebooks, nothing to move.\n\nWhat it does: you add your own sources (PDFs, notes, websites, YouTube links) and it answers from them, pointing to where each answer came from.\n\nNew in September: ~60-second video summaries in 80+ languages, plus quizzes and flashcards.\n\nIf an older tutorial says “NotebookLM”, it's talking about this tool.\n\nSend this to the classmate who still calls it NotebookLM.\n\n#GeminiNotebook #NotebookLM #studytips", "pillar_name": "Current developments", "src": [{"t": "NotebookLM is now Gemini Notebook", "u": "https://blog.google/innovation-and-ai/products/gemini-notebook/notebooklm-gemini-notebook/", "p": "Google Blog / Workspace Updates", "d": "2026-07-16", "v": false}, {"t": "Sharpen your study routine with new Gemini Notebook tools", "u": "https://blog.google/innovation-and-ai/products/gemini-notebook/new-study-tools-september-2026/", "p": "Google Blog", "d": "2026-09", "v": false}, {"t": "NotebookLM adds audio and YouTube support", "u": "https://blog.google/innovation-and-ai/products/notebooklm-audio-video-sources/", "p": "Google Blog", "d": "2024-09", "v": false}], "wps": null}, {"id": "D05-R1", "type": "reel", "series": "AI Myth Check", "pillar": "LIT", "format": "Numbered list + talking head", "topic": "5 things you should never paste into AI", "human_problem": "Pasting private or sensitive data into AI chats without thinking about where it goes.", "objective": "Shares (safety) + trust", "hook": "You've probably pasted one of these into AI.", "open_loop": "Which of the five have I already done?", "main_idea": "Five categories of data don't belong in AI chats; placeholders keep the help without the risk.", "takeaway": "Replace private details with placeholders before you paste anything into AI.", "value": "A clear 'never paste' list + the placeholder technique.", "payoff": "25–31 s: placeholders let you get the same help without sharing the data.", "cta": "Ask viewers which one they've pasted before.", "cta_type": "question", "visual_concept": "Numbered cards slide in beside Asif; final screen recording shows names swapped for [CLIENT] placeholders.", "runtime": 37, "retention": {"hook": "'You've probably done this' makes every viewer check themselves against the list.", "relatability": "Mobile-banking PINs, NID numbers and customer phone lists are everyday data for this audience.", "visual_progression": "A new numbered card every 4–5 seconds keeps the screen changing.", "usefulness": "The placeholder trick lets people keep using AI on real work safely.", "save_share": "Teams forward it; the honest question invites comments without bait."}, "script": [{"t": "0-3", "vo": "You've probably pasted one of these into AI.", "ost": "Pasted one of these?", "vis": "Asif to camera; hand covers a phone screen."}, {"t": "3-7", "vo": "One: passwords and OTP codes. No tool ever needs them.", "ost": "1 · Passwords & OTPs", "vis": "Card 1 slides in."}, {"t": "7-11", "vo": "Two: card numbers and mobile banking PINs.", "ost": "2 · Card numbers & PINs", "vis": "Card 2 slides in."}, {"t": "11-15", "vo": "Three: your NID or passport number, or anyone else's.", "ost": "3 · NID & passport numbers", "vis": "Card 3 slides in."}, {"t": "15-20", "vo": "Four: customer phone lists or client files, without their permission.", "ost": "4 · Other people's data", "vis": "Card 4 slides in."}, {"t": "20-25", "vo": "Five: anything under an NDA, or a contract you promised to keep private.", "ost": "5 · Anything under NDA", "vis": "Card 5 slides in."}, {"t": "25-31", "vo": "Need help with a real document? Swap details for placeholders: client A, amount X.", "ost": "Use [CLIENT] · [AMOUNT]", "vis": "Screen recording: names and amounts replaced by [CLIENT], [AMOUNT]."}, {"t": "31-37", "vo": "You still get the help, without the risk. Which one have you pasted before?", "ost": "Which one have you pasted?", "vis": "Asif to camera; end card."}], "caption": "You've probably pasted at least one of these into an AI chat:\n\n1. Passwords and OTP codes\n2. Card numbers and mobile-banking PINs\n3. NID or passport numbers (yours or anyone's)\n4. Customer phone lists or client files, without permission\n5. Anything under an NDA or confidentiality promise\n\nNeed help with a real document? Replace the details with placeholders: [CLIENT], [AMOUNT], [PHONE]. You still get the help; the AI never sees the data.\n\nBe honest: which one have you pasted before? (No judgement.)\n", "hashtags": ["AIsafety", "privacy", "AItips"], "sources": [], "production_notes": "Use a fake document for the placeholder demo. Don't show any real customer data, even blurred.", "day": 5, "slot": "R1", "time": "13:30", "slot_no": 2, "date": "2026-10-16", "spec": "Reel 9:16 · 1080×1920 · H.264 MP4 · 30 fps · AAC 48 kHz · safe box x65–1015 / y270–1250 · burned-in captions y1050–1250 · cover title inside centre 1080×1350", "post_no": 18, "caption_full": "You've probably pasted at least one of these into an AI chat:\n\n1. Passwords and OTP codes\n2. Card numbers and mobile-banking PINs\n3. NID or passport numbers (yours or anyone's)\n4. Customer phone lists or client files, without permission\n5. Anything under an NDA or confidentiality promise\n\nNeed help with a real document? Replace the details with placeholders: [CLIENT], [AMOUNT], [PHONE]. You still get the help; the AI never sees the data.\n\nBe honest: which one have you pasted before? (No judgement.)\n\n#AIsafety #privacy #AItips", "pillar_name": "AI literacy & safety", "src": [], "wps": 2.3}, {"id": "D05-I2", "type": "image", "series": "Steal This Prompt", "pillar": "WF", "format": "Framework card", "topic": "A 10-minute daily AI routine: 3 morning prompts, 1 evening prompt", "human_problem": "Starting busy days without knowing what matters most.", "objective": "Saves; habit-forming", "hook": "A 10-minute AI routine for busy days", "main_idea": "Four prompts around your real task list turn AI into a daily planning partner.", "takeaway": "Four short prompts around your real task list help you prioritise in the morning and carry work over at night.", "value": "Three morning prompts (prioritise, break down, risks) + one evening prompt (carry over).", "cta": "Save it and try it tomorrow morning.", "cta_type": "save", "visual_concept": "Sun/moon split card: morning section with 3 prompts, evening section with 1.", "design": {"headline": "A 10-minute AI routine for busy days", "body": ["MORNING", "1. “Here's my task list. Which 3 matter most today, and why?”", "2. “Break task #1 into steps under 30 minutes each.”", "3. “What could go wrong today? One line each.”", "EVENING", "4. “Here's what I finished. What should move to tomorrow?”"], "footer": "Paste your real list. The answers are only as good as your list.", "layout": "Card split horizontally: top 70% light with a small sun icon (MORNING + 3 prompts), bottom 30% dark with a moon icon (EVENING + 1 prompt). Footer under the dark band."}, "caption": "A 10-minute AI routine I'd use on busy days:\n\nMorning\n1. “Here's my task list: [paste]. Which 3 matter most today, and why?”\n2. “Break task #1 into steps under 30 minutes each.”\n3. “What could go wrong today? One line each.”\n\nEvening\n4. “Here's what I finished: [paste]. What should move to tomorrow?”\n\nPaste your real list. Vague list, vague advice.\n\nTry it tomorrow morning with your real list.\n", "hashtags": ["productivity", "AItips", "planning"], "sources": [], "production_notes": "Framework template. MORNING/EVENING labels as small caps, not counted as separate ideas.", "day": 5, "slot": "I2", "time": "18:30", "slot_no": 3, "date": "2026-10-16", "spec": "Feed image 4:5 · 1440×1800 PNG (sRGB) · text ≥90 px from edges · headline ≥88 px, body ≥44 px · ≤75 words on image", "post_no": 19, "caption_full": "A 10-minute AI routine I'd use on busy days:\n\nMorning\n1. “Here's my task list: [paste]. Which 3 matter most today, and why?”\n2. “Break task #1 into steps under 30 minutes each.”\n3. “What could go wrong today? One line each.”\n\nEvening\n4. “Here's what I finished: [paste]. What should move to tomorrow?”\n\nPaste your real list. Vague list, vague advice.\n\nTry it tomorrow morning with your real list.\n\n#productivity #AItips #planning", "pillar_name": "Workflows & productivity", "src": [], "wps": null}, {"id": "D05-R2", "type": "reel", "series": "Steal This Prompt", "pillar": "PA", "format": "Screen demo + face cam", "topic": "Spreadsheet formulas from plain English, plus the 3-row test", "human_problem": "Needing a total from a spreadsheet but not knowing the formula.", "objective": "Saves + practical win for office workers and sellers", "hook": "Can't write Excel formulas? Describe them instead.", "open_loop": "What's the part most people skip? (held until 17.5 s)", "main_idea": "Describe the goal, columns and rows; get a formula with an explanation; always test on rows you can check by hand.", "takeaway": "Describe the result you need and test the AI's formula on rows you can check by hand.", "value": "Prompt template + the testing habit that makes AI formulas trustworthy.", "payoff": "21–31 s: the 3-row test proves the formula before it touches 500 rows.", "cta": "Save it for your next spreadsheet.", "cta_type": "save", "visual_concept": "Google Sheet order list; AI prompt and answer; 3 highlighted rows with hand math overlay; green tick.", "runtime": 44, "retention": {"hook": "Speaks to a common insecurity (formulas) and removes it in one line.", "problem_solution": "A real sales question goes from blank to answered on screen.", "curiosity": "'The part most people skip' at second 17 holds viewers for the twist.", "payoff": "The formula result matches the hand-checked 4,500 with a green tick.", "save_share": "Prompt template in the caption is reusable for any spreadsheet question."}, "script": [{"t": "0-3", "vo": "Can't write Excel formulas? Describe them instead.", "ost": "Describe it. Don't memorise it.", "vis": "Asif face; a messy sheet behind him."}, {"t": "3-7.5", "vo": "Here's my order sheet: date, amount, status. I want October's delivered sales.", "ost": "Goal: Oct delivered sales", "vis": "Screen: sheet with columns A Date, B Amount, C Status."}, {"t": "7.5-13", "vo": "So I tell AI exactly that, plus the column letters and where data starts.", "ost": "Say: goal + columns + rows", "vis": "Prompt typed (same as caption)."}, {"t": "13-17.5", "vo": "It gives a formula, and explains each part in plain words.", "ost": "Formula + explanation", "vis": "AI answer with SUMIFS formula; explanation lines highlighted."}, {"t": "17.5-21", "vo": "Now the important part most people skip.", "ost": "The part people skip ↓", "vis": "Asif leans in."}, {"t": "21-26.5", "vo": "Test it on three rows you can check by hand. Here, I expect 4,500.", "ost": "Test on 3 rows", "vis": "3-row test copy highlighted; overlay 1,200 + 2,000 + 1,300 = 4,500."}, {"t": "26.5-31", "vo": "It says 4,500. Now I can trust all 500 rows.", "ost": "✓ 4,500 = 4,500", "vis": "Cell shows 4,500; green tick animation."}, {"t": "31-36.5", "vo": "If it's wrong, paste the error or the wrong result back. It fixes it.", "ost": "Wrong? Paste it back", "vis": "Screen: error pasted into chat; corrected formula returned."}, {"t": "36.5-41", "vo": "Works in Google Sheets and Excel. The prompt is in the caption.", "ost": "Prompt in caption ↓", "vis": "Asif points down."}, {"t": "41-44", "vo": "Save it for your next spreadsheet.", "ost": "Save for later", "vis": "End card."}], "caption": "Can't write spreadsheet formulas? Describe them instead.\n\nPrompt:\n“I have a sheet. Column A = order date, B = amount, C = status. Data is in rows 2–500. Write a Google Sheets formula for the total amount of orders with status ‘Delivered’ in October 2026. Explain each part in one line.”\n\nThen the step most people skip: test it on 3 rows where you already know the answer. If it matches, use it on the full sheet. If not, paste the wrong result back and ask it to fix the formula.\n\nWorks for Excel too. Just say “Excel” instead.\n\nThe 3-row test is the habit worth keeping. It works for any formula.\n", "hashtags": ["GoogleSheets", "Excel", "AItips"], "sources": [], "production_notes": "Build a demo sheet with fake orders. Make a separate 3-row test tab where the known total is 4,500 (1,200 + 2,000 + 1,300, all Delivered, all October). Record the real AI answer; if the formula differs from SUMIFS, show what you actually got.", "day": 5, "slot": "R2", "time": "21:00", "slot_no": 4, "date": "2026-10-16", "spec": "Reel 9:16 · 1080×1920 · H.264 MP4 · 30 fps · AAC 48 kHz · safe box x65–1015 / y270–1250 · burned-in captions y1050–1250 · cover title inside centre 1080×1350", "post_no": 20, "caption_full": "Can't write spreadsheet formulas? Describe them instead.\n\nPrompt:\n“I have a sheet. Column A = order date, B = amount, C = status. Data is in rows 2–500. Write a Google Sheets formula for the total amount of orders with status ‘Delivered’ in October 2026. Explain each part in one line.”\n\nThen the step most people skip: test it on 3 rows where you already know the answer. If it matches, use it on the full sheet. If not, paste the wrong result back and ask it to fix the formula.\n\nWorks for Excel too. Just say “Excel” instead.\n\nThe 3-row test is the habit worth keeping. It works for any formula.\n\n#GoogleSheets #Excel #AItips", "pillar_name": "Practical AI", "src": [], "wps": 2.48}, {"id": "D06-I1", "type": "image", "series": "AI Myth Check", "pillar": "AU", "format": "Myth vs fact", "topic": "Myth: you need to code to automate", "human_problem": "Believing automation is only for programmers.", "objective": "Lower the barrier; educate future buyers", "hook": "Myth: you need to code to automate", "main_idea": "Visual tools make automation about process thinking, not code; AI now writes the small code bits.", "takeaway": "If you can write a process down step by step, you can learn to automate it with visual tools.", "value": "Reframes the real skill (thinking in steps) and what you actually need.", "cta": "None. The closing line is the takeaway.", "cta_type": "none", "visual_concept": "Myth (crossed out) vs Fact panels; small node-graph illustration.", "design": {"headline": "Myth: you need to code to automate", "body": ["FACT: Tools like n8n, Make and Zapier are visual. You connect boxes.", "You need: a clear process, the apps' logins, and patience to test.", "Code helps for edge cases. AI can now write those small bits.", "The real skill is thinking in steps: trigger → steps → result."], "footer": "Can you write the steps on paper? You can learn to automate them.", "layout": "Top band red-tinted: 'MYTH' tag + headline with strike-through on 'you need to code'. Lower area green-tinted: 'FACT' rows. Small node-graph doodle bottom-right."}, "caption": "Myth: you need to be a programmer to automate your work.\n\nFact: n8n, Make and Zapier are visual tools. You connect boxes: “when this happens → do this → then this”.\n\nWhat you actually need:\n• a clear process (write it on paper first)\n• logins to the apps involved\n• patience to test with fake data\n\nCode helps with edge cases, and AI can now write those small pieces for you.\n\nIf you can write the steps down, you can learn to automate them.\n", "hashtags": ["automation", "nocode", "n8n"], "sources": [], "production_notes": "Myth-vs-fact template. Tool names as plain text, no logos.", "day": 6, "slot": "I1", "time": "09:30", "slot_no": 1, "date": "2026-10-17", "spec": "Feed image 4:5 · 1440×1800 PNG (sRGB) · text ≥90 px from edges · headline ≥88 px, body ≥44 px · ≤75 words on image", "post_no": 21, "caption_full": "Myth: you need to be a programmer to automate your work.\n\nFact: n8n, Make and Zapier are visual tools. You connect boxes: “when this happens → do this → then this”.\n\nWhat you actually need:\n• a clear process (write it on paper first)\n• logins to the apps involved\n• patience to test with fake data\n\nCode helps with edge cases, and AI can now write those small pieces for you.\n\nIf you can write the steps down, you can learn to automate them.\n\n#automation #nocode #n8n", "pillar_name": "Automation & n8n", "src": [], "wps": null}, {"id": "D06-R1", "type": "reel", "series": "Before → After", "pillar": "WF", "format": "Phone-in-hand demo", "topic": "Brain-dump by voice, get a clean plan", "human_problem": "Too many tasks in your head to even decide where to begin.", "objective": "Relatability + saves", "hook": "Head too full to start? Talk it out.", "open_loop": "Can a messy ramble really turn into a plan?", "main_idea": "Speaking a 2-minute messy brain-dump into voice mode, then asking for a grouped plan, beats typing.", "takeaway": "Talk through everything in voice mode, then ask AI to turn it into a grouped plan with next steps.", "value": "The brain-dump method + the exact 'turn this into a plan' prompt.", "payoff": "17–27 s: a grouped plan appears, including a task mentioned only once in passing.", "cta": "Save the prompt from the caption.", "cta_type": "save", "visual_concept": "Asif walking and talking into the phone; waveform; messy transcript turns into a neat grouped plan.", "runtime": 36, "retention": {"hook": "Names the overwhelm of a full head and offers a low-effort start: just talk.", "relatability": "A full head and scattered tasks is a feeling everyone knows.", "visual_progression": "Messy transcript visibly reorganises into grouped tasks.", "payoff": "A task mentioned once in passing shows up in the right group: proof it works.", "usefulness": "Free voice mode in common AI apps plus a one-line prompt; works in Bangla or English."}, "script": [{"t": "0-3", "vo": "Head too full to start? Talk it out.", "ost": "Too much in your head?", "vis": "Asif walking, phone near mouth."}, {"t": "3-8", "vo": "I don't type. I open voice mode and just talk.", "ost": "Voice mode. Just talk.", "vis": "Screen: tapping the voice/mic icon in an AI app."}, {"t": "8-13", "vo": "Two minutes. Half sentences, worries, random tasks. Bangla, English, both.", "ost": "2 minutes · any language", "vis": "Speed-ramped talking; waveform overlay."}, {"t": "13-17", "vo": "Then one sentence: “Turn this into a plan.”", "ost": "“Turn this into a plan.”", "vis": "Large text on screen."}, {"t": "17-22.5", "vo": "Add: “Group by project, give each task a next step, flag anything urgent.”", "ost": "group · next step · urgent", "vis": "Screen: structured plan appears."}, {"t": "22.5-27", "vo": "Look. Things I mentioned once, now in the right place.", "ost": "Nothing lost", "vis": "Highlight a task mentioned in passing, now under the right project."}, {"t": "27-32", "vo": "It's faster than typing, and you forget less.", "ost": "Faster than typing", "vis": "Asif to camera."}, {"t": "32-36", "vo": "The full prompt is in the caption. Try it tonight.", "ost": "Prompt ↓", "vis": "End card."}], "caption": "Head too full to even start? Don't type. Talk.\n\n1. Open voice mode in your AI app (ChatGPT, Gemini, Claude all have one)\n2. Talk for 2 minutes: half-sentences, worries, random tasks. Bangla, English, both.\n3. Then say: “Turn this into a plan. Group by project, give each task one next step, and flag anything urgent or due this week.”\n\nFaster than typing, and nothing you mentioned gets lost.\n\nTry it tonight when your head is full.\n", "hashtags": ["productivity", "AItips", "voiceAI"], "sources": [], "production_notes": "Record a genuine brain-dump (real tasks, nothing private). Show the actual transcript. Speed-ramp 2 minutes down to ~5 s.", "day": 6, "slot": "R1", "time": "13:30", "slot_no": 2, "date": "2026-10-17", "spec": "Reel 9:16 · 1080×1920 · H.264 MP4 · 30 fps · AAC 48 kHz · safe box x65–1015 / y270–1250 · burned-in captions y1050–1250 · cover title inside centre 1080×1350", "post_no": 22, "caption_full": "Head too full to even start? Don't type. Talk.\n\n1. Open voice mode in your AI app (ChatGPT, Gemini, Claude all have one)\n2. Talk for 2 minutes: half-sentences, worries, random tasks. Bangla, English, both.\n3. Then say: “Turn this into a plan. Group by project, give each task one next step, and flag anything urgent or due this week.”\n\nFaster than typing, and nothing you mentioned gets lost.\n\nTry it tonight when your head is full.\n\n#productivity #AItips #voiceAI", "pillar_name": "Workflows & productivity", "src": [], "wps": 2.14}, {"id": "D06-I2", "type": "image", "series": "Steal This Prompt", "pillar": "PA", "format": "Before/after chat mock", "topic": "Angry customer? Compare a defensive reply with a calm one", "human_problem": "An angry customer message arrives and the first reply that comes to mind is defensive.", "objective": "Saves for sellers and support staff", "hook": "Angry customer? Compare these two replies", "main_idea": "A structured prompt produces a calm, human reply with options instead of excuses.", "takeaway": "A calm reply says sorry once, repeats the problem and offers two clear options.", "value": "A copy-paste complaint-reply prompt with four rules.", "cta": "Save it for your next difficult message.", "cta_type": "save", "visual_concept": "Phone chat mock: customer complaint, a red-outlined defensive reply, a green-outlined calm reply, and the prompt strip.", "design": {"headline": "Angry customer? Compare these two replies", "body": ["Customer: “3 days late and no update. Very bad service.”", "✗ “Sorry for the inconvenience. Delays happen due to courier issues.”", "✓ “You're right, 3 days with no update isn't OK. I'm sorry. I can resend today or refund now. Which do you prefer?”", "Prompt: “Reply: sorry once, repeat their problem, 2 options, under 80 words.”"], "footer": "Check names, prices and promises before you send.", "layout": "Phone chat mock: grey customer bubble on top; red-outlined defensive reply; green-outlined calm reply; prompt strip at the bottom. Footer below the phone."}, "caption": "Angry customer message? The first reply that comes to mind is usually defensive.\n\n✗ “Sorry for the inconvenience. Delays happen due to courier issues.”\n✓ “You're right, 3 days with no update isn't OK. I'm sorry. I can resend today or refund now. Which do you prefer?”\n\nThe second one says sorry once, shows you understood, and gives a choice. AI can draft it for you:\n“Here's a customer message: [paste]. Write a reply that says sorry once without excuses, repeats their problem in one line, offers 2 clear options with times, and sounds like a calm human. Under 80 words.”\n\nCheck every name, price and promise before sending. Keep the prompt for the next difficult message.\n", "hashtags": ["customerservice", "AItips", "smallbusiness"], "sources": [], "production_notes": "Prompt-card template. Keep the dash bullets inside the quote block so it reads as one prompt.", "day": 6, "slot": "I2", "time": "18:30", "slot_no": 3, "date": "2026-10-17", "spec": "Feed image 4:5 · 1440×1800 PNG (sRGB) · text ≥90 px from edges · headline ≥88 px, body ≥44 px · ≤75 words on image", "post_no": 23, "caption_full": "Angry customer message? The first reply that comes to mind is usually defensive.\n\n✗ “Sorry for the inconvenience. Delays happen due to courier issues.”\n✓ “You're right, 3 days with no update isn't OK. I'm sorry. I can resend today or refund now. Which do you prefer?”\n\nThe second one says sorry once, shows you understood, and gives a choice. AI can draft it for you:\n“Here's a customer message: [paste]. Write a reply that says sorry once without excuses, repeats their problem in one line, offers 2 clear options with times, and sounds like a calm human. Under 80 words.”\n\nCheck every name, price and promise before sending. Keep the prompt for the next difficult message.\n\n#customerservice #AItips #smallbusiness", "pillar_name": "Practical AI", "src": [], "wps": null}, {"id": "D06-R2", "type": "reel", "series": "Hidden Button", "pillar": "HF", "format": "Screen demo + face cam", "topic": "Turn a YouTube lecture into a quiz with Gemini Notebook", "human_problem": "Watching long lectures and forgetting almost everything by exam time.", "objective": "Saves + shares among students", "hook": "Watched a two-hour lecture. Remember nothing?", "open_loop": "How do you turn a video into something you'll actually remember?", "main_idea": "Add a YouTube lecture + notes to Gemini Notebook, generate a quiz, test yourself first, then make flashcards from mistakes.", "takeaway": "Turn a lecture into a quiz with Gemini Notebook and study only what you got wrong.", "value": "A study workflow built on retrieval practice using a free tool.", "payoff": "17–37 s: quiz first, then explanations with the exact lecture line, then flashcards from your mistakes.", "cta": "Send it to a classmate with exams coming.", "cta_type": "share", "visual_concept": "Laptop with a lecture → Gemini Notebook screens: add source, quiz, citation, flashcards.", "runtime": 44, "retention": {"hook": "Hits a universal student pain (watched it, forgot it) in under 3 seconds.", "relatability": "Exam season, long recorded lectures and scattered slides are familiar to students.", "usefulness": "Exact steps in a free tool, including the new quiz formats.", "novelty": "Many viewers still know the tool as NotebookLM and haven't seen the September quiz/flashcard tools.", "visual_progression": "Moves through 5 different screens: lecture, source panel, quiz, citation, flashcards.", "save_share": "Students forward study hacks to classmates."}, "script": [{"t": "0-3", "vo": "Watched a two-hour lecture. Remember nothing?", "ost": "Watched it. Forgot it?", "vis": "Over-the-shoulder: YouTube lecture playing on a laptop."}, {"t": "3-7.5", "vo": "Open Gemini Notebook. It used to be called NotebookLM.", "ost": "Gemini Notebook (ex-NotebookLM)", "vis": "Screen: Gemini Notebook home."}, {"t": "7.5-12", "vo": "Create a notebook and paste the YouTube link as a source.", "ost": "Add source → YouTube link", "vis": "Screen recording: pasting the link."}, {"t": "12-17", "vo": "Add your class slides or notes too. It answers from these sources.", "ost": "Answers from YOUR sources", "vis": "Sources panel fills."}, {"t": "17-22", "vo": "Now create a quiz. Short answer, multiple choice, or fill in the blank.", "ost": "Quiz · 3 formats", "vis": "Studio panel → Quiz → format picker."}, {"t": "22-27", "vo": "Take it before you read anything again. Getting answers wrong is the point.", "ost": "Test first. Mistakes = memory", "vis": "Quiz on screen; one answer turns red."}, {"t": "27-32.5", "vo": "Wrong answers? Ask it to explain that part, with the exact line from the lecture.", "ost": "Explain + show the source", "vis": "Answer with a citation; click shows the transcript line."}, {"t": "32.5-37", "vo": "Then make flashcards from what you missed.", "ost": "Flashcards from mistakes", "vis": "Flashcards panel."}, {"t": "37-41", "vo": "Free to start. Works with PDFs and notes too.", "ost": "Free to start", "vis": "Asif face-cam."}, {"t": "41-44", "vo": "Send this to a friend with exams coming.", "ost": "Send to a classmate", "vis": "End card."}], "caption": "Watched a two-hour lecture and remember nothing? Do this:\n\n1. Open Gemini Notebook (the new name of NotebookLM)\n2. Create a notebook → add the YouTube link as a source, plus your slides or notes\n3. Create a quiz (short answer, multiple choice or fill-in-the-blank)\n4. Take it BEFORE re-reading. Wrong answers show you what to study.\n5. Ask it to explain each wrong answer and show the exact line from the lecture\n6. Turn your mistakes into flashcards\n\nTesting yourself beats re-reading. Free to start.\n\nExams coming? Share it with your study group.\n", "hashtags": ["studytips", "GeminiNotebook", "students"], "sources": ["google_notebook_rename", "google_notebook_study", "google_notebook_youtube"], "production_notes": "Use a public lecture you have the right to show briefly on screen (e.g. an openly licensed university lecture, or record your own 5-minute 'lecture'). Keep the third-party video on screen ≤ 3 s; focus on the Gemini Notebook UI. Verify quiz formats in the live UI before filming.", "day": 6, "slot": "R2", "time": "21:00", "slot_no": 4, "date": "2026-10-17", "spec": "Reel 9:16 · 1080×1920 · H.264 MP4 · 30 fps · AAC 48 kHz · safe box x65–1015 / y270–1250 · burned-in captions y1050–1250 · cover title inside centre 1080×1350", "post_no": 24, "caption_full": "Watched a two-hour lecture and remember nothing? Do this:\n\n1. Open Gemini Notebook (the new name of NotebookLM)\n2. Create a notebook → add the YouTube link as a source, plus your slides or notes\n3. Create a quiz (short answer, multiple choice or fill-in-the-blank)\n4. Take it BEFORE re-reading. Wrong answers show you what to study.\n5. Ask it to explain each wrong answer and show the exact line from the lecture\n6. Turn your mistakes into flashcards\n\nTesting yourself beats re-reading. Free to start.\n\nExams coming? Share it with your study group.\n\n#studytips #GeminiNotebook #students", "pillar_name": "Hidden features & tools", "src": [{"t": "NotebookLM is now Gemini Notebook", "u": "https://blog.google/innovation-and-ai/products/gemini-notebook/notebooklm-gemini-notebook/", "p": "Google Blog / Workspace Updates", "d": "2026-07-16", "v": false}, {"t": "Sharpen your study routine with new Gemini Notebook tools", "u": "https://blog.google/innovation-and-ai/products/gemini-notebook/new-study-tools-september-2026/", "p": "Google Blog", "d": "2026-09", "v": false}, {"t": "NotebookLM adds audio and YouTube support", "u": "https://blog.google/innovation-and-ai/products/notebooklm-audio-video-sources/", "p": "Google Blog", "d": "2024-09", "v": false}], "wps": 2.34}, {"id": "D07-I1", "type": "image", "series": "Work With Me", "pillar": "SVC", "format": "Service menu", "topic": "What I build with n8n (service menu)", "human_problem": "Owners know they lose time to repetitive work but can't picture what automating it would look like.", "objective": "First explicit offer; Messenger leads", "hook": "What I build with n8n", "main_idea": "A menu of real workflow types Asif has built and runs, so buyers can recognise their need.", "takeaway": "Six real workflow types show what n8n automation looks like in a small business.", "value": "Concrete outcomes, not jargon; a clear next step.", "cta": "Message 'AUTOMATE' with the task you repeat most.", "cta_type": "message", "visual_concept": "Menu-style card with six icon rows and a Messenger CTA bar.", "design": {"headline": "What I build with n8n", "subhead": "Workflows I've built and run in production", "body": ["Messenger & WhatsApp assistants that reply in seconds", "Leads from forms or comments → Google Sheets + alert", "Auto-publishing from a content sheet to your pages", "File backups: Telegram → Google Drive, no duplicates", "Website AI assistant + calendar booking helper", "Form and application intake → email or chat alerts"], "footer": "Message me “AUTOMATE” with the task you repeat most.", "layout": "Dark background, menu style. Headline + subhead. Six rows each with a simple line icon (chat, sheet, calendar-post, cloud, globe, inbox). Bottom: full-width accent bar with Messenger icon + footer CTA."}, "caption": "People ask what I actually build. This is the menu. All of these are workflows I've built and run in n8n:\n\n• Messenger & WhatsApp assistants that reply in seconds\n• Leads from forms or comments → Google Sheets + instant alert\n• Auto-publishing from a content sheet to your pages\n• File backups: Telegram → Google Drive, verified, no duplicates\n• Website AI assistant and calendar booking helper\n• Form and application intake → email or chat alerts\n\nNot sure if your task fits? Send me a message describing it, and I'll tell you whether it's really worth automating.\n", "hashtags": ["n8n", "automation", "AIautomation"], "sources": [], "production_notes": "Every line maps to a real workflow in Asif's n8n (see 01-research/page-audit.md §3). Remove any line you don't want to sell. Set up the AUTOMATE keyword reply in Meta Business Suite before this goes live.", "day": 7, "slot": "I1", "time": "09:30", "slot_no": 1, "date": "2026-10-18", "spec": "Feed image 4:5 · 1440×1800 PNG (sRGB) · text ≥90 px from edges · headline ≥88 px, body ≥44 px · ≤75 words on image", "post_no": 25, "caption_full": "People ask what I actually build. This is the menu. All of these are workflows I've built and run in n8n:\n\n• Messenger & WhatsApp assistants that reply in seconds\n• Leads from forms or comments → Google Sheets + instant alert\n• Auto-publishing from a content sheet to your pages\n• File backups: Telegram → Google Drive, verified, no duplicates\n• Website AI assistant and calendar booking helper\n• Form and application intake → email or chat alerts\n\nNot sure if your task fits? Send me a message describing it, and I'll tell you whether it's really worth automating.\n\n#n8n #automation #A
