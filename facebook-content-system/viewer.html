Iautomation", "pillar_name": "Work with me (n8n services)", "src": [], "wps": null}, {"id": "D07-R1", "type": "reel", "series": "Automate This", "pillar": "AU", "format": "Numbered list + talking head", "topic": "5 signs a task should be automated", "human_problem": "Spending part of every day copying information from one app to another.", "objective": "Educate buyers to self-identify; comments", "hook": "Copy-pasting daily? That's a machine's job.", "open_loop": "Does my task pass the five signs?", "main_idea": "Same steps, copy-paste, frequency, costly mistakes and someone waiting = automate; judgment-heavy = keep human.", "takeaway": "A task with fixed steps, copy-paste, high frequency, costly mistakes or someone waiting is worth automating.", "value": "A self-scoring checklist (3+ signs = strong candidate) and the honest exception.", "payoff": "28–38 s: three or more signs means automate; needs judgment means keep it human.", "cta": "Comment which task scored highest.", "cta_type": "question", "visual_concept": "Counter graphic 1–5 with icons; tally at the end; 'keep it human' card.", "runtime": 43, "retention": {"hook": "Calls out a daily chore viewers do and reframes it as a machine's job, which is mildly provocative and relatable.", "relatability": "Copy-pasting from Messenger to a sheet and waiting customers are daily realities for sellers.", "usefulness": "Viewers can score their own tasks right away (3+ = automate).", "visual_progression": "A new numbered icon every ~4.5 s; tally animation at the end.", "payoff": "The 'keep it human' exception adds an honest twist that builds trust."}, "script": [{"t": "0-3", "vo": "Copy-pasting daily? That's a machine's job.", "ost": "Copy-paste daily = machine's job", "vis": "Asif copy-pasting between two windows, then stops and looks at camera."}, {"t": "3-5.5", "vo": "Five signs to check.", "ost": "5 signs", "vis": "Counter graphic appears."}, {"t": "5.5-10", "vo": "One: the steps are the same every time. Same apps, same order.", "ost": "1 · Same steps", "vis": "Icon 1 with repeating arrows."}, {"t": "10-14.5", "vo": "Two: you copy-paste between apps. Messenger to sheet, sheet to email.", "ost": "2 · Copy-paste between apps", "vis": "Animated cursor copy-pasting between two windows."}, {"t": "14.5-18.5", "vo": "Three: it happens every day or every week.", "ost": "3 · Daily or weekly", "vis": "Calendar pages flip."}, {"t": "18.5-23.5", "vo": "Four: a small mistake costs you. A wrong price, a missed order.", "ost": "4 · Mistakes cost money", "vis": "Red alert icon."}, {"t": "23.5-28", "vo": "Five: someone is waiting. A customer, a boss, a delivery man.", "ost": "5 · Someone is waiting", "vis": "Clock ticking icon."}, {"t": "28-33.5", "vo": "Three or more signs? That task is a strong candidate.", "ost": "3+ signs = automate", "vis": "Tally marks animate 1-2-3."}, {"t": "33.5-38", "vo": "But if it needs your judgment every single time, keep it human.", "ost": "Needs judgment? Keep it human.", "vis": "Asif to camera."}, {"t": "38-43", "vo": "Which task scored highest for you? Tell me below.", "ost": "Your task? ↓", "vis": "End card."}], "caption": "Copy-pasting the same thing every day? That's a machine's job. 5 signs a task should be automated:\n\n1. The steps are the same every time\n2. You copy-paste between apps (Messenger → sheet → email)\n3. It happens daily or weekly\n4. A small mistake costs money (wrong price, missed order)\n5. Someone is waiting (customer, boss, delivery)\n\n3 or more? Strong candidate.\nNeeds your judgment every time? Keep it human. Automation handles rules; decisions stay with you.\n\nWhich task scored highest for you?\n", "hashtags": ["automation", "smallbusiness", "n8n"], "sources": [], "production_notes": "List template with large numerals. Reply to comments with a one-line 'trigger → steps → result' for their task (consistent with D01-R2).", "day": 7, "slot": "R1", "time": "13:30", "slot_no": 2, "date": "2026-10-18", "spec": "Reel 9:16 · 1080×1920 · H.264 MP4 · 30 fps · AAC 48 kHz · safe box x65–1015 / y270–1250 · burned-in captions y1050–1250 · cover title inside centre 1080×1350", "post_no": 26, "caption_full": "Copy-pasting the same thing every day? That's a machine's job. 5 signs a task should be automated:\n\n1. The steps are the same every time\n2. You copy-paste between apps (Messenger → sheet → email)\n3. It happens daily or weekly\n4. A small mistake costs money (wrong price, missed order)\n5. Someone is waiting (customer, boss, delivery)\n\n3 or more? Strong candidate.\nNeeds your judgment every time? Keep it human. Automation handles rules; decisions stay with you.\n\nWhich task scored highest for you?\n\n#automation #smallbusiness #n8n", "pillar_name": "Automation & n8n", "src": [], "wps": 2.21}, {"id": "D07-I2", "type": "image", "series": "Hidden Button", "pillar": "HF", "format": "Hidden feature card", "topic": "3 Google Lens tricks most people miss", "human_problem": "Retyping phone numbers and text from photos by hand.", "objective": "Shares; broad utility", "hook": "Still typing text from photos? 3 Lens tricks", "main_idea": "Lens can copy text from images, translate in place and search what you see.", "takeaway": "Google Lens can copy text from photos, translate signs in place and search what you see.", "value": "Three practical uses with where to find Lens.", "cta": "Send it to someone who still types text from photos by hand.", "cta_type": "share", "visual_concept": "Three phone-shaped panels with icons for copy, translate and search.", "design": {"headline": "Still typing text from photos? 3 Lens tricks", "body": ["Copy text from any photo or screenshot: tap Text, select, copy.", "Translate a sign, menu or label: tap Translate, the words change on the image.", "Search what you see: point at a product or plant to find matches."], "footer": "Find Lens in the Google app, Google Photos, or your camera on many Android phones.", "layout": "Light background. Headline top. Three tall phone-outline panels side by side, each with a big icon (T, 文→A, magnifier) and the tip underneath. Footer bottom."}, "caption": "Still typing phone numbers from photos by hand? 3 Google Lens tricks most people miss:\n\n1. Copy text from any photo or screenshot: open it in Lens → Text → select → copy. No more typing phone numbers from pictures.\n2. Translate in place: point at a sign, menu or label → Translate. The words change on the image.\n3. Search what you see: point at a product, plant or part to find matches.\n\nFind Lens in the Google app, in Google Photos, or in the camera on many Android phones.\n\nSend this to someone who still types text from photos by hand.\n", "hashtags": ["GoogleLens", "techtips", "AItips"], "sources": [], "production_notes": "Draw phone outlines; don't screenshot Google UI. Test each trick on an Android and an iPhone before posting so the wording matches both.", "day": 7, "slot": "I2", "time": "18:30", "slot_no": 3, "date": "2026-10-18", "spec": "Feed image 4:5 · 1440×1800 PNG (sRGB) · text ≥90 px from edges · headline ≥88 px, body ≥44 px · ≤75 words on image", "post_no": 27, "caption_full": "Still typing phone numbers from photos by hand? 3 Google Lens tricks most people miss:\n\n1. Copy text from any photo or screenshot: open it in Lens → Text → select → copy. No more typing phone numbers from pictures.\n2. Translate in place: point at a sign, menu or label → Translate. The words change on the image.\n3. Search what you see: point at a product, plant or part to find matches.\n\nFind Lens in the Google app, in Google Photos, or in the camera on many Android phones.\n\nSend this to someone who still types text from photos by hand.\n\n#GoogleLens #techtips #AItips", "pillar_name": "Hidden features & tools", "src": [], "wps": null}, {"id": "D07-R2", "type": "reel", "series": "Before → After", "pillar": "PA", "format": "Before/after split screen", "topic": "Write emails that don't sound like AI", "human_problem": "Sending AI-written emails that sound stiff and fake to the people reading them.", "objective": "Saves + relatability for professionals", "hook": "People can tell your email came from AI.", "open_loop": "What gives it away, and how do you fix it?", "main_idea": "AI fills space with safe, long, polite filler; notes + your own sample + hard limits fix it.", "takeaway": "Give AI your notes, one real email you wrote and a word limit, then read the result aloud.", "value": "Three rules + read-aloud test + prompt in caption.", "payoff": "26–36.5 s: a half-length rewrite that sounds human, plus the read-aloud test.", "cta": "Save the prompt.", "cta_type": "save", "visual_concept": "Generic email with filler highlighted in yellow → rewritten short email; split before/after.", "runtime": 40, "retention": {"hook": "Calls out something people suspect about their own emails, which creates mild discomfort and curiosity.", "relatability": "'I hope this email finds you well' is instantly recognised.", "problem_solution": "Three numbered rules, each shown on screen, then the fixed email.", "payoff": "Before/after: half the length and clearly human.", "save_share": "The prompt in the caption is reusable for every email."}, "script": [{"t": "0-3", "vo": "People can tell your email came from AI.", "ost": "They can tell.", "vis": "Asif reads a long generic email, winces."}, {"t": "3-7.5", "vo": "“I hope this email finds you well.” Nobody talks like that.", "ost": "“I hope this finds you well…”", "vis": "Phrase highlighted in yellow."}, {"t": "7.5-12", "vo": "AI fills empty space with polite, safe, long sentences.", "ost": "polite · safe · long", "vis": "More filler phrases highlight one by one."}, {"t": "12-17", "vo": "Fix it with three rules. One: give it your rough notes, not a topic.", "ost": "1 · Your notes, not a topic", "vis": "Bullet notes typed."}, {"t": "17-21.5", "vo": "Two: paste one real email you wrote, so it copies your voice.", "ost": "2 · One email you wrote", "vis": "Sample email pasted."}, {"t": "21.5-26", "vo": "Three: set limits. Under 100 words. No opening small talk.", "ost": "3 · Under 100 words", "vis": "Limits typed."}, {"t": "26-31.5", "vo": "Before and after. Same message, half the length, and it sounds like a person.", "ost": "Before → After", "vis": "Split screen: long generic email vs short clear one."}, {"t": "31.5-36.5", "vo": "Last step: read it out loud. If you wouldn't say it, delete it.", "ost": "Read it out loud", "vis": "Asif mouthing the email."}, {"t": "36.5-40", "vo": "The prompt is in the caption. Save it.", "ost": "Prompt ↓ Save it", "vis": "End card."}], "caption": "People can tell when an email came from AI. It fills empty space with safe, polite, long sentences.\n\nFix it with 3 rules:\n1. Give it your rough notes, not a topic\n2. Paste one real email you wrote, so it copies your voice\n3. Set limits: under 100 words, no opening small talk\n\nPrompt:\n“Write an email from these notes: [notes]. Match the style of this email I wrote: [paste]. Under 100 words. No ‘I hope this finds you well’. Plain, direct, friendly.”\n\nThen read it out loud. If you wouldn't say it, delete it. The prompt works for every email, so keep it handy.\n", "hashtags": ["emailtips", "AItips", "productivity"], "sources": [], "production_notes": "Use a realistic but fictional email (supplier delay). Generate the 'before' with a bare prompt and the 'after' with the caption prompt, live.", "day": 7, "slot": "R2", "time": "21:00", "slot_no": 4, "date": "2026-10-18", "spec": "Reel 9:16 · 1080×1920 · H.264 MP4 · 30 fps · AAC 48 kHz · safe box x65–1015 / y270–1250 · burned-in captions y1050–1250 · cover title inside centre 1080×1350", "post_no": 28, "caption_full": "People can tell when an email came from AI. It fills empty space with safe, polite, long sentences.\n\nFix it with 3 rules:\n1. Give it your rough notes, not a topic\n2. Paste one real email you wrote, so it copies your voice\n3. Set limits: under 100 words, no opening small talk\n\nPrompt:\n“Write an email from these notes: [notes]. Match the style of this email I wrote: [paste]. Under 100 words. No ‘I hope this finds you well’. Plain, direct, friendly.”\n\nThen read it out loud. If you wouldn't say it, delete it. The prompt works for every email, so keep it handy.\n\n#emailtips #AItips #productivity", "pillar_name": "Practical AI", "src": [], "wps": 2.48}, {"id": "D08-I1", "type": "image", "series": "Before → After", "pillar": "PA", "format": "Before/after table", "topic": "Say this, not that: 4 prompt upgrades", "human_problem": "Getting vague AI answers because the request itself is vague.", "objective": "Saves; show prompting as a concrete skill", "hook": "Say this, not that: 4 prompt upgrades", "main_idea": "Weak prompts lack audience, limits and the user's own material; adding them improves answers a lot.", "takeaway": "Add who it's for, a limit and your own material to any prompt.", "value": "Four side-by-side rewrites for everyday tasks (caption, CV, explanation, weekly plan).", "cta": "Save it.", "cta_type": "save", "visual_concept": "Two-column table: greyed weak prompts left, bold strong prompts right.", "design": {"headline": "Say this, not that: 4 prompt upgrades", "body": ["“Write a caption” → “3 captions for [product], for mothers in Dhaka, under 40 words”", "“Fix my CV” → “Rewrite these 3 bullets with results. Don't invent numbers.”", "“Explain AI agents” → “Explain AI agents to a shop owner in 5 lines”", "“Plan my week” → “Here are my 12 tasks and 3 deadlines. Plan Mon–Fri.”"], "footer": "Better prompts add: audience, limit, your material.", "layout": "Light background. Column headers 'Instead of' (grey) and 'Say' (accent). Four rows, left text grey 40%, right text dark 60%, arrow between. Footer band at bottom."}, "caption": "Same task, better prompt. 4 upgrades:\n\nInstead of “Write a caption” → “Write 3 captions for [product], for mothers in Dhaka, under 40 words.”\nInstead of “Fix my CV” → “Rewrite these 3 bullets to show results. Don't invent numbers.”\nInstead of “Explain AI agents” → “Explain AI agents to a shop owner in 5 lines.”\nInstead of “Plan my week” → “Here are my 12 tasks and 3 deadlines. Plan Monday to Friday.”\n\nWhat changed each time: who it's for, a limit, and your own material. Pick one upgrade and use it on your next prompt.\n", "hashtags": ["AItips", "ChatGPT", "PromptTips"], "sources": [], "production_notes": "Before/after table template. Keep [product] in accent colour as a fill-in.", "day": 8, "slot": "I1", "time": "09:30", "slot_no": 1, "date": "2026-10-19", "spec": "Feed image 4:5 · 1440×1800 PNG (sRGB) · text ≥90 px from edges · headline ≥88 px, body ≥44 px · ≤75 words on image", "post_no": 29, "caption_full": "Same task, better prompt. 4 upgrades:\n\nInstead of “Write a caption” → “Write 3 captions for [product], for mothers in Dhaka, under 40 words.”\nInstead of “Fix my CV” → “Rewrite these 3 bullets to show results. Don't invent numbers.”\nInstead of “Explain AI agents” → “Explain AI agents to a shop owner in 5 lines.”\nInstead of “Plan my week” → “Here are my 12 tasks and 3 deadlines. Plan Monday to Friday.”\n\nWhat changed each time: who it's for, a limit, and your own material. Pick one upgrade and use it on your next prompt.\n\n#AItips #ChatGPT #PromptTips", "pillar_name": "Practical AI", "src": [], "wps": null}, {"id": "D08-R1", "type": "reel", "series": "Explain It Simply", "pillar": "AU", "format": "Diagram explainer + talking head", "topic": "Chatbot vs automation vs AI agent: the actual difference", "human_problem": "Hearing 'chatbot', 'automation' and 'AI agent' used for everything and not knowing which one you actually need.", "objective": "Authority; helps buyers ask for the right thing", "hook": "“Where's my order?” Three systems, three answers.", "open_loop": "Which system answers best, and which one do I need?", "main_idea": "Chatbot talks; automation follows fixed steps; agent chooses its own steps with tools. Use the simplest that works and add human approval for money.", "takeaway": "Use automation for fixed rules, an AI agent for changing questions, and human approval for anything involving money.", "value": "One shared example ('Where's my order?') across all three, plus a decision rule.", "payoff": "25–43 s: use the simplest that works: automation for fixed rules, an agent for changing questions, a human for money.", "cta": "Ask which one viewers thought they needed.", "cta_type": "question", "visual_concept": "Three columns, one per type, each answering the same customer bubble; straight arrow vs branching arrows.", "runtime": 46, "retention": {"hook": "Opens on a question every seller gets daily and promises three different answers, so it's concrete, not jargon.", "curiosity": "Viewers want to know which of the three they actually need.", "visual_progression": "The same question flows through three different diagrams: chat bubble, straight line, branching tree.", "usefulness": "Ends with a 3-line decision rule (fixed rules, changing questions, money).", "payoff": "The 'simplest one that works' rule cuts through the hype."}, "script": [{"t": "0-3", "vo": "“Where's my order?” Three systems, three answers.", "ost": "Same question. 3 answers.", "vis": "A customer bubble 'Where's my order?' drops in; three labelled columns appear beside Asif."}, {"t": "3-7", "vo": "A chatbot, an automation, and an AI agent. Watch the difference.", "ost": "Chatbot · Automation · Agent", "vis": "Messenger bubble drops into each of three columns."}, {"t": "7-13", "vo": "A chatbot just talks. It answers from what it was told, but it can't check anything.", "ost": "Chatbot: talks, can't check", "vis": "Column 1: reply 'Orders usually take 3–5 days.'"}, {"t": "13-18.5", "vo": "An automation follows fixed steps. Status changes, it sends an update. Every time.", "ost": "Automation: fixed path", "vis": "Column 2: straight arrow 'status = shipped' → message."}, {"t": "18.5-22", "vo": "An agent chooses the path. It reads the question,", "ost": "Agent: picks its own steps", "vis": "Column 3: agent icon reads the bubble; branches appear."}, {"t": "22-25", "vo": "checks the order sheet and courier, then replies.", "ost": "sheet → courier → reply", "vis": "Agent icon picks 'Sheet' then 'Courier' tools; reply bubble."}, {"t": "25-29.5", "vo": "So which one do you need? Use the simplest one that works.", "ost": "Use the simplest that works", "vis": "Asif to camera."}, {"t": "29.5-34", "vo": "Fixed rules? Automation. Cheaper and more predictable.", "ost": "Fixed rules → automation", "vis": "Column 2 glows."}, {"t": "34-38.5", "vo": "Questions that change every time? An agent, with limits.", "ost": "Changing questions → agent", "vis": "Column 3 glows with a fence icon."}, {"t": "38.5-43", "vo": "Anything involving money? Add a human approval step.", "ost": "Money → a human approves", "vis": "Approval checkmark node added."}, {"t": "43-46", "vo": "Start with the simple one. Upgrade later.", "ost": "Start simple", "vis": "End card with series tag."}], "caption": "“Where's my order?” A chatbot, an automation and an AI agent answer it very differently.\n\nCustomer asks: “Where's my order?”\n• Chatbot: talks. Answers from what it was told, but can't check anything.\n• Automation: fixed steps. When the order status changes, it sends an update. Same path every time.\n• AI agent: chooses its own steps. Reads the question, checks your order sheet, then the courier, then replies.\n\nWhich do you need? The simplest one that works.\nFixed rules → automation. Changing questions → agent with limits. Money involved → add a human approval.\n\nWhich one did you think you needed before watching?\n", "hashtags": ["AIagents", "automation", "n8n"], "sources": [], "production_notes": "Three-column motion template. Keep each column's icon style identical so the only difference is the path shape.", "day": 8, "slot": "R1", "time": "13:30", "slot_no": 2, "date": "2026-10-19", "spec": "Reel 9:16 · 1080×1920 · H.264 MP4 · 30 fps · AAC 48 kHz · safe box x65–1015 / y270–1250 · burned-in captions y1050–1250 · cover title inside centre 1080×1350", "post_no": 30, "caption_full": "“Where's my order?” A chatbot, an automation and an AI agent answer it very differently.\n\nCustomer asks: “Where's my order?”\n• Chatbot: talks. Answers from what it was told, but can't check anything.\n• Automation: fixed steps. When the order status changes, it sends an update. Same path every time.\n• AI agent: chooses its own steps. Reads the question, checks your order sheet, then the courier, then replies.\n\nWhich do you need? The simplest one that works.\nFixed rules → automation. Changing questions → agent with limits. Money involved → add a human approval.\n\nWhich one did you think you needed before watching?\n\n#AIagents #automation #n8n", "pillar_name": "Automation & n8n", "src": [], "wps": 2.33}, {"id": "D08-I2", "type": "image", "series": "Hidden Button", "pillar": "HF", "format": "Hidden feature card", "topic": "See and delete what ChatGPT remembers about you", "human_problem": "Not knowing what ChatGPT has quietly remembered about you.", "objective": "Saves + privacy trust", "hook": "See what ChatGPT remembers about you", "main_idea": "ChatGPT's memory is visible and editable; most users never check it.", "takeaway": "You can view, delete and switch off what ChatGPT remembers under Settings → Personalization → Memory.", "value": "Where to find memory, how to delete items, how to turn off chat-history reference.", "cta": "Ask whether anything in their memory list surprised them.", "cta_type": "question", "visual_concept": "Drawn settings path (breadcrumb style) + a list with a delete icon.", "design": {"headline": "See what ChatGPT remembers about you", "body": ["Go to Settings → Personalization → Memory.", "Open the saved list. Delete anything wrong or too personal.", "Turn off 'reference chat history' if you don't want past chats used.", "Or say in chat: “Forget that I…”, then check the list."], "footer": "Menu names can change between app versions. Look for Memory under Personalization.", "layout": "Light background. Breadcrumb path drawn as three rounded chips with arrows at the top. Below, a mock list of three memory items with trash icons. Instructions as numbered rows. Footer small."}, "caption": "ChatGPT may remember things about you across chats. You can see exactly what, and delete it.\n\n1. Settings → Personalization → Memory\n2. Open the saved list and delete anything wrong or too personal\n3. Turn off “reference chat history” if you don't want old chats used\n4. Or just say: “Forget that I…”, then check the list to confirm\n\nMenu names change between app versions; look for Memory under Personalization.\n\nCheck your list today. Anything in there you didn't expect?\n", "hashtags": ["ChatGPT", "privacy", "AItips"], "sources": ["openai_memory"], "production_notes": "Verify the current menu path in both the mobile and web app the day before posting; update the breadcrumb if it changed. Draw the UI; don't screenshot it with real memories visible.", "day": 8, "slot": "I2", "time": "18:30", "slot_no": 3, "date": "2026-10-19", "spec": "Feed image 4:5 · 1440×1800 PNG (sRGB) · text ≥90 px from edges · headline ≥88 px, body ≥44 px · ≤75 words on image", "post_no": 31, "caption_full": "ChatGPT may remember things about you across chats. You can see exactly what, and delete it.\n\n1. Settings → Personalization → Memory\n2. Open the saved list and delete anything wrong or too personal\n3. Turn off “reference chat history” if you don't want old chats used\n4. Or just say: “Forget that I…”, then check the list to confirm\n\nMenu names change between app versions; look for Memory under Personalization.\n\nCheck your list today. Anything in there you didn't expect?\n\n#ChatGPT #privacy #AItips", "pillar_name": "Hidden features & tools", "src": [{"t": "Memory in ChatGPT", "u": "https://help.openai.com/en/articles/8590148-memory-in-chatgpt", "p": "OpenAI Help Center", "d": "current", "v": false}], "wps": null}, {"id": "D08-R2", "type": "reel", "series": "Steal This Prompt", "pillar": "WF", "format": "Talking head + screen split", "topic": "Tailor your CV to a job post without lying", "human_problem": "Sending lots of job applications and hearing nothing back.", "objective": "Saves + shares among job seekers", "hook": "Thirty applications. Zero calls. Look at your CV.", "open_loop": "What's wrong with my CV, and how do I fix it without lying?", "main_idea": "Extract the job's requirements, match each to real evidence, rewrite matched bullets in the employer's words, and handle gaps honestly.", "takeaway": "Match your CV to each job's own requirements and words, honestly, instead of sending one CV everywhere.", "value": "A 4-step method + the 'don't invent anything, mark gaps' guardrail.", "payoff": "22–38 s: the match table shows strengths and gaps; matched bullets are rewritten honestly in the employer's words.", "cta": "Send to a friend who's job hunting.", "cta_type": "share", "visual_concept": "Vertical split: Asif on the top half holding a printed CV, the screen on the bottom half: job post → requirement list → match table (green/red rows) → before/after bullet.", "runtime": 46, "retention": {"hook": "'Thirty applications, zero calls' is a painful, specific feeling job seekers recognise instantly.", "problem_solution": "Clear 4-step fix shown on screen, one step every ~6 seconds.", "visual_progression": "The match table fills with green and red rows, a visible map of strengths and gaps.", "usefulness": "Prompts are copy-paste and work in any AI tool; honest guardrail included.", "save_share": "Highly forwardable to friends applying for jobs."}, "script": [{"t": "0-3", "vo": "Thirty applications. Zero calls. Look at your CV.", "ost": "30 applications · 0 calls", "vis": "Asif holding a printed CV; inbox with no replies behind him."}, {"t": "3-6", "vo": "Usually it's one CV sent to every job.", "ost": "Same CV, every job", "vis": "The same CV copied onto a stack of different job posts."}, {"t": "6-11.5", "vo": "Step one: paste the job post. Ask for the top eight requirements.", "ost": "1 · Top 8 requirements", "vis": "Screen half: job post pasted → list of 8."}, {"t": "11.5-17.5", "vo": "Step two: paste your CV. Ask it to match each requirement to proof in your CV.", "ost": "2 · Match each one to proof", "vis": "Table forms: requirement | evidence | gap."}, {"t": "17.5-22", "vo": "And add this line: “Don't invent anything. Mark gaps.”", "ost": "“Don't invent. Mark gaps.”", "vis": "The line highlighted in yellow."}, {"t": "22-27", "vo": "Now you see it clearly. Six matches, two gaps.", "ost": "6 matches · 2 gaps", "vis": "Table: six green rows, two red rows."}, {"t": "27-32.5", "vo": "Step three: rewrite your matched bullets using their keywords, only where it's true.", "ost": "3 · Their words, your truth", "vis": "Before/after of one CV bullet."}, {"t": "32.5-38", "vo": "Step four: the gaps. Learn it, explain it in the cover letter, or apply anyway.", "ost": "4 · Gaps: learn · explain · accept", "vis": "Three option cards."}, {"t": "38-43.5", "vo": "Many employers scan for the job's own words. Now your CV has them, honestly.", "ost": "Their keywords · honestly", "vis": "Matching keywords glow in both documents."}, {"t": "43.5-46", "vo": "Send this to someone job hunting.", "ost": "Send to a job hunter", "vis": "End card."}], "caption": "Thirty applications, zero calls? Often it's one CV sent to every job. Tailor it in 10 minutes, honestly:\n\n1. Paste the job post: “List the top 8 requirements, using the employer's exact words.”\n2. Paste your CV: “Match each requirement to proof in my CV. Don't invent anything. Mark gaps.”\n3. Rewrite only the matched bullets using their keywords, where it's true.\n4. For each gap: learn it, explain it in your cover letter, or apply anyway.\n\nMany employers scan CVs for the job's own words. Now yours has them, without lying.\n\nJob hunting, or know someone who is? Pass this on.\n", "hashtags": ["jobsearch", "CVtips", "AItips"], "sources": [], "production_notes": "Use a fictional CV and a real-looking but invented job post (no real company). Remove personal data. Keep the 'Don't invent anything' line visible for 2+ seconds.", "day": 8, "slot": "R2", "time": "21:00", "slot_no": 4, "date": "2026-10-19", "spec": "Reel 9:16 · 1080×1920 · H.264 MP4 · 30 fps · AAC 48 kHz · safe box x65–1015 / y270–1250 · burned-in captions y1050–1250 · cover title inside centre 1080×1350", "post_no": 32, "caption_full": "Thirty applications, zero calls? Often it's one CV sent to every job. Tailor it in 10 minutes, honestly:\n\n1. Paste the job post: “List the top 8 requirements, using the employer's exact words.”\n2. Paste your CV: “Match each requirement to proof in my CV. Don't invent anything. Mark gaps.”\n3. Rewrite only the matched bullets using their keywords, where it's true.\n4. For each gap: learn it, explain it in your cover letter, or apply anyway.\n\nMany employers scan CVs for the job's own words. Now yours has them, without lying.\n\nJob hunting, or know someone who is? Pass this on.\n\n#jobsearch #CVtips #AItips", "pillar_name": "Workflows & productivity", "src": [], "wps": 2.39}, {"id": "D09-I1", "type": "image", "series": "Automate This", "pillar": "AU", "format": "Cheat sheet", "topic": "7 things that can start an automation (triggers)", "human_problem": "Not knowing where an automation would even start.", "objective": "Saves; teach buyers to spot triggers", "hook": "7 things that can start an automation", "main_idea": "Most automations start from one of seven trigger types; spotting the trigger is half the design.", "takeaway": "Most automations start from one of seven triggers, so finding the trigger is half the design.", "value": "A reference list of common triggers with everyday examples.", "cta": "Ask which trigger starts a task they repeat.", "cta_type": "question", "visual_concept": "Seven icon tiles in a grid, each a trigger type.", "design": {"headline": "7 things that can start an automation", "body": ["A new message: Messenger, WhatsApp, email", "A form is submitted", "A new row in a Google Sheet", "A time: every day at 9 AM", "A file lands in a folder", "A payment or order is created", "A webhook: another app 'rings the bell'"], "footer": "Find the trigger, and half the automation is designed.", "layout": "Dark background. Headline top. 7 tiles in a 2-column grid (last tile centred), each with a lightning icon + label. Footer at bottom."}, "caption": "Every automation starts with a trigger. These 7 cover most real-world workflows:\n\n1. A new message (Messenger, WhatsApp, email)\n2. A form is submitted\n3. A new row appears in a Google Sheet\n4. A time (every day at 9 AM, every Monday)\n5. A file lands in a folder\n6. A payment or order is created\n7. A webhook: another app tells yours that something happened\n\nFind the trigger, and half the automation is designed. Think of one task you repeat: which of these 7 starts it?\n", "hashtags": ["automation", "n8n", "nocode"], "sources": [], "production_notes": "Cheat-sheet grid template. Webhook tile links visually to the doorbell icon used in D04-R1 for series consistency.", "day": 9, "slot": "I1", "time": "09:30", "slot_no": 1, "date": "2026-10-20", "spec": "Feed image 4:5 · 1440×1800 PNG (sRGB) · text ≥90 px from edges · headline ≥88 px, body ≥44 px · ≤75 words on image", "post_no": 33, "caption_full": "Every automation starts with a trigger. These 7 cover most real-world workflows:\n\n1. A new message (Messenger, WhatsApp, email)\n2. A form is submitted\n3. A new row appears in a Google Sheet\n4. A time (every day at 9 AM, every Monday)\n5. A file lands in a folder\n6. A payment or order is created\n7. A webhook: another app tells yours that something happened\n\nFind the trigger, and half the automation is designed. Think of one task you repeat: which of these 7 starts it?\n\n#automation #n8n #nocode", "pillar_name": "Automation & n8n", "src": [], "wps": null}, {"id": "D09-R1", "type": "reel", "series": "Steal This Prompt", "pillar": "PA", "format": "Talking head + screen split", "topic": "Make AI disagree with you", "human_problem": "Making decisions with an AI that tends to agree with whatever you suggest.", "objective": "Saves + comments", "hook": "AI loved my plan. That worried me.", "open_loop": "Why is agreement a problem, and how do you get honest pushback?", "main_idea": "AI tends to agree with the user; asking it to argue against your plan surfaces risks you missed.", "takeaway": "Ask AI for the strongest reasons your plan could fail, then ask what would make it work.", "value": "The 'strongest reasons it could fail' prompt + the follow-up 'what would make it work'.", "payoff": "11–25.5 s: the flipped prompt surfaces risks the creator hadn't considered.", "cta": "Ask what decision viewers would run this on.", "cta_type": "question", "visual_concept": "Chat showing 'Great idea!' → flipped prompt → list of failure reasons with two highlighted.", "runtime": 32, "retention": {"hook": "A personal twist (praise as a warning sign) that viewers don't expect.", "novelty": "Using AI as a critic instead of a cheerleader is new to most viewers.", "relatability": "A price increase decision is something every seller faces.", "payoff": "Two real risks the creator hadn't considered appear on screen.", "usefulness": "Two short prompts that work in any AI tool, useful before any decision."}, "script": [{"t": "0-3", "vo": "AI loved my plan. That worried me.", "ost": "AI loved my plan. Uh-oh.", "vis": "Asif; chat screen with 'Great idea!' response."}, {"t": "3-7.5", "vo": "Ask “Is my plan good?” and it usually says yes.", "ost": "“Great idea!” 🙄", "vis": "Highlight 'Great idea!' in yellow."}, {"t": "7.5-11", "vo": "So flip the question. Make it argue against you.", "ost": "Make it argue", "vis": "Asif flips his hand; whoosh."}, {"t": "11-16", "vo": "“Give me the three strongest reasons this plan could fail.”", "ost": "“3 strongest reasons it fails”", "vis": "Prompt typed in large text."}, {"t": "16-21", "vo": "My plan: raise my price to 1,500 taka. Here's what came back.", "ost": "Plan: Tk 1,200 → 1,500", "vis": "Screen: AI answer appears as a list."}, {"t": "21-25.5", "vo": "Two of these I hadn't thought about. That's the point.", "ost": "Risks I missed", "vis": "Two items highlighted."}, {"t": "25.5-29", "vo": "Then ask: “What would make this plan work?”", "ost": "“What would make it work?”", "vis": "Second prompt typed."}, {"t": "29-32", "vo": "You decide. AI just tests the idea.", "ost": "You decide", "vis": "Asif to camera; end."}], "caption": "AI loved my plan. That worried me. Ask “Is my plan good?” and you'll usually hear yes.\n\nFlip it:\n“Give me the 3 strongest reasons this plan could fail. Be specific to my situation: [details].”\n\nThen:\n“What would make this plan work?”\n\nI tried it on a price increase (Tk 1,200 → 1,500) and got two risks I hadn't considered.\n\nYou still decide. AI just pressure-tests the idea.\n\nWhat decision would you run this on?\n", "hashtags": ["AItips", "decisionmaking", "smallbusiness"], "sources": [], "production_notes": "Run the prompt live on a real or realistic decision. Only say 'two of these I hadn't thought about' if true; otherwise change the line to 'Look at number two' and highlight that one.", "day": 9, "slot": "R1", "time": "13:30", "slot_no": 2, "date": "2026-10-20", "spec": "Reel 9:16 · 1080×1920 · H.264 MP4 · 30 fps · AAC 48 kHz · safe box x65–1015 / y270–1250 · burned-in captions y1050–1250 · cover title inside centre 1080×1350", "post_no": 34, "caption_full": "AI loved my plan. That worried me. Ask “Is my plan good?” and you'll usually hear yes.\n\nFlip it:\n“Give me the 3 strongest reasons this plan could fail. Be specific to my situation: [details].”\n\nThen:\n“What would make this plan work?”\n\nI tried it on a price increase (Tk 1,200 → 1,500) and got two risks I hadn't considered.\n\nYou still decide. AI just pressure-tests the idea.\n\nWhat decision would you run this on?\n\n#AItips #decisionmaking #smallbusiness", "pillar_name": "Practical AI", "src": [], "wps": 2.31}, {"id": "D09-I2", "type": "image", "series": "AI Myth Check", "pillar": "LIT", "format": "Quadrant card", "topic": "Use AI to prepare, not to decide: 4 areas", "human_problem": "Using AI for serious decisions about health, money, contracts or people.", "objective": "Trust + shares", "hook": "Use AI to prepare, not to decide, these 4", "main_idea": "In health, money transfers, legal papers and people decisions, AI should prepare you, not decide for you.", "takeaway": "In high-stakes areas, use AI to prepare your questions and understanding, not to make the decision.", "value": "A clear boundary for high-stakes AI use, with what AI is still good for in each.", "cta": "Send it to someone who asks AI about everything.", "cta_type": "share", "visual_concept": "Four quadrants with icons (heart, money, document, people) and a 'prepare ✓ decide ✗' tag.", "design": {"headline": "Use AI to prepare, not to decide, these 4", "body": ["Health: use it to prepare questions for your doctor.", "Money transfers: never act on an AI or a voice you can't verify.", "Legal papers: use it to understand terms, then ask a lawyer.", "Hiring and firing: it can sort information, not judge people."], "footer": "AI is great at drafts and questions. You own the decision.", "layout": "2×2 grid of quadrants, each with an icon, label and one line. A small tag 'Prepare ✓ / Decide ✗' in each corner. Footer band at bottom."}, "caption": "AI is useful in serious areas, as long as you use it to prepare, not to decide.\n\nHealth: prepare questions for your doctor. Don't replace the doctor.\nMoney transfers: never act on an AI instruction or a voice you can't verify.\nLegal papers: understand the terms, then ask a lawyer before signing.\nHiring and firing: let it organise information. People should judge people.\n\nAI is great at drafts and questions. You own the decision.\n\nSend this to someone who asks AI about everything.\n", "hashtags": ["AIliteracy", "AIsafety", "AItips"], "sources": [], "production_notes": "Quadrant template. Calm colours. This is a trust post, not a scare post.", "day": 9, "slot": "I2", "time": "18:30", "slot_no": 3, "date": "2026-10-20", "spec": "Feed image 4:5 · 1440×1800 PNG (sRGB) · text ≥90 px from edges · headline ≥88 px, body ≥44 px · ≤75 words on image", "post_no": 35, "caption_full": "AI is useful in serious areas, as long as you use it to prepare, not to decide.\n\nHealth: prepare questions for your doctor. Don't replace the doctor.\nMoney transfers: never act on an AI instruction or a voice you can't verify.\nLegal papers: understand the terms, then ask a lawyer before signing.\nHiring and firing: let it organise information. People should judge people.\n\nAI is great at drafts and questions. You own the decision.\n\nSend this to someone who asks AI about everything.\n\n#AIliteracy #AIsafety #AItips", "pillar_name": "AI literacy & safety", "src": [], "wps": null}, {"id": "D09-R2", "type": "reel", "series": "Automate This", "pillar": "AU", "format": "Screen demo + face cam", "topic": "Build: new lead → Google Sheet → phone alert in n8n", "human_problem": "Leads arrive at night or while you're busy, and you see them too late.", "objective": "Proof of skill; Messenger leads from small businesses", "hook": "11 PM lead. Seen two days later.", "open_loop": "How does an 11 PM lead reach me at 11 PM?", "main_idea": "A 5-node n8n workflow captures form leads, cleans them, blocks duplicates, logs them to Sheets and alerts the owner on Telegram.", "takeaway": "A five-node n8n workflow can log every form lead to a sheet and alert your phone within seconds.", "value": "Shows a complete, practical build and the reasoning behind each node (cleaning, duplicate check).", "payoff": "7–38 s: five nodes clean, de-duplicate, log and alert; the stopwatch shows seconds.", "cta": "Soft service line in the caption only.", "cta_type": "soft", "visual_concept": "Phone buzz with a lead alert → full canvas → node-by-node zoom with before/after data → stopwatch.", "runtime": 51, "retention": {"hook": "Opens on a missed lead, a loss every small business has felt, before showing any technology.", "visual_progression": "Five nodes light up one after another, each with visible data changes.", "usefulness": "Explains the cleaning and duplicate check most DIY builds miss.", "relatability": "Missed and slow-to-answer leads are a common small-business pain.", "payoff": "The ending answers the opening: the 11 PM lead is on your phone at 11 PM.", "novelty": "Seeing a real n8n canvas explained in plain words is rare in this audience's feed."}, "script": [{"t": "0-3", "vo": "11 PM lead. Seen two days later.", "ost": "11 PM lead · seen 2 days later", "vis": "Phone: form notification email at 23:04, opened two days later (dramatized)."}, {"t": "3-7", "vo": "Here's the five-box fix I built in n8n.", "ost": "The fix: 5 nodes", "vis": "Full demo canvas, slow zoom out."}, {"t": "7-12", "vo": "One: the form sends the lead here the moment someone submits it.", "ost": "1 · Form → webhook", "vis": "Form submit on the left; Webhook node lights."}, {"t": "12-17.5", "vo": "Two: clean it up. Trim spaces, fix the phone format, add the date.", "ost": "2 · Clean the data", "vis": "Edit Fields node: before/after values side by side."}, {"t": "17.5-23", "vo": "Three: check the sheet. Same phone number already there? Don't add it twice.", "ost": "3 · Already in the sheet?", "vis": "Lookup node; duplicate branch highlighted."}, {"t": "23-27.5", "vo": "Four: add a new row to Google Sheets.", "ost": "4 · Add to Google Sheets", "vis": "Sheet: new row slides in."}, {"t": "27.5-32.5", "vo": "Five: send me a Telegram message with name, phone and what they want.", "ost": "5 · Alert on my phone", "vis": "Telegram node → phone notification."}, {"t": "32.5-38", "vo": "Form to phone in a few seconds. Nobody copy-pastes anything.", "ost": "Seconds · zero copy-paste", "vis": "Stopwatch overlay on a real run."}, {"t": "38-43", "vo": "Why it matters: the first business to reply often gets the customer.", "ost": "Reply first", "vis": "Asif to camera."}, {"t": "43-48", "vo": "Next time, that 11 PM lead is on your phone at 11 PM.", "ost": "11 PM lead → your phone, 11 PM", "vis": "Phone buzzes with the Telegram alert at 23:04."}, {"t": "48-51", "vo": "And you reply first.", "ost": "Reply first", "vis": "End card."}], "caption": "A lead fills your form at 11 PM. You see it two days later. The fix took 5 n8n nodes:\n\n1. Webhook: the form sends the lead the moment it's submitted\n2. Clean: trim spaces, fix the phone format, add the date\n3. Check: is this phone number already in the sheet? Then don't add it twice\n4. Add a new row to Google Sheets\n5. Send a Telegram alert with name, phone and request\n\nNobody copy-pastes anything, and you can reply first. The first reply often wins the customer.\n\nNeed something like this for your business? I build custom n8n automations.\n", "hashtags": ["n8n", "automation", "leadgeneration"], "sources": [], "production_notes": "Build a clean demo workflow (Webhook → Edit Fields → Google Sheets lookup → IF → Google Sheets append → Telegram). Use fake lead data and a masked phone number. Run it live for the stopwatch shot. Hide credentials and webhook URL.", "day": 9, "slot": "R2", "time": "21:00", "slot_no": 4, "date": "2026-10-20", "spec": "Reel 9:16 · 1080×1920 · H.264 MP4 · 30 fps · AAC 48 kHz · safe box x65–1015 / y270–1250 · burned-in captions y1050–1250 · cover title inside centre 1080×1350", "post_no": 36, "caption_full": "A lead fills your form at 11 PM. You see it two days later. The fix took 5 n8n nodes:\n\n1. Webhook: the form sends the lead the moment it's submitted\n2. Clean: trim spaces, fix the phone format, add the date\n3. Check: is this phone number already in the sheet? Then don't add it twice\n4. Add a new row to Google Sheets\n5. Send a Telegram alert with name, phone and request\n\nNobody copy-pastes anything, and you can reply first. The first reply often wins the customer.\n\nNeed something like this for your business? I build custom n8n automations.\n\n#n8n #automation #leadgeneration", "pillar_name": "Automation & n8n", "src": [], "wps": 2.22}, {"id": "D10-I1", "type": "image", "series": "Steal This Prompt", "pillar": "PA", "format": "Staircase card", "topic": "Learn anything faster: ask for 3 levels of explanation", "human_problem": "Reading explanations that are either far too simple or far too advanced.", "objective": "Saves among students and self-learners", "hook": "Confused by a topic? Ask AI for 3 levels", "main_idea": "Asking for child, student and expert levels shows exactly where your understanding stops.", "takeaway": "Ask for three levels of explanation and study the point where it starts to feel hard.", "value": "A copy-paste learning prompt + how to use the result.", "cta": "Save it.", "cta_type": "save", "visual_concept": "Three-step staircase: each step is one explanation level, with a flag where it gets hard.", "design": {"headline": "Confused by a topic? Ask AI for 3 levels", "body": ["“Explain [topic] at 3 levels:", "1. To a 10-year-old, in 3 sentences", "2. To a university student, with one example", "3. To an expert: what do beginners get wrong?”", "Read level 1 first. Stop where it gets hard. That's your study point."], "footer": "Works for taxes, physics, marketing or n8n.", "layout": "Light background. Prompt block in the top half. Below, a three-step staircase (small → medium → tall), each step labelled with its level; a small flag on the step marked 'stop here = study here'. Footer bottom."}, "caption": "Confused by a topic? The fastest way I know to learn it with AI:\n\n“Explain [topic] at 3 levels:\n1. To a 10-year-old, in 3 sentences\n2. To a university student, with one example\n3. To an expert: what do beginners usually get wrong?”\n\nRead level 1. Then level 2. The moment it gets hard is exactly where you should study.\n\nLevel 3 is the bonus: it shows the mistakes before you make them. Try it on the topic you've been avoiding.\n", "hashtags": ["studytips", "AItips", "learning"], "sources": [], "production_notes": "Prompt-card template with step graphic. [topic] in accent colour.", "day": 10, "slot": "I1", "time": "09:30", "slot_no": 1, "date": "2026-10-21", "spec": "Feed image 4:5 · 1440×1800 PNG (sRGB) · text ≥90 px from edges · headline ≥88 px, body ≥44 px · ≤75 words on image", "post_no": 37, "caption_full": "Confused by a topic? The fastest way I know to learn it with AI:\n\n“Explain [topic] at 3 levels:\n1. To a 10-year-old, in 3 sentences\n2. To a university student, with one example\n3. To an expert: what do beginners usually get wrong?”\n\nRead level 1. Then level 2. The moment it gets hard is exactly where you should study.\n\nLevel 3 is the bonus: it shows the mistakes before you make them. Try it on the topic you've been avoiding.\n\n#studytips #AItips #learning", "pillar_name": "Practical AI", "src": [], "wps": null}, {"id": "D10-R1", "type": "reel", "series": "AI Myth Check", "pillar": "LIT", "format": "POV skit + talking head", "topic": "Voice-clone scam calls: the family code word", "human_problem": "A panicked call from a 'family member' asking for money, in a voice that sounds real.", "objective": "Shares to family groups; trust", "hook": "Your brother calls. It's not your brother.", "open_loop": "How can it not be him?", "main_idea": "AI can clone voices from short clips; a family code word, calling back on a saved number, and treating urgency as a red flag stop the scam.", "takeaway": "Agree on a family code word and always call back on a saved number before sending money.", "value": "Three concrete steps backed by an FBI public warning.", "payoff": "8–31 s: voice cloning explained, then three steps that stop the scam.", "cta": "Send to your family group.", "cta_type": "share", "visual_concept": "Short dramatized call (unknown number, panicked voice), then Asif breaks the fourth wall with three steps; ends on the phone ringing again.", "loop": "Ends 'Because next time, it might not be him' over a ringing phone, which flows into the opening 'Your brother calls…'", "runtime": 39, "retention": {"hook": "A personal, slightly scary twist in five words; viewers instantly imagine their own sibling.", "relatability": "Emergency money requests from family over the phone are common across Bangladesh.", "curiosity": "How could it not be him? The answer (voice cloning) comes at second 8.", "usefulness": "Three steps anyone can do tonight, no tech needed.", "save_share": "Designed to be forwarded to family WhatsApp/Messenger groups.", "rewatch": "The ringing phone at the end loops into the opening scene."}, "script": [{"t": "0-3", "vo": "Your brother calls. It's not your brother.", "ost": "It's not your brother.", "vis": "Phone ringing on a table: 'Unknown number'. Asif picks up."}, {"t": "3-8", "vo": "“It's me. I had an accident. Send money to this number, now.”", "ost": "“Send money. Now.”", "vis": "Dramatized: muffled, panicked voice (actor or Asif's own voice processed). Asif looks worried."}, {"t": "8-12.5", "vo": "Scammers can now copy a voice using short clips from your videos.", "ost": "AI copies voices from short clips", "vis": "Asif turns to camera; waveform 'clone' animation."}, {"t": "12.5-16.5", "vo": "The FBI warned about exactly this. Its advice is simple.", "ost": "FBI warning · Dec 2024", "vis": "Text card citing the PSA (no logo)."}, {"t": "16.5-21.5", "vo": "One: agree on a secret family word. Today. Not during the emergency.", "ost": "1 · A secret family word", "vis": "Family chat mock: 'Our code word is…' (word blurred)."}, {"t": "21.5-26", "vo": "Two: hang up and call back on the number you saved.", "ost": "2 · Hang up. Call back.", "vis": "Phone contacts → saved number."}, {"t": "26-31", "vo": "Three: urgency is the trick. Real family can wait two minutes.", "ost": "3 · Urgency = red flag", "vis": "Red flag icon."}, {"t": "31-36", "vo": "Set your word tonight. Send this to your family group.", "ost": "Send to your family group", "vis": "Asif to camera."}, {"t": "36-39", "vo": "Because next time, it might not be him.", "ost": "", "vis": "Phone rings again on the table, same shot as frame 1 (loop)."}], "caption": "Your brother calls asking for money. It might not be him.\n\nScammers can now copy a voice from short clips posted online. The FBI warned about this and recommends a simple defence:\n\n1. Agree on a secret family word or phrase, today, not during an emergency\n2. Hang up and call back on the number you have saved\n3. Treat urgency as a red flag. Real family can wait 2 minutes while you check.\n\nNever send money based on a voice alone.\n\nSend this to your family group tonight.\n", "hashtags": ["scamalert", "AIsafety", "voicecloning"], "sources": ["fbi_genai_fraud"], "production_notes": "Do NOT clone anyone's real voice for the skit. Use an actor or Asif's own voice with a phone filter. Mark the skit visually as a dramatization (small 'reenactment' label).", "day": 10, "slot": "R1", "time": "13:30", "slot_no": 2, "date": "2026-10-21", "spec": "Reel 9:16 · 1080×1920 · H.264 MP4 · 30 fps · AAC 48 kHz · safe box x65–1015 / y270–1250 · burned-in captions y1050–1250 · cover title inside centre 1080×1350", "post_no": 38, "caption_full": "Your brother calls asking for money. It might not be him.\n\nScammers can now copy a voice from short clips posted online. The FBI warned about this and recommends a simple defence:\n\n1. Agree on a secret family word or phrase, today, not during an emergency\n2. Hang up and call back on the number you have saved\n3. Treat urgency as a red flag. Real family can wait 2 minutes while you check.\n\nNever send money based on a voice alone.\n\nSend this to your family group tonight.\n\n#scamalert #AIsafety #voicecloning", "pillar_name": "AI literacy & safety", "src": [{"t": "Criminals Use Generative Artificial Intelligence to Facilitate Financial Fraud (PSA I-120324-PSA)", "u": "https://www.ic3.gov/PSA/2024/PSA241203", "p": "FBI / IC3", "d": "2024-12-03", "v": false}], "wps": 2.38}, {"id": "D10-I2", "type": "image", "series": "Work With Me", "pillar": "SVC", "format": "Process steps", "topic": "How I build your automation in 5 steps", "human_problem": "Owners worry that hiring someone to automate will be confusing, risky or full of jargon.", "objective": "Reduce buyer uncertainty; Messenger leads", "hook": "How I build your automation in 5 steps", "main_idea": "A clear, low-risk process: call → map → build with fake data → go live with alerts → handover.", "takeaway": "A clear automation project maps first, tests with fake data, alerts on failure and leaves accounts in your name.", "value": "Shows buyers what happens after they message, and that their logins stay theirs.", "cta": "Message 'AUTOMATE' to start step 1.", "cta_type": "message", "visual_concept": "Horizontal 5-step timeline with icons; step 2 'you approve' highlighted.", "design": {"headline": "How I build your automation in 5 steps", "body": ["1. A 20-minute call: what you repeat, which apps, what goes wrong.", "2. Map: I draw trigger → steps → result. You approve it.", "3. Build and test with fake data first.", "4. Go live, with alerts if anything fails.", "5. Handover: a short guide + video. Logins stay in your name."], "footer": "Message “AUTOMATE” to start with step 1.", "layout": "Dark background. Vertical timeline with 5 numbered circles connected by a line; step 2 and 5 have small accent badges ('you approve', 'yours'). Footer as CTA bar."}, "caption": "What happens after you message me “AUTOMATE”:\n\n1. A 20-minute call: what you repeat, which apps you use, what goes wrong today\n2. I map it on one page: trigger → steps → result. You approve before I build anything.\n3. I build and test it with fake data, never on real customers first\n4. It goes live with error alerts, so problems don't hide\n5. Handover: a short written guide + a screen video. Logins and accounts stay in your name.\n\nIf that's the kind of process you want, send me a message and we'll start with step 1.\n", "hashtags": ["n8n", "automation", "smallbusiness"], "sources": [], "production_notes": "Confirm this matches your real process before posting (call length, handover format). If you deliver through RAM Studio, you may add its verified inclusions (e.g. 30 days technical support), but only those listed in the RAM Studio fact base.", "day": 10, "slot": "I2", "time": "18:30", "slot_no": 3, "date": "2026-10-21", "spec": "Feed image 4:5 · 1440×1800 PNG (sRGB) · text ≥90 px from edges · headline ≥88 px, body ≥44 px · ≤75 words on image", "post_no": 39, "caption_full": "What happens after you message me “AUTOMATE”:\n\n1. A 20-minute call: what you repeat, which apps you use, what goes wrong today\n2. I map it on one page: trigger → steps → result. You approve before I build anything.\n3. I build and test it with fake data, never on real customers first\n4. It goes live with error alerts, so problems don't hide\n5. Handover: a short written guide + a screen video. Logins and accounts stay in your name.\n\nIf that's the kind of process you want, send me a message and we'll start with step 1.\n\n#n8n #automation #smallbusiness", "pillar_name": "Work with me (n8n services)", "src": [], "wps": null}, {"id": "D10-R2", "type": "reel", "series": "Steal This Prompt", "pillar": "WF", "format": "Before/after split screen", "topic": "Meeting notes → action table (owner, deadline, MISSING)", "human_problem": "Leaving meetings unsure who is doing what, then arguing about it later.", "objective": "Saves among professionals", "hook": "Meetings end. Nobody knows who does what.", "open_loop": "What's the one line that stops AI guessing?", "main_idea": "Paste a transcript or notes; ask for action/owner/deadline + open questions; force 'MISSING' instead of guesses.", "takeaway": "Ask AI to write MISSING instead of guessing owners or dates when it turns notes into tasks.", "value": "A prompt that turns notes into accountable actions and an automatic follow-up list.", "payoff": "13–28 s: 'write MISSING' turns gaps into a ready follow-up list.", "cta": "Save it for your next meeting.", "cta_type": "save", "visual_concept": "Closing laptop → split screen: left 'before' table with a guessed owner, right 'after' table with red MISSING cells → follow-up message.", "runtime": 38, "retention": {"hook": "A universal workplace frustration stated in seven words.", "relatability": "Everyone has left a meeting unsure who owns what.", "novelty": "The 'write MISSING' rule is an unusual, specific trick most people haven't seen.", "payoff": "MISSING cells become a ready-made follow-up message.", "save_share": "Prompt in the caption; teams share it internally."}, "script": [{"t": "0-3", "vo": "Meetings end. Nobody knows who does what.", "ost": "Who does what?", "vis": "Asif closes a laptop after a call; confused look."}, {"t": "3-7.5", "vo": "Fix: paste the transcript or your rough notes into AI.", "ost": "Paste transcript or notes", "vis": "Screen: notes pasted."}, {"t": "7.5-13", "vo": "Ask for a table: action, owner, deadline. Plus a list of open questions.", "ost": "action · owner · deadline", "vis": "Table appears."}, {"t": "13-18", "vo": "Add this line, the most important one: “If it's missing, write MISSING.”", "ost": "“Missing? Write MISSING.”", "vis": "Line typed and highlighted."}, {"t": "18-23", "vo": "Without it, AI guesses an owner or invents a date. That causes fights.", "ost": "No guessed owners", "vis": "Red highlight on a guessed name in a 'before' table."}, {"t": "23-28", "vo": "Now three tasks say MISSING. That's your follow-up message, done.", "ost": "3 × MISSING = follow-up", "vis": "MISSING cells pulse red; follow-up message drafted."}, {"t": "28-33.5", "vo": "Recording a call? Ask everyone first. It's polite, and in many places, the law.", "ost": "Ask before recording", "vis": "Asif to camera."}, {"t": "33.5-38", "vo": "Next meeting, try it. Count the MISSING cells.", "ost": "Count the MISSING cells", "vis": "End card."}], "caption": "Meetings end and nobody knows who does what. Fix it in one prompt:\n\n“From these notes, make a table: Action | Owner | Deadline. Then list open questions. Use only what's in the notes. If an owner or deadline is missing, write MISSING. Don't guess.”\n\nThe MISSING cells are your follow-up message, already written.\n\nIf you record calls, ask everyone first. It's polite, and in many places it's the law.\n\nTry it after your next meeting and count the MISSING cells.\n", "hashtags": ["productivity", "meetings", "AItips"], "sources": [], "production_notes": "Use invented meeting notes. Show the 'before' table (with a guessed owner) generated without the MISSING line, then the corrected version.", "day": 10, "slot": "R2", "time": "21:00", "slot_no": 4, "date": "2026-10-21", "spec": "Reel 9:16 · 1080×1920 · H.264 MP4 · 30 fps · AAC 48 kHz · safe box x65–1015 / y270–1250 · burned-in captions y1050–1250 · cover title inside centre 1080×1350", "post_no": 40, "caption_full": "Meetings end and nobody knows who does what. Fix it in one prompt:\n\n“From these notes, make a table: Action | Owner | Deadline. Then list open questions. Use only what's in the notes. If an owner or deadline is missing, write MISSING. Don't guess.”\n\nThe MISSING cells are your follow-up message, already written.\n\nIf you record calls, ask everyone first. It's polite, and in many places it's the law.\n\nTry it after your next meeting and count the MISSING cells.\n\n#productivity #meetings #AItips", "pillar_name": "Workflows & productivity", "src": [], "wps": 2.29}, {"id": "D11-I1", "type": "image", "series": "Automate This", "pillar": "AU", "format": "Flow diagram", "topic": "Simple automation: Google Form → Sheet → personal confirmation email", "human_problem": "People fill your form and wait days for a reply, or never hear back.", "objective": "Saves; first buildable workflow for beginners", "hook": "A simple automation you can build this weekend", "main_idea": "Form submissions can trigger a personal confirmation email automatically via Sheets + n8n.", "takeaway": "Google Forms, Sheets and n8n can send every person a personal confirmation within minutes.", "value": "A beginner-friendly flow with real use cases (registrations, orders, admissions, applications).", "cta": "Save it for the weekend.", "cta_type": "save", "visual_concept": "Left-to-right flow: Form → Sheet → n8n → Email → happy applicant.", "design": {"headline": "A simple automation you can build this weekend", "subhead": "Google Form → Sheet → personal confirmation email", "body": ["Trigger: someone submits your Google Form", "Step 1: the answer lands in Google Sheets (built in)", "Step 2: n8n notices the new row", "Step 3: it emails them: their name, their choice, next steps", "Result: every person gets a reply in minutes, not days"], "footer": "Use it for registrations, orders, admissions or job applications.", "layout": "Light background. Headline + subhead. A horizontal 4-node flow at mid-height (Form, Sheet, n8n, Email icons) with numbered labels underneath. Footer bottom."}, "caption": "A simple automation you can build this weekend:\n\nGoogle Form → Google Sheet → personal confirmation email\n\n1. Someone submits your form\n2. Google saves the answer in a Sheet (this part is built in)\n3. n8n notices the new row\n4. It sends a personal email: their name, what they chose, what happens next\n\nEvery person gets a reply within minutes. Use it for registrations, orders, admissions or job applications.\n\nWeekend project: pick one form you already use and try it.\n", "hashtags": ["n8n", "GoogleSheets", "automation"], "sources": [], "production_notes": "Flow-diagram template. Use generic icons for Form/Sheet/Email (no Google logos).", "day": 11, "slot": "I1", "time": "09:30", "slot_no": 1, "date": "2026-10-22", "spec": "Feed image 4:5 · 1440×1800 PNG (sRGB) · text ≥90 px from edges · headline ≥88 px, body ≥44 px · ≤75 words on image", "post_no": 41, "caption_full": "A simple automation you can build this weekend:\n\nGoogle Form → Google Sheet → personal confirmation email\n\n1. Someone submits your form\n2. Google saves the answer in a Sheet (this part is built in)\n3. n8n notices the new row\n4. It sends a personal email: their name, what they chose, what happens next\n\nEvery person gets a reply within minutes. Use it for registrations, orders, admissions or job applications.\n\nWeekend project: pick one form you already use and try it.\n\n#n8n #GoogleSheets #automation", "pillar_name": "Automation & n8n", "src": [], "wps": null}, {"id": "D11-R1", "type": "reel", "series": "Hidden Button", "pillar": "HF", "format": "Phone-in-hand demo", "topic": "Stop retyping instructions: Gemini skills (and Gems switch on 17 November)", "human_problem": "Re-typing the same long instructions into AI for every similar task.", "objective": "Timeliness; saves among Gemini users", "hook": "Typing the same instructions into AI every time?", "open_loop": "How do I save instructions once, and what happens to my Gems?", "main_idea": "Skills (launched 30 Sep 2026) replace Gems for personal accounts from November; migration is automatic, and skills add slash access, files and stacking.", "takeaway": "Save repeated instructions as Gemini skills and call them with a slash; Gems move to skills from 17 November.", "value": "What changes, what happens to your Gems, and how to make your first skill in one sentence.", "payoff": "12–38 s: type a slash to use one, ask Gemini to create one, attach files, stack two.", "cta": "Comment the skill you'd build first.", "cta_type": "question", "visual_concept": "Over-the-shoulder phone shots in the Gemini app: '/' menu, 'create a skill' request, file attach, two skills stacked; Asif to camera between steps.", "runtime": 47, "retention": {"hook": "Starts from a daily annoyance (retyping instructions) rather than a product announcement.", "usefulness": "Shows exactly how to create, use and stack a skill.", "novelty": "Skills launched on 30 Sep 2026 and Gems switch on 17 Nov; few creators have explained them simply.", "payoff": "Reassurance (auto-migration) plus a concrete next step.", "visual_progression": "Moves through five app screens: help page, slash menu, creation, file attach, stacked skills."}, "script": [{"t": "0-3", "vo": "Typing the same instructions into AI every time?", "ost": "Same instructions, every time?", "vis": "Asif retyping a long instruction on his phone, sighing."}, {"t": "3-7.5", "vo": "Gemini skills save them once. And Gems become skills on November 17.", "ost": "Skills · Gems switch 17 Nov", "vis": "Own screen capture of the Gemini help page (date highlighted)."}, {"t": "7.5-12", "vo": "Good news: they move automatically. You don't lose anything.", "ost": "Moved automatically", "vis": "Check mark animation."}, {"t": "12-17", "vo": "A skill is a saved instruction. Type slash, pick it, done.", "ost": "Type / → pick a skill", "vis": "Screen: typing '/' shows a skills list."}, {"t": "17-22.5", "vo": "Easiest way: just ask. “Create a skill that writes replies in my style.”", "ost": "Just ask Gemini to make it", "vis": "Request typed; skill appears."}, {"t": "22.5-28", "vo": "You can attach files to a skill. Your price list, your brand guide, a PDF.", "ost": "Attach: price list · PDF", "vis": "File attach screen."}, {"t": "28-33", "vo": "And you can stack two skills. My writing style, plus my brand rules.", "ost": "Stack skills", "vis": "Two skill chips in one prompt."}, {"t": "33-38", "vo": "Gemini can also use a skill by itself when your request matches it.", "ost": "Used automatically when relevant", "vis": "Example prompt triggers a skill badge."}, {"t": "38-43", "vo": "Make your first one this week, before the switch.", "ost": "Make one this week", "vis": "Asif to camera."}, {"t": "43-47", "vo": "Comment the skill you'd build first.", "ost": "Your first skill? ↓", "vis": "End card."}], "caption": "Typing the same instructions into Gemini every time? Save them once as a skill.\n\n• A skill = a saved instruction. Type / and pick it.\n• Easiest way to make one: ask Gemini, “Create a skill that writes replies in my style.”\n• Skills can include files (price list, PDF, images), and you can stack two in one chat\n• Gemini can use a skill on its own when your request matches\n\nIf you use Gems: from 17 November 2026, Gems on personal Google accounts start turning into skills automatically (work and school accounts later).\nNote: skills need an 18+ account with Gemini's activity setting turned on.\n\nWhich skill would you build first?\n", "hashtags": ["GeminiAI", "AItips", "productivity"], "sources": ["google_gemini_skills", "google_gems_transition", "gems_nov17"], "production_notes": "Re-check the Gems transition date on the help page the day before posting. Record on a personal Google account. Don't show personal chats.", "day": 11, "slot": "R1", "time": "13:30", "slot_no": 2, "date": "2026-10-22", "spec": "Reel 9:16 · 1080×1920 · H.264 MP4 · 30 fps · AAC 48 kHz · safe box x65–1015 / y270–1250 · burned-in captions y1050–1250 · cover title inside centre 1080×1350", "post_no": 42, "caption_full": "Typing the same instructions into Gemini every time? Save them once as a skill.\n\n• A skill = a saved instruction. Type / and pick it.\n• Easiest way to make one: ask Gemini, “Create a skill that writes replies in my style.”\n• Skills can include files (price list, PDF, images), and you can stack two in one chat\n• Gemini can use a skill on its own when your request matches\n\nIf you use Gems: from 17 November 2026, Gems on personal Google accounts start turning into skills automatically (work and school accounts later).\nNote: skills need an 18+ account with Gemini's activity setting turned on.\n\nWhich skill would you build first?\n\n#GeminiAI #AItips #productivity", "pillar_name": "Hidden features & tools", "src": [{"t": "Let skills in Gemini tackle your most repetitive tasks", "u": "https://blog.google/products-and-platforms/products/gemini/automate-tasks-with-skills/", "p": "Google Blog (+ Gemini Apps Help 'About the transition from Gems to skills')", "d": "2026-09-30", "v": true}, {"t": "About the transition from Gems to skills", "u": "https://support.google.com/gemini/answer/18560919?hl=en", "p": "Gemini Apps Help", "d": "2026", "v": true}, {"t": "Google Is Replacing Gemini Gems With Skills Nov 17", "u": "https://www.techrepublic.com/article/news-gemini-gems-skills-migration/", "p": "TechRepublic (also 9to5Google, 2026-09-27 and 2026-09-30)", "d": "2026-09-30", "v": true}], "wps": 2.32}, {"id": "D11-I2", "type": "image", "series": "Steal This Prompt", "pillar": "WF", "format": "Framework card", "topic": "Learn any skill with AI: the weekly loop", "human_problem": "Starting to learn a new skill with energy and quitting after a week.", "objective": "Saves; habit content", "hook": "Learn any skill with AI: the weekly loop", "main_idea": "A weekly plan → learn → quiz → practise → review → repeat loop, run with simple prompts.", "takeaway": "Run your learning in a weekly loop where AI plans, quizzes, sets practice tasks and reviews your work.", "value": "Seven-day structure with the exact prompt for each stage.", "cta": "Ask which skill they'd run through the loop.", "cta_type": "question", "visual_concept": "Circular loop diagram with day labels around it.", "design": {"headline": "Learn any skill with AI: the weekly loop", "body": ["MON: “Make a 4-week plan to learn [skill]. 30 minutes a day.”", "TUE–THU: learn, then “Quiz me on today's topic. 5 questions.”", "FRI: “Give me a small real task to practise.”", "SAT: share your result: “Review it like a strict teacher.”", "SUN: “What should I repeat next week?”"], "footer": "AI plans and checks. The practice is still yours.", "layout": "Light background. Circular loop arrow with five day-segments around it; each segment holds its prompt line. Headline above, footer below."}, "caption": "A simple weekly loop to learn any skill with AI (design, Excel, English, n8n):\n\nMonday: “Make a 4-week plan to learn [skill], 30 minutes a day.”\nTue–Thu: learn, then “Quiz me on today's topic. 5 questions.”\nFriday: “Give me a small real task to practise.”\nSaturday: paste your result: “Review it like a strict teacher.”\nSunday: “What should I repeat next week?”\n\nAI plans and checks. The practice is still yours.\n\nWhich skill would you run through this loop first?\n", "hashtags": ["learning", "AItips", "selfimprovement"], "sources": [], "production_notes": "Loop-diagram template. Make sure prompts are ≥44 px; if crowded, shorten day labels to MON/TUE–THU etc.", "day": 11, "slot": "I2", "time": "18:30", "slot_no": 3, "date": "2026-10-22", "spec": "Feed image 4:5 · 1440×1800 PNG (sRGB) · text ≥90 px from edges · headline ≥88 px, body ≥44 px · ≤75 words on image", "post_no": 43, "caption_full": "A simple weekly loop to learn any skill with AI (design, Excel, English, n8n):\n\nMonday: “Make a 4-week plan to learn [skill], 30 minutes a day.”\nTue–Thu: learn, then “Quiz me on today's topic. 5 questions.”\nFriday: “Give me a small real task to practise.”\nSaturday: paste your result: “Review it like a strict teacher.”\nSunday: “What should I repeat next week?”\n\nAI plans and checks. The practice is still yours.\n\nWhich skill would you run through this loop first?\n\n#learning #AItips #selfimprovement", "pillar_name": "Workflows & productivity", "src": [], "wps": null}, {"id": "D11-R2", "type": "reel", "series": "Automate This", "pillar": "AU", "format": "Talking head + screen split", "topic": "Why automations break, and the alert that saves you", "human_problem": "An automation silently stops working and you find out from an unhappy customer.", "objective": "Authority; differentiates Asif from 'quick bot' sellers", "hook": "I build automations. Every one will break.", "open_loop": "When does it break, and how do I find out first?", "main_idea": "Expired logins, changed data and silent failures break automations; an n8n error workflow alerts you immediately.", "takeaway": "Set an n8n error workflow so any failure sends you an alert instead of staying silent.", "value": "Three failure modes + how to set an error workflow in n8n.", "payoff": "22–38 s: an n8n error workflow messages you the moment a linked workflow fails.", "cta": "Ask n8n builders whether their workflows have an error workflow set.", "cta_type": "question", "visual_concept": "Canvas nodes turning red for each failure; renamed column; calendar of silent days; Error Trigger → phone alert.", "runtime": 45, "retention": {"hook": "An automation builder admitting everything breaks is unexpected and builds trust instantly.", "curiosity": "Viewers want to know the three moments it breaks, especially 'the worst one'.", "relatability": "Renaming a sheet column is something every team does without thinking.", "problem_solution": "Each failure is followed by the n8n fix (error workflow) shown on screen.", "payoff": "A real alert message arrives on the phone with workflow, step and error."}, "script": [{"t": "0-2.5", "vo": "I build automations. Every one will break.", "ost": "Every automation breaks", "vis": "Asif; behind him a canvas node flashes red."}, {"t": "2.5-7", "vo": "One: a login expires. A password changes, or a token runs out.", "ost": "1 · Logins expire", "vis": "Key icon cracks."}, {"t": "7-12.5", "vo": "Two: the data changes. Someone renames a column in the sheet.", "ost": "2 · A column gets renamed", "vis": "Sheet header 'Phone' edited to 'Mobile No.'; node turns red."}, {"t": "12.5-17", "vo": "Your workflow still looks for “Phone”. It finds nothing.", "ost": "Looks for 'Phone' → nothing", "vis": "Empty output panel."}, {"t": "17-22", "vo": "Three, the worst one: it fails quietly, and nobody notices for a week.", "ost": "3 · It fails quietly", "vis": "Calendar days flip; unread orders pile up."}, {"t": "22-27.5", "vo": "The fix in n8n: an error workflow. It starts the moment a workflow fails.", "ost": "Fix: an error workflow", "vis": "Error Trigger node on canvas."}, {"t": "27.5-33", "vo": "It sends me a message: which workflow, which step, what went wrong.", "ost": "Which workflow · step · why", "vis": "Telegram alert on phone."}, {"t": "33-38", "vo": "Set it once in workflow settings. It covers every workflow you link to it.", "ost": "Set once in Settings", "vis": "Workflow Settings → 'Error workflow' dropdown."}, {"t": "38-42", "vo": "No alert means you find out from an angry customer.", "ost": "No alert = angry customer", "vis": "Asif to camera."}, {"t": "42-45", "vo": "Test it: break one on purpose.", "ost": "Test the alert", "vis": "End card."}], "caption": "I build automations, and every one of them will break eventually. Usually for one of 3 reasons:\n\n1. A login expires (password changed, token ran out)\n2. The data changes (someone renames a sheet column, a form adds a question)\n3. It fails quietly, and nobody notices for a week. This is the worst one.\n\nThe fix in n8n: an error workflow. Create a workflow that starts with the Error Trigger node and sends you a message (Telegram, email, chat). Then select it under Workflow Settings → Error workflow for each workflow you care about.\n\nNo alert = you find out from an angry customer.\n\nIf you build in n8n: does every workflow you care about have an error workflow set?\n", "hashtags": ["n8n", "automation", "nocode"], "sources": ["n8n_error_trigger"], "production_notes": "Demo on a test workflow: rename a column live to trigger the failure. Show the Error Trigger workflow and a real alert. Hide chat IDs and tokens.", "day": 11, "slot": "R2", "time": "21:00", "slot_no": 4, "date": "2026-10-22", "spec": "Reel 9:16 · 1080×1920 · H.264 MP4 · 30 fps · AAC 48 kHz · safe box x65–1015 / y270–1250 · burned-in captions y1050–1250 · cover title inside centre 1080×1350", "post_no": 44, "caption_full": "I build automations, and every one of them will break eventually. Usually for one of 3 reasons:\n\n1. A login expires (password changed, token ran out)\n2. The data changes (someone renames a sheet column, a form adds a question)\n3. It fails quietly, and nobody notices for a week. This is the worst one.\n\nThe fix in n8n: an error workflow. Create a workflow that starts with the Error Trigger node and sends you a message (Telegram, email, chat). Then select it under Workflow Settings → Error workflow for each workflow you care about.\n\nNo alert = you find out from an angry customer.\n\nIf you build in n8n: does every workflow you care about have an error workflow set?\n\n#n8n #automation #nocode", "pillar_name": "Automation & n8n", "src": [{"t": "Error Trigger node / Error handling", "u": "https://docs.n8n.io/flow-logic/error-handling/", "p": "n8n Docs", "d": "current", "v": false}], "wps": 2.4}, {"id": "D12-I1", "type": "image", "series": "AI Myth Check", "pillar": "LIT", "format": "Myth vs fact", "topic": "Myth: 'Act as an expert' makes AI smarter", "human_problem": "Copying 'Act as an expert' prompts and still getting average answers.", "objective": "Correct a popular prompting myth; saves", "hook": "Myth: “Act as an expert” makes AI smarter", "main_idea": "A role changes tone, not knowledge; facts, goal, example and format do the heavy lifting.", "takeaway": "A role changes the tone, not the knowledge, so give AI your facts, goal, an example and a format.", "value": "Weak vs strong prompt comparison showing what actually improves answers.", "cta": "None. 'Context beats costume' closes it.", "cta_type": "none", "visual_concept": "Costume illustration (a hat labelled 'expert') crossed out vs a toolbox labelled 'context'.", "design": {"headline": "Myth: “Act as an expert” makes AI smarter", "body": ["FACT: A role sets the tone. It doesn't add knowledge.", "What helps: your facts, your goal, an example, a format.", "Weak: “Act as a marketing expert. Write my ad.”", "Strong: “Product, price, buyer and offer are… Write 3 ads under 40 words.”"], "footer": "Context beats costume.", "layout": "Top: MYTH tag + headline with the quoted phrase struck through. Middle: FACT rows. Bottom: weak (grey) vs strong (accent) prompt blocks side by side. Footer as a short bold line."}, "caption": "“Act as an expert marketer…” is one of the most copied prompt openers online. It mostly changes the tone, not the quality.\n\nWhat actually improves answers:\n• your facts (product, price, buyer)\n• your goal (what should the reader do?)\n• an example of what good looks like\n• a format (3 options, under 40 words)\n\nWeak: “Act as a marketing expert. Write my ad.”\nStrong: “My product is…, price…, buyer…, offer… Write 3 ads under 40 words.”\n\nContext beats costume.\n", "hashtags": ["AItips", "PromptTips", "ChatGPT"], "sources": [], "production_notes": "Myth-vs-fact template with the 'costume vs toolbox' doodle. Keep the claim modest: roles affect tone/focus, they don't add facts.", "day": 12, "slot": "I1", "time": "09:30", "slot_no": 1, "date": "2026-10-23", "spec": "Feed image 4:5 · 1440×1800 PNG (sRGB) · text ≥90 px from edges · headline ≥88 px, body ≥44 px · ≤75 words on image", "post_no": 45, "caption_full": "“Act as an expert marketer…” is one of the most copied prompt openers online. It mostly changes the tone, not the quality.\n\nWhat actually improves answers:\n• your facts (product, price, buyer)\n• your goal (what should the reader do?)\n• an example of what good looks like\n• a format (3 options, under 40 words)\n\nWeak: “Act as a marketing expert. Write my ad.”\nStrong: “My product is…, price…, buyer…, offer… Write 3 ads under 40 words.”\n\nContext beats costume.\n\n#AItips #PromptTips #ChatGPT", "pillar_name": "AI literacy & safety", "src": [], "wps": null}, {"id": "D12-R1", "type": "reel", "series": "Before → After", "pillar": "PA", "format": "Before/after split screen", "topic": "
