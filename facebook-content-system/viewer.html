d Oct 2026.", "layout": "Light background. Three bands: green 'MUST', blue 'GOOD HABIT', red 'NEVER', with rows inside. Small 'AI info' tag illustration top-right. Footer small."}, "caption": "Using AI images, video or voice on your page? When to label it, according to Meta's rules:\n\nMust: Meta requires you to use its AI disclosure option when you post photorealistic video or realistic-sounding audio that was made or changed with AI.\nAutomatic: Meta may add an “AI info” label when it detects industry AI signals.\nGood habit: write “AI-generated” on any realistic AI image, even if it's not strictly required.\nNever: make a real person appear to say or do something they didn't.\n\nLabels don't hurt honest pages. Getting caught faking does.\n", "hashtags": ["AIlabel", "FacebookTips", "AIliteracy"], "sources": ["meta_ai_label"], "production_notes": "Three-tier template. Re-check Meta's labelling page the day before posting.", "day": 22, "slot": "I2", "time": "18:30", "slot_no": 3, "date": "2026-11-02", "spec": "Feed image 4:5 · 1440×1800 PNG (sRGB) · text ≥90 px from edges · headline ≥88 px, body ≥44 px · ≤75 words on image", "post_no": 87, "caption_full": "Using AI images, video or voice on your page? When to label it, according to Meta's rules:\n\nMust: Meta requires you to use its AI disclosure option when you post photorealistic video or realistic-sounding audio that was made or changed with AI.\nAutomatic: Meta may add an “AI info” label when it detects industry AI signals.\nGood habit: write “AI-generated” on any realistic AI image, even if it's not strictly required.\nNever: make a real person appear to say or do something they didn't.\n\nLabels don't hurt honest pages. Getting caught faking does.\n\n#AIlabel #FacebookTips #AIliteracy", "pillar_name": "AI literacy & safety", "src": [{"t": "Our Approach to Labeling AI-Generated Content and Manipulated Media", "u": "https://about.fb.com/news/2024/04/metas-approach-to-labeling-ai-generated-content-and-manipulated-media/", "p": "Meta Newsroom", "d": "2024-04-05", "v": false}], "wps": null}, {"id": "D22-R2", "type": "reel", "series": "Build Log", "pillar": "SVC", "format": "Screen demo + face cam", "topic": "A WhatsApp assistant that remembers your customers", "human_problem": "Customers have to repeat their whole story every time they message your business.", "objective": "Proof for the WhatsApp service; Messenger leads", "hook": "Customers hate repeating themselves. Your WhatsApp makes them.", "open_loop": "How does an assistant remember a customer from last week?", "main_idea": "A production n8n workflow on the official WhatsApp API loads each customer's record and last 5 conversation summaries, detects language and intent, replies in their language and saves memory.", "takeaway": "A WhatsApp assistant that saves short conversation summaries can greet returning customers with context, in their own language.", "value": "Shows memory + language handling, which are what make an assistant feel like good service.", "payoff": "12.5–33.5 s: it loads the customer's last five chats, replies in their language, then saves a summary.", "cta": "Message 'AUTOMATE' with what customers ask on WhatsApp.", "cta_type": "message", "visual_concept": "Test WhatsApp chat where the assistant remembers a previous request → canvas sections zoomed by name → Bangla reply.", "runtime": 51, "retention": {"hook": "Names a frustration on both sides of the chat (customers repeating themselves) before any technology appears.", "relatability": "Customers repeating themselves on WhatsApp is a daily annoyance for both sides.", "visual_progression": "The canvas is shown section by section (receive, load, detect, reply, save).", "novelty": "Language detection with Bangla in, Bangla out surprises many viewers.", "payoff": "A returning customer gets a reply that references their last conversation.", "problem_solution": "Problem (forgetful, slow replies) → system with memory → optional human routing."}, "script": [{"t": "0-3", "vo": "Customers hate repeating themselves. Your WhatsApp makes them.", "ost": "“As I said yesterday…”", "vis": "Test WhatsApp chat: customer types 'As I told you yesterday, the blue sofa…'"}, {"t": "3-7.5", "vo": "This WhatsApp assistant remembers them. I built it in n8n.", "ost": "Remembers · built in n8n", "vis": "Canvas zoomed to section notes and node names only."}, {"t": "7.5-12.5", "vo": "A message arrives through WhatsApp's official Business API.", "ost": "1 · Official WhatsApp API", "vis": "'Receive WhatsApp' node."}, {"t": "12.5-18", "vo": "It finds the customer, or creates a new record, and loads their last five conversations.", "ost": "2 · Customer + last 5 chats", "vis": "'Load Client' and 'Load Memory' nodes."}, {"t": "18-23.5", "vo": "Then AI detects the language and the intent: order, complaint, or question.", "ost": "3 · Language + intent", "vis": "'Detect Intent' node output (test data)."}, {"t": "23.5-28.5", "vo": "It replies in the customer's own language. Bangla in, Bangla out.", "ost": "Bangla in → Bangla out", "vis": "Test chat: Bangla message and Bangla reply."}, {"t": "28.5-33.5", "vo": "After each chat, it saves a short summary, so next time it remembers.", "ost": "4 · Save a summary", "vis": "'Update Memory' node."}, {"t": "33.5-38.5", "vo": "Customers don't repeat themselves. That alone feels like better service.", "ost": "No repeating themselves", "vis": "Asif to camera."}, {"t": "38.5-43.5", "vo": "You can send complaints straight to a person. You choose the rules.", "ost": "Complaints → a person", "vis": "Simple routing add-on diagram."}, {"t": "43.5-48", "vo": "Need one for your business? Message me.", "ost": "Message me", "vis": "Asif to camera."}, {"t": "48-51", "vo": "Tell me what customers ask on WhatsApp.", "ost": "What do they ask?", "vis": "End card."}], "caption": "Customers hate repeating themselves, and most WhatsApp setups make them. This production n8n workflow remembers them:\n\n1. Messages arrive through WhatsApp's official Business API\n2. It finds the customer (or creates a record) and loads their last 5 conversation summaries\n3. AI detects the language and the intent: order, complaint, question\n4. It replies in the customer's own language. Bangla in, Bangla out.\n5. After each chat it saves a short summary, so next time it remembers\n\nCustomers don't have to repeat themselves. You can also route complaints straight to a person.\n\nNeed something like this for your business? I build custom n8n automations. Message me with what customers ask you on WhatsApp.\n", "hashtags": ["WhatsAppBusiness", "n8n", "AIautomation"], "sources": [], "production_notes": "Film the 'Production WhatsApp AI Client Manager' workflow zoomed to section notes and node names. Use a test number and test conversations only. Don't claim it reads images or searches documents (current version doesn't). Never show tokens, phone_number_id or database details.", "day": 22, "slot": "R2", "time": "21:00", "slot_no": 4, "date": "2026-11-02", "spec": "Reel 9:16 · 1080×1920 · H.264 MP4 · 30 fps · AAC 48 kHz · safe box x65–1015 / y270–1250 · burned-in captions y1050–1250 · cover title inside centre 1080×1350", "post_no": 88, "caption_full": "Customers hate repeating themselves, and most WhatsApp setups make them. This production n8n workflow remembers them:\n\n1. Messages arrive through WhatsApp's official Business API\n2. It finds the customer (or creates a record) and loads their last 5 conversation summaries\n3. AI detects the language and the intent: order, complaint, question\n4. It replies in the customer's own language. Bangla in, Bangla out.\n5. After each chat it saves a short summary, so next time it remembers\n\nCustomers don't have to repeat themselves. You can also route complaints straight to a person.\n\nNeed something like this for your business? I build custom n8n automations. Message me with what customers ask you on WhatsApp.\n\n#WhatsAppBusiness #n8n #AIautomation", "pillar_name": "Work with me (n8n services)", "src": [], "wps": 2.22}, {"id": "D23-I1", "type": "image", "series": "Automate This", "pillar": "AU", "format": "Do / Don't card", "topic": "Your automation's keys are passwords: 5 security rules", "human_problem": "Leaking a password or key in a screenshot or workflow without realising it.", "objective": "Authority; protects DIY builders and buyers", "hook": "Your automation's keys are passwords. Treat them that way.", "main_idea": "API keys, tokens and webhook URLs must be stored in credentials, never shown, minimally scoped, revoked if leaked, and verified on incoming webhooks.", "takeaway": "Treat API keys, tokens and webhook URLs like passwords: store them in credentials and never show them.", "value": "Five concrete security rules for anyone building or buying automations.", "cta": "Send it to someone who builds automations.", "cta_type": "share", "visual_concept": "Key-and-padlock illustration over a two-column Do / Don't card.", "design": {"headline": "Your automation's keys are passwords. Treat them that way.", "body": ["Store keys in n8n Credentials, never typed inside a node.", "Never post a screenshot with a token or webhook URL visible.", "Give each app only the access it needs.", "Leaked a key? Revoke it and make a new one. Today.", "Check incoming webhooks really come from the sender (signatures)."], "layout": "Dark background. Key + padlock illustration top. Two columns: green DO (store in credentials, minimal access, verify signatures) and red DON'T (show tokens on screen, wait to revoke a leaked key). Series tag top-left."}, "caption": "API keys, access tokens and webhook URLs are passwords. 5 rules I follow:\n\n1. Store them in n8n Credentials, never typed into a Set or Code node\n2. Never post a screenshot or video where a token or webhook URL is visible\n3. Give each app only the access it needs, nothing extra\n4. Leaked a key? Revoke it and create a new one today, not “later”\n5. Check that incoming webhooks really come from the sender (signature checks)\n\nMost automation “hacks” aren't clever. Someone just found a key.\n\nSend this to someone who builds automations.\n", "hashtags": ["n8n", "cybersecurity", "automation"], "sources": [], "production_notes": "Security checklist template. This post reflects the filming rule for this whole plan: no tokens or webhook URLs on screen, ever.", "day": 23, "slot": "I1", "time": "09:30", "slot_no": 1, "date": "2026-11-03", "spec": "Feed image 4:5 · 1440×1800 PNG (sRGB) · text ≥90 px from edges · headline ≥88 px, body ≥44 px · ≤75 words on image", "post_no": 89, "caption_full": "API keys, access tokens and webhook URLs are passwords. 5 rules I follow:\n\n1. Store them in n8n Credentials, never typed into a Set or Code node\n2. Never post a screenshot or video where a token or webhook URL is visible\n3. Give each app only the access it needs, nothing extra\n4. Leaked a key? Revoke it and create a new one today, not “later”\n5. Check that incoming webhooks really come from the sender (signature checks)\n\nMost automation “hacks” aren't clever. Someone just found a key.\n\nSend this to someone who builds automations.\n\n#n8n #cybersecurity #automation", "pillar_name": "Automation & n8n", "src": [], "wps": null}, {"id": "D23-R1", "type": "reel", "series": "Automate This", "pillar": "AU", "format": "Talking head + paper drawing", "topic": "Map the 'what if' path before you build", "human_problem": "Processes that work on normal days and fall apart on the unusual order.", "objective": "Authority; shows professional process", "hook": "Your process works. Until the address is missing.", "open_loop": "Which 'what ifs' should I plan for?", "main_idea": "Draw the happy path, then list the what-ifs (missing address, out of stock, duplicate, voice note) and give each a rule: ask, wait or alert a person.", "takeaway": "Before building, list the 'what ifs' and give each one a rule: ask the customer, wait, or alert a person.", "value": "A 10-minute paper exercise that prevents most real-world failures.", "payoff": "7.5–29.5 s: four what-ifs, each given a rule: ask, wait or alert a person.", "cta": "Ask what broke the viewer's process last time.", "cta_type": "question", "visual_concept": "Overhead shot of Asif drawing boxes and branches on paper; each what-if becomes a branch with a rule tag.", "runtime": 42, "retention": {"hook": "Starts with the exact moment a normal process breaks, which every operator has lived through.", "visual_progression": "The paper map grows branch by branch on camera.", "relatability": "Missing addresses, double orders and voice notes are exactly what sellers deal with.", "usefulness": "A pen-and-paper method anyone can do before building or hiring.", "payoff": "The finished map shows every branch with a clear rule, which is visually satisfying."}, "script": [{"t": "0-3", "vo": "Your process works. Until the address is missing.", "ost": "Works… until it doesn't", "vis": "Overhead: a neat three-box process drawn on paper; a sticky note 'address missing?' lands on it."}, {"t": "3-7.5", "vo": "Everyone draws the happy path. Order comes in, sheet, confirmation.", "ost": "Happy path ✓", "vis": "Three boxes drawn in a line."}, {"t": "7.5-11.5", "vo": "Now ask: what if the address is missing?", "ost": "What if: no address?", "vis": "First branch drawn."}, {"t": "11.5-15.5", "vo": "What if the item is out of stock?", "ost": "What if: out of stock?", "vis": "Second branch."}, {"t": "15.5-19.5", "vo": "What if they order twice by mistake?", "ost": "What if: ordered twice?", "vis": "Third branch."}, {"t": "19.5-24", "vo": "What if they write in Bangla, with a voice note?", "ost": "What if: voice note?", "vis": "Fourth branch."}, {"t": "24-29.5", "vo": "For each one, pick a rule: ask the customer, wait, or alert a person.", "ost": "ask · wait · alert a person", "vis": "Rule tags written on each branch."}, {"t": "29.5-34.5", "vo": "Ten minutes on paper saves days of fixing later.", "ost": "10 min on paper", "vis": "Full map revealed."}, {"t": "34.5-39.5", "vo": "This map is the first thing I ask clients to make with me.", "ost": "Step 1 of every project", "vis": "Asif to camera, holding the map."}, {"t": "39.5-42", "vo": "What broke your process last time?", "ost": "What broke yours?", "vis": "End card."}], "caption": "Your process works fine, until the address is missing.\n\nMost automations don't break on the normal case. They break on the “what if”.\n\nBefore building, draw the happy path (order → sheet → confirmation). Then ask:\n• What if the address is missing?\n• What if the item is out of stock?\n• What if they order twice by mistake?\n• What if they send a voice note in Bangla?\n\nFor each one, pick a rule: ask the customer, wait, or alert a person.\n\nTen minutes on paper saves days of fixing later. It's the first thing I do with every client.\n\nWhat “what if” broke your process last time?\n", "hashtags": ["automation", "n8n", "processdesign"], "sources": [], "production_notes": "Overhead phone rig. Use a thick marker so lines read on mobile. Keep 'first thing I do with every client' only if true.", "day": 23, "slot": "R1", "time": "13:30", "slot_no": 2, "date": "2026-11-03", "spec": "Reel 9:16 · 1080×1920 · H.264 MP4 · 30 fps · AAC 48 kHz · safe box x65–1015 / y270–1250 · burned-in captions y1050–1250 · cover title inside centre 1080×1350", "post_no": 90, "caption_full": "Your process works fine, until the address is missing.\n\nMost automations don't break on the normal case. They break on the “what if”.\n\nBefore building, draw the happy path (order → sheet → confirmation). Then ask:\n• What if the address is missing?\n• What if the item is out of stock?\n• What if they order twice by mistake?\n• What if they send a voice note in Bangla?\n\nFor each one, pick a rule: ask the customer, wait, or alert a person.\n\nTen minutes on paper saves days of fixing later. It's the first thing I do with every client.\n\nWhat “what if” broke your process last time?\n\n#automation #n8n #processdesign", "pillar_name": "Automation & n8n", "src": [], "wps": 2.21}, {"id": "D23-I2", "type": "image", "series": "Steal This Prompt", "pillar": "PA", "format": "Prompt card", "topic": "Before you launch anything, ask AI what you missed", "human_problem": "Launching something and only then noticing the obvious gap.", "objective": "Saves among sellers, freelancers and organisers", "hook": "Before you launch anything, ask AI this", "main_idea": "A 4-question review prompt catches gaps, confusion, risks and complexity before launch.", "takeaway": "Ask AI what you forgot, what will confuse a newcomer, what could go wrong and what's too complicated.", "value": "Copy-paste pre-launch checklist prompt.", "cta": "Save it.", "cta_type": "save", "visual_concept": "Rocket icon with a magnifier; four question chips.", "design": {"headline": "Before you launch anything, ask AI this", "body": ["“Here's my plan: [paste].", "1. What did I forget?", "2. What will confuse a first-time customer?", "3. What could go wrong in week one?", "4. Which part is too complicated? Make it simpler.”"], "footer": "Use it on offers, events, websites and job posts.", "layout": "Light background. Small rocket + magnifier icon top-right. Prompt as a quote block with four numbered lines. Footer bottom."}, "caption": "Before you launch an offer, an event, a website or a job post, ask AI to find what you missed:\n\n“Here's my plan: [paste].\n1. What did I forget?\n2. What will confuse a first-time customer?\n3. What could go wrong in week one?\n4. Which part is too complicated? Make it simpler.”\n\nQuestion 2 is the one that saves money. You can't see your own plan like a stranger does.\n", "hashtags": ["AItips", "smallbusiness", "planning"], "sources": [], "production_notes": "Prompt-card template.", "day": 23, "slot": "I2", "time": "18:30", "slot_no": 3, "date": "2026-11-03", "spec": "Feed image 4:5 · 1440×1800 PNG (sRGB) · text ≥90 px from edges · headline ≥88 px, body ≥44 px · ≤75 words on image", "post_no": 91, "caption_full": "Before you launch an offer, an event, a website or a job post, ask AI to find what you missed:\n\n“Here's my plan: [paste].\n1. What did I forget?\n2. What will confuse a first-time customer?\n3. What could go wrong in week one?\n4. Which part is too complicated? Make it simpler.”\n\nQuestion 2 is the one that saves money. You can't see your own plan like a stranger does.\n\n#AItips #smallbusiness #planning", "pillar_name": "Practical AI", "src": [], "wps": null}, {"id": "D23-R2", "type": "reel", "series": "Steal This Prompt", "pillar": "WF", "format": "Talking head + screen split", "topic": "Same questions every day? Build your FAQ from your own chats", "human_problem": "Typing the same answers to the same customer questions every single day.", "objective": "Saves among page owners; bridge to the assistant service", "hook": "Same questions every day? Answer them once.", "open_loop": "How do I find the questions and turn them into one-tap replies?", "main_idea": "Turn 30 anonymised customer chats into a grouped question list, write the true answers yourself, and let AI format an FAQ plus saved replies.", "takeaway": "Turn your real customer chats into an FAQ and one-tap saved replies, writing the facts yourself.", "value": "A one-hour process that speeds up replies and prepares data for an AI assistant later.", "payoff": "8–33 s: grouped questions with counts, your true answers, a clean FAQ and saved replies.", "cta": "Save it for the weekend.", "cta_type": "save", "visual_concept": "Vertical split: Asif talking on top; bottom half shows the inbox full of 'price?' → redaction → grouped question list with counts → FAQ doc → saved replies.", "runtime": 44, "retention": {"hook": "Every page owner answers the same questions repeatedly; the promise is immediate relief.", "relatability": "'Delivery charge?' and 'Size?' messages are universal for Facebook sellers.", "usefulness": "A step-by-step method using free tools and Meta Business Suite saved replies.", "visual_progression": "Inbox, redaction, list with counts, FAQ doc, saved replies: five clear visual states.", "payoff": "The same FAQ becomes the foundation for an AI assistant later."}, "script": [{"t": "0-3", "vo": "Same questions every day? Answer them once.", "ost": "Answer them ONCE", "vis": "Asif scrolling an inbox full of 'price?' and 'delivery?'"}, {"t": "3-8", "vo": "Copy thirty recent customer chats. Remove names and phone numbers first.", "ost": "1 · 30 chats · no names", "vis": "Redaction of names and numbers."}, {"t": "8-13.5", "vo": "Ask AI: “List the questions customers ask most, grouped, with how often.”", "ost": "2 · Top questions, grouped", "vis": "AI list with counts."}, {"t": "13.5-18", "vo": "Delivery charge. Payment options. Size. Return policy. The usual.", "ost": "delivery · payment · size · returns", "vis": "List items highlight."}, {"t": "18-23", "vo": "Now you write the true answers. AI doesn't know your prices.", "ost": "3 · YOU write the facts", "vis": "Typing answers."}, {"t": "23-28", "vo": "Then: “Turn this into a clear FAQ, plus short versions for quick replies.”", "ost": "4 · FAQ + short replies", "vis": "FAQ doc appears."}, {"t": "28-33", "vo": "Save the short ones as saved replies in your inbox. One tap each.", "ost": "Saved replies · 1 tap", "vis": "Own screen capture of Meta Business Suite saved replies."}, {"t": "33-38", "vo": "And that same FAQ is exactly what an AI assistant needs later.", "ost": "Ready for an AI assistant", "vis": "FAQ doc slides into an assistant icon."}, {"t": "38-41", "vo": "One hour now. Faster replies every day.", "ost": "1 hour → faster every day", "vis": "Asif to camera."}, {"t": "41-44", "vo": "One hour this weekend. That's it.", "ost": "1 hour this weekend", "vis": "End card."}], "caption": "Answering the same questions every day? Answer them once:\n\n1. Copy ~30 recent customer chats. Remove names and phone numbers first.\n2. Ask AI: “List the questions customers ask most, grouped, with how often each comes up.”\n3. Write the true answers yourself. AI doesn't know your prices or delivery areas.\n4. “Turn this into a clear FAQ, plus a one-line version of each answer for quick replies.”\n5. Save the one-liners as saved replies in Meta Business Suite.\n\nBonus: that FAQ is exactly what an AI assistant needs if you automate replies later.\n\nOne hour this weekend. Faster replies every day after.\n", "hashtags": ["fcommerce", "customerservice", "AItips"], "sources": [], "production_notes": "Use fictional chats. Capture Meta Business Suite saved replies from your own account.", "day": 23, "slot": "R2", "time": "21:00", "slot_no": 4, "date": "2026-11-03", "spec": "Reel 9:16 · 1080×1920 · H.264 MP4 · 30 fps · AAC 48 kHz · safe box x65–1015 / y270–1250 · burned-in captions y1050–1250 · cover title inside centre 1080×1350", "post_no": 92, "caption_full": "Answering the same questions every day? Answer them once:\n\n1. Copy ~30 recent customer chats. Remove names and phone numbers first.\n2. Ask AI: “List the questions customers ask most, grouped, with how often each comes up.”\n3. Write the true answers yourself. AI doesn't know your prices or delivery areas.\n4. “Turn this into a clear FAQ, plus a one-line version of each answer for quick replies.”\n5. Save the one-liners as saved replies in Meta Business Suite.\n\nBonus: that FAQ is exactly what an AI assistant needs if you automate replies later.\n\nOne hour this weekend. Faster replies every day after.\n\n#fcommerce #customerservice #AItips", "pillar_name": "Workflows & productivity", "src": [], "wps": 2.3}, {"id": "D24-I1", "type": "image", "series": "Steal This Prompt", "pillar": "PA", "format": "Package mock", "topic": "Not sure what to charge? Ask AI for 3 pricing tiers", "human_problem": "Not knowing what to charge and quoting a different price every time.", "objective": "Saves among freelancers and service businesses", "hook": "Not sure what to charge? Build 3 packages", "main_idea": "Give AI your service, customers, costs and time; get basic/standard/premium packages with inclusions; validate against real competitors.", "takeaway": "Ask AI to draft three packages with clear 'not included' lines, then check real competitor prices.", "value": "A packaging prompt + the reminder that the market sets prices.", "cta": "Save it.", "cta_type": "save", "visual_concept": "Three package cards (Basic, Standard, Premium) like a real price page, with the prompt underneath.", "design": {"headline": "Not sure what to charge? Build 3 packages", "body": ["“I offer [service] to [customers] in [city].", "My costs: [list]. Time per job: [X hours].", "Suggest 3 packages: basic, standard, premium.", "For each: what's included, what's not, and a price range.”", "Then check real competitor prices yourself."], "footer": "AI suggests. The market decides.", "layout": "Light background. Three package cards side by side (Basic / Standard / Premium) with blank price tags and 'included / not included' rows. The prompt block runs underneath. Footer bottom."}, "caption": "Not sure what to charge? Let AI draft your packages, then check them against reality.\n\n“I offer [service] to [customers] in [city].\nMy costs: [list]. Time per job: [X hours].\nSuggest 3 packages: basic, standard, premium.\nFor each: what's included, what's NOT included, and a price range.”\n\nThe “not included” line is gold. It stops scope creep before it starts.\n\nThen check real competitor prices yourself. AI suggests; the market decides.\n", "hashtags": ["freelancing", "pricing", "AItips"], "sources": [], "production_notes": "Prompt-card template with tier graphic.", "day": 24, "slot": "I1", "time": "09:30", "slot_no": 1, "date": "2026-11-04", "spec": "Feed image 4:5 · 1440×1800 PNG (sRGB) · text ≥90 px from edges · headline ≥88 px, body ≥44 px · ≤75 words on image", "post_no": 93, "caption_full": "Not sure what to charge? Let AI draft your packages, then check them against reality.\n\n“I offer [service] to [customers] in [city].\nMy costs: [list]. Time per job: [X hours].\nSuggest 3 packages: basic, standard, premium.\nFor each: what's included, what's NOT included, and a price range.”\n\nThe “not included” line is gold. It stops scope creep before it starts.\n\nThen check real competitor prices yourself. AI suggests; the market decides.\n\n#freelancing #pricing #AItips", "pillar_name": "Practical AI", "src": [], "wps": null}, {"id": "D24-R1", "type": "reel", "series": "Hidden Button", "pillar": "HF", "format": "Phone-in-hand demo", "topic": "Stuck in an app? Share your screen with Gemini Live", "human_problem": "Knowing you should secure your account but getting lost in settings menus.", "objective": "Shares; practical help + account safety", "hook": "No two-step login yet? Let AI guide you.", "open_loop": "Can AI really guide me through my own settings?", "main_idea": "Gemini Live screen sharing guides you through any app live; demo: turning on Facebook two-factor login; close private content first.", "takeaway": "Share your screen with Gemini Live for step-by-step help in any app, after closing private content.", "value": "A free way to get step-by-step help in any app + a security win.", "payoff": "12–22.5 s: live step-by-step guidance until two-factor login is on.", "cta": "Send it to the person who always asks you for tech help.", "cta_type": "share", "visual_concept": "Phone screen recording with Gemini guiding through Facebook security settings; privacy warning card.", "runtime": 37, "retention": {"hook": "Starts from a real security gap (no two-step login) and promises a guided fix.", "novelty": "Screen sharing with AI is unfamiliar to most viewers.", "usefulness": "The demo itself turns on two-factor login, a real security improvement.", "relatability": "Every family has the person who gets asked for tech help.", "save_share": "The CTA targets that exact person, so it gets forwarded."}, "script": [{"t": "0-3", "vo": "No two-step login yet? Let AI guide you.", "ost": "No 2-step login yet?", "vis": "Asif frowning at phone settings."}, {"t": "3-7.5", "vo": "In Gemini Live, tap share screen. It sees what you see.", "ost": "Gemini Live → share screen", "vis": "Tap on the screen-share button."}, {"t": "7.5-12", "vo": "I asked: “Help me turn on two-factor login on Facebook.”", "ost": "“Turn on 2-factor login”", "vis": "Voice prompt waveform."}, {"t": "12-18", "vo": "It told me where to tap, step by step, while I moved through the settings.", "ost": "Step by step, live", "vis": "Screen recording through Facebook security settings."}, {"t": "18-22.5", "vo": "Done in two minutes. And now my account is safer.", "ost": "2FA ✓", "vis": "Success screen."}, {"t": "22.5-28", "vo": "One warning: it sees your whole screen. Close private chats and turn off notifications first.", "ost": "It sees EVERYTHING on screen", "vis": "A blurred notification pops up as an example."}, {"t": "28-32.5", "vo": "Free on Android and iPhone. Works with any app.", "ost": "Free · any app", "vis": "Asif to camera."}, {"t": "32.5-37", "vo": "Send this to someone who always asks you for help.", "ost": "Send to that person", "vis": "End card."}], "caption": "No two-step login on your Facebook yet? Let AI guide you through it with screen sharing.\n\nIn Gemini Live, tap share screen and ask out loud. I asked: “Help me turn on two-factor login on Facebook.” It walked me through it step by step while I tapped, and now my account is safer.\n\nBefore you share:\n• it sees your whole screen\n• close private chats and turn off notifications first\n\nFree on Android and iPhone. Works with any app.\n\nSend this to the person who always asks you for tech help.\n", "hashtags": ["GeminiAI", "techtips", "accountsecurity"], "sources": ["google_gemini_live_free"], "production_notes": "Record the real session. Only keep 'done in two minutes' if accurate. Blur any account names or codes. Don't show backup codes or login codes.", "day": 24, "slot": "R1", "time": "13:30", "slot_no": 2, "date": "2026-11-04", "spec": "Reel 9:16 · 1080×1920 · H.264 MP4 · 30 fps · AAC 48 kHz · safe box x65–1015 / y270–1250 · burned-in captions y1050–1250 · cover title inside centre 1080×1350", "post_no": 94, "caption_full": "No two-step login on your Facebook yet? Let AI guide you through it with screen sharing.\n\nIn Gemini Live, tap share screen and ask out loud. I asked: “Help me turn on two-factor login on Facebook.” It walked me through it step by step while I tapped, and now my account is safer.\n\nBefore you share:\n• it sees your whole screen\n• close private chats and turn off notifications first\n\nFree on Android and iPhone. Works with any app.\n\nSend this to the person who always asks you for tech help.\n\n#GeminiAI #techtips #accountsecurity", "pillar_name": "Hidden features & tools", "src": [{"t": "Gemini gets more personal, proactive and powerful (I/O 2025)", "u": "https://blog.google/products/gemini/gemini-app-updates-io-2025/", "p": "Google Blog (+ Gemini Apps Help 'Talk naturally with Gemini Live')", "d": "2025-05-20", "v": false}], "wps": 2.38}, {"id": "D24-I2", "type": "image", "series": "AI Myth Check", "pillar": "LIT", "format": "Three-rule card", "topic": "3 rules that beat almost every AI scam", "human_problem": "AI-powered scams that sound and look more real every month.", "objective": "Shares; protection", "hook": "3 rules that beat almost every AI scam", "main_idea": "Second-channel verification, treating urgency as a red flag, and never sharing OTPs/PINs defeat voice, video and text scams.", "takeaway": "Verify on a second channel, treat urgency as a red flag and never share OTPs or PINs.", "value": "Three memorable rules that work regardless of the scam's technology.", "cta": "Send it to someone who'd panic first and check later.", "cta_type": "share", "visual_concept": "Three large numbered shields.", "design": {"headline": "3 rules that beat almost every AI scam", "body": ["1. Verify on a second channel. Call back on a number you saved.", "2. Urgency is the trick. Real people can wait 5 minutes.", "3. Never share OTPs or PINs. Real companies don't ask for them.", "Fake voices, fake videos, perfect-English messages: same 3 rules."], "footer": "Send to someone who'd panic first and check later.", "layout": "Dark background. Three large shield icons in a row with numbers; rules underneath each. Summary line below. Footer bottom."}, "caption": "AI scams keep changing: cloned voices, fake video calls, perfect-English messages. The defence doesn't change. 3 rules:\n\n1. Verify on a second channel: hang up, call back on the number you saved\n2. Urgency is the trick: real people can wait 5 minutes while you check\n3. Never share OTPs or PINs: banks and mobile-money services don't ask for them\n\nSend this to someone who'd panic first and check later.\n", "hashtags": ["scamalert", "AIsafety", "cybersecurity"], "sources": ["fbi_genai_fraud"], "production_notes": "Shield template. Complements D10-R1 (voice clone) without repeating its story.", "day": 24, "slot": "I2", "time": "18:30", "slot_no": 3, "date": "2026-11-04", "spec": "Feed image 4:5 · 1440×1800 PNG (sRGB) · text ≥90 px from edges · headline ≥88 px, body ≥44 px · ≤75 words on image", "post_no": 95, "caption_full": "AI scams keep changing: cloned voices, fake video calls, perfect-English messages. The defence doesn't change. 3 rules:\n\n1. Verify on a second channel: hang up, call back on the number you saved\n2. Urgency is the trick: real people can wait 5 minutes while you check\n3. Never share OTPs or PINs: banks and mobile-money services don't ask for them\n\nSend this to someone who'd panic first and check later.\n\n#scamalert #AIsafety #cybersecurity", "pillar_name": "AI literacy & safety", "src": [{"t": "Criminals Use Generative Artificial Intelligence to Facilitate Financial Fraud (PSA I-120324-PSA)", "u": "https://www.ic3.gov/PSA/2024/PSA241203", "p": "FBI / IC3", "d": "2024-12-03", "v": false}], "wps": null}, {"id": "D24-R2", "type": "reel", "series": "Work With Me", "pillar": "SVC", "format": "Screen demo + face cam", "topic": "Fill a sheet, posts publish themselves (approved-only auto-publisher)", "human_problem": "Page owners staying online at night just to publish posts on time.", "objective": "Sell the content auto-publishing service", "hook": "Up at 9 PM just to post?", "open_loop": "How do posts go out on time without me?", "main_idea": "An n8n publisher checks a content sheet every 15 minutes, publishes only 'Approved' rows to your Page, writes back the result and alerts on failure.", "takeaway": "An approved-only n8n publisher posts from a spreadsheet on schedule, so nothing goes out without a human yes.", "value": "Shows a safe, human-approved publishing system teams can run from a spreadsheet.", "payoff": "7.5–27 s: approved rows publish on schedule, the sheet updates, and failures alert you.", "cta": "Message 'AUTOMATE' and say where you post.", "cta_type": "message", "visual_concept": "Content calendar sheet → schedule + filter nodes → post appears on a test Page → row updates.", "runtime": 49, "retention": {"hook": "Speaks to a routine pain for page owners (staying up to post) before showing the system.", "relatability": "Posting late at night and on Fridays is a pain for small teams.", "visual_progression": "Sheet → canvas → live post → updated row.", "novelty": "The 'Approved only' safety rule is a detail most auto-posting tools don't stress.", "payoff": "A post goes live on time and the sheet updates itself."}, "script": [{"t": "0-3", "vo": "Up at 9 PM just to post?", "ost": "Up at 9 PM just to post?", "vis": "Phone clock at 21:00; Asif, tired, posting by hand; cut to the content sheet."}, {"t": "3-7.5", "vo": "Fill a sheet once. One row, one post.", "ost": "1 row = 1 post", "vis": "Sheet columns highlighted."}, {"t": "7.5-12", "vo": "Every 15 minutes, n8n checks: is anything due?", "ost": "Every 15 min: anything due?", "vis": "Schedule node."}, {"t": "12-17", "vo": "Only rows marked “Approved” go out. Nothing posts without a human yes.", "ost": "Only 'Approved' rows", "vis": "Filter node; status column."}, {"t": "17-22", "vo": "It publishes to your Facebook Page, and other platforms if you want.", "ost": "Publish → your Page", "vis": "Publishing node; test Page."}, {"t": "22-27", "vo": "Then writes back: posted, time, and the post link. Failed? I get an alert.", "ost": "Posted ✓ · Failed → alert", "vis": "Row updates; alert on phone."}, {"t": "27-32", "vo": "AI can draft captions in the sheet too. But you approve them.", "ost": "AI drafts · you approve", "vis": "AI caption column."}, {"t": "32-37", "vo": "Your team works in a spreadsheet they already know. No new app.", "ost": "No new app to learn", "vis": "Asif to camera."}, {"t": "37-42.5", "vo": "Posting at night or on Fridays doesn't need you awake anymore.", "ost": "Posts on time · you rest", "vis": "Phone at 9 PM showing the post live."}, {"t": "42.5-46", "vo": "Want this for your pages? Message me AUTOMATE.", "ost": "Message: AUTOMATE", "vis": "Asif to camera."}, {"t": "46-49", "vo": "And get your evenings back.", "ost": "Evenings back", "vis": "End card."}], "caption": "Up at 9 PM just to post on time? Fill a spreadsheet once, and the posts publish themselves:\n\n• Each row = one post: date, time, caption, image link, status\n• Every 15 minutes, n8n checks what's due\n• Only rows marked “Approved” go out. Nothing posts without a human yes.\n• It publishes to your Facebook Page (and other platforms if you want)\n• It writes back “Posted” with the time and link. If anything fails, you get an alert.\n• AI can draft captions in the sheet, but you approve them\n\nYour team works in a spreadsheet they already know.\n\nNeed something like this for your pages? I build custom n8n automations. Message me “AUTOMATE”.\n", "hashtags": ["n8n", "socialmediamanagement", "automation"], "sources": [], "production_notes": "Demo on a test Page. Confirm your 'AI Social Media Content Creation and Auto Publisher' workflow behaves this way before filming, or build a clean demo. This 30-day plan's own CSV can be the demo sheet.", "day": 24, "slot": "R2", "time": "21:00", "slot_no": 4, "date": "2026-11-04", "spec": "Reel 9:16 · 1080×1920 · H.264 MP4 · 30 fps · AAC 48 kHz · safe box x65–1015 / y270–1250 · burned-in captions y1050–1250 · cover title inside centre 1080×1350", "post_no": 96, "caption_full": "Up at 9 PM just to post on time? Fill a spreadsheet once, and the posts publish themselves:\n\n• Each row = one post: date, time, caption, image link, status\n• Every 15 minutes, n8n checks what's due\n• Only rows marked “Approved” go out. Nothing posts without a human yes.\n• It publishes to your Facebook Page (and other platforms if you want)\n• It writes back “Posted” with the time and link. If anything fails, you get an alert.\n• AI can draft captions in the sheet, but you approve them\n\nYour team works in a spreadsheet they already know.\n\nNeed something like this for your pages? I build custom n8n automations. Message me “AUTOMATE”.\n\n#n8n #socialmediamanagement #automation", "pillar_name": "Work with me (n8n services)", "src": [], "wps": 2.22}, {"id": "D25-I1", "type": "image", "series": "Hidden Button", "pillar": "LIT", "format": "Hidden feature card", "topic": "Don't want your chats used for AI training? Check these settings", "human_problem": "Not knowing whether your AI chats are being used to train models.", "objective": "Privacy trust; saves", "hook": "Don't want your chats used for AI training? Check this", "main_idea": "ChatGPT's 'Improve the model for everyone' and Gemini's 'Keep Activity' settings control whether chats help train models.", "takeaway": "Check ChatGPT's 'Improve the model for everyone' and Gemini's 'Keep Activity' settings, and know the trade-offs.", "value": "Where to find both settings and the trade-offs.", "cta": "None. Ends with where to find the settings.", "cta_type": "none", "visual_concept": "Two toggle switches labelled with each app's setting name (drawn).", "design": {"headline": "Don't want your chats used for AI training? Check this", "body": ["ChatGPT: Settings → Data controls → “Improve the model for everyone”.", "Gemini: “Keep Activity” (formerly Gemini Apps Activity) in your activity settings.", "Trade-off: Gemini skills need Keep Activity turned on.", "Work account? Your company's settings may already decide this."], "footer": "Setting names change. Search the app's help page for 'data controls'.", "layout": "Light background. Two large drawn toggle switches side by side labelled 'ChatGPT' and 'Gemini' with setting names. Notes below. Footer small."}, "caption": "Want to keep your chats out of AI training? Two settings to check:\n\nChatGPT: Settings → Data controls → “Improve the model for everyone”\nGemini: “Keep Activity” (the new name for Gemini Apps Activity)\n\nTurning these off can change how history works, and Gemini skills need Keep Activity on. Read the note on screen before you switch.\nUsing a work account? Your company's admin settings may already decide this.\n\nSetting names change; search each app's help page for “data controls”.\n", "hashtags": ["privacy", "ChatGPT", "GeminiAI"], "sources": ["openai_data_controls", "google_keep_activity", "gems_nov17"], "production_notes": "Verify both setting names in the live apps the day before posting. Draw toggles; no logos.", "day": 25, "slot": "I1", "time": "09:30", "slot_no": 1, "date": "2026-11-05", "spec": "Feed image 4:5 · 1440×1800 PNG (sRGB) · text ≥90 px from edges · headline ≥88 px, body ≥44 px · ≤75 words on image", "post_no": 97, "caption_full": "Want to keep your chats out of AI training? Two settings to check:\n\nChatGPT: Settings → Data controls → “Improve the model for everyone”\nGemini: “Keep Activity” (the new name for Gemini Apps Activity)\n\nTurning these off can change how history works, and Gemini skills need Keep Activity on. Read the note on screen before you switch.\nUsing a work account? Your company's admin settings may already decide this.\n\nSetting names change; search each app's help page for “data controls”.\n\n#privacy #ChatGPT #GeminiAI", "pillar_name": "AI literacy & safety", "src": [{"t": "Data controls in ChatGPT", "u": "https://help.openai.com/en/articles/7730893-data-controls-in-chatgpt", "p": "OpenAI Help Center", "d": "current", "v": false}, {"t": "Gemini app personalizes responses based on past chats, plus new privacy controls", "u": "https://blog.google/products/gemini/temporary-chats-privacy-controls/", "p": "Google Blog (+ Gemini Apps Help 'Manage & delete your activity')", "d": "2025-08", "v": false}, {"t": "Google Is Replacing Gemini Gems With Skills Nov 17", "u": "https://www.techrepublic.com/article/news-gemini-gems-skills-migration/", "p": "TechRepublic (also 9to5Google, 2026-09-27 and 2026-09-30)", "d": "2026-09-30", "v": true}], "wps": null}, {"id": "D25-R1", "type": "reel", "series": "AI Myth Check", "pillar": "LIT", "format": "Prop explainer + talking head", "topic": "Why long AI chats get worse (and the clean-desk fix)", "human_problem": "Long AI chats where it slowly forgets the rules you set at the start.", "objective": "Saves; practical understanding of context limits", "hook": "Twenty minutes in, AI forgot my rules.", "open_loop": "Why does it forget, and how do I stop it?", "main_idea": "AI reads chats in tokens within a limit; as a chat grows, early instructions get buried or dropped; summarise and restart.", "takeaway": "When a long chat starts forgetting, ask for a summary and continue in a fresh chat.", "value": "A simple mental model (a desk) + a restart-with-summary technique.", "payoff": "8.5–32 s: the full-desk explanation, then summarise-and-restart.", "cta": "Save it.", "cta_type": "save", "visual_concept": "Real desk + real paper: Asif stacks printed 'messages' on a small desk until the first sheets slide off; then writes a summary card and moves it to a clean desk. Short screen inserts for the prompt.", "runtime": 37, "retention": {"hook": "A personal, familiar moment (AI ignoring rules you gave it earlier) rather than a technical statement.", "curiosity": "'Here's why' sets up a simple reveal (tokens and a limit).", "visual_progression": "Paper-on-a-desk animation makes an invisible limit visible.", "usefulness": "A one-prompt fix viewers can use immediately.", "novelty": "Introduces 'tokens' and 'context limits' in plain language."}, "script": [{"t": "0-3", "vo": "Twenty minutes in, AI forgot my rules.", "ost": "AI forgot my rules", "vis": "Asif scrolling a very long chat."}, {"t": "3-8.5", "vo": "AI reads your chat in small pieces called tokens. And it has a limit.", "ost": "Tokens + a limit", "vis": "Text breaks into small blocks."}, {"t": "8.5-13", "vo": "Think of it as a desk. Every message adds paper.", "ost": "Chat = a desk", "vis": "Real desk: Asif adds printed message sheets one by one."}, {"t": "13-18", "vo": "When the desk is full, the oldest papers fall off, or get buried.", "ost": "Old instructions fall off", "vis": "The first sheets slide off the back of the desk."}, {"t": "18-22.5", "vo": "Your first instructions are often the ones it forgets.", "ost": "First rules forgotten", "vis": "First message greys out."}, {"t": "22.5-28", "vo": "Fix: ask for a summary. “List the goal, decisions and my preferences in ten bullets.”", "ost": "Summary: goal · decisions · preferences", "vis": "Summary appears."}, {"t": "28-32", "vo": "Start a new chat. Paste the summary. Clean desk.", "ost": "New chat + summary", "vis": "Asif places one handwritten summary card on an empty desk."}, {"t": "32-37", "vo": "Rules you always want? Save them as custom instructions.", "ost": "Permanent rules → instructions", "vis": "Settings mock; end card."}], "caption": "AI forgot the instructions you gave it 20 minutes ago? It's not your imagination.\n\nAI reads your chat in small pieces called tokens, and every chat has a limit. Think of a desk: every message adds paper. When it's full, older papers get buried or fall off, and often the first instructions you gave are the ones it forgets.\n\nFix:\n1. “Summarise the goal, the decisions so far and my preferences in 10 bullets.”\n2. Start a new chat and paste the summary.\n3. Rules you always want → save them as custom instructions (or a skill).\n\nNext time an answer suddenly ignores your rules, start fresh with a summary.\n", "hashtags": ["AItips", "ChatGPT", "AIliteracy"], "sources": [], "production_notes": "Desk-and-paper motion template. Keep the claim general (no exact token limits; they differ by model).", "day": 25, "slot": "R1", "time": "13:30", "slot_no": 2, "date": "2026-11-05", "spec": "Reel 9:16 · 1080×1920 · H.264 MP4 · 30 fps · AAC 48 kHz · safe box x65–1015 / y270–1250 · burned-in captions y1050–1250 · cover title inside centre 1080×1350", "post_no": 98, "caption_full": "AI forgot the instructions you gave it 20 minutes ago? It's not your imagination.\n\nAI reads your chat in small pieces called tokens, and every chat has a limit. Think of a desk: every message adds paper. When it's full, older papers get buried or fall off, and often the first instructions you gave are the ones it forgets.\n\nFix:\n1. “Summarise the goal, the decisions so far and my preferences in 10 bullets.”\n2. Start a new chat and paste the summary.\n3. Rules you always want → save them as custom instructions (or a skill).\n\nNext time an answer suddenly ignores your rules, start fresh with a summary.\n\n#AItips #ChatGPT #AIliteracy", "pillar_name": "AI literacy & safety", "src": [], "wps": 2.32}, {"id": "D25-I2", "type": "image", "series": "Steal This Prompt", "pillar": "WF", "format": "Sorting trays card", "topic": "Turn 50 unread emails into a 5-minute to-do list", "human_problem": "An overflowing inbox that hides what actually needs a reply.", "objective": "Saves among office workers", "hook": "Turn 50 unread emails into a 5-minute to-do list", "main_idea": "Sort emails into reply today / this week / read / ignore with one-line suggested replies, then reply yourself.", "takeaway": "Ask AI to sort emails into reply today, this week, read and ignore, then write the replies yourself.", "value": "An inbox triage prompt that works with pasted text or an AI app's Gmail connection.", "cta": "Save it.", "cta_type": "save", "visual_concept": "An overflowing inbox pouring into four labelled trays, with the two prompts on the trays.", "design": {"headline": "Turn 50 unread emails into a 5-minute to-do list", "body": ["Paste subjects + first lines, or use your AI app's Gmail connection.", "“Sort these into: reply today / this week / just read / ignore.”", "“For ‘reply today’, suggest a one-line reply for each.”", "Then you reply. Not the AI."], "footer": "Remove private or confidential emails before pasting.", "layout": "Light background. Overflowing inbox icon at the top pours into four labelled trays (Reply today / This week / Just read / Ignore). The two prompts sit on the trays. Footer small."}, "caption": "50 unread emails? Turn them into a to-do list in 5 minutes:\n\n1. Paste the subjects and first lines (or use your AI app's Gmail connection)\n2. “Sort these into: reply today / reply this week / just read / ignore.”\n3. “For ‘reply today’, suggest a one-line reply for each.”\n4. Then you reply. Not the AI.\n\nRemove private or confidential emails before pasting anything.\n", "hashtags": ["productivity", "email", "AItips"], "sources": [], "production_notes": "Prompt-card template with tray illustration.", "day": 25, "slot": "I2", "time": "18:30", "slot_no": 3, "date": "2026-11-05", "spec": "Feed image 4:5 · 1440×1800 PNG (sRGB) · text ≥90 px from edges · headline ≥88 px, body ≥44 px · ≤75 words on image", "post_no": 99, "caption_full": "50 unread emails? Turn them into a to-do list in 5 minutes:\n\n1. Paste the subjects and first lines (or use your AI app's Gmail connection)\n2. “Sort these into: reply today / reply this week / just read / ignore.”\n3. “For ‘reply today’, suggest a one-line reply for each.”\n4. Then you reply. Not the AI.\n\nRemove private or confidential emails before pasting anything.\n\n#productivity #email #AItips", "pillar_name": "Workflows & productivity", "src": [], "wps": null}, {"id": "D25-R2", "type": "reel", "series": "Explain It Simply", "pillar": "AU", "format": "Diagram explainer + talking head", "topic": "MCP explained: a USB port for AI (and why n8n now has one)", "human_problem": "Hearing 'MCP' everywhere and not knowing why it matters to you.", "objective": "Authority on current AI-automation tech", "hook": "Remember when every phone needed a different charger?", "open_loop": "What's the AI version of the universal charger?", "main_idea": "MCP is a standard plug that lets AI assistants use apps' tools; n8n's MCP server lets an AI assistant build and edit workflows, in every edition.", "takeaway": "MCP is a standard plug that lets AI assistants use apps' tools, and n8n's MCP server lets AI build workflows.", "value": "Plain explanation of a trending term + a concrete use (AI builds, human checks).", "payoff": "7.5–33 s: MCP explained, then an AI assistant building an n8n workflow through it.", "cta": "Follow for more Explain It Simply.", "cta_type": "follow", "visual_concept": "USB cable in hand → tangle of old cables → neat hub diagram → screen recording of an assistant creating an n8n workflow.", "runtime": 46, "retention": {"hook": "Starts from a shared everyday memory (a drawer of different chargers) before naming any technology.", "curiosity": "Viewers who've heard 'MCP' everywhere finally get a simple answer.", "visual_progression": "Cable tangle turns into a clean hub, then into a real n8n canvas building itself.", "novelty": "Seeing an AI assistant build an n8n workflow is new to most viewers.", "payoff": "Clear takeaway: AI builds, a human checks; works even on free self-hosted n8n."}, "script": [{"t": "0-3", "vo": "Remember when every phone needed a different charger?", "ost": "A different charger for every phone?", "vis": "A drawer full of tangled, mismatched chargers."}, {"t": "3-7.5", "vo": "AI tools had the same problem. Every app needed its own connection.", "ost": "Every app: its own cable", "vis": "AI icon with tangled lines to app icons."}, {"t": "7.5-12.5", "vo": "MCP fixes it, like USB did. One standard plug.", "ost": "MCP = USB for AI", "vis": "Asif holds up one USB cable; the tangle snaps into a neat hub."}, {"t": "12.5-17.5", "vo": "It stands for Model Context Protocol. Apps share their tools through it.", "ost": "Model Context Protocol", "vis": "Hub diagram with app icons around it."}, {"t": "17.5-22.5", "vo": "Any app that speaks MCP can give an AI assistant its tools.", "ost": "Apps share tools with AI", "vis": "Tool icons slide into the AI icon."}, {"t": "22.5-27.5", "vo": "Here's why I care: n8n now has an MCP server.", "ost": "n8n has an MCP server", "vis": "n8n MCP settings screen (own instance, no URLs)."}, {"t": "27.5-33", "vo": "So my AI assistant can build or edit workflows directly in n8n.", "ost": "AI builds the workflow", "vis": "Screen recording: assistant creates a workflow; canvas appears."}, {"t": "33-38", "vo": "I still review every node before it runs. AI builds, I check.", "ost": "AI builds · I check", "vis": "Asif reviewing nodes."}, {"t": "38-42.5", "vo": "It works in every n8n edition, even the free self-hosted one.", "ost": "All editions · incl. self-hosted", "vis": "Card."}, {"t": "42.5-46", "vo": "Follow for more Explain It Simply.", "ost": "Follow", "vis": "End card."}], "caption": "Remember when every phone needed a different charger? MCP is the USB fix for AI tools.\n\nBefore USB, every device needed its own cable. AI tools had the same problem: every app needed a custom connection. MCP (Model Context Protocol) is one standard plug, so any app that “speaks MCP” can give an AI assistant its tools.\n\nWhy I care: n8n now has a built-in MCP server. My AI assistant can create and edit n8n workflows directly, in every edition, including the free self-hosted one. I still review every node before it runs. AI builds, I check.\n\nFollow for more Explain It Simply.\n", "hashtags": ["MCP", "n8n", "AIagents"], "sources": ["n8n_mcp_blog", "n8n_release_2x"], "production_notes": "Record a real session where an AI assistant creates a small demo workflow through n8n's MCP server. Hide instance URL and tokens. Requires n8n 2.14+ (recommended 2.18.4+).", "day": 25, "slot": "R2", "time": "21:00", "slot_no": 4, "date": "2026-11-05", "spec": "Reel 9:16 · 1080×1920 · H.264 MP4 · 30 fps · AAC 48 kHz · safe box x65–1015 / y270–1250 · burned-in captions y1050–1250 · cover title inside centre 1080×1350", "post_no": 100, "caption_full": "Remember when every phone needed a different charger? MCP is the USB fix for AI tools.\n\nBefore USB, every device needed its own cable. AI tools had the same problem: every app needed a custom connection. MCP (Model Context Protocol) is one standard plug, so any app that “speaks MCP” can give an AI assistant its tools.\n\nWhy I care: n8n now has a built-in MCP server. My AI assistant can create and edit n8n workflows directly, in every edition, including the free self-hosted one. I still review every node before it runs. AI builds, I check.\n\nFollow for more Explain It Simply.\n\n#MCP #n8n #AIagents", "pillar_name": "Automation & n8n", "src": [{"t": "n8n's MCP server can now build workflows!", "u": "https://blog.n8n.io/n8n-mcp-server/", "p": "n8n Blog", "d": "2026", "v": false}, {"t": "Release notes 2.x", "u": "https://docs.n8n.io/changelog/release-notes-2.x", "p": "n8n Docs", "d": "2026", "v": true}], "wps": 2.26}, {"id": "D26-I1", "type": "image", "series": "Steal This Prompt", "pillar": "PA", "format": "Prompt card", "topic": "Stuck on an error? Paste this, not just the error", "human_problem": "Pasting an error into AI and getting ten random fixes that don't work.", "objective": "Saves; universal troubleshooting", "hook": "Stuck on an error? Paste this, not just the error", "main_idea": "Error text + what you did + what you expected + what you tried gets a far better fix than the error alone.", "takeaway": "Give AI the error, what you did, what you expected and what you tried, and ask for one fix first.", "value": "A troubleshooting prompt template that works for any software.", "cta": "Save it.", "cta_type": "save", "visual_concept": "Red error dialog icon + four-part template card.", "design": {"headline": "Stuck on an error? Paste this, not just the error", "body": ["“Here's the error: [exact text or screenshot].", "What I was doing: [steps].", "What I expected: [result].", "What I already tried: [list].", "Explain the cause simply, then give me one fix to try first.”"], "footer": "Works for Excel, WordPress, phones, printers and n8n.", "layout": "Light background. Red error-dialog icon top-left. Template as a quote block with bracketed fields in accent colour. Footer bottom."}, "caption": "Pasting only the error message gets you a list of 10 random fixes. Paste this instead:\n\n“Here's the error: [exact text or screenshot].\nWhat I was doing: [steps].\nWhat I expected: [result].\nWhat I already tried: [list].\nExplain the cause in simple words, then give me ONE fix to try first.”\n\n“One fix first” is the key. You test, report back, and it narrows down.\n\nWorks for Excel, WordPress, phones, printers and n8n.\n", "hashtags": ["techtips", "AItips", "troubleshooting"], "sources": [], "production_notes": "Prompt-card template.", "day": 26, "slot": "I1", "time": "09:30", "slot_no": 1, "date": "2026-11-06", "spec": "Feed image 4:5 · 1440×1800 PNG (sRGB) · text ≥90 px from edges · headline ≥88 px, body ≥44 px · ≤75 words on image", "post_no": 101, "caption_full": "Pasting only the error message gets you a list of 10 random fixes. Paste this instead:\n\n“Here's the error: [exact text or screenshot].\nWhat I was doing: [steps].\nWhat I expected: [result].\nWhat I already tried: [list].\nExplain the cause in simple words, then give me ONE fix to try first.”\n\n“One fix first” is the key. You test, report back, and it narrows down.\n\nWorks for Excel, WordPress, phones, printers and n8n.\n\n#techtips #AItips #troubleshooting", "pillar_name": "Practical AI", "src": [], "wps": null}, {"id": "D26-R1", "type": "reel", "series": "Steal This Prompt", "pillar": "WF", "format": "Talking head + screen split", "topic": "The 10-minute Friday review with AI", "human_problem": "Feeling busy all week but being unable to say what actually got done.", "objective": "Habit content; saves", "hook": "Busy all week. Finished what, exactly?", "open_loop": "Which four questions make the week clear?", "main_idea": "Paste done/not done/calendar, ask four questions (finished, slipping, stop, top 3), then choose one repeated task to automate, delegate or delete.", "takeaway": "Spend ten minutes each Friday asking AI what you finished, what keeps slipping, what to stop and your top three.", "value": "A weekly review ritual that ties back to the page's first post (automate/delegate/delete).", "payoff": "7.5–32.5 s: finished, slipping, stop and top three, then one task to automate, delegate or delete.", "cta": "Ask what keeps slipping for viewers every week.", "cta_type": "question", "visual_concept": "Friday evening tea + laptop; AI answers to four questions; callback to the Day 1 decision tree.", "runtime": 40, "retention": {"hook": "Hits the uncomfortable gap between feeling busy and having finished something.", "relatability": "Tasks that 'keep slipping' are universal; Asif admits his own.", "usefulness": "Four questions and a decision rule, reusable every week.", "payoff": "The personal admission ('mine was invoices') connects to a fix shown earlier on the page.", "rewatch": "Returning viewers recognise the Day 1 decision tree callback."}, "script": [{"t": "0-3", "vo": "Busy all week. Finished what, exactly?", "ost": "Busy… finished what?", "vis": "Asif with tea and laptop."}, {"t": "3-7.5", "vo": "Paste what you finished, what you didn't, and next week's calendar.", "ost": "Paste: done · not done · calendar", "vis": "Pasting lists."}, {"t": "7.5-12", "vo": "Then ask four questions. One: what did I actually finish?", "ost": "1 · What did I finish?", "vis": "Answer appears."}, {"t": "12-17", "vo": "Two: what keeps slipping, and why?", "ost": "2 · What keeps slipping?", "vis": "A repeated item highlighted."}, {"t": "17-22", "vo": "This one hurts. Mine was invoices, every single week.", "ost": "Mine: invoices", "vis": "Asif laughs."}, {"t": "22-27", "vo": "Three: what should I stop doing? Four: my top three for next week.", "ost": "3 · Stop · 4 · Top 3", "vis": "Answers appear."}, {"t": "27-32.5", "vo": "Then pick one repeated task, and decide: automate, delegate, or delete.", "ost": "Automate · delegate · delete", "vis": "Day 1 decision tree graphic."}, {"t": "32.5-37", "vo": "Small review, every week. It adds up.", "ost": "Every Friday", "vis": "Asif to camera."}, {"t": "37-40", "vo": "What keeps slipping for you?", "ost": "What slips for you?", "vis": "End card."}], "caption": "Busy all week, but can't say what you actually finished? 10 minutes every Friday fixes that.\n\nPaste: what you finished, what you didn't, and next week's calendar. Then ask:\n1. “What did I actually finish?”\n2. “What keeps slipping, and why?”\n3. “What should I stop doing?”\n4. “What are my top 3 for next week?”\n\nThen pick one repeated task and decide: automate, delegate or delete.\n\n(Mine kept slipping on invoices. So I automated them.)\n\nWhat keeps slipping for you every week?\n", "hashtags": ["productivity", "weeklyreview", "AItips"], "sources": [], "production_notes": "Use your real 'what keeps slipping' answer; replace 'invoices' with yours if different (and adjust the caption line).", "day": 26, "slot": "R1", "time": "13:30", "slot_no": 2, "date": "2026-11-06", "spec": "Reel 9:16 · 1080×1920 · H.264 MP4 · 30 fps · AAC 48 kHz · safe box x65–1015 / y270–1250 · burned-in captions y1050–1250 · cover title inside centre 1080×1350", "post_no": 102, "caption_full": "Busy all week, but can't say what you actually finished? 10 minutes every Friday fixes that.\n\nPaste: what you finished, what you didn't, and next week's calendar. Then ask:\n1. “What did I actually finish?”\n2. “What keeps slipping, and why?”\n3. “What should I stop doing?”\n4. “What are my top 3 for next week?”\n\nThen pick one repeated task and decide: automate, delegate or delete.\n\n(Mine kept slipping on invoices. So I automated them.)\n\nWhat keeps slipping for you every week?\n\n#productivity #weeklyreview #AItips", "pillar_name": "Workflows & productivity", "src": [], "wps": 1.95}, {"id": "D26-I2", "type": "image", "series": "Work With Me", "pillar": "SVC", "format": "Checklist", "topic": "5 mistakes I see in DIY automations", "human_problem": "DIY automations that quietly fail, duplicate data or let AI make risky changes.", "objective": "Authority + lead generation from DIY builders", "hook": "5 mistakes I see in DIY automations", "main_idea": "No alerts, testing on customers, giant workflows, no duplicate checks and unsupervised AI money decisions cause most DIY failures.", "takeaway": "Add error alerts, test with fake data, split big workflows, check for duplicates and keep humans on money decisions.", "value": "A practical audit list for anyone who built their own automation.", "cta": "Ask which mistake is in the viewer's workflow right now.", "cta_type": "question", "visual_concept": "Five red warning rows with small illustrations.", "design": {"headline": "5 mistakes I see in DIY automations", "body": ["No error alert: it fails quietly for days.", "Testing on real customers.", "One giant workflow doing ten jobs. Hard to fix.", "No duplicate check: orders counted twice.", "AI allowed to change prices or send refunds alone."], "footer": "Built it yourself? Fix these first.", "layout": "Dark background. Five rows each with a red warning icon and a tiny illustration. Footer as a short bold line at the bottom."}, "caption": "Built your own automation? Check for these 5 mistakes:\n\n1. No error alert: it fails quietly for days\n2. Testing on real customers instead of fake data\n3. One giant workflow doing ten jobs, so it's hard to fix\n4. No duplicate check, so orders or rows get counted twice\n5. AI allowed to change prices or send refunds without a human\n\nFix these first and most problems disappear.\n\nWhich of these is in your workflow right now?\n", "hashtags": ["n8n", "automation", "nocode"], "sources": [], "production_notes": "Warning-list template. 'Mistakes I see' should reflect Asif's real experience; edit any item you haven't seen.", "day": 26, "slot": "I2", "time": "18:30", "slot_no": 3, "date": "2026-11-06", "spec": "Feed image 4:5 · 1440×1800 PNG (sRGB) · text ≥90 px from edges · headline ≥88 px, body ≥44 px · ≤75 words on image", "post_no": 103, "caption_full": "Built your own automation? Check for these 5 mistakes:\n\n1. No error alert: it fails quietly for days\n2. Testing on real customers instead of fake data\n3. One giant workflow doing ten jobs, so it's hard to fix\n4. No duplicate check, so orders or rows get counted twice\n5. AI allowed to change prices or send refunds without a human\n\nFix these first and most problems disappear.\n\nWhich of these is in your workflow right now?\n\n#n8n #automation #nocode", "pillar_name": "Work with me (n8n services)", "src": [], "wps": null}, {"id": "D26-R2", "type": "reel", "series": "Work With Me", "pillar": "SVC", "format": "Talking head + b-roll", "topic": "What I need from you to automate your business (just 4 things)", "human_problem": "Owners assume they need technical knowledge or perfect documentation before asking for automation.", "objective": "Lower the barrier to enquiring; Messenger leads", "hook": "Not technical? I just need four things.", "open_loop": "What are the four things?", "main_idea": "A voice-note description, a screen recording, app names (not passwords) and 3–5 examples including a weird one are enough to start.", "takeaway": "To start an automation, share the task in your words, a screen recording, the app names and a few real examples.", "value": "Makes the first step concrete and easy; reassures non-technical owners.", "payoff": "3–34 s: a voice note, a screen recording, the app names and real examples, including a weird one.", "cta": "Message 'AUTOMATE' and send the voice note first.", "cta_type": "message", "visual_concept": "Talking head with four icons appearing (voice note, phone recording, app icons, example cards).", "runtime": 45, "retention": {"hook": "Removes the biggest fear (not being technical) in the first sentence.", "relatability": "Owners worry they need to be technical or prepared; this removes that.", "usefulness": "Clear, doable preparation steps.", "novelty": "Asking for a screen recording and a 'weird' example is unusual and shows expertise.", "payoff": "Ends with a single easy action: send a voice note."}, "script": [{"t": "0-3", "vo": "Not technical? I just need four things.", "ost": "Not technical? 4 things.", "vis": "Asif to camera."}, {"t": "3-8", "vo": "One: the task in your own words. A voice note is fine.", "ost": "1 · The task, in your words", "vis": "Voice-note icon."}, {"t": "8-13.5", "vo": "Two: a screen recording of you doing it once. Your phone is enough.", "ost": "2 · Record yourself doing it", "vis": "Phone screen-recording icon."}, {"t": "13.5-18.5", "vo": "That recording shows me steps you'd never think to mention.", "ost": "Shows hidden steps", "vis": "B-roll of a screen recording with a step highlighted."}, {"t": "18.5-23.5", "vo": "Three: which apps are involved. Not passwords yet. Just the names.", "ost": "3 · App names (no passwords)", "vis": "App icons."}, {"t": "23.5-29", "vo": "Four: three to five real examples, including one weird one.", "ost": "4 · 3–5 examples + 1 weird", "vis": "Example cards fan out."}, {"t": "29-34", "vo": "The weird one dly.”"], "footer": "Always check facts and answers before using them in class.", "layout": "Dark green chalkboard-style background with white text. Three framed prompt sections. Footer at bottom in chalk style."}, "caption": "Teachers and tutors: 3 prompts that save real time.\n\nLesson plan: “Plan a 40-minute class on [topic] for [class/grade]. Include one activity and 3 questions to check understanding.”\nPractice set: “Make 10 questions on [topic], from easy to hard. Put the answers in a separate list.”\nFeedback: “Here's a student's answer: [paste]. Give 2 specific strengths and 1 next step, in a kind tone.”\n\nAlways check facts and answers before using them in class.\n\nTeachers and tutors: which of these would save you the most time?\n", "hashtags": ["teachers", "education", "AItips"], "sources": [], "production_notes": "Chalkboard variant of the prompt-card template. Remove student names before using real answers.", "day": 28, "slot": "I1", "time": "09:30", "slot_no": 1, "date": "2026-11-08", "spec": "Feed image 4:5 · 1440×1800 PNG (sRGB) · text ≥90 px from edges · headline ≥88 px, body ≥44 px · ≤75 words on image", "post_no": 109, "caption_full": "Teachers and tutors: 3 prompts that save real time.\n\nLesson plan: “Plan a 40-minute class on [topic] for [class/grade]. Include one activity and 3 questions to check understanding.”\nPractice set: “Make 10 questions on [topic], from easy to hard. Put the answers in a separate list.”\nFeedback: “Here's a student's answer: [paste]. Give 2 specific strengths and 1 next step, in a kind tone.”\n\nAlways check facts and answers before using them in class.\n\nTeachers and tutors: which of these would save you the most time?\n\n#teachers #education #AItips", "pillar_name": "Practical AI", "src": [], "wps": null}, {"id": "D28-R1", "type": "reel", "series": "Before → After", "pillar": "PA", "format": "Before/after split screen", "topic": "Make AI grade its own answer against your checklist", "human_problem": "AI drafts th ent) + a payment log that updates itself\n\nStart with one: the one that annoys you most.\n\nDon't see your business? Message me “AUTOMATE” with what you do, and I'll tell you your first automation.\n", "hashtags": ["n8n", "automation", "smallbusiness"], "sources": [], "production_notes": "Four-tile flip template. Reminders to parents by WhatsApp need approved templates (see D27-R1); mention consent.", "day": 28, "slot": "R2", "time": "21:00", "slot_no": 4, "date": "2026-11-08", "spec": "Reel 9:16 · 1080×1920 · H.264 MP4 · 30 fps · AAC 48 kHz · safe box x65–1015 / y270–1250 · burned-in captions y1050–1250 · cover title inside centre 1080×1350", "post_no": 112, "caption_full": "Not sure what to automate first? It depends on your business. Where I'd start:\n\n🛍 Online shop: Messenger orders straight into a Google Sheet + an automatic confirmation\n☕ Restaurant or café: tonight's sales and low-stock items sent to your phone\n🏠 Property agent: every new lead gets a reply in seconds, and you get a call task\n📚 Coaching centre: fee reminders to parents (with their consent) + a payment log that updates itself\n\nStart with one: the one that annoys you most.\n\nDon't see your business? Message me “AUTOMATE” with what you do, and I'll tell you your first automation.\n\n#n8n #automation #smallbusiness", "pillar_name": "Work with me (n8n services)", "src": [], "wps": 2.11}, {"id": "D29-I1", "type": "image", "series": "Steal This Prompt", "pillar": "WF", "format": "Annotated example", "topic": "Ask your sales sheet these 4 questions with AI", "human_problem": "Having months of sales data and never looking at what it says.", "objective": "Saves among sellers and managers", "hook": "Ask your sales sheet these 4 questions with AI", "main_idea": "Top products, best days, lapsed customers and hidden patterns turn a sales sheet into decisions.", "takeaway": "Ask AI four questions about your sales sheet to find top products, best days, lapsed customers and patterns.", "value": "Four analysis prompts + privacy and verification rules.", "cta": "Save it for month-end.", "cta_type": "save", "visual_concept": "A small sales sheet with four numbered callouts pointing at the answers each question finds.", "design": {"headline": "Ask your sales sheet these 4 questions with AI", "body": ["“Which 5 products sold most this month, and which dropped?”", "“Which day of the week brings the most orders?”", "“Which customers ordered before but not in 60 days?”", "“What's one pattern I'm missing?”"], "footer": "Upload a copy without phone numbers. Check any number that matters.", "layout": "Light background. Mini spreadsheet (fictional data) in the top half with four numbered callout bubbles; the four questions below, matched by number. Footer bottom."}, "caption": "Your sales sheet already knows things you don't. Upload a copy (without phone numbers) and ask:\n\n1. “Which 5 products sold most this month, and which dropped?”\n2. “Which day of the week brings the most orders?”\n3. “Which customers ordered before but not in the last 60 days?”\n4. “What's one pattern I'm missing?”\n\nQuestion 3 is a ready-made list for a “we miss you” offer.\n\nDouble-check any number before you make a decision on it. Try it at month-end.\n", "hashtags": ["smallbusiness", "data", "AItips"], "sources": [], "production_notes": "Prompt-card template.", "day": 29, "slot": "I1", "time": "09:30", "slot_no": 1, "date": "2026-11-09", "spec": "Feed image 4:5 · 1440×1800 PNG (sRGB) · text ≥90 px from edges · headline ≥88 px, body ≥44 px · ≤75 words on image", "post_no": 113, "caption_full": "Your sales sheet already knows things you don't. Upload a copy (without phone numbers) and ask:\n\n1. “Which 5 products sold most this month, and which dropped?”\n2. “Which day of the week brings the most orders?”\n3. “Which customers ordered before but not in the last 60 days?”\n4. “What's one pattern I'm missing?”\n\nQuestion 3 is a ready-made list for a “we miss you” offer.\n\nDouble-check any number before you make a decision on it. Try it at month-end.\n\n#smallbusiness #data #AItips", "pillar_name": "Workflows & productivity", "src": [], "wps": null}, {"id": "D29-R1", "type": "reel", "series": "Explain It Simply", "pillar": "WF", "format": "Text-led Reel", "topic": "Pick the right AI tool for the job: a 5-card map", "human_problem": "Getting frustrated with AI because you're using a chatbot for a job it isn't built for.", "objective": "Saves; reduces frustration; bridges to automation", "hook": "Frustrated with AI? Maybe it's the wrong tool.", "open_loop": "Which tool fits which job?", "main_idea": "Chat for drafting, search-on for recent facts, notebooks for your documents, camera/voice for real-world things, automation for recurring jobs.", "takeaway": "Match the job to the tool: chat to draft, search for recent facts, notebooks for your files, automation for repeated work.", "value": "A clear map that matches tasks to tool types.", "payoff": "3–30 s: five jobs matched to five tool types; 35–40 s: chat answers once, automation keeps working.", "cta": "Save the map.", "cta_type": "save", "visual_concept": "Text-led: five kinetic text cards dealt one by one with icons on a plain background; Asif's voice from frame 1; a short face shot at the end.", "runtime": 44, "retention": {"hook": "Validates a common frustration and offers a less obvious explanation (wrong tool, not 'bad AI').", "visual_progression": "A new card every ~5 seconds builds a full map on screen.", "usefulness": "Viewers can immediately pick a better tool for their next task.", "payoff": "The 'chat answers once, automation keeps working' line ties it together.", "save_share": "A reference map people save and revisit."}, "script": [{"t": "0-3", "vo": "Frustrated with AI? Maybe it's the wrong tool.", "ost": "Wrong tool?", "vis": "Text-led: 'AI can't do this?!' types out, then cracks; voice only."}, {"t": "3-8", "vo": "Drafting, rewriting, brainstorming? A normal AI chat is perfect.", "ost": "Draft head", "topic": "Auto-reply to comments in Messenger: the rules you must know", "human_problem": "Answering the same 'price?' comment by hand, again and again.", "objective": "Authority; prevents policy mistakes; leads", "hook": "Hundreds of “price?” comments. Replying one by one?", "open_loop": "Can I automate this without breaking Facebook's rules?", "main_idea": "A Page can send one private reply per comment within 7 days; a reply opens a 24-hour window; comment-bait is demoted.", "takeaway": "A Page can send one private reply per comment within seven days, so make that first message genuinely useful.", "value": "Platform rules for comment-to-Messenger automation and how to make the one message count.", "payoff": "8–33.5 s: one private reply per comment, within 7 days, a 24-hour window if they reply, and no comment-bait.", "cta": "Soft service line in the caption only.", "cta_type": "soft", "visual_concept": "Comment 'Price?' → private reply in Messenger; three rule cards; red 'comment-bait' card; n8n canvas.", "runtime": 45, "retention": {"hook": "Starts with the repetitive chore page owners face daily before introducing the rules.", "novelty": "Most viewers don't know the one-message, 7-day limit.", "usefulness": "Three rules + how to write the one message that matters.", "problem_solution": "Shows the risk (bait, rule breaks) and the compliant approach.", "relatability": "'Price?' comments under posts are everywhere on Bangladeshi pages."}, "script": [{"t": "0-3", "vo": "Hundreds of “price?” comments. Replying one by one?", "ost": "Replying one by one?", "vis": "A post with dozens of 'price?' comments scrolling; Asif replying to them one by one."}, {"t": "3-8", "vo": "Someone comments “price?” on your post. Your Page can reply privately in Messenger.", "ost": "Private reply ✓", "vis": "Comment → private reply animation."}, {"t": "8-12.5", "vo": "Rule one: one private message per comment.", "ost": "1 · ONE message per comment", "vis": "Rule card 1."}, {"t": "12.5-17", "vo": "Rule two: within seven days of the comment.", "ost": "2 · Within 7 days", "vis": "Calendar card."}, {"t": "17-22.5", "vo": "Rule three: if they reply, you can keep chatting for twenty-four hours.", "ost": "3 · They reply → 24-hour window", "vis": "Timer card."}, {"t": "22.5-28", "vo": "So the first message has to be useful. Price, link, and one question back.", "ost": "Make message #1 count", "vis": "Example message."}, {"t": "28-33.5", "vo": "And don't ask people to comment just to boost reach. Facebook demotes that.", "ost": "Comment-bait gets demoted", "vis": "Red card."}, {"t": "33.5-38.5", "vo": "I build this in n8n with the official Messenger API, inside these rules.", "ost": "Official API · inside the rules", "vis": "Canvas (node names only)."}, {"t": "38.5-42.5", "vo": "Inside these rules, it's a real time-saver.", "ost": "Inside the rules", "vis": "Asif to camera."}, {"t": "42.5-45", "vo": "Follow for more.", "ost": "Follow", "vis": "End card."}], "caption": "Hundreds of “price?” comments, and you reply to each one by hand? You can automate it, but know Meta's rules first:\n\n1. One private reply per comment\n2. It must be sent within 7 days of the comment\n3. If they reply, a 24-hour window opens and you can keep chatting\n\nSo make the first message count: the price, a link, and one question back.\n\nAnd don't ask people to comment just to boost reach. Facebook demotes engagement bait.\n\nI build comment replies in n8n with the official Messenger API, inside these rules. If your page needs one, send me a message.\n", "hashtags": ["MessengerAutomation", "n8n", "FacebookTips"], "sources": ["meta_private_replies", "meta_engagement_bait"], "production_notes": "Re-check the Messenger Platform policy page before posting (rules can change). Demo on a test Page.", "day": 29, "slot": "R2", "time": "21:00", "slot_no": 4, "date": "2026-11-09", "spec": "Reel 9:16 · 1080×1920 · H.264 MP4 · 30 fps · AAC 48 kHz · safe box x65–1015 / y270–1250 · burned-in
