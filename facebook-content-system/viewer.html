Better product photos with AI, without lying to customers", "human_problem": "Good products look cheap in phone photos taken at home.", "objective": "Saves + shares among F-commerce sellers", "hook": "Looks great in hand. Cheap in photos?", "open_loop": "Can AI make it look better without changing the product?", "main_idea": "Ask AI to change only background and light, keep the product identical, verify details, and post one untouched photo too.", "takeaway": "Ask AI to change only the background and light, then check the label, colour and edges at full zoom.", "value": "An edit prompt that protects product accuracy + a 3-point check (label, colour, edges).", "payoff": "17–37 s: a clean result, a zoomed check of label and colour, and one untouched photo posted too.", "cta": "Save the prompt.", "cta_type": "save", "visual_concept": "Split: phone photo of a mug on a messy table → clean studio-style shot; zoomed comparison of the label.", "runtime": 42, "retention": {"hook": "Every seller knows the gap between how a product looks in hand and in a phone photo.", "relatability": "Most Facebook sellers shoot products on phones in home light.", "visual_progression": "Clear before → after reveal, then a zoomed side-by-side check.", "payoff": "A clean, sellable photo that still shows the real product.", "usefulness": "Exact prompt + a 3-point verification habit.", "save_share": "Sellers forward this to partners and staff who post products."}, "script": [{"t": "0-3", "vo": "Looks great in hand. Cheap in photos?", "ost": "Great in hand. Cheap in photos?", "vis": "Split screen: messy phone photo of a mug (left) → clean studio shot (right)."}, {"t": "3-7", "vo": "Here's a normal phone photo. Messy table, yellow light.", "ost": "Before: messy + yellow", "vis": "Zoom on the before photo."}, {"t": "7-12.5", "vo": "I upload it and say: keep the product exactly the same. Shape, colour, label, size.", "ost": "Keep the product EXACTLY the same", "vis": "Screen: prompt typed in ChatGPT or Gemini image editing."}, {"t": "12.5-17", "vo": "Only change the background and the light.", "ost": "Change only: background + light", "vis": "Prompt continues."}, {"t": "17-21.5", "vo": "Here's the result. Now the most important step.", "ost": "After", "vis": "Result reveal with a soft flash."}, {"t": "21.5-27", "vo": "Zoom in. Compare the label, the colour, the edges. AI sometimes changes small details.", "ost": "Check: label · colour · edges", "vis": "Side-by-side zoom on the label; any changed detail circled."}, {"t": "27-32", "vo": "If the product changed, don't use it. Customers notice.", "ost": "Product changed? Don't post it", "vis": "Red X over a version with an altered label."}, {"t": "32-37", "vo": "And post one untouched photo too. Clean, but honest.", "ost": "Post 1 real photo too", "vis": "Post mock: edited photo + original photo side by side."}, {"t": "37-42", "vo": "Clean photos, real product. That's the rule.", "ost": "Clean photo · real product", "vis": "End card."}], "caption": "Looks great in your hand, cheap in your photos? Fix it with AI, without misleading customers.\n\nPrompt (works in ChatGPT or Gemini image editing):\n“Keep the product exactly the same: shape, colour, label, size and texture. Only replace the background with a plain light-grey studio background and soft natural shadow. Fix the lighting to neutral daylight.”\n\nThen check 3 things at full zoom: label text, colour, edges. AI sometimes changes small details. If the product changed, don't use it.\n\nAnd post one untouched photo too. Clean, but honest.\n\nTry it on your next product, and post the untouched photo too.\n", "hashtags": ["fcommerce", "productphotography", "AItips"], "sources": ["openai_images25"], "production_notes": "Use a real product you own (mug, bag). Generate the edit live and show the genuine result, including any detail it got wrong. That honesty is the point of the Reel. Don't fabricate a perfect result.", "day": 12, "slot": "R1", "time": "13:30", "slot_no": 2, "date": "2026-10-23", "spec": "Reel 9:16 · 1080×1920 · H.264 MP4 · 30 fps · AAC 48 kHz · safe box x65–1015 / y270–1250 · burned-in captions y1050–1250 · cover title inside centre 1080×1350", "post_no": 46, "caption_full": "Looks great in your hand, cheap in your photos? Fix it with AI, without misleading customers.\n\nPrompt (works in ChatGPT or Gemini image editing):\n“Keep the product exactly the same: shape, colour, label, size and texture. Only replace the background with a plain light-grey studio background and soft natural shadow. Fix the lighting to neutral daylight.”\n\nThen check 3 things at full zoom: label text, colour, edges. AI sometimes changes small details. If the product changed, don't use it.\n\nAnd post one untouched photo too. Clean, but honest.\n\nTry it on your next product, and post the untouched photo too.\n\n#fcommerce #productphotography #AItips", "pillar_name": "Practical AI", "src": [{"t": "Introducing ChatGPT Images 2.5", "u": "https://openai.com/index/introducing-chatgpt-images-2-5/", "p": "OpenAI", "d": "2026-09-08", "v": true}], "wps": 2.02}, {"id": "D12-I2", "type": "image", "series": "What It Means For You", "pillar": "NEWS", "format": "News card", "topic": "Why creators put links in the comments now (Facebook link limit test)", "human_problem": "Posting links on your page and finding the feature limited.", "objective": "Useful platform insight for page owners; shares", "hook": "Why creators put links in the comments now", "main_idea": "Meta is testing a 2-link-posts-per-month limit for Pages without Meta Verified; links in comments aren't limited.", "takeaway": "Some Pages are limited to two link posts a month without a paid Meta plan, so put links in comments or Messenger.", "value": "What the test is, who it affects, and three practical workarounds.", "cta": "None. A practical instruction to check their own posting screen.", "cta_type": "none", "visual_concept": "A post mock with a link icon locked, arrow to a comment with the link.", "design": {"headline": "Why creators put links in the comments now", "body": ["Meta is testing a limit: 2 posts with links per month for Pages.", "It hits Pages and professional profiles without a paid Meta plan.", "Links in comments aren't limited.", "What to do: value first, link in the first comment, or “Message me”."], "footer": "It's a test. Not every Page has it yet. Check your own posting screen.", "layout": "Light background. Left: simple post mock with a padlocked link icon. Right: arrow to a comment bubble with a link. Rows below. Footer small."}, "caption": "Noticed creators saying “link in the comments”? Here's why.\n\nMeta has been testing a limit on link posts: Pages and professional profiles without a paid Meta subscription (Meta Verified, or the new Meta One) can share links in only 2 posts per month. Links in comments aren't limited.\n\nWhat I'd do if you run a page:\n• lead with value in the post itself\n• put the link in the first comment\n• or use “Message me” and send links in Messenger\n\nIt's a test, so not every Page has it. Check your own posting screen.\n\nIf you run a Facebook page, check your own posting screen this week.\n", "hashtags": ["FacebookTips", "socialmedia", "pagemanagement"], "sources": ["meta_link_limit", "meta_one"], "production_notes": "Re-check the test's status the day before posting. If Meta has ended or widened it, rewrite line 1 accordingly.", "day": 12, "slot": "I2", "time": "18:30", "slot_no": 3, "date": "2026-10-23", "spec": "Feed image 4:5 · 1440×1800 PNG (sRGB) · text ≥90 px from edges · headline ≥88 px, body ≥44 px · ≤75 words on image", "post_no": 47, "caption_full": "Noticed creators saying “link in the comments”? Here's why.\n\nMeta has been testing a limit on link posts: Pages and professional profiles without a paid Meta subscription (Meta Verified, or the new Meta One) can share links in only 2 posts per month. Links in comments aren't limited.\n\nWhat I'd do if you run a page:\n• lead with value in the post itself\n• put the link in the first comment\n• or use “Message me” and send links in Messenger\n\nIt's a test, so not every Page has it. Check your own posting screen.\n\nIf you run a Facebook page, check your own posting screen this week.\n\n#FacebookTips #socialmedia #pagemanagement", "pillar_name": "Current developments", "src": [{"t": "What Facebook's New Link Rules Mean for Your 2026 Strategy", "u": "https://www.socialmediaexaminer.com/what-facebooks-new-link-rules-mean-for-your-2026-strategy/", "p": "Social Media Examiner (test first confirmed to TechCrunch, Dec 2025)", "d": "2026", "v": true}, {"t": "Introducing Meta One: A Subscription Service With More Features and AI to Create, Connect, and Stand Out", "u": "https://about.fb.com/news/2026/09/introducing-meta-one-subscription-service-more-features-ai/", "p": "Meta Newsroom", "d": "2026-09", "v": true}], "wps": null}, {"id": "D12-R2", "type": "reel", "series": "Explain It Simply", "pillar": "AU", "format": "Diagram explainer + talking head", "topic": "What is an API? Think of a shop counter", "human_problem": "Hearing 'API' constantly and not knowing what it means for the tools you use.", "objective": "Authority; loop for rewatches", "hook": "An API is just a shop counter.", "open_loop": "How is software like a shop counter?", "main_idea": "An API is a counter with a fixed menu: your app asks for menu items with its key and gets a reply; off-menu requests get errors.", "takeaway": "An API is a fixed menu one app offers another, and the API key is the card that proves who's asking.", "value": "Explains API, endpoints and API keys with a local analogy, plus why keys must stay secret.", "payoff": "11–24 s: apps ask for 'menu items' with a key card; off-menu requests get errors.", "cta": "Ask which tech word to explain next.", "cta_type": "question", "visual_concept": "Illustrated shop counter with a menu board; two app icons exchanging a request and a reply; key card.", "loop": "Ends '…picture' over the counter; the opening line completes it: 'An API is a shop counter.'", "runtime": 30, "retention": {"hook": "An unexpected comparison between tech jargon and a familiar shop.", "curiosity": "Viewers wait to see how a counter maps to software.", "novelty": "A fresh analogy instead of the overused 'waiter' explanation.", "rewatch": "The ending loops into the opening line.", "usefulness": "Teaches the practical rule 'never share your API key'."}, "script": [{"t": "0-3", "vo": "An API is just a shop counter.", "ost": "API = shop counter", "vis": "Asif next to an illustrated shop counter."}, {"t": "3-7", "vo": "You don't walk into the warehouse. You ask at the counter.", "ost": "Don't enter the warehouse", "vis": "Closed warehouse door; customer at the counter window."}, {"t": "7-11", "vo": "And you can only ask for what's on the menu.", "ost": "Only what's on the menu", "vis": "Menu board lights up."}, {"t": "11-15.5", "vo": "Apps work the same. Your app asks Google Sheets: add this row.", "ost": "App → “add this row”", "vis": "Two app icons; request arrow travels."}, {"t": "15.5-19.5", "vo": "Sheets checks your card, your API key, and does it.", "ost": "API key = your member card", "vis": "Key card scan; green light."}, {"t": "19.5-24", "vo": "Ask for something not on the menu, and you get an error.", "ost": "Not on the menu → error", "vis": "Red error code bubble."}, {"t": "24-27", "vo": "So never share your key. It's your card.", "ost": "Never share your key", "vis": "Padlock on the key card."}, {"t": "27-30", "vo": "Next time someone says API, just picture…", "ost": "", "vis": "Back to the counter shot from frame 1 (loop)."}], "caption": "What is an API? Think of a shop counter.\n\nYou don't walk into the warehouse. You ask at the counter, and only for what's on the menu.\n\nApps work the same way: your app asks Google Sheets' “counter” to add a row. Sheets checks your card (your API key) and does it. Ask for something that's not on the menu → error.\n\nThat's also why you never share an API key. It's your card.\n\nWhich tech word should I explain next?\n", "hashtags": ["API", "automation", "n8n"], "sources": [], "production_notes": "Explain It Simply motion template; same palette as D04-R1 for series consistency. Last frame identical to the first.", "day": 12, "slot": "R2", "time": "21:00", "slot_no": 4, "date": "2026-10-23", "spec": "Reel 9:16 · 1080×1920 · H.264 MP4 · 30 fps · AAC 48 kHz · safe box x65–1015 / y270–1250 · burned-in captions y1050–1250 · cover title inside centre 1080×1350", "post_no": 48, "caption_full": "What is an API? Think of a shop counter.\n\nYou don't walk into the warehouse. You ask at the counter, and only for what's on the menu.\n\nApps work the same way: your app asks Google Sheets' “counter” to add a row. Sheets checks your card (your API key) and does it. Ask for something that's not on the menu → error.\n\nThat's also why you never share an API key. It's your card.\n\nWhich tech word should I explain next?\n\n#API #automation #n8n", "pillar_name": "Automation & n8n", "src": [], "wps": 2.57}, {"id": "D13-I1", "type": "image", "series": "Automate This", "pillar": "AU", "format": "Checklist", "topic": "Test your automation before customers do: 6 checks", "human_problem": "Launching an automation that breaks in front of real customers.", "objective": "Authority + saves among builders and buyers", "hook": "Test your automation before customers do", "main_idea": "Six tests catch most automation failures before they reach customers.", "takeaway": "Test with fake data, odd inputs, double runs and a broken login before customers ever touch it.", "value": "A practical testing checklist (fake data, edge cases, duplicates, broken login, output check, owner).", "cta": "Save it before your next launch.", "cta_type": "save", "visual_concept": "Checklist with six checkbox rows and small icons.", "design": {"headline": "Test your automation before customers do", "body": ["Run it with fake data first. Never with real customers.", "Try weird cases: empty field, Bangla name, emoji, very long text.", "Run it twice. Does it create duplicates?", "Break a login on purpose. Do you get an alert?", "Check the output where people see it: sheet, email, chat.", "Write down who fixes it when it breaks."], "layout": "Dark background. Headline top. Six checkbox rows with icons (flask, warning, copy, key, eye, person). No footer; series tag top-left."}, "caption": "Before any automation touches a real customer, I run these 6 tests:\n\n☐ Fake data first, never real customers\n☐ Weird cases: empty fields, Bangla names, emoji, very long text\n☐ Run it twice: does it create duplicates?\n☐ Break a login on purpose: does an alert arrive?\n☐ Check the output where people actually see it (the sheet, the email, the chat)\n☐ Write down who fixes it when it breaks\n\nMost problems show up in test 2 and test 3.\n\nSave this before your next launch.\n", "hashtags": ["automation", "n8n", "testing"], "sources": [], "production_notes": "Checklist template. 'Most problems show up in test 2 and 3' is Asif's experience-based opinion. Keep it only if true for you, otherwise delete that line.", "day": 13, "slot": "I1", "time": "09:30", "slot_no": 1, "date": "2026-10-24", "spec": "Feed image 4:5 · 1440×1800 PNG (sRGB) · text ≥90 px from edges · headline ≥88 px, body ≥44 px · ≤75 words on image", "post_no": 49, "caption_full": "Before any automation touches a real customer, I run these 6 tests:\n\n☐ Fake data first, never real customers\n☐ Weird cases: empty fields, Bangla names, emoji, very long text\n☐ Run it twice: does it create duplicates?\n☐ Break a login on purpose: does an alert arrive?\n☐ Check the output where people actually see it (the sheet, the email, the chat)\n☐ Write down who fixes it when it breaks\n\nMost problems show up in test 2 and test 3.\n\nSave this before your next launch.\n\n#automation #n8n #testing", "pillar_name": "Automation & n8n", "src": [], "wps": null}, {"id": "D13-R1", "type": "reel", "series": "Steal This Prompt", "pillar": "PA", "format": "Talking head + screen split", "topic": "Make AI your tutor, not your answer key", "human_problem": "Students copy AI answers, then freeze in exams where there is no AI.", "objective": "Shares among students and parents", "hook": "AI can do your homework. That's the problem.", "open_loop": "How do you use AI and still learn?", "main_idea": "Ask AI to give one hint at a time and ask you the next step, so you build understanding instead of copying answers.", "takeaway": "Ask AI for one hint at a time and make it ask you for the next step.", "value": "A tutor prompt that works in any AI tool + why it matters (no AI in exams).", "payoff": "11.5–32 s: the hint-by-hint tutor prompt in action.", "cta": "Send it to a student who copies AI answers.", "cta_type": "share", "visual_concept": "Student POV: full AI solution → tutor prompt → back-and-forth chat with hints.", "runtime": 36, "retention": {"hook": "Flips the usual 'AI helps homework' message into a problem, which is surprising and slightly provocative.", "relatability": "Students (and parents) recognise copying AI answers.", "problem_solution": "Shows the problem (no learning) then the exact fix prompt.", "usefulness": "One prompt, any subject, any AI tool.", "save_share": "Parents and teachers will forward this to students."}, "script": [{"t": "0-3", "vo": "AI can do your homework. That's the problem.", "ost": "That's the problem.", "vis": "Student POV: AI shows a full maths solution."}, {"t": "3-7", "vo": "You get the answer. Your brain gets nothing.", "ost": "Answer ✓ · Learning ✗", "vis": "Asif to camera."}, {"t": "7-11.5", "vo": "In the exam hall, there's no AI. So change the deal.", "ost": "No AI in the exam", "vis": "Illustration of an exam hall."}, {"t": "11.5-17.5", "vo": "Type: “Be my tutor. Don't give me the answer. Give me one hint at a time.”", "ost": "“One hint at a time.”", "vis": "Prompt typed."}, {"t": "17.5-21.5", "vo": "“Then ask what I think the next step is.”", "ost": "“Ask me the next step.”", "vis": "Prompt continues."}, {"t": "21.5-27.5", "vo": "Now it asks you. Stuck? It nudges. Wrong? It explains why.", "ost": "Stuck → hint · Wrong → why", "vis": "Chat exchange: hint, student answer, correction."}, {"t": "27.5-32", "vo": "Slower, yes. But this time, the answer is in your head.", "ost": "Answer in YOUR head", "vis": "Asif taps his head."}, {"t": "32-36", "vo": "Send this to a student who copies AI answers.", "ost": "Send to a student", "vis": "End card."}], "caption": "AI can do your homework. That's the problem. In the exam hall, there's no AI.\n\nChange the deal with one prompt:\n“Be my tutor. Don't give me the answer. Give me one hint at a time, then ask me what I think the next step is. If I'm wrong, explain why.”\n\nWorks for maths, physics, accounting, coding. Any subject, any AI app.\n\nSlower, yes. But the answer ends up in your head.\n\nSend this to a student who copies AI answers.\n", "hashtags": ["students", "studytips", "AItips"], "sources": [], "production_notes": "Use a simple algebra problem (e.g. 3x + 5 = 20). Record a real tutoring exchange; keep only the three clearest turns.", "day": 13, "slot": "R1", "time": "13:30", "slot_no": 2, "date": "2026-10-24", "spec": "Reel 9:16 · 1080×1920 · H.264 MP4 · 30 fps · AAC 48 kHz · safe box x65–1015 / y270–1250 · burned-in captions y1050–1250 · cover title inside centre 1080×1350", "post_no": 50, "caption_full": "AI can do your homework. That's the problem. In the exam hall, there's no AI.\n\nChange the deal with one prompt:\n“Be my tutor. Don't give me the answer. Give me one hint at a time, then ask me what I think the next step is. If I'm wrong, explain why.”\n\nWorks for maths, physics, accounting, coding. Any subject, any AI app.\n\nSlower, yes. But the answer ends up in your head.\n\nSend this to a student who copies AI answers.\n\n#students #studytips #AItips", "pillar_name": "Practical AI", "src": [], "wps": 2.31}, {"id": "D13-I2", "type": "image", "series": "Steal This Prompt", "pillar": "PA", "format": "Framework card", "topic": "The 5-part formula for AI image prompts", "human_problem": "Getting random, unusable AI images from short prompts.", "objective": "Saves among creators and sellers", "hook": "The 5-part formula for AI image prompts", "main_idea": "Subject, setting, light, style and shape make image prompts predictable.", "takeaway": "Describe subject, setting, light, style and shape, and change one part at a time.", "value": "A fill-in formula with a worked example and the right aspect ratio for Facebook.", "cta": "Save it.", "cta_type": "save", "visual_concept": "Five coloured blocks forming one prompt sentence, with a small example image you generate yourself (labelled if photorealistic).", "design": {"headline": "The 5-part formula for AI image prompts", "body": ["1. Subject: “a brown leather wallet”", "2. Setting: “on a wooden desk by a window”", "3. Light: “soft morning light”", "4. Style: “clean product photo” or “flat illustration”", "5. Shape: “4:5 portrait” for Facebook"], "footer": "Change one part at a time to see what it does.", "layout": "Light background. Five horizontal colour-coded blocks (one per part) that visually join into a single sentence strip at the bottom. Footer below."}, "caption": "Random AI images come from random prompts. Use 5 parts:\n\n1. Subject: what exactly? “a brown leather wallet”\n2. Setting: where? “on a wooden desk by a window”\n3. Light: “soft morning light”\n4. Style: “clean product photo” or “flat illustration”\n5. Shape: “4:5 portrait” (best for Facebook feed)\n\nPut together: “A brown leather wallet on a wooden desk by a window, soft morning light, clean product photo, 4:5 portrait.”\n\nChange one part at a time and you'll learn what each word does.\n", "hashtags": ["AIart", "AItips", "contentcreation"], "sources": [], "production_notes": "If you add an example image, generate it yourself and keep it non-photorealistic or clearly a product mock. If photorealistic, label 'AI-generated' on the image.", "day": 13, "slot": "I2", "time": "18:30", "slot_no": 3, "date": "2026-10-24", "spec": "Feed image 4:5 · 1440×1800 PNG (sRGB) · text ≥90 px from edges · headline ≥88 px, body ≥44 px · ≤75 words on image", "post_no": 51, "caption_full": "Random AI images come from random prompts. Use 5 parts:\n\n1. Subject: what exactly? “a brown leather wallet”\n2. Setting: where? “on a wooden desk by a window”\n3. Light: “soft morning light”\n4. Style: “clean product photo” or “flat illustration”\n5. Shape: “4:5 portrait” (best for Facebook feed)\n\nPut together: “A brown leather wallet on a wooden desk by a window, soft morning light, clean product photo, 4:5 portrait.”\n\nChange one part at a time and you'll learn what each word does.\n\n#AIart #AItips #contentcreation", "pillar_name": "Practical AI", "src": [], "wps": null}, {"id": "D13-R2", "type": "reel", "series": "Build Log", "pillar": "SVC", "format": "Screen demo + face cam", "topic": "Build log: Telegram → Google Drive backups that never duplicate", "human_problem": "Important files scattered in chat apps, hard to find and easy to lose.", "objective": "Proof of reliability engineering; Messenger leads", "hook": "Hundreds of files, buried in one chat.", "open_loop": "How do you move hundreds of files without duplicates or gaps?", "main_idea": "Two n8n workflows move files from Telegram to Drive, verify size + fingerprint, skip duplicates and resume after crashes.", "takeaway": "A reliable file automation verifies every copy, skips duplicates and remembers where it stopped.", "value": "Shows reliability concepts (verification, duplicate check, resume point) in plain words, which signals professional quality.", "payoff": "17–38.5 s: fingerprint check, duplicate skip and resume-after-crash, explained simply.", "cta": "Message 'AUTOMATE' and say where your files live.", "cta_type": "message", "visual_concept": "Telegram channel scroll (blurred) → Drive folders filling → canvas zooms on verify and duplicate nodes.", "runtime": 51, "retention": {"hook": "Starts from a familiar mess (files lost in a chat) before any technical detail.", "relatability": "Teams that share files on Telegram and lose track of them recognise the problem.", "visual_progression": "Drive folders fill while matching fingerprints animate side by side.", "novelty": "Concepts like file fingerprints and crash-safe resume are new to most viewers but explained simply.", "payoff": "Ends with the full system working: new files every 5 minutes, old files backfilled.", "problem_solution": "Clear problem (hundreds of files in chat) → a reliable solution."}, "script": [{"t": "0-3", "vo": "Hundreds of files, buried in one chat.", "ost": "Files buried in chat", "vis": "Endless scroll of a Telegram channel full of files (names blurred)."}, {"t": "3-7.5", "vo": "Our team sends design files to a Telegram channel every day.", "ost": "More files every day", "vis": "Scroll through the channel (file names blurred)."}, {"t": "7.5-12", "vo": "I built two n8n workflows to copy them all into Google Drive.", "ost": "2 workflows", "vis": "Both canvases side by side."}, {"t": "12-17", "vo": "The first checks for new files every five minutes.", "ost": "① New files · every 5 min", "vis": "Schedule trigger node."}, {"t": "17-22.5", "vo": "It downloads, uploads to Drive, then compares size and a digital fingerprint.", "ost": "Verify: size + fingerprint (MD5)", "vis": "Two matching hash strings animate side by side."}, {"t": "22.5-27.5", "vo": "Same fingerprint? Saved correctly. Different? It tries again.", "ost": "Match ✓ · No match ↻", "vis": "Green tick / retry arrow animation."}, {"t": "27.5-33", "vo": "Before any upload it asks: have I done this one already? If yes, skip.", "ost": "Done already? Skip.", "vis": "Lookup step highlighted."}, {"t": "33-38.5", "vo": "It also remembers where it stopped, so a crash doesn't restart everything.", "ost": "Crash-safe: remembers its place", "vis": "Bookmark icon on the message list."}, {"t": "38.5-43", "vo": "The second workflow slowly moves the old files, oldest first.", "ost": "② Old files · oldest first", "vis": "Second canvas; counter climbing."}, {"t": "43-48", "vo": "Files stuck somewhere like this? Send me a message.", "ost": "Message me", "vis": "Asif to camera."}, {"t": "48-51", "vo": "I'll tell you if it can be automated.", "ost": "Can it be automated?", "vis": "End card."}], "caption": "Important files buried in a Telegram chat? I built a backup in n8n that never copies the same file twice:\n\nOur team shares design files in a Telegram channel. Hundreds of them. Two workflows move them into Google Drive:\n\n① New files, every 5 minutes: download → upload to the right Drive folder → compare size + digital fingerprint (MD5). Match = saved correctly. No match = try again.\nBefore every upload: “Have I done this one already?” If yes, skip.\nIt remembers where it stopped, so a crash doesn't restart everything.\n\n② Old files: a second workflow works through the archive, oldest first.\n\nFiles stuck somewhere like this? Send me a message with where they live now (Telegram, WhatsApp, email), and I'll tell you if it can be automated.\n", "hashtags": ["n8n", "GoogleDrive", "automation"], "sources": [], "production_notes": "Film Asif's real 'TG→Drive ①/②' workflows. Blur channel name, file names, client names and folder names. Never show the setup/credentials workflow or API keys.", "day": 13, "slot": "R2", "time": "21:00", "slot_no": 4, "date": "2026-10-24", "spec": "Reel 9:16 · 1080×1920 · H.264 MP4 · 30 fps · AAC 48 kHz · safe box x65–1015 / y270–1250 · burned-in captions y1050–1250 · cover title inside centre 1080×1350", "post_no": 52, "caption_full": "Important files buried in a Telegram chat? I built a backup in n8n that never copies the same file twice:\n\nOur team shares design files in a Telegram channel. Hundreds of them. Two workflows move them into Google Drive:\n\n① New files, every 5 minutes: download → upload to the right Drive folder → compare size + digital fingerprint (MD5). Match = saved correctly. No match = try again.\nBefore every upload: “Have I done this one already?” If yes, skip.\nIt remembers where it stopped, so a crash doesn't restart everything.\n\n② Old files: a second workflow works through the archive, oldest first.\n\nFiles stuck somewhere like this? Send me a message with where they live now (Telegram, WhatsApp, email), and I'll tell you if it can be automated.\n\n#n8n #GoogleDrive #automation", "pillar_name": "Work with me (n8n services)", "src": [], "wps": 2.2}, {"id": "D14-I1", "type": "image", "series": "Steal This Prompt", "pillar": "WF", "format": "Timeline card", "topic": "Prepare for any meeting in 3 prompts", "human_problem": "Walking into meetings unprepared and getting caught off guard.", "objective": "Saves among professionals and freelancers", "hook": "Meeting in 5 minutes? Ask AI these 3 things", "main_idea": "Three prompts (decisions needed, likely questions, your 3 points) prepare you in minutes.", "takeaway": "Before a meeting, ask AI which decisions are needed, what you'll be asked and your three key points.", "value": "A short meeting-prep sequence.", "cta": "Save it.", "cta_type": "save", "visual_concept": "Countdown timeline from 5:00 to 0:00 with three stops, one per prompt.", "design": {"headline": "Meeting in 5 minutes? Ask AI these 3 things", "body": ["1. “Here's the agenda and last notes. What decisions are needed?”", "2. “What will the other side probably ask? Give me short answers.”", "3. “Write my 3 key points in under 60 words.”", "Bring the page, not the chat."], "footer": "Paste only what you're allowed to share.", "layout": "Light background. Horizontal countdown bar 5:00 → 0:00 with three stops; each stop holds one prompt. A small 'walk in' flag at 0:00 with the 'bring the page' line. Footer bottom."}, "caption": "5 minutes before a meeting, run these 3 prompts:\n\n1. “Here's the agenda and last meeting's notes: [paste]. What decisions are needed today?”\n2. “What will the other side probably ask? Give me short answers.”\n3. “Write my 3 key points in under 60 words.”\n\nThen write them on one page and close the chat. You'll sound prepared because you are.\n\nOnly paste what you're allowed to share. Try it before your next meeting.\n", "hashtags": ["productivity", "meetings", "AItips"], "sources": [], "production_notes": "Prompt-card template.", "day": 14, "slot": "I1", "time": "09:30", "slot_no": 1, "date": "2026-10-25", "spec": "Feed image 4:5 · 1440×1800 PNG (sRGB) · text ≥90 px from edges · headline ≥88 px, body ≥44 px · ≤75 words on image", "post_no": 53, "caption_full": "5 minutes before a meeting, run these 3 prompts:\n\n1. “Here's the agenda and last meeting's notes: [paste]. What decisions are needed today?”\n2. “What will the other side probably ask? Give me short answers.”\n3. “Write my 3 key points in under 60 words.”\n\nThen write them on one page and close the chat. You'll sound prepared because you are.\n\nOnly paste what you're allowed to share. Try it before your next meeting.\n\n#productivity #meetings #AItips", "pillar_name": "Workflows & productivity", "src": [], "wps": null}, {"id": "D14-R1", "type": "reel", "series": "AI Myth Check", "pillar": "LIT", "format": "Green screen + diagram", "topic": "Your AI might be living in the past (training cutoff)", "human_problem": "Using an AI answer about prices, rules or 'the latest' that is quietly out of date.", "objective": "Trust + shares; prevents a common mistake", "hook": "Today's price? AI might quote last year's.", "open_loop": "Why would AI give an old answer as if it's current?", "main_idea": "Models learn from data up to a cutoff; without web search they can state old information as current.", "takeaway": "For anything recent, turn on web search and only trust answers that show dated sources.", "value": "Two checks for time-sensitive questions: is search on, and are sources dated?", "payoff": "3–26.5 s: the training cutoff explained, then two checks (search on, dated sources).", "cta": "Ask if viewers have caught AI giving outdated information.", "cta_type": "question", "visual_concept": "Timeline with a 'cutoff' line; right side greyed; search toggle and dated sources.", "runtime": 30, "retention": {"hook": "A concrete, costly mistake (quoting an old price) that makes viewers question answers they already trusted.", "novelty": "Many users don't know AI models have a training cutoff.", "visual_progression": "A timeline animation with the cutoff line makes an invisible limit visible.", "usefulness": "Two quick checks viewers can apply to every time-sensitive answer.", "payoff": "Ends with a simple rule viewers can remember: no dates, no trust."}, "script": [{"t": "0-3", "vo": "Today's price? AI might quote last year's.", "ost": "Today's price? Last year's answer.", "vis": "Asif on green screen; behind him a chat answer quoting an outdated price as 'current'."}, {"t": "3-8", "vo": "Every AI model learns from data up to a certain date. Its cutoff.", "ost": "Training cutoff", "vis": "Timeline animation with a cutoff line."}, {"t": "8-12.5", "vo": "After that date, it knows nothing, unless it searches the web.", "ost": "After cutoff: blank", "vis": "Right side of the timeline greys out."}, {"t": "12.5-17", "vo": "Without search, it can confidently describe old prices as current.", "ost": "Old info, stated as current", "vis": "Example answer with an outdated price highlighted."}, {"t": "17-22", "vo": "So for news, prices, laws or ‘the latest’ anything, check two things.", "ost": "news · prices · laws · latest", "vis": "Four icons."}, {"t": "22-26.5", "vo": "Is web search on? And does the answer show sources with dates?", "ost": "Search on? Dated sources?", "vis": "Search toggle; source links with dates highlighted."}, {"t": "26.5-30", "vo": "No dates, no trust. Check before you quote it.", "ost": "No dates, no trust", "vis": "Asif to camera; a dated source link highlighted."}], "caption": "Ask AI for today's price and it might quote last year's.\n\nEvery AI model learns from data up to a cutoff date. After that, it knows nothing unless it searches the web, and without search it can describe old prices, laws or “the latest version” as if they're current.\n\nFor anything time-sensitive, check 2 things:\n1. Is web search on?\n2. Does the answer show sources with dates?\n\nNo dates, no trust.\n\nHave you caught AI giving you outdated information?\n", "hashtags": ["AIliteracy", "ChatGPT", "AItips"], "sources": [], "production_notes": "Generate a real outdated answer by asking a model with search off about a recent product; show it honestly. Don't single out one brand as 'bad'.", "day": 14, "slot": "R1", "time": "13:30", "slot_no": 2, "date": "2026-10-25", "spec": "Reel 9:16 · 1080×1920 · H.264 MP4 · 30 fps · AAC 48 kHz · safe box x65–1015 / y270–1250 · burned-in captions y1050–1250 · cover title inside centre 1080×1350", "post_no": 54, "caption_full": "Ask AI for today's price and it might quote last year's.\n\nEvery AI model learns from data up to a cutoff date. After that, it knows nothing unless it searches the web, and without search it can describe old prices, laws or “the latest version” as if they're current.\n\nFor anything time-sensitive, check 2 things:\n1. Is web search on?\n2. Does the answer show sources with dates?\n\nNo dates, no trust.\n\nHave you caught AI giving you outdated information?\n\n#AIliteracy #ChatGPT #AItips", "pillar_name": "AI literacy & safety", "src": [], "wps": 2.47}, {"id": "D14-I2", "type": "image", "series": "Explain It Simply", "pillar": "AU", "format": "Glossary card", "topic": "What's inside an AI agent: brain, instructions, memory, tools", "human_problem": "Hearing 'AI agent' everywhere without knowing what's inside one.", "objective": "Authority; prepares buyers for agent projects", "hook": "What's inside an AI agent (4 parts)", "main_idea": "An agent = model + instructions + memory + tools; fewer tools mean fewer mistakes.", "takeaway": "An AI agent is a model plus instructions, memory and tools, and fewer tools means fewer mistakes.", "value": "Plain-language anatomy that helps buyers scope agent projects.", "cta": "None. Ends with a practical question to ask anyone selling an 'AI agent'.", "cta_type": "none", "visual_concept": "Robot outline split into four labelled zones (head, notebook, chat bubble, toolbox).", "design": {"headline": "What's inside an AI agent (4 parts)", "body": ["Brain: the AI model that reads and decides.", "Instructions: the rules, written once (tone, limits, when to ask a human).", "Memory: what it remembers about this customer or task.", "Tools: what it may do. Read a sheet, send a message, book a slot."], "footer": "Fewer tools = fewer mistakes. Give an agent only what it needs.", "layout": "Dark background. Simple line-art agent figure in the centre with four callout lines to labelled boxes (brain/head, instructions/clipboard, memory/notebook, tools/toolbox). Footer bottom."}, "caption": "“AI agent” sounds complicated. Inside, it's 4 parts:\n\n🧠 Brain: the AI model that reads and decides\n📋 Instructions: the rules, written once (tone, limits, when to hand over to a human)\n🗂 Memory: what it remembers about this customer or task\n🧰 Tools: what it's allowed to do (read a sheet, send a message, book a slot)\n\nThe rule I build by: fewer tools = fewer mistakes. Give an agent only what it needs for the job.\n\nNext time someone sells you an “AI agent”, ask which tools it's allowed to use.\n", "hashtags": ["AIagents", "n8n", "automation"], "sources": [], "production_notes": "Glossary/diagram hybrid. The four parts mirror n8n's AI Agent node (model, system message, memory, tools); you can show a small n8n reference in the caption reply if asked.", "day": 14, "slot": "I2", "time": "18:30", "slot_no": 3, "date": "2026-10-25", "spec": "Feed image 4:5 · 1440×1800 PNG (sRGB) · text ≥90 px from edges · headline ≥88 px, body ≥44 px · ≤75 words on image", "post_no": 55, "caption_full": "“AI agent” sounds complicated. Inside, it's 4 parts:\n\n🧠 Brain: the AI model that reads and decides\n📋 Instructions: the rules, written once (tone, limits, when to hand over to a human)\n🗂 Memory: what it remembers about this customer or task\n🧰 Tools: what it's allowed to do (read a sheet, send a message, book a slot)\n\nThe rule I build by: fewer tools = fewer mistakes. Give an agent only what it needs for the job.\n\nNext time someone sells you an “AI agent”, ask which tools it's allowed to use.\n\n#AIagents #n8n #automation", "pillar_name": "Automation & n8n", "src": [], "wps": null}, {"id": "D14-R2", "type": "reel", "series": "Steal This Prompt", "pillar": "WF", "format": "Before/after split screen", "topic": "Freelance proposals: let AI read the job post, you write the opener", "human_problem": "Sending proposals that get ignored because they open like everyone else's.", "objective": "Saves + shares among freelancers", "hook": "Clients read two lines. Then decide.", "open_loop": "What should the first two lines say instead?", "main_idea": "Use AI to analyse the client's worries and words; write a 2-line opener yourself (their worry + your proof); let AI cut generic lines.", "takeaway": "Use AI to find the client's real worry, then open your proposal by naming it and showing proof.", "value": "A proposal method that avoids AI-sounding openers + three prompts.", "payoff": "18–34 s: the client's worry becomes line one; proof becomes line two.", "cta": "Ask for the worst proposal opener viewers have seen.", "cta_type": "question", "visual_concept": "Split screen: left = generic 'Dear Sir' proposal (crossed out), right = job-post analysis → typed two-line opener → AI edit suggestions; final full-width better proposal.", "runtime": 43, "retention": {"hook": "A hard truth in five words that every freelancer feels.", "relatability": "'Dear Sir, I am an expert' is a recognisable cliché for this audience.", "usefulness": "Three prompts that work on any job platform.", "problem_solution": "Shows the bad opener, the analysis and the better opener in sequence.", "save_share": "Freelancers share proposal tips in their groups."}, "script": [{"t": "0-2.5", "vo": "Clients read two lines. Then decide.", "ost": "2 lines. Then decide.", "vis": "Asif; a list of proposal previews behind him."}, {"t": "2.5-7", "vo": "Most proposals start with “Dear sir, I am an expert.” Skipped.", "ost": "“Dear Sir, I am expert…” ✗", "vis": "Generic opener struck through."}, {"t": "7-12.5", "vo": "Use AI to read the job post first, not to write your proposal.", "ost": "AI reads. You write.", "vis": "Job post pasted into AI."}, {"t": "12.5-18", "vo": "Ask: “What is this client worried about? Which words do they repeat?”", "ost": "Their worry · their words", "vis": "AI answer listing worries and repeated words."}, {"t": "18-23", "vo": "Here: they're worried about deadlines and past freelancers disappearing.", "ost": "Worry: deadlines · ghosting", "vis": "Two lines highlighted."}, {"t": "23-29", "vo": "So my first line names that worry. My second line shows proof I've solved it before.", "ost": "Line 1: their worry · Line 2: proof", "vis": "Typing the two-line opener."}, {"t": "29-34", "vo": "Then AI checks it: “Is anything here generic? Cut it.”", "ost": "“Cut anything generic.”", "vis": "AI suggestions with two cuts."}, {"t": "34-39", "vo": "End with one smart question about their project. It starts a conversation.", "ost": "End with 1 smart question", "vis": "Final proposal shown."}, {"t": "39-43", "vo": "Two lines. Their worry, your proof.", "ost": "Their worry · your proof", "vis": "End card."}], "caption": "Clients read the first two lines of your proposal, then decide.\n\nUse AI to read the job post, not to write your proposal:\n1. “What is this client worried about? Which words do they repeat? What's the real problem behind the task?”\n2. Write your opener yourself. Line 1: name their worry. Line 2: proof you've solved it before.\n3. “Is anything in my proposal generic? Cut it. Keep it under 120 words.”\n4. End with one smart question about their project.\n\nSkip “Dear Sir, I am an expert.” Every proposal says that.\n\nWhat's the worst proposal opener you've seen?\n", "hashtags": ["freelancing", "Upwork", "AItips"], "sources": [], "production_notes": "Use an invented job post (no real client). Write the opener live so viewers see a human writing it. Don't show any real platform account details.", "day": 14, "slot": "R2", "time": "21:00", "slot_no": 4, "date": "2026-10-25", "spec": "Reel 9:16 · 1080×1920 · H.264 MP4 · 30 fps · AAC 48 kHz · safe box x65–1015 / y270–1250 · burned-in captions y1050–1250 · cover title inside centre 1080×1350", "post_no": 56, "caption_full": "Clients read the first two lines of your proposal, then decide.\n\nUse AI to read the job post, not to write your proposal:\n1. “What is this client worried about? Which words do they repeat? What's the real problem behind the task?”\n2. Write your opener yourself. Line 1: name their worry. Line 2: proof you've solved it before.\n3. “Is anything in my proposal generic? Cut it. Keep it under 120 words.”\n4. End with one smart question about their project.\n\nSkip “Dear Sir, I am an expert.” Every proposal says that.\n\nWhat's the worst proposal opener you've seen?\n\n#freelancing #Upwork #AItips", "pillar_name": "Workflows & productivity", "src": [], "wps": 2.21}, {"id": "D15-I1", "type": "image", "series": "Steal This Prompt", "pillar": "PA", "format": "Prompt card", "topic": "Don't ask for a summary, ask for decisions", "human_problem": "Reading a long notice or letter and still not knowing what you're supposed to do.", "objective": "Saves; practical document reading", "hook": "Don't ask for a summary. Ask for decisions.", "main_idea": "Asking AI for decisions, deadlines, amounts and consequences turns any document into an action list.", "takeaway": "Ask AI for the decisions, deadlines and consequences in a document instead of a summary.", "value": "A 4-question document prompt that beats 'summarise this'.", "cta": "Save it for the next long document.", "cta_type": "save", "visual_concept": "Long document icon → four question chips → checklist.", "design": {"headline": "Don't ask for a summary. Ask for decisions.", "body": ["“Read this document: [paste].", "1. What decisions does it ask me to make?", "2. What are the deadlines and amounts?", "3. What happens if I do nothing?", "4. What should I ask before agreeing?”"], "footer": "A summary tells you what it says. This tells you what to do.", "layout": "Light background. Left: tall document icon with lines. Right: four numbered question chips. Footer band."}, "caption": "“Summarise this” gives you a shorter document. You still don't know what to do.\n\nAsk this instead:\n“Read this document: [paste].\n1. What decisions does it ask me to make?\n2. What are the deadlines and amounts?\n3. What happens if I do nothing?\n4. What should I ask before agreeing?”\n\nWorks for school notices, bank letters, client briefs and policy updates.\n\nUse it on the next bank letter, school notice or client brief that lands on you.\n", "hashtags": ["AItips", "productivity", "ChatGPT"], "sources": [], "production_notes": "Prompt-card template.", "day": 15, "slot": "I1", "time": "09:30", "slot_no": 1, "date": "2026-10-26", "spec": "Feed image 4:5 · 1440×1800 PNG (sRGB) · text ≥90 px from edges · headline ≥88 px, body ≥44 px · ≤75 words on image", "post_no": 57, "caption_full": "“Summarise this” gives you a shorter document. You still don't know what to do.\n\nAsk this instead:\n“Read this document: [paste].\n1. What decisions does it ask me to make?\n2. What are the deadlines and amounts?\n3. What happens if I do nothing?\n4. What should I ask before agreeing?”\n\nWorks for school notices, bank letters, client briefs and policy updates.\n\nUse it on the next bank letter, school notice or client brief that lands on you.\n\n#AItips #productivity #ChatGPT", "pillar_name": "Practical AI", "src": [], "wps": null}, {"id": "D15-R1", "type": "reel", "series": "Steal This Prompt", "pillar": "PA", "format": "Prop demo + screen inserts", "topic": "Can't decide? Make AI build a weighted scorecard", "human_problem": "Going back and forth between two options for days without deciding.", "objective": "Saves; practical decision tool", "hook": "Stuck between two laptops for a week?", "open_loop": "Which one wins for my priorities, and why?", "main_idea": "Give AI your priorities with weights and the real specs; get a scored table, then ask what would flip the result.", "takeaway": "Give AI your priorities with weights and the real specs, then ask what would change the winner.", "value": "A decision method for laptops, phones, couriers or job offers that keeps you in control.", "payoff": "22.5–37.5 s: weighted totals show the winner and exactly what would flip it.", "cta": "Ask what viewers are stuck choosing between.", "cta_type": "question", "visual_concept": "Asif at a table with two real laptop boxes (props) → cut-in screen inserts: weights bar chart, scoring table with totals, 'what would flip it' answer → Asif picks up the winner.", "runtime": 41, "retention": {"hook": "A specific, relatable stall (a week stuck between two laptops) instead of a generic 'can't decide?'.", "visual_progression": "Weights chart, then a scoring table, then highlighted totals.", "usefulness": "Works for any comparison: phones, laptops, couriers, job offers.", "novelty": "The 'what would have to change for A to win?' question is an unusual, smart step.", "payoff": "A clear winner with the reason (battery) shown in the totals."}, "script": [{"t": "0-3", "vo": "Stuck between two laptops for a week?", "ost": "Stuck between two?", "vis": "Asif holding two laptop boxes."}, {"t": "3-7.5", "vo": "First, tell AI what matters to you, with weights.", "ost": "1 · Your priorities + weights", "vis": "Screen: priorities typed."}, {"t": "7.5-12", "vo": "Battery forty percent, price thirty, weight twenty, ports ten.", "ost": "40 · 30 · 20 · 10", "vis": "Animated bar chart of the weights."}, {"t": "12-17.5", "vo": "Second, paste the real specs from the shop pages. Don't trust its memory for specs.", "ost": "2 · Paste the real specs", "vis": "Specs from two product pages pasted."}, {"t": "17.5-22.5", "vo": "Third: “Score each from one to ten, explain why, and give a weighted total.”", "ost": "3 · Score · why · total", "vis": "Scoring table appears."}, {"t": "22.5-27", "vo": "Laptop B wins, 7.6 to 6.9. Mostly because of battery.", "ost": "B wins: 7.6 vs 6.9", "vis": "Totals highlighted; battery row glows."}, {"t": "27-32.5", "vo": "Fourth, the smart question: “What would have to change for A to win?”", "ost": "4 · What would flip it?", "vis": "AI answer appears."}, {"t": "32.5-37.5", "vo": "Now you know the trade-off. You choose, clearly.", "ost": "Clear trade-off", "vis": "Asif to camera."}, {"t": "37.5-41", "vo": "Works for phones, couriers, even job offers.", "ost": "phones · couriers · job offers", "vis": "End card."}], "caption": "Stuck between two laptops (or phones, or job offers) for a week? Make AI build a weighted scorecard.\n\n1. Your priorities, with weights: “Battery 40%, price 30%, weight 20%, ports 10%.”\n2. Paste the real specs from the shop pages. Don't trust AI's memory for specs or prices.\n3. “Score each option 1–10 on each priority, explain why, and give a weighted total.”\n4. The smart question: “What would have to change for the other option to win?”\n\nYou still choose, but now you know exactly what you're trading.\n\nWhat are you stuck choosing between right now?\n", "hashtags": ["AItips", "decisionmaking", "productivity"], "sources": [], "production_notes": "Use two real laptop listings (no brand logos needed on screen; blur if necessary). The 7.6 vs 6.9 totals are example values from a test run; if your recorded run gives different totals, say yours in beat 6 and on screen. The scoring method doesn't change.", "day": 15, "slot": "R1", "time": "13:30", "slot_no": 2, "date": "2026-10-26", "spec": "Reel 9:16 · 1080×1920 · H.264 MP4 · 30 fps · AAC 48 kHz · safe box x65–1015 / y270–1250 · burned-in captions y1050–1250 · cover title inside centre 1080×1350", "post_no": 58, "caption_full": "Stuck between two laptops (or phones, or job offers) for a week? Make AI build a weighted scorecard.\n\n1. Your priorities, with weights: “Battery 40%, price 30%, weight 20%, ports 10%.”\n2. Paste the real specs from the shop pages. Don't trust AI's memory for specs or prices.\n3. “Score each option 1–10 on each priority, explain why, and give a weighted total.”\n4. The smart question: “What would have to change for the other option to win?”\n\nYou still choose, but now you know exactly what you're trading.\n\nWhat are you stuck choosing between right now?\n\n#AItips #decisionmaking #productivity", "pillar_name": "Practical AI", "src": [], "wps": 2.24}, {"id": "D15-I2", "type": "image", "series": "Automate This", "pillar": "AU", "format": "Framework card", "topic": "Is it worth automating? The 1-minute math", "human_problem": "A task feels like 'only a few minutes' until you see what it costs over a year.", "objective": "Saves; quantifies value for buyers", "hook": "Is it worth automating? Do the 1-minute math", "main_idea": "Minutes × frequency × 52 shows yearly time cost; compare with setup and running cost, plus mistake costs.", "takeaway": "Minutes per task × times per week × 52 shows the yearly cost of doing it by hand.", "value": "A simple formula with a worked example (15 min × 10/week = 130 hours/year).", "cta": "Ask what yearly number viewers got.", "cta_type": "question", "visual_concept": "Calculator-style card with the formula and a worked example.", "design": {"headline": "Is it worth automating? Do the 1-minute math", "body": ["Minutes per task × times per week × 52 = minutes per year", "Example: 15 min × 10 times × 52 = 7,800 min = 130 hours a year", "Compare with: setup time + monthly running cost", "Add what mistakes cost you: lost orders, late replies"], "footer": "If the yearly number scares you, it's worth a conversation.", "layout": "Dark background. Formula in a large monospace-style block. Worked example underneath with the result '130 hours' in large accent numerals. Comparison lines below. Footer bottom."}, "caption": "Is a task worth automating? 1 minute of maths:\n\nminutes per task × times per week × 52 = minutes per year\n\nExample: 15 minutes × 10 times a week × 52 = 7,800 minutes = 130 hours a year.\n\nNow compare that with the setup time and the monthly running cost. Then add what mistakes cost you: a lost order, a late reply, a wrong price.\n\nIf the yearly number scares you, it's worth a conversation.\n\nCalculate one task today. What number did you get?\n", "hashtags": ["automation", "productivity", "smallbusiness"], "sources": [], "production_notes": "The example is illustrative and labelled 'Example'. Keep the maths exactly as written (15 × 10 × 52 = 7,800 min = 130 h).", "day": 15, "slot": "I2", "time": "18:30", "slot_no": 3, "date": "2026-10-26", "spec": "Feed image 4:5 · 1440×1800 PNG (sRGB) · text ≥90 px from edges · headline ≥88 px, body ≥44 px · ≤75 words on image", "post_no": 59, "caption_full": "Is a task worth automating? 1 minute of maths:\n\nminutes per task × times per week × 52 = minutes per year\n\nExample: 15 minutes × 10 times a week × 52 = 7,800 minutes = 130 hours a year.\n\nNow compare that with the setup time and the monthly running cost. Then add what mistakes cost you: a lost order, a late reply, a wrong price.\n\nIf the yearly number scares you, it's worth a conversation.\n\nCalculate one task today. What number did you get?\n\n#automation #productivity #smallbusiness", "pillar_name": "Automation & n8n", "src": [], "wps": null}, {"id": "D15-R2", "type": "reel", "series": "Automate This", "pillar": "AU", "format": "Screen demo + face cam", "topic": "Human-in-the-loop: AI drafts, you tap Approve", "human_problem": "Wanting AI to help with customer replies but fearing it will send something wrong.", "objective": "Trust in AI automation; buyer education", "hook": "One wrong AI reply can cost a customer.", "open_loop": "How do you let AI help without letting it send on its own?", "main_idea": "An n8n workflow drafts replies with AI, then waits for a human Approve/Decline on Telegram before sending; n8n agents can also require approval before using tools.", "takeaway": "Add a human Approve step so AI drafts customer replies but never sends them alone.", "value": "A safe pattern for adding AI to customer communication.", "payoff": "7.5–21.5 s: the workflow pauses and asks on Telegram; Approve sends, Decline stops.", "cta": "Ask whether viewers would trust AI replies without a check.", "cta_type": "question", "visual_concept": "Phone showing a Telegram approval message with buttons → canvas with Gmail trigger, AI node and 'send and wait' node → both branches.", "runtime": 45, "retention": {"hook": "Names the real fear behind AI customer service (one bad reply) before showing the solution.", "visual_progression": "Approve and Decline branches light up separately on the canvas.", "novelty": "Most viewers haven't seen AI automation that pauses for a human tap.", "usefulness": "Gives a clear rule for when to use approval: money, customers, reputation.", "payoff": "The 'automate the safe ones later' path shows a sensible way to scale."}, "script": [{"t": "0-3", "vo": "One wrong AI reply can cost a customer.", "ost": "One wrong reply = a lost customer", "vis": "Phone: an AI-drafted reply with a wrong price highlighted red, then the Telegram [Approve] [Decline] message."}, {"t": "3-7.5", "vo": "This workflow drafts a reply to every customer email.", "ost": "AI drafts the reply", "vis": "n8n canvas: Gmail trigger → AI node."}, {"t": "7.5-12", "vo": "But before sending, it stops and asks me on Telegram.", "ost": "Then it waits for me", "vis": "'Send and wait for response' node highlighted."}, {"t": "12-17", "vo": "I see the customer's message, the AI's reply, and two buttons.", "ost": "Approve · Decline", "vis": "Phone close-up of the approval message."}, {"t": "17-21.5", "vo": "Approve, and it sends. Decline, and nothing goes out.", "ost": "✓ sends · ✗ stops", "vis": "Both branches animate on the canvas."}, {"t": "21.5-27", "vo": "It's called human-in-the-loop. In n8n, even AI agents can ask before using a tool.", "ost": "Human-in-the-loop", "vis": "AI Agent node with tool-approval setting shown."}, {"t": "27-32", "vo": "Use it for anything that touches money, customers or your reputation.", "ost": "money · customers · reputation", "vis": "Three icons."}, {"t": "32-37", "vo": "After a few weeks, you'll know which replies are safe to automate fully.", "ost": "Then automate the safe ones", "vis": "Asif to camera."}, {"t": "37-42", "vo": "That's how you add AI without the scary part.", "ost": "AI, without the scary part", "vis": "Asif smiles."}, {"t": "42-45", "vo": "That's AI with a safety catch.", "ost": "AI + a safety catch", "vis": "End card."}], "caption": "One wrong AI reply can cost you a customer. So don't let AI send on its own. Add a human tap.\n\nThis n8n workflow:\n1. A customer email arrives\n2. AI drafts a reply\n3. The workflow pauses and sends me the draft on Telegram with Approve / Decline buttons\n4. Approve → it sends. Decline → nothing goes out.\n\nIt's called human-in-the-loop. Newer n8n versions also let an AI agent ask for approval before it uses a tool.\n\nUse it for anything that touches money, customers or your reputation. After a few weeks you'll see which replies are safe to automate fully.\n\nWould you trust AI to reply to your customers without a check like this?\n", "hashtags": ["n8n", "AIautomation", "humanintheloop"], "sources": ["n8n_release_2x"], "production_notes": "Build on a demo Gmail account. Use the Telegram 'send message and wait for response' approval pattern. Show the agent tool-approval option only if your n8n version has it (2.6+); confirm before filming.", "day": 15, "slot": "R2", "time": "21:00", "slot_no": 4, "date": "2026-10-26", "spec": "Reel 9:16 · 1080×1920 · H.264 MP4 · 30 fps · AAC 48 kHz · safe box x65–1015 / y270–1250 · burned-in captions y1050–1250 · cover title inside centre 1080×1350", "post_no": 60, "caption_full": "One wrong AI reply can cost you a customer. So don't let AI send on its own. Add a human tap.\n\nThis n8n workflow:\n1. A customer email arrives\n2. AI drafts a reply\n3. The workflow pauses and sends me the draft on Telegram with Approve / Decline buttons\n4. Approve → it sends. Decline → nothing goes out.\n\nIt's called human-in-the-loop. Newer n8n versions also let an AI agent ask for approval before it uses a tool.\n\nUse it for anything that touches money, customers or your reputation. After a few weeks you'll see which replies are safe to automate fully.\n\nWould you trust AI to reply to your customers without a check like this?\n\n#n8n #AIautomation #humanintheloop", "pillar_name": "Automation & n8n", "src": [{"t": "Release notes 2.x", "u": "https://docs.n8n.io/changelog/release-notes-2.x", "p": "n8n Docs", "d": "2026", "v": true}], "wps": 2.22}, {"id": "D16-I1", "type": "image", "series": "Work With Me", "pillar": "SVC", "format": "FAQ card", "topic": "Will automation cost me every month? Honest answer", "human_problem": "Worrying that automation will add another monthly bill you can't predict.", "objective": "Remove a buying objection; Messenger leads", "hook": "“Will automation cost me every month?” Honest answer", "main_idea": "Running cost has four parts (hosting, AI usage, paid apps, maintenance); some setups run very cheaply.", "takeaway": "Automation running costs come from hosting, AI usage, paid apps and maintenance, and can be very low.", "value": "A transparent cost breakdown and a promise of an estimate before building.", "cta": "Message 'AUTOMATE' for an estimate.", "cta_type": "message", "visual_concept": "Receipt-style card listing four cost lines.", "design": {"headline": "“Will automation cost me every month?” Honest answer", "body": ["1. Where it runs: an n8n Cloud plan, or your own server.", "2. AI usage: you pay the AI provider per use. Usually small at low volume.", "3. Paid apps: some tools you connect need their own plan.", "4. Maintenance: occasional fixes when apps change.", "No AI and self-hosted? Running costs can be very low."], "footer": "You get an estimate before any build. Message “AUTOMATE”.", "layout": "Light background. Receipt-style card (zig-zag bottom edge) with four line items and a 'TOTAL: depends on your setup' line. Footer CTA bar below the receipt."}, "caption": "The question I get most: “Will this cost me every month?”\n\nHonest answer: it depends on 4 things.\n1. Where it runs: an n8n Cloud plan, or your own server (self-hosted)\n2. AI usage: if the workflow uses AI, you pay the AI provider per use. At low volume it's usually small.\n3. Paid apps: some tools you connect need their own subscription\n4. Maintenance: apps change, and occasionally something needs a fix\n\nNo AI and self-hosted? Running costs can be very low.\n\nBefore I build anything, you get an estimate. Message me “AUTOMATE” if you want one.\n", "hashtags": ["n8n", "automation", "smallbusiness"], "sources": ["n8n_choose"], "production_notes": "Don't add prices to the image (they change and vary by country). Give real numbers only in private quotes.", "day": 16, "slot": "I1", "time": "09:30", "slot_no": 1, "date": "2026-10-27", "spec": "Feed image 4:5 · 1440×1800 PNG (sRGB) · text ≥90 px from edges · headline ≥88 px, body ≥44 px · ≤75 words on image", "post_no": 61, "caption_full": "The question I get most: “Will this cost me every month?”\n\nHonest answer: it depends on 4 things.\n1. Where it runs: an n8n Cloud plan, or your own server (self-hosted)\n2. AI usage: if the workflow uses AI, you pay the AI provider per use. At low volume it's usually small.\n3. Paid apps: some tools you connect need their own subscription\n4. Maintenance: apps change, and occasionally something needs a fix\n\nNo AI and self-hosted? Running costs can be very low.\n\nBefore I build anything, you get an estimate. Message me “AUTOMATE” if you want one.\n\n#n8n #automation #smallbusiness", "pillar_name": "Work with me (n8n services)", "src": [{"t": "Choose your n8n", "u": "https://docs.n8n.io/choose-n8n/", "p": "n8n Docs", "d": "current", "v": false}], "wps": null}, {"id": "D16-R1", "type": "reel", "series": "What It Means For You", "pillar": "NEWS", "format": "Green screen + talking head", "topic": "The Facebook survey 'How well does this video match your interests?' explained", "human_problem": "Seeing a strange survey under Facebook Reels and not knowing what it does.", "objective": "Relatable platform insight; shares among creators", "hook": "Seen this question under a Facebook Reel?", "open_loop": "What does my answer actually change?", "main_idea": "Since Jan 2026 Facebook uses random 1–5 interest surveys to train Reels ranking; honest answers shape your feed, and creators should stay on-topic.", "takeaway": "Facebook's interest survey trains which Reels you see, so answer it honestly, and creators should stay on one topic.", "value": "Explains a mysterious prompt users see, with advice for viewers and creators.", "payoff": "7.5–34.5 s: it trains the Reels ranking; viewers should answer honestly, creators should stay on topic.", "cta": "Follow if AI and automation is your interest.", "cta_type": "follow", "visual_concept": "Drawn mock of the survey card; Meta engineering article capture; before/after precision stat card.", "runtime": 41, "retention": {"hook": "Many users have seen this survey and wondered about it, so instant recognition.", "curiosity": "'What does my answer actually do?' is answered step by step.", "novelty": "Few people know Meta's engineers published how this survey trains the feed.", "usefulness": "Practical advice for both viewers (answer honestly, use Not interested) and creators (stay on topic).", "payoff": "Ends by tying the insight to why this page stays on one topic."}, "script": [{"t": "0-3", "vo": "Seen this question under a Facebook Reel?", "ost": "“How well does this video match your interests?”", "vis": "Asif on green screen beside a drawn mock of the survey."}, {"t": "3-7.5", "vo": "“How well does this video match your interests?” One to five.", "ost": "1 · 2 · 3 · 4 · 5", "vis": "The five rating dots animate."}, {"t": "7.5-13", "vo": "It's real. Meta's engineers explained it in January. Your answer trains the Reels ranking.", "ost": "Your answer trains your feed", "vis": "Own screen capture of the Engineering at Meta article (title + date)."}, {"t": "13-18", "vo": "Before this, Facebook guessed your interests from likes and watch time.", "ost": "Before: likes + watch time", "vis": "Like and clock icons."}, {"t": "18-23.5", "vo": "Meta says those guesses were right less than half the time. The survey fixes that.", "ost": "Old guesses: 48% right", "vis": "Stat card: 48.3% → 63.2% precision (Meta, Jan 2026)."}, {"t": "23.5-28.5", "vo": "For you: answer honestly, and tap Not interested when a Reel misses.", "ost": "Viewers: answer honestly", "vis": "'Not interested' option mock."}, {"t": "28.5-34.5", "vo": "For creators: stay on your topic. Clickbait brings the wrong viewers, and they'll rate you low.", "ost": "Creators: stay on topic", "vis": "Asif to camera."}, {"t": "34.5-38", "vo": "That's why this page only talks AI and automation.", "ost": "One topic. On purpose.", "vis": "Asif smiles."}, {"t": "38-41", "vo": "Follow if that's your interest.", "ost": "Follow", "vis": "End card."}], "caption": "Seen “How well does this video match your interests?” under a Facebook Reel? This is what it does.\n\nMeta's engineers explained it in January 2026: Facebook randomly shows this 1–5 survey to some viewers and uses the answers to train how Reels are ranked. Their old interest guesses (based on likes and watch time) were right only 48% of the time; with the survey model, 63%.\n\nFor viewers: answer honestly, and use “Not interested” when a Reel misses.\nFor creators: stay on your topic. Clickbait brings the wrong viewers, and they'll rate you low.\n\nThat's why this page only talks AI and automation. Follow if that's your interest.\n", "hashtags": ["FacebookReels", "socialmedia", "contentcreator"], "sources": ["meta_utis"], "production_notes": "Draw the survey mock yourself; don't screenshot someone else's Reel. Capture the engineering article from your own screen for ≤3 s.", "day": 16, "slot": "R1", "time": "13:30", "slot_no": 2, "date": "2026-10-27", "spec": "Reel 9:16 · 1080×1920 · H.264 MP4 · 30 fps · AAC 48 kHz · safe box x65–1015 / y270–1250 · burned-in captions y1050–1250 · cover title inside centre 1080×1350", "post_no": 62, "caption_full": "Seen “How well does this video match your interests?” under a Facebook Reel? This is what it does.\n\nMeta's engineers explained it in January 2026: Facebook randomly shows this 1–5 survey to some viewers and uses the answers to train how Reels are ranked. Their old interest guesses (based on likes and watch time) were right only 48% of the time; with the survey model, 63%.\n\nFor viewers: answer honestly, and use “Not interested” when a Reel misses.\nFor creators: stay on your topic. Clickbait brings the wrong viewers, and they'll rate you low.\n\nThat's why this page only talks AI and automation. Follow if that's your interest.\n\n#FacebookReels #socialmedia #contentcreator", "pillar_name": "Current developments", "src": [{"t": "Adapting the Facebook Reels RecSys AI Model Based on User Feedback", "u": "https://engineering.fb.com/2026/01/14/ml-applications/adapting-the-facebook-reels-recsys-ai-model-based-on-user-feedback/", "p": "Engineering at Meta", "d": "2026-01-14", "v": false}], "wps": 2.44}, {"id": "D16-I2", "type": "image", "series": "Hidden Button", "pillar": "HF", "format": "Hidden feature card", "topic": "Windows shortcut: Alt + Space opens Gemini", "human_problem": "Switching tabs every time you want to ask AI something quick.", "objective": "Shares among office workers and students", "hook": "Windows shortcut: Alt + Space opens Gemini", "main_idea": "The Gemini app for Windows (Sept 2026) opens over any app with Alt + Space.", "takeaway": "On Windows, the Gemini app opens over any app with Alt + Space.", "value": "A quick-access habit + what to use it for.", "cta": "None. The shortcut is the value.", "cta_type": "none", "visual_concept": "Large keyboard keys 'Alt' + 'Space' with a small chat window popping up.", "design": {"headline": "Windows shortcut: Alt + Space opens Gemini", "body": ["Install the Gemini app for Windows (released Sept 2026).", "Press Alt + Space from any app to ask a quick question.", "Summarise a doc, draft a reply, or ask about your work.", "Connect Gmail and Drive to search your own files."], "footer": "No more switching tabs for a quick question.", "layout": "Dark background. Centre: two big 3D-style keycaps 'Alt' and 'Space' with a '+' between. A small floating chat window above them. Text rows below. Footer bottom."}, "caption": "Windows users: Gemini now has a desktop app, and Alt + Space opens it over any app.\n\n• Install the Gemini app for Windows (released Sept 2026)\n• Press Alt + Space from Word, Excel, your browser, anything\n• Ask a quick question, summarise a document, draft a reply\n• Connect Gmail and Drive to search your own files\n\nNo more switching tabs to ask a quick question.\n\nWorks on any Windows PC with the Gemini app installed.\n", "hashtags": ["GeminiAI", "Windows", "productivity"], "sources": ["google_gemini_windows"], "production_notes": "Draw the keys; no Google logo. Check whether Alt + Space conflicts with the Windows window menu on your test PC and mention the settings fix in a comment if needed.", "day": 16, "slot": "I2", "time": "18:30", "slot_no": 3, "date": "2026-10-27", "spec": "Feed image 4:5 · 1440×1800 PNG (sRGB) · text ≥90 px from edges · headline ≥88 px, body ≥44 px · ≤75 words on image", "post_no": 63, "caption_full": "Windows users: Gemini now has a desktop app, and Alt + Space opens it over any app.\n\n• Install the Gemini app for Windows (released Sept 2026)\n• Press Alt + Space from Word, Excel, your browser, anything\n• Ask a quick question, summarise a document, draft a reply\n• Connect Gmail and Drive to search your own files\n\nNo more switching tabs to ask a quick question.\n\nWorks on any Windows PC with the Gemini app installed.\n\n#GeminiAI #Windows #productivity", "pillar_name": "Hidden features & tools", "src": [{"t": "The Gemini desktop app is now available for Windows", "u": "https://workspaceupdates.googleblog.com/2026/09/the-gemini-desktop-app-is-now-available-for-Windows.html", "p": "Google Workspace Updates", "d": "2026-09", "v": false}], "wps": null}, {"id": "D16-R2", "type": "reel", "series": "Steal This Prompt", "pillar": "PA", "format": "Text-led Reel", "topic": "The 4-part prompt: goal, context, example, format", "human_problem": "Typing a one-line request and getting a bland result back.", "objective": "Saves; core prompting framework", "hook": "Good prompts have four parts. Yours has one.", "open_loop": "What are the other three parts?", "main_idea": "Most prompts contain only the task; adding goal, context, example and format produces dramatically better results.", "takeaway": "Add a goal, context, an example and a format to a request to get much better AI results.", "value": "A memorable framework (G-C-E-F) demonstrated on a real promo post.", "payoff": "31–40 s: the before/after shows what the four-part prompt produces.", "cta": "Save it.", "cta_type": "save", "visual_concept": "Text-led: kinetic typography on a plain background. Four letter blocks G, C, E, F fill one by one; short screen inserts for the before/after. Asif's voice from frame 1.", "runtime": 43, "retention": {"hook": "A mild challenge ('yours has one') makes viewers check their own habit.", "visual_progression": "Four letter blocks fill in sequence, each with a typed example.", "payoff": "The before/after split shows the difference visually.", "usefulness": "A four-part checklist that applies to any prompt.", "save_share": "Framework content gets saved for later reference."}, "script": [{"t": "0-3", "vo": "Good prompts have four parts. Yours has one.", "ost": "4 parts. You use 1.", "vis": "Text-led: the prompt 'Write a post about my discount' types out on a plain background; Asif's voice only."}, {"t": "3-7", "vo": "“Write a post about my discount.” That's just the task.", "ost": "Task only", "vis": "Weak generic output appears."}, {"t": "7-12", "vo": "Part one, goal: what's it for, and who reads it?", "ost": "G · Goal", "vis": "Letter block G fills."}, {"t": "12-16", "vo": "“Get office workers in Gulshan to pre-order lunch by 11 AM.”", "ost": "who + what action", "vis": "Goal line types under G."}, {"t": "16-21", "vo": "Part two, context: the facts it can't guess. Price, product, delivery.", "ost": "C · Context", "vis": "Block C fills; facts typed."}, {"t": "21-26", "vo": "Part three, example: paste a post that worked before.", "ost": "E · Example", "vis": "Block E fills; example pasted."}, {"t": "26-31", "vo": "Part four, format: three options, under fifty words, one emoji max.", "ost": "F · Format", "vis": "Block F fills."}, {"t": "31-35", "vo": "Same task, four parts. Look at the difference.", "ost": "Before → After", "vis": "Split screen: weak output vs strong output."}, {"t": "35-40", "vo": "Goal, context, example, format. Add the ones you're missing.", "ost": "G · C · E · F", "vis": "Four blocks line up."}, {"t": "40-43", "vo": "Save this for your next prompt.", "ost": "Save it", "vis": "End card."}], "caption": "Most prompts are just a task: “Write a post about my discount.” Good prompts have 4 parts:\n\nG: Goal: what's it for and who reads it? “Get office workers in Gulshan to pre-order lunch by 11 AM.”\nC: Context: facts it can't guess. Product, price, delivery, offer end date.\nE: Example: paste a post that worked before.\nF: Format: “3 options, under 50 words, max one emoji.”\n\nYou don't need all 4 every time. Add the ones you're missing.\n", "hashtags": ["AItips", "PromptTips", "ChatGPT"], "sources": [], "production_notes": "List template with 4 letter blocks. Generate both outputs live. Use a fictional shop and discount.", "day": 16, "slot": "R2", "time": "21:00", "slot_no": 4, "date": "2026-10-27", "spec": "Reel 9:16 · 1080×1920 · H.264 MP4 · 30 fps · AAC 48 kHz · safe box x65–1015 / y270–1250 · burned-in captions y1050–1250 · cover title inside centre 1080×1350", "post_no": 64, "caption_full": "Most prompts are just a task: “Write a post about my discount.” Good prompts have 4 parts:\n\nG: Goal: what's it for and who reads it? “Get office workers in Gulshan to pre-order lunch by 11 AM.”\nC: Context: facts it can't guess. Product, price, delivery, offer end date.\nE: Example: paste a post that worked before.\nF: Format: “3 options, under 50 words, max one emoji.”\n\nYou don't need all 4 every time. Add the ones you're missing.\n\n#AItips #PromptTips #ChatGPT", "pillar_name": "Practical AI", "src": [], "wps": 2.16}, {"id": "D17-I1", "type": "image", "series": "Before → After", "pillar": "AU", "format": "Before/after timeline", "topic": "A Facebook seller's day, before and after 3 automations", "human_problem": "Sellers spend the whole day and evening copying orders and answering the same questions.", "objective": "Make automation tangible for F-commerce owners", "hook": "A Facebook seller's day, before and after 3 automations", "main_idea": "Three automations (order capture, FAQ replies, nightly sales summary) change a seller's whole day.", "takeaway": "Three automations (order capture, FAQ replies, a nightly summary) give a seller back their evenings.", "value": "Concrete before/after picture of automation benefits in the audience's own context.", "cta": "Ask which part of the 'before' day is theirs.", "cta_type": "question", "visual_concept": "Two vertical timelines: grey 'before' with stress icons, green 'after' with calm icons.", "design": {"headline": "A Facebook seller's day, before and after 3 automations", "body": ["BEFORE · 9 AM: copy orders from Messenger into a notebook", "1 PM: answer “price?” again and again", "10 PM: add up today's sales by hand", "AFTER · orders land in a sheet automatically", "FAQs get instant replies; you answer the real questions", "10 PM: the sales summary arrives on your phone"], "footer": "Same business. Different evenings.", "layout": "Two columns: left 'BEFORE' timeline in grey with small clock stamps; right 'AFTER' in accent green with check icons. Headline across the top. Footer centred bottom."}, "caption": "An example day for a Facebook seller, before and after 3 automations:\n\nBefore\n9 AM: copy orders from Messenger into a notebook\n1 PM: answer “price?” again and again\n10 PM: add up today's sales by hand\n\nAfter\nOrders land in a Google Sheet automatically\nCommon questions get instant replies, so you answer only the real ones\n10 PM: a sales summary arrives on your phone\n\nSame business. Different evenings.\n\nWhich part of the “before” day is yours?\n", "hashtags": ["fcommerce", "automation", "smallbusiness"], "sources": [], "production_notes": "Label it as an example day. Use neutral icons, not a real seller's page.", "day": 17, "slot": "I1", "time": "09:30", "slot_no": 1, "date": "2026-10-28", "spec": "Feed image 4:5 · 1440×1800 PNG (sRGB) · text ≥90 px from edges · headline ≥88 px, body ≥44 px · ≤75 words on image", "post_no": 65, "caption_full": "An example day for a Facebook seller, before and after 3 automations:\n\nBefore\n9 AM: copy orders from Messenger into a notebook\n1 PM: answer “price?” again and again\n10 PM: add up today's sales by hand\n\nAfter\nOrders land in a Google Sheet automatically\nCommon questions get instant replies, so you answer only the real ones\n10 PM: a sales summary arrives on your phone\n\nSame business. Different evenings.\n\nWhich part of the “before” day is yours?\n\n#fcommerce #automation #smallbusiness", "pillar_name": "Automation & n8n", "src": [], "wps": null}, {"id": "D17-R1", "type": "reel", "series": "Steal This Prompt", "pillar": "PA", "format": "Phone-in-hand demo", "topic": "Practise a job interview out loud with AI voice mode", "human_problem": "Knowing your answers but freezing when you have to say them out loud in an interview.", "objective": "Saves + shares among job seekers and students", "hook": "Interview question. Your mind goes blank.", "open_loop": "How do you practise speaking, not just typing?", "main_idea": "Use voice mode with the job post to run a one-question-at-a-time mock interview, then ask for targeted feedback.", "takeaway": "Practise interviews out loud in AI voice mode, then ask for feedback on your weakest answer.", "value": "A realistic practice method + the most useful feedback request.", "payoff": "7–33 s: a voice-mode mock interview, then feedback on the vaguest answer.", "cta": "None. 'Practise tonight' is the action.", "cta_type": "none", "visual_concept": "Phone propped like a video call; Asif answering out loud; feedback text on screen.", "runtime": 40, "retention": {"hook": "Captures the exact moment people dread in interviews, so it's instantly personal.", "relatability": "Freezing when speaking (vs typing) is widely felt, especially in a second language.", "usefulness": "Exact voice prompt + feedback prompt anyone can use for free.", "visual_progression": "Shifts between Asif speaking, waveform, and on-screen feedback.", "save_share": "Job seekers forward interview help to friends."}, "script": [{"t": "0-3", "vo": "Interview question. Your mind goes blank.", "ost": "Mind goes blank?", "vis": "Asif in interview posture; a typed question appears; quick freeze-frame zoom on his blank
