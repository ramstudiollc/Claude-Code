face."}, {"t": "3-7", "vo": "Typing answers is easy. Saying them is where people freeze.", "ost": "Typing ≠ speaking", "vis": "Asif to camera."}, {"t": "7-12.5", "vo": "Open voice mode and say: “Interview me for this job. One question at a time.”", "ost": "“One question at a time.”", "vis": "Phone screen: voice mode."}, {"t": "12.5-16.5", "vo": "Paste the job post first, so the questions are real.", "ost": "Paste the job post first", "vis": "Text paste."}, {"t": "16.5-22", "vo": "It asks. You answer out loud. No pausing to google.", "ost": "Answer out loud", "vis": "Asif answering; waveform."}, {"t": "22-27.5", "vo": "After five questions: “Tell me what was vague, and improve my weakest answer.”", "ost": "Feedback: vague + weakest", "vis": "Feedback text on screen."}, {"t": "27.5-33", "vo": "The most useful feedback: one real example with a result, not adjectives.", "ost": "Example + result > adjectives", "vis": "Highlight in the feedback."}, {"t": "33-37", "vo": "Then ask it to be a tough interviewer.", "ost": "Then: “Be tough.”", "vis": "Asif grins."}, {"t": "37-40", "vo": "Send this to someone with an interview.", "ost": "Send to a job seeker", "vis": "End card."}], "caption": "You know the answer. Then the interviewer asks, and your mind goes blank.\n\nPractise out loud with AI. Typing answers is easy; saying them is where people freeze.\n\n1. Paste the job post into your AI app\n2. Turn on voice mode and say: “Interview me for this job. One question at a time. Wait for my answer.”\n3. Answer out loud, with no pausing to google\n4. After 5 questions: “Tell me what was vague, and rewrite my weakest answer.”\n5. When you're ready: “Be a tough interviewer.”\n\nThe most useful feedback: give one real example with a result, not adjectives.\n\nInterview this week? Practise tonight.\n", "hashtags": ["jobinterview", "careertips", "AItips"], "sources": [], "production_notes": "Record a real practice session for a realistic role (e.g. junior graphic designer). Keep 2–3 short Q&A moments only.", "day": 17, "slot": "R1", "time": "13:30", "slot_no": 2, "date": "2026-10-28", "spec": "Reel 9:16 · 1080×1920 · H.264 MP4 · 30 fps · AAC 48 kHz · safe box x65–1015 / y270–1250 · burned-in captions y1050–1250 · cover title inside centre 1080×1350", "post_no": 66, "caption_full": "You know the answer. Then the interviewer asks, and your mind goes blank.\n\nPractise out loud with AI. Typing answers is easy; saying them is where people freeze.\n\n1. Paste the job post into your AI app\n2. Turn on voice mode and say: “Interview me for this job. One question at a time. Wait for my answer.”\n3. Answer out loud, with no pausing to google\n4. After 5 questions: “Tell me what was vague, and rewrite my weakest answer.”\n5. When you're ready: “Be a tough interviewer.”\n\nThe most useful feedback: give one real example with a result, not adjectives.\n\nInterview this week? Practise tonight.\n\n#jobinterview #careertips #AItips", "pillar_name": "Practical AI", "src": [], "wps": 2.27}, {"id": "D17-I2", "type": "image", "series": "Steal This Prompt", "pillar": "PA", "format": "Before/after card", "topic": "Turn messy order chats into a clean table", "human_problem": "Orders scattered across dozens of Messenger chats, with details missing.", "objective": "Saves among F-commerce sellers", "hook": "30 order chats → one clean table", "main_idea": "Paste raw order messages and get a structured table with MISSING flags and a follow-up list.", "takeaway": "Paste order chats into AI to get one table, with MISSING marking exactly what to ask customers.", "value": "A copy-paste prompt that structures orders for Google Sheets.", "cta": "Save it for your next order rush.", "cta_type": "save", "visual_concept": "Messy chat bubbles on the left → neat table on the right.", "design": {"headline": "30 order chats → one clean table", "body": ["“Here are today's order messages: [paste].", "Make a table: Name | Phone | Item | Size | Qty | Address | Payment.", "If anything is missing, write MISSING.", "Then list who I need to message back.”"], "footer": "Copy the table straight into Google Sheets.", "layout": "Light background. Left 40%: stack of messy chat bubbles (before). Arrow. Right 60%: a neat table preview with one red MISSING cell (after). Prompt block across the bottom."}, "caption": "Orders scattered across 30 Messenger chats? Paste them into AI:\n\n“Here are today's order messages: [paste].\nMake a table: Name | Phone | Item | Size | Qty | Address | Payment.\nIf anything is missing, write MISSING.\nThen list who I need to message back and what to ask them.”\n\nCopy the table into Google Sheets. The MISSING list is your follow-up job.\n\nRemove anything you don't need before pasting; customer data is private.\n\nSave this for your next order rush.\n", "hashtags": ["fcommerce", "AItips", "GoogleSheets"], "sources": [], "production_notes": "Prompt-card template with a table preview. Use invented names in the preview.", "day": 17, "slot": "I2", "time": "18:30", "slot_no": 3, "date": "2026-10-28", "spec": "Feed image 4:5 · 1440×1800 PNG (sRGB) · text ≥90 px from edges · headline ≥88 px, body ≥44 px · ≤75 words on image", "post_no": 67, "caption_full": "Orders scattered across 30 Messenger chats? Paste them into AI:\n\n“Here are today's order messages: [paste].\nMake a table: Name | Phone | Item | Size | Qty | Address | Payment.\nIf anything is missing, write MISSING.\nThen list who I need to message back and what to ask them.”\n\nCopy the table into Google Sheets. The MISSING list is your follow-up job.\n\nRemove anything you don't need before pasting; customer data is private.\n\nSave this for your next order rush.\n\n#fcommerce #AItips #GoogleSheets", "pillar_name": "Practical AI", "src": [], "wps": null}, {"id": "D17-R2", "type": "reel", "series": "Automate This", "pillar": "AU", "format": "Screen demo + face cam", "topic": "Add a row, and the invoice makes itself (n8n)", "human_problem": "Freelancers and shops lose evenings making invoices by hand, and sometimes get them wrong.", "objective": "Proof of skill for freelancers and shops; Messenger leads", "hook": "Add a row. The invoice makes itself.", "open_loop": "How does one row become a sent invoice?", "main_idea": "A sheet row marked 'Ready' triggers n8n to fill a template, create a numbered PDF, email the client and mark the row invoiced; totals come from the sheet, not AI.", "takeaway": "A sheet row can trigger n8n to create, number, email and log an invoice, with totals taken from the sheet.", "value": "A complete invoicing automation with the important rule that money maths isn't left to AI.", "payoff": "7–31 s: template → numbered PDF → email → row marked 'Invoiced'.", "cta": "Soft service line in the caption only.", "cta_type": "soft", "visual_concept": "Sheet row status → template filling → PDF 'INV-0042' → email arrives → row updated.", "runtime": 49, "retention": {"hook": "A satisfying cause-and-effect promise shown in the first frame.", "relatability": "Freelancers and shops dislike making invoices by hand.", "visual_progression": "Each step produces a visible object: filled template, PDF, email, updated row.", "novelty": "The 'totals from the sheet, not AI' rule is a smart detail most demos skip.", "payoff": "A professional PDF invoice lands in the client's inbox automatically."}, "script": [{"t": "0-3", "vo": "Add a row. The invoice makes itself.", "ost": "Row → PDF → email", "vis": "Sheet row typed; an email with a PDF attachment arrives."}, {"t": "3-7", "vo": "Making invoices by hand is slow, and easy to get wrong.", "ost": "Slow + easy to get wrong", "vis": "Asif to camera."}, {"t": "7-11.5", "vo": "Here's the n8n version. It starts when a row says “Ready”.", "ost": "1 · Status = Ready", "vis": "Sheets trigger node; status cell turns 'Ready'."}, {"t": "11.5-16.5", "vo": "It fills my invoice template: client, items, totals, due date.", "ost": "2 · Fill the template", "vis": "Template filling animation."}, {"t": "16.5-21", "vo": "Then turns it into a PDF with the next invoice number.", "ost": "3 · PDF + invoice number", "vis": "PDF appears labelled INV-0042."}, {"t": "21-26", "vo": "It emails it to the client with a short, polite message.", "ost": "4 · Email to the client", "vis": "Email with attachment."}, {"t": "26-31", "vo": "And writes back to the sheet: invoiced, date, number. No double invoices.", "ost": "5 · Mark as invoiced", "vis": "Row updates to 'Invoiced'."}, {"t": "31-36.5", "vo": "The totals come from the sheet, not from AI. Money maths should never be guessed.", "ost": "Totals from the sheet, not AI", "vis": "Sheet formula highlighted."}, {"t": "36.5-42", "vo": "Set it up once, and every invoice looks the same and goes out on time.", "ost": "Same look · on time", "vis": "Stack of identical PDFs."}, {"t": "42-46", "vo": "No more invoice night.", "ost": "No more invoice night", "vis": "Asif to camera."}, {"t": "46-49", "vo": "Just a row in a sheet.", "ost": "Just a row", "vis": "End card."}], "caption": "Add a row to a sheet → the invoice makes itself. The n8n version:\n\n1. A row's status changes to “Ready”\n2. n8n fills my invoice template: client, items, totals, due date\n3. It creates a PDF with the next invoice number\n4. Emails it to the client with a short message\n5. Marks the row “Invoiced” with date and number, so nobody invoices twice\n\nOne rule: totals come from the sheet's formulas, not from AI. Money maths should never be guessed.\n\nI build these for freelancers and small businesses. If you want one, my inbox is open.\n", "hashtags": ["n8n", "invoicing", "freelancing"], "sources": [], "production_notes": "Build a demo (Google Sheets trigger → Google Docs template or HTML template → PDF → Gmail → Sheets update). Fake client data. Hide credentials.", "day": 17, "slot": "R2", "time": "21:00", "slot_no": 4, "date": "2026-10-28", "spec": "Reel 9:16 · 1080×1920 · H.264 MP4 · 30 fps · AAC 48 kHz · safe box x65–1015 / y270–1250 · burned-in captions y1050–1250 · cover title inside centre 1080×1350", "post_no": 68, "caption_full": "Add a row to a sheet → the invoice makes itself. The n8n version:\n\n1. A row's status changes to “Ready”\n2. n8n fills my invoice template: client, items, totals, due date\n3. It creates a PDF with the next invoice number\n4. Emails it to the client with a short message\n5. Marks the row “Invoiced” with date and number, so nobody invoices twice\n\nOne rule: totals come from the sheet's formulas, not from AI. Money maths should never be guessed.\n\nI build these for freelancers and small businesses. If you want one, my inbox is open.\n\n#n8n #invoicing #freelancing", "pillar_name": "Automation & n8n", "src": [], "wps": 2.31}, {"id": "D18-I1", "type": "image", "series": "AI Myth Check", "pillar": "LIT", "format": "Step-by-step card", "topic": "Check an AI claim in 60 seconds", "human_problem": "Forwarding something an AI said that turns out to be wrong.", "objective": "Trust + shares in groups", "hook": "Check an AI claim in 60 seconds", "main_idea": "A 5-step quick check (exact claim, two known sources, dates, agreement, don't repeat if only AI says it).", "takeaway": "Check an AI claim against two known, dated sources before you repeat it.", "value": "A fast verification habit for AI answers and viral claims.", "cta": "Send it to a group where people forward everything.", "cta_type": "share", "visual_concept": "Stopwatch at 60 s with five numbered steps around it.", "design": {"headline": "Check an AI claim in 60 seconds", "body": ["1. Copy the exact claim. One sentence.", "2. Search it, and open 2 sources you know.", "3. Look at the date on each source.", "4. Do they say the same thing? Good.", "5. Only AI says it? Don't repeat it."], "footer": "Especially before you share it in a group.", "layout": "Dark background. Stopwatch graphic top-right. Five numbered rows. Footer band."}, "caption": "Before you repeat something an AI told you, give it 60 seconds:\n\n1. Copy the exact claim, one sentence\n2. Search it and open 2 sources you already know\n3. Check the date on each\n4. Do they agree? Good.\n5. Only the AI says it? Don't repeat it.\n\nEspecially before forwarding it to a family or office group.\n\nSend this to a group where people forward everything.\n", "hashtags": ["factcheck", "AIliteracy", "AItips"], "sources": [], "production_notes": "Checklist template with stopwatch.", "day": 18, "slot": "I1", "time": "09:30", "slot_no": 1, "date": "2026-10-29", "spec": "Feed image 4:5 · 1440×1800 PNG (sRGB) · text ≥90 px from edges · headline ≥88 px, body ≥44 px · ≤75 words on image", "post_no": 69, "caption_full": "Before you repeat something an AI told you, give it 60 seconds:\n\n1. Copy the exact claim, one sentence\n2. Search it and open 2 sources you already know\n3. Check the date on each\n4. Do they agree? Good.\n5. Only the AI says it? Don't repeat it.\n\nEspecially before forwarding it to a family or office group.\n\nSend this to a group where people forward everything.\n\n#factcheck #AIliteracy #AItips", "pillar_name": "AI literacy & safety", "src": [], "wps": null}, {"id": "D18-R1", "type": "reel", "series": "Automate This", "pillar": "AU", "format": "Phone-in-hand demo + canvas inserts", "topic": "AI news in one email a day: an n8n digest", "human_problem": "Trying to keep up with AI news across many sites and losing your mornings to it.", "objective": "Proof of skill + useful idea for any industry", "hook": "Ten news tabs every morning? Not anymore.", "open_loop": "What replaced the ten tabs?", "main_idea": "An n8n workflow reads trusted RSS feeds each morning, filters the last 24 hours, removes repeats, and has AI write two lines per story with source links.", "takeaway": "An n8n workflow can read trusted RSS feeds every morning and email you a short summary with source links.", "value": "Shows how to cut information overload, and that the idea works for any industry.", "payoff": "7.5–32 s: RSS → last 24 hours → a two-line AI summary with links, deli vo": "Works for any topic: your industry, competitors' blogs, job posts.", "ost": "industry · competitors · jobs", "vis": "Three icons."}, {"t": "42-47", "vo": "My mornings start with one email now.", "ost": "One email. Calm mornings.", "vis": "Asif to camera."}, {"t": "47-50", "vo": "What would you put in yours?", "ost": "Your topics?", "vis": "End card."}], "caption": "Ten tabs of AI news every morning? I replaced them with one email that an n8n workflow writes at 7 AM:\n\n1. Reads the RSS feeds of official blogs I trust (RSS = a simple public feed most blogs offer)\n2. Keeps only the last 24 hours, removes repeats\n3. AI writes 2 lines per story + why it matters\n4. Every line keeps the original link, and I click before I share anything\n\nTen sites become one email. Works for any industry, competitor blogs or job posts.\n\nWhat would you put in yours? If you want one for your field, I can build it. Just send me the sites.\n", "hashtags": ["n8n", "automation", "AInews"], "sources": [], "production_notes": "Use official blog RSS feeds (e.g. Google, OpenAI, n8n blogs). Don't republish their articles; the digest is private and links out. Show the email briefly.", "day": 18, "slot": "R1", "time": "13:30", "slot_no": 2, "date": "2026-10-29", "spec": "Reel 9:16 · 1080×1920 · H.264 MP4 · 30 fps · AAC 48 kHz · safe box x65–1015 / y270–1250 · burned-in captions y1050–1250 · cover title inside centre 1080×1350", "post_no": 70, "caption_full": "Ten tabs of AI news every morning? I replaced them with one email that an n8n workflow writes at 7 AM:\n\n1. Reads the RSS feeds of official blogs I trust (RSS = a simple public feed most blogs offer)\n2. Keeps only the last 24 hours, removes repeats\n3. AI writes 2 lines per story + why it matters\n4. Every line keeps the original link, and I click before I share anything\n\nTen sites become one email. Works for any industry, competitor blogs or job posts.\n\nWhat would you put in yours? If you want one for your field, I can build it. Just send me the sites.\n\n#n8n #automation #AInews", "pillar_name": "Automation & n8n", "src": [], "wps": 2.04}, {"id": "D18-I2", "type": "image", "series": "Steal This Prompt", "pillar": "WF", "format": "Flow diagram", "topic": "1 video → 5 posts, without sounding like a robot", "human_problem": "Making one good video and having nothing else to post for the week.", "objective": "Saves among creators and small businesses", "hook": "1 video → 5 posts, without sounding like a robot", "main_idea": "Repurpose your own video by extracting ideas with timestamps, drafting with AI, and rewriting hooks yourself.", "takeaway": "Pull five ideas from your own video's transcript, draft with AI, and rewrite every hook yourself.", "value": "A 5-step repurposing workflow that respects originality rules.", "cta": "Save it.", "cta_type": "save", "visual_concept": "One video icon branching into five post icons.", "design": {"headline": "1 video → 5 posts, without sounding like a robot", "body": ["1. Get the transcript of your own video.", "2. “List the 5 most useful ideas, in my words, with timestamps.”", "3. For each idea: one image post, one short caption.", "4. Rewrite every hook yourself. AI drafts, you decide.", "5. Post them days apart, not all at once."], "footer": "Repurpose your content, not other people's.", "layout": "Light background. Left: one video tile. Five arrows fan out to five small post tiles on the right. Steps listed below. Footer bottom."}, "caption": "One good video can become 5 posts, without sounding like AI wrote them:\n\n1. Get the transcript of your own video\n2. “List the 5 most useful ideas, in my words, with timestamps.”\n3. For each idea: one image post + one short caption\n4. Rewrite every hook yourself. AI drafts, you decide.\n5. Spread them across the week\n\nOnly repurpose your own content. Facebook now reduces reach for reposted content.\n\nTry it on your last video.\n", "hashtags": ["contentcreation", "AItips", "socialmedia"], "sources": ["meta_original_2026"], "production_notes": "Flow-fan template.", "day": 18, "slot": "I2", "time": "18:30", "slot_no": 3, "date": "2026-10-29", "spec": "Feed image 4:5 · 1440×1800 PNG (sRGB) · text ≥90 px from edges · headline ≥88 px, body ≥44 px · ≤75 words on image", "post_no": 71, "caption_full": "One good video can become 5 posts, without sounding like AI wrote them:\n\n1. Get the transcript of your own video\n2. “List the 5 most useful ideas, in my words, with timestamps.”\n3. For each idea: one image post + one short caption\n4. Rewrite every hook yourself. AI drafts, you decide.\n5. Spread them across the week\n\nOnly repurpose your own content. Facebook now reduces reach for reposted content.\n\nTry it on your last video.\n\n#contentcreation #AItips #socialmedia", "pillar_name": "Workflows & productivity", "src": [{"t": "Rewarding Original Creators on Facebook", "u": "https://about.fb.com/news/2026/03/rewarding-original-creators-on-facebook/", "p": "Meta Newsroom", "d": "2026-03", "v": false}], "wps": null}, {"id": "D18-R2", "type": "reel", "series": "Work With Me", "pillar": "SVC", "format": "Numbered list + talking head", "topic": "5 questions to ask before hiring an automation freelancer", "human_problem": "Paying someone to automate, then being stuck when they disappear or it breaks.", "objective": "Trust-building service post; Messenger leads", "hook": "A freelancer builds your automation, then disappears.", "open_loop": "What do I ask before hiring so that doesn't happen to me?", "main_idea": "Ownership, failure handling, test data, monthly cost and handover separate professionals from risky builds.", "takeaway": "Before hiring an automation builder, ask about account ownership, alerts, test data, running costs and a handover guide.", "value": "A buyer's checklist that protects business owners, and positions Asif as transparent.", "payoff": "3–33 s: five questions to ask; 33–39 s: the red flag to walk away from.", "cta": "Message 'AUTOMATE' and ask all five.", "cta_type": "message", "visual_concept": "Numbered question cards; a red-flag card; Asif inviting the questions.", "runtime": 48, "retention": {"hook": "A real fear for owners (the builder vanishes) is stated before any advice.", "usefulness": "Five concrete questions anyone can ask any freelancer.", "relatability": "Many owners have had a freelancer disappear with access to their accounts.", "visual_progression": "A new numbered card every ~5 s, then a red-flag reveal.", "payoff": "Ends with Asif inviting viewers to ask him the same five questions, a confident close."}, "script": [{"t": "0-3", "vo": "A freelancer builds your automation, then disappears.", "ost": "Builder disappears. Now what?", "vis": "An n8n canvas with a red error node; a chat with the builder shows 'last seen 3 weeks ago' (dramatized)."}, {"t": "3-8", "vo": "Avoid that with five questions. One: whose accounts will it run on?", "ost": "1 · Whose accounts?", "vis": "Card 1."}, {"t": "8-13", "vo": "It should be yours. If they leave, you keep it.", "ost": "Yours. They leave, you keep it.", "vis": "Card 1 detail."}, {"t": "13-18", "vo": "Two: what happens when it fails? Ask who gets the alert.", "ost": "2 · Who gets the alert?", "vis": "Card 2."}, {"t": "18-23", "vo": "Three: can I see it work with test data before going live?", "ost": "3 · Test data first?", "vis": "Card 3."}, {"t": "23-28", "vo": "Four: what will it cost every month to run? Server, AI, apps.", "ost": "4 · Monthly cost?", "vis": "Card 4."}, {"t": "28-33", "vo": "Five: do I get a guide, so someone else can fix it later?", "ost": "5 · A handover guide?", "vis": "Card 5."}, {"t": "33-39", "vo": "Red flag: anyone promising one hundred percent automation with no human ever.", "ost": "Red flag: “100% automated”", "vis": "Red flag animation."}, {"t": "39-43.5", "vo": "These are questions I'm happy to answer before every project.", "ost": "Ask me these too", "vis": "Asif to camera."}, {"t": "43.5-48", "vo": "Have a task to automate? Message me. Ask me all five.", "ost": "Message me · ask all five", "vis": "End card."}], "caption": "A freelancer builds your automation, then disappears. Avoid that. Ask these 5 questions before you hire anyone:\n\n1. Whose accounts will it run on? (Should be yours. If they leave, you keep it.)\n2. What happens when it fails, and who gets the alert?\n3. Can I see it work with test data before it goes live?\n4. What will it cost every month to run (server, AI, apps)?\n5. Do I get a written guide, so someone else can fix it later?\n\nRed flag: anyone promising “100% automated, no human ever”.\n\nI'm happy to answer all five before any project. Have a repetitive task you want to automate? Message me.\n", "hashtags": ["n8n", "automation", "smallbusiness"], "sources": [], "production_notes": "Talking-head list. Only keep 'I'm happy to answer all five' if your process really covers each (see D10-I2).", "day": 18, "slot": "R2", "time": "21:00", "slot_no": 4, "date": "2026-10-29", "spec": "Reel 9:16 · 1080×1920 · H.264 MP4 · 30 fps · AAC 48 kHz · safe box x65–1015 / y270–1250 · burned-in captions y1050–1250 · cover title inside centre 1080×1350", "post_no": 72, "caption_full": "A freelancer builds your automation, then disappears. Avoid that. Ask these 5 questions before you hire anyone:\n\n1. Whose accounts will it run on? (Should be yours. If they leave, you keep it.)\n2. What happens when it fails, and who gets the alert?\n3. Can I see it work with test data before it goes live?\n4. What will it cost every month to run (server, AI, apps)?\n5. Do I get a written guide, so someone else can fix it later?\n\nRed flag: anyone promising “100% automated, no human ever”.\n\nI'm happy to answer all five before any project. Have a repetitive task you want to automate? Message me.\n\n#n8n #automation #smallbusiness", "pillar_name": "Work with me (n8n services)", "src": [], "wps": 2.29}, {"id": "D19-I1", "type": "image", "series": "Automate This", "pillar": "AU", "format": "Comparison table", "topic": "Zapier, Make or n8n? Choose by need, not hype", "human_problem": "Choosing an automation tool because of hype instead of what you actually need.", "objective": "Answer a common buyer question honestly; saves", "hook": "Zapier, Make or n8n? Choose by need, not hype", "main_idea": "Each tool fits a different need: Zapier for the simplest start, Make for visual multi-step flows, n8n for control, AI agents and self-hosting.", "takeaway": "Zapier suits simple quick starts, Make suits visual multi-step flows, and n8n suits control, AI agents and self-hosting.", "value": "A fair, non-salesy comparison with a 'pick this if' rule.", "cta": "Ask which tool viewers use now and whether it fits.", "cta_type": "question", "visual_concept": "Three-column comparison with neutral icons (no logos).", "design": {"headline": "Zapier, Make or n8n? Choose by need, not hype", "body": ["Zapier: easiest start, most ready-made app connections.", "Make: visual flows for multi-step jobs. Pay per usage.", "n8n: visual + code when needed. Self-host or cloud.", "Pick Zapier: you want it simple, today.", "Pick Make: you think visually and need branches.", "Pick n8n: you want control, AI agents, or your own server."], "footer": "Check each tool's current pricing page. They change often.", "layout": "Light background. Top: three equal columns with tool names in plain text. Middle: one-line description per tool. Bottom: three 'Pick … if' rows. Footer small."}, "caption": "Zapier, Make or n8n? Don't pick by hype. Pick by need.\n\nZapier: the easiest start and the most ready-made app connections.\nMake: visual flows for multi-step jobs.\nn8n: visual, with code when you need it. Run it in the cloud or on your own server.\n\nPick Zapier if you want it simple, today.\nPick Make if you think visually and need branches.\nPick n8n if you want control, AI agents, or your own server.\n\nI build in n8n for those reasons, but all three are good tools. Pricing changes often, so check each tool's current pricing page.\n\nWhich one are you using now, and is it the right fit?\n", "hashtags": ["n8n", "Zapier", "automation"], "sources": ["n8n_choose"], "production_notes": "Tool names as plain text only (no logos). Keep it fair. Don't add prices.", "day": 19, "slot": "I1", "time": "09:30", "slot_no": 1, "date": "2026-10-30", "spec": "Feed image 4:5 · 1440×1800 PNG (sRGB) · text ≥90 px from edges · headline ≥88 px, body ≥44 px · ≤75 words on image", "post_no": 73, "caption_full": "Zapier, Make or n8n? Don't pick by hype. Pick by need.\n\nZapier: the easiest start and the most ready-made app connections.\nMake: visual flows for multi-step jobs.\nn8n: visual, with code when you need it. Run it in the cloud or on your own server.\n\nPick Zapier if you want it simple, today.\nPick Make if you think visually and need branches.\nPick n8n if you want control, AI agents, or your own server.\n\nI build in n8n for those reasons, but all three are good tools. Pricing changes often, so check each tool's current pricing page.\n\nWhich one are you using now, and is it the right fit?\n\n#n8n #Zapier #automation", "pillar_name": "Automation & n8n", "src": [{"t": "Choose your n8n", "u": "https://docs.n8n.io/choose-n8n/", "p": "n8n Docs", "d": "current", "v": false}], "wps": null}, {"id": "D19-R1", "type": "reel", "series": "Steal This Prompt", "pillar": "PA", "format": "Prop demo + screen inserts", "topic": "Before you sign anything, ask AI these 4 questions", "human_problem": "Signing agreements you haven't fully read or understood.", "objective": "Saves; practical protection", "hook": "Signing something you haven't fully read?", "open_loop": "Which four questions?", "main_idea": "Redact personal data, then ask about payments/dates, one-sided rules, exit terms and unusual clauses with exact quotes.", "takeaway": "Before signing, ask AI about payments, one-sided rules, exit costs and unusual clauses, then read the quoted clause yourself.", "value": "A 4-question contract reading method + clear 'not legal advice' boundary.", "payoff": "7.5–28 s: payments, one-sided rules, exit costs and unusual clauses, each with the exact quote.", "cta": "Save the four questions.", "cta_type": "save", "visual_concept": "Long agreement on paper → marker redaction → AI answers with highlighted clauses.", "runtime": 45, "retention": {"hook": "Most people have signed something they didn't fully read; the question makes them admit it to themselves.", "relatability": "Rental agreements, job contracts and app terms are everyday documents.", "usefulness": "Four specific questions + the redaction step.", "novelty": "'What can they do that I can't?' is a sharp question most people never ask.", "save_share": "A list people keep for the next contract."}, "script": [{"t": "0-3", "vo": "Signing something you haven't fully read?", "ost": "Haven't read it all?", "vis": "Asif holding a long printed agreement."}, {"t": "3-7.5", "vo": "Ask AI four questions first. Remove ID numbers before you upload.", "ost": "4 questions · remove IDs first", "vis": "Marker redacting personal details."}, {"t": "7.5-12.5", "vo": "One: “List every amount I pay, and every date.”", "ost": "1 · Every amount + date", "vis": "AI answer list."}, {"t": "12.5-17.5", "vo": "Two: “What can they do that I can't?” This finds one-sided rules.", "ost": "2 · What can they do that I can't?", "vis": "One-sided clause highlighted."}, {"t": "17.5-22.5", "vo": "Three: “How do I get out, and what does it cost me?”", "ost": "3 · How do I exit? Cost?", "vis": "Exit clause answer."}, {"t": "22.5-28", "vo": "Four: “What's unusual here? Quote the exact clause.”", "ost": "4 · What's unusual? Quote it.", "vis": "Quoted clause highlighted."}, {"t": "28-33", "vo": "The quote matters. You check the real words, not the AI's summary.", "ost": "Check the real words", "vis": "Clause and summary side by side."}, {"t": "33-38", "vo": "This isn't legal advice. For big contracts, take these answers to a lawyer.", "ost": "Not legal advice", "vis": "Asif to camera."}, {"t": "38-42", "vo": "You'll ask better questions, and pay for less time.", "ost": "Better questions", "vis": "Asif to camera."}, {"t": "42-45", "vo": "Four questions. Before every signature.", "ost": "Before every signature", "vis": "End card."}], "caption": "Signing something you haven't fully read? Rent, job, freelance, app terms: ask AI 4 questions first.\n\nFirst, remove your ID numbers, signatures and account details.\n\n1. “List every amount I pay, and every date.”\n2. “What can they do that I can't?” (finds one-sided rules)\n3. “How do I get out, and what does it cost me?”\n4. “What's unusual compared with similar agreements? Quote the exact clause.”\n\nAlways read the quoted clause yourself.\n\nNot legal advice. For big contracts, take these answers to a lawyer. You'll ask better questions and pay for less time.\n\nKeep these for the next agreement someone hands you.\n", "hashtags": ["AItips", "contracts", "ChatGPT"], "sources": [], "production_notes": "Use a sample agreement template (public-domain or self-written). Never show a real person's contract.", "day": 19, "slot": "R1", "time": "13:30", "slot_no": 2, "date": "2026-10-30", "spec": "Reel 9:16 · 1080×1920 · H.264 MP4 · 30 fps · AAC 48 kHz · safe box x65–1015 / y270–1250 · burned-in captions y1050–1250 · cover title inside centre 1080×1350", "post_no": 74, "caption_full": "Signing something you haven't fully read? Rent, job, freelance, app terms: ask AI 4 questions first.\n\nFirst, remove your ID numbers, signatures and account details.\n\n1. “List every amount I pay, and every date.”\n2. “What can they do that I can't?” (finds one-sided rules)\n3. “How do I get out, and what does it cost me?”\n4. “What's unusual compared with similar agreements? Quote the exact clause.”\n\nAlways read the quoted clause yourself.\n\nNot legal advice. For big contracts, take these answers to a lawyer. You'll ask better questions and pay for less time.\n\nKeep these for the next agreement someone hands you.\n\n#AItips #contracts #ChatGPT", "pillar_name": "Practical AI", "src": [], "wps": 2.16}, {"id": "D19-I2", "type": "image", "series": "Steal This Prompt", "pillar": "PA", "format": "Before/after card", "topic": "Rambling AI answers? Add the reader and a limit", "human_problem": "AI answers that are long, general and hard to use.", "objective": "Saves; quick prompting win", "hook": "Rambling AI answers? Add these 2 things", "main_idea": "Naming the reader and setting a hard limit fixes most rambling answers.", "takeaway": "Name the reader and set a hard length limit to stop rambling AI answers.", "value": "Two simple constraints with examples and a before/after.", "cta": "Save it.", "cta_type": "save", "visual_concept": "Long scroll of text (before) vs five neat lines (after).", "design": {"headline": "Rambling AI answers? Add these 2 things", "body": ["1. The reader: “for a busy shop owner” or “for my 12-year-old”", "2. A hard limit: “under 80 words” or “5 bullets”", "Before: 400 words about everything.", "After: 5 lines you can actually use."], "footer": "Who it's for + how long. Two lines, much better answers.", "layout": "Light background. Left: a long grey scrolling text block labelled 'Before'. Right: five short accent lines labelled 'After'. Two rules on top. Footer bottom."}, "caption": "AI answers too long and too general? Add 2 things to your prompt:\n\n1. The reader: “for a busy shop owner”, “for my 12-year-old”, “for my manager”\n2. A hard limit: “under 80 words”, “5 bullets”, “one paragraph”\n\nBefore: 400 words about everything.\nAfter: 5 lines you can actually use. Add both to your next prompt and compare.\n", "hashtags": ["AItips", "ChatGPT", "productivity"], "sources": [], "production_notes": "Before/after template.", "day": 19, "slot": "I2", "time": "18:30", "slot_no": 3, "date": "2026-10-30", "spec": "Feed image 4:5 · 1440×1800 PNG (sRGB) · text ≥90 px from edges · headline ≥88 px, body ≥44 px · ≤75 words on image", "post_no": 75, "caption_full": "AI answers too long and too general? Add 2 things to your prompt:\n\n1. The reader: “for a busy shop owner”, “for my 12-year-old”, “for my manager”\n2. A hard limit: “under 80 words”, “5 bullets”, “one paragraph”\n\nBefore: 400 words about everything.\nAfter: 5 lines you can actually use. Add both to your next prompt and compare.\n\n#AItips #ChatGPT #productivity", "pillar_name": "Practical AI", "src": [], "wps": null}, {"id": "D19-R2", "type": "reel", "series": "AI Myth Check", "pillar": "LIT", "format": "Green screen + talking head", "topic": "AI detectors flag real human writing", "human_problem": "Students being accused of using AI because a detector flagged their honest work.", "objective": "Shares among teachers, students and employers", "hook": "AI detectors flagged real student essays as AI.", "open_loop": "Why would a detector flag real writing?", "main_idea": "Studies and OpenAI's own experience show AI-text detectors are unreliable, especially for non-native English writers; a score is not proof.", "takeaway": "AI-text detectors often flag real writing, especially by non-native English writers, so a score is not proof.", "value": "Evidence-based warning + a fairer alternative (ask about drafts and process).", "payoff": "22.5–37 s: simple writing looks 'predictable'; a score is not proof; ask about drafts instead.", "cta": "Send it to a teacher.", "cta_type": "share", "visual_concept": "Asif on green screen over the Patterns paper and the 2023 TechCrunch headline; simple stat cards.", "runtime": 42, "retention": {"hook": "A surprising, unfair outcome (real essays flagged) creates instant concern.", "novelty": "Most people assume detectors work; OpenAI withdrawing its own is surprising.", "relatability": "Students in Bangladesh write in English as a second language, exactly the group the study found most affected.", "payoff": "Clear guidance for teachers and employers: a score is not proof.", "save_share": "Students will forward this to teachers, and teachers to colleagues."}, "script": [{"t": "0-3", "vo": "AI detectors flagged real student essays as AI.", "ost": "Real essays. Flagged as AI.", "vis": "Asif on green screen; the Patterns paper title behind him (own capture)."}, {"t": "3-8", "vo": "Stanford researchers tested seven detectors on essays by non-native English speakers.", "ost": "7 detectors · 91 essays", "vis": "Paper detail highlighted."}, {"t": "8-12.5", "vo": "More than half were wrongly labelled as AI.", "ost": ">50% wrongly flagged", "vis": "Bar animation."}, {"t": "12.5-17.5", "vo": "Even OpenAI shut down its own detector in 2023 for low accuracy.", "ost": "OpenAI's own detector: shut down", "vis": "Headline capture (TechCrunch, Jul 2023)."}, {"t": "17.5-22.5", "vo": "It caught only 26 percent of AI text, and flagged real writing too.", "ost": "Caught 26% · flagged humans 9%", "vis": "Stat cards."}, {"t": "22.5-27", "vo": "Why? Simple, clear writing looks ‘predictable’, and that's what detectors look for.", "ost": "Simple writing = 'looks AI'", "vis": "Asif to camera."}, {"t": "27-32", "vo": "So teachers and employers: a detector score is not proof.", "ost": "A score is not proof", "vis": "Card."}, {"t": "32-37", "vo": "Ask about the work instead. Drafts, notes, a short conversation.", "ost": "Ask about drafts + notes", "vis": "Card."}, {"t": "37-42", "vo": "Send this to a teacher you know.", "ost": "Send to a teacher", "vis": "End card."}], "caption": "AI detectors labelled real student essays as AI-written.\n\n• Stanford researchers ran 91 essays by non-native English writers through 7 popular detectors. More than half were wrongly flagged as AI. (Patterns, 2023)\n• OpenAI shut down its own detector in July 2023 for “low accuracy”. It caught 26% of AI text and flagged 9% of human text as AI.\n\nWhy: simple, clear writing looks “predictable”, which is what detectors measure.\n\nTeachers and employers: a detector score is not proof. Ask about drafts, notes, or have a short conversation about the work.\n\nSend this to a teacher you know.\n", "hashtags": ["AIliteracy", "education", "students"], "sources": ["liang_detectors", "openai_classifier"], "production_notes": "Capture source pages from your own screen for ≤3 s each. Don't name or show any specific commercial detector product.", "day": 19, "slot": "R2", "time": "21:00", "slot_no": 4, "date": "2026-10-30", "spec": "Reel 9:16 · 1080×1920 · H.264 MP4 · 30 fps · AAC 48 kHz · safe box x65–1015 / y270–1250 · burned-in captions y1050–1250 · cover title inside centre 1080×1350", "post_no": 76, "caption_full": "AI detectors labelled real student essays as AI-written.\n\n• Stanford researchers ran 91 essays by non-native English writers through 7 popular detectors. More than half were wrongly flagged as AI. (Patterns, 2023)\n• OpenAI shut down its own detector in July 2023 for “low accuracy”. It caught 26% of AI text and flagged 9% of human text as AI.\n\nWhy: simple, clear writing looks “predictable”, which is what detectors measure.\n\nTeachers and employers: a detector score is not proof. Ask about drafts, notes, or have a short conversation about the work.\n\nSend this to a teacher you know.\n\n#AIliteracy #education #students", "pillar_name": "AI literacy & safety", "src": [{"t": "GPT detectors are biased against non-native English writers", "u": "https://www.cell.com/patterns/fulltext/S2666-3899(23)00130-7", "p": "Patterns (Cell Press), Liang et al.", "d": "2023-07", "v": false}, {"t": "OpenAI scuttles AI-written text detector over 'low rate of accuracy'", "u": "https://techcrunch.com/2023/07/25/openai-scuttles-ai-written-text-detector-over-low-rate-of-accuracy/", "p": "TechCrunch", "d": "2023-07-25", "v": false}], "wps": 2.17}, {"id": "D20-I1", "type": "image", "series": "Hidden Button", "pillar": "HF", "format": "Hidden feature card", "topic": "ChatGPT Library: pull files from your cloud drive with @", "human_problem": "Downloading files from Drive or Dropbox just to upload them into ChatGPT.", "objective": "Saves; timely feature awareness", "hook": "Stop downloading files just to show ChatGPT", "main_idea": "Since Sept 2026, ChatGPT's Library connects Google Drive, Dropbox, Box and SharePoint; add files with @ or 'Add from Library'.", "takeaway": "ChatGPT's Library can pull files from Google Drive, Dropbox, Box and SharePoint with an @ mention.", "value": "How to use it + a privacy reminder.", "cta": "None. Ends with a privacy and plan check.", "cta_type": "none", "visual_concept": "Chat input with '@' and a dropdown of file icons from four cloud services (drawn, no logos).", "design": {"headline": "Stop downloading files just to show ChatGPT", "body": ["Library connects Google Drive, Dropbox, Box and SharePoint (Sept 2026).", "Type @ in a chat to add a file, or use Add from Library.", "Ask: “Compare these two quotes.” No downloading needed.", "Only connect accounts you're comfortable sharing."], "footer": "Features vary by plan. Check your ChatGPT settings.", "layout": "Light background. Drawn chat input with an '@' and a dropdown listing 3 generic file icons. Rows below. Footer small."}, "caption": "Still downloading files just to upload them to ChatGPT? It can now pull them straight from your cloud storage.\n\nSince 10 Sept 2026, ChatGPT's Library connects Box, Dropbox and SharePoint, alongside Google Drive. Once connected:\n• type @ in a chat to add a file, or use “Add from Library”\n• ask: “Compare these two quotes” or “Summarise the changes in v2”, no downloading needed\n\nOnly connect accounts you're comfortable sharing, and check what's available on your plan.\n", "hashtags": ["ChatGPT", "productivity", "AItips"], "sources": ["openai_release_notes"], "production_notes": "Re-check the release note and plan availability the day before posting. Draw UI; no third-party logos.", "day": 20, "slot": "I1", "time": "09:30", "slot_no": 1, "date": "2026-10-31", "spec": "Feed image 4:5 · 1440×1800 PNG (sRGB) · text ≥90 px from edges · headline ≥88 px, body ≥44 px · ≤75 words on image", "post_no": 77, "caption_full": "Still downloading files just to upload them to ChatGPT? It can now pull them straight from your cloud storage.\n\nSince 10 Sept 2026, ChatGPT's Library connects Box, Dropbox and SharePoint, alongside Google Drive. Once connected:\n• type @ in a chat to add a file, or use “Add from Library”\n• ask: “Compare these two quotes” or “Summarise the changes in v2”, no downloading needed\n\nOnly connect accounts you're comfortable sharing, and check what's available on your plan.\n\n#ChatGPT #productivity #AItips", "pillar_name": "Hidden features & tools", "src": [{"t": "ChatGPT — Release Notes", "u": "https://help.openai.com/en/articles/6825453-chatgpt-release-notes", "p": "OpenAI Help Center", "d": "2026-09", "v": true}], "wps": null}, {"id": "D20-R1", "type": "reel", "series": "Automate This", "pillar": "AU", "format": "Phone-in-hand demo + canvas inserts", "topic": "Snap a receipt, get a spreadsheet row (Telegram bot + n8n)", "human_problem": "Losing receipts and spending month-end piecing your expenses back together.", "objective": "Proof of skill; relatable use case", "hook": "Month end. Receipts everywhere. Again.", "open_loop": "How does a photo become a correct spreadsheet row?", "main_idea": "A Telegram bot built in n8n reads receipt photos with AI, validates numbers, asks when unsure, logs to Sheets and confirms.", "takeaway": "A Telegram bot built in n8n can turn receipt photos into checked spreadsheet rows and ask you when it's unsure.", "value": "Shows AI + automation with a safety check (ask instead of guess).", "payoff": "11.5–41 s: AI reads it, checks the numbers, asks when unsure, logs it and confirms; month-end totals are ready.", "cta": "Soft service line in the caption only.", "cta_type": "soft", "visual_concept": "Mostly phone-in-hand: snapping a real receipt, sending it to the bot, getting the confirmation; brief canvas and sheet inserts between.", "runtime": 48, "retention": {"hook": "Starts from the month-end receipt mess everyone recognises, then shows the photo-to-row fix.", "relatability": "Everyone loses receipts; small teams track expenses badly.", "visual_progression": "Photo, canvas, extracted fields, check, row, reply: six visual states.", "novelty": "A bot that asks when it can't read the total is a smart detail.", "payoff": "Month-end totals already done."}, "script": [{"t": "0-3", "vo": "Month end. Receipts everywhere. Again.", "ost": "Receipts everywhere. Again.", "vis": "A messy pile of receipts on a desk; Asif picks one up and snaps it."}, {"t": "3-7", "vo": "So I send each one to a Telegram bot instead.", "ost": "Snap → bot → sheet", "vis": "Canvas overview."}, {"t": "7-11.5", "vo": "I send a photo. The workflow receives it instantly.", "ost": "1 · Photo arrives", "vis": "Telegram trigger node."}, {"t": "11.5-17", "vo": "An AI model reads it: shop, date, total, and a category.", "ost": "2 · AI reads shop · date · total", "vis": "Extracted fields shown as a simple card."}, {"t": "17-22", "vo": "Then a check: is the total a real number? Is the date valid?", "ost": "3 · Check the numbers", "vis": "IF node with two conditions."}, {"t": "22-27", "vo": "If something's unclear, the bot asks me instead of guessing.", "ost": "Unclear? It asks.", "vis": "Bot message: 'I can't read the total. What was it?'"}, {"t": "27-31.5", "vo": "Then it adds the row to my Google Sheet.", "ost": "4 · Add to the sheet", "vis": "Row appears."}, {"t": "31.5-36", "vo": "And replies: “Saved, 850 taka, groceries. Correct?”", "ost": "“Saved: Tk 850 · Groceries”", "vis": "Bot reply on phone."}, {"t": "36-41", "vo": "Month end, the totals are already there. No pile of receipts.", "ost": "Month end: done", "vis": "Sheet summary with totals by category."}, {"t": "41-45", "vo": "Which messy pile would you hand to a bot?", "ost": "Your messy pile?", "vis": "Asif to camera."}, {"t": "45-48", "vo": "Follow for more builds.", "ost": "Follow", "vis": "End card."}], "caption": "Month end. Receipts everywhere. Again. So now I send each one to a Telegram bot built in n8n:\n\n1. Send the bot a photo of a receipt\n2. An AI model reads the shop, date, total and picks a category\n3. A check: is the total a real number, is the date valid?\n4. If anything is unclear, the bot asks you instead of guessing\n5. It adds a row to Google Sheets and replies: “Saved: Tk 850, Groceries. Correct?”\n\nMonth end, the totals are already there.\n\nThis is the kind of thing I build for clients. Ask if you want one for your team.\n", "hashtags": ["n8n", "Telegram", "automation"], "sources": [], "production_notes": "Build a demo bot (Telegram Trigger → download file → AI vision model → IF → Google Sheets → Telegram reply). Use your own receipts with personal data covered. The vision step must receive the actual image file (not just a file ID). Test this before filming.", "day": 20, "slot": "R1", "time": "13:30", "slot_no": 2, "date": "2026-10-31", "spec": "Reel 9:16 · 1080×1920 · H.264 MP4 · 30 fps · AAC 48 kHz · safe box x65–1015 / y270–1250 · burned-in captions y1050–1250 · cover title inside centre 1080×1350", "post_no": 78, "caption_full": "Month end. Receipts everywhere. Again. So now I send each one to a Telegram bot built in n8n:\n\n1. Send the bot a photo of a receipt\n2. An AI model reads the shop, date, total and picks a category\n3. A check: is the total a real number, is the date valid?\n4. If anything is unclear, the bot asks you instead of guessing\n5. It adds a row to Google Sheets and replies: “Saved: Tk 850, Groceries. Correct?”\n\nMonth end, the totals are already there.\n\nThis is the kind of thing I build for clients. Ask if you want one for your team.\n\n#n8n #Telegram #automation", "pillar_name": "Automation & n8n", "src": [], "wps": 2.04}, {"id": "D20-I2", "type": "image", "series": "Work With Me", "pillar": "SVC", "format": "Checklist", "topic": "Before you automate: is your business ready?", "human_problem": "Paying for automation before the business process is ready for it.", "objective": "Qualify leads; reduce failed projects", "hook": "Before you automate: is your business ready?", "main_idea": "Readiness = clear steps, digital data, weekly repetition, a definition of done, and an owner.", "takeaway": "Automation works when the task is clear, digital, weekly, has a defined end and has an owner.", "value": "A readiness checklist that helps owners prepare (and helps Asif get better leads).", "cta": "Ask how many boxes viewers ticked.", "cta_type": "question", "visual_concept": "Clipboard checklist with five boxes.", "design": {"headline": "Before you automate: is your business ready?", "body": ["☐ You can explain the task step by step.", "☐ The data lives somewhere digital: a sheet, inbox or form.", "☐ The task repeats every week.", "☐ You know what 'done' looks like.", "☐ Someone will own it after launch."], "footer": "Missing some? Fix those first.", "layout": "Light background. Clipboard illustration with five checkbox rows. Footer as a short bold line under the clipboard."}, "caption": "Before you pay anyone to automate, check that your business is ready:\n\n☐ You can explain the task step by step\n☐ The data lives somewhere digital (a sheet, an inbox, a form), not only in a notebook\n☐ The task repeats every week\n☐ You know what “done” looks like\n☐ Someone will own it after launch\n\nMissing some? Fix those first. It'll save you money.\nHow many boxes did you tick?\n", "hashtags": ["automation", "smallbusiness", "n8n"], "sources": [], "production_notes": "Checklist template.", "day": 20, "slot": "I2", "time": "18:30", "slot_no": 3, "date": "2026-10-31", "spec": "Feed image 4:5 · 1440×1800 PNG (sRGB) · text ≥90 px from edges · headline ≥88 px, body ≥44 px · ≤75 words on image", "post_no": 79, "caption_full": "Before you pay anyone to automate, check that your business is ready:\n\n☐ You can explain the task step by step\n☐ The data lives somewhere digital (a sheet, an inbox, a form), not only in a notebook\n☐ The task repeats every week\n☐ You know what “done” looks like\n☐ Someone will own it after launch\n\nMissing some? Fix those first. It'll save you money.\nHow many boxes did you tick?\n\n#automation #smallbusiness #n8n", "pillar_name": "Work with me (n8n services)", "src": [], "wps": null}, {"id": "D20-R2", "type": "reel", "series": "Work With Me", "pillar": "SVC", "format": "Diagram explainer + talking head", "topic": "A website chat that only answers from your documents (RAG explained)", "human_problem": "Website chatbots giving customers confident but wrong answers about your business.", "objective": "Sell the website assistant service; educate on RAG", "hook": "Most website chatbots guess. This one reads first.", "open_loop": "How does it know what to say about my business?", "main_idea": "A retrieval-based assistant searches your files, answers only from matching passages, shows sources and hands over when the answer isn't there.", "takeaway": "A retrieval-based assistant answers only from your documents and hands over to a person when the answer isn't there.", "value": "Explains RAG simply and why it beats a generic chatbot for business.", "payoff": "7.5–27 s: search your files, pick matching parts, answer only from those, hand over if not found.", "cta": "Message 'AUTOMATE' and send your FAQ.", "cta_type": "message", "visual_concept": "Website chat widget → document icons → highlighted paragraphs → answer with source tag → human fallback.", "runtime": 46, "retention": {"hook": "Contrasts a common annoyance (bots that guess) with a better approach in one line.", "problem_solution": "Shows a normal bot guessing, then the document-grounded approach.", "visual_progression": "Documents → highlighted passages → sourced answer → fallback, each step visible.", "novelty": "Explains 'RAG' in plain words, a term many have heard but few understand.", "payoff": "Updating a price list instantly updates answers, a concrete business benefit."}, "script": [{"t": "0-3", "vo": "Most website chatbots guess. This one reads first.", "ost": "Guessing bot vs reading bot", "vis": "Website chat widget answers 'Do you deliver to Chattogram?'"}, {"t": "3-7.5", "vo": "Normal chatbots answer from the internet, or make things up.", "ost": "Normal bots: guess", "vis": "Example of a wrong generic answer."}, {"t": "7.5-12", "vo": "This one searches your files first. Price list, policies, FAQs.", "ost": "1 · Search your files", "vis": "Document icons."}, {"t": "12-17", "vo": "It picks the few paragraphs that match the question.", "ost": "2 · Pick matching parts", "vis": "Paragraphs highlight."}, {"t": "17-22", "vo": "Then it answers using only those, and can show where it came from.", "ost": "3 · Answer from those only", "vis": "Answer with 'Source: Delivery policy' tag."}, {"t": "22-27", "vo": "Not in your documents? It says so, and offers a human.", "ost": "Not found → a human", "vis": "Fallback message."}, {"t": "27-32", "vo": "The technical name is RAG: retrieval, then generation. Find, then answer.", "ost": "RAG = find, then answer", "vis": "Two-step diagram."}, {"t": "32-37", "vo": "Update the price list, and the answers update too. No retraining.", "ost": "Update a file → answers update", "vis": "File edit → new answer."}, {"t": "37-42", "vo": "Want one for your website or page? Message me AUTOMATE.", "ost": "Message: AUTOMATE", "vis": "Asif to camera."}, {"t": "42-46", "vo": "Send me your FAQ. I'll show you.", "ost": "Send your FAQ", "vis": "End card."}], "caption": "Most website chatbots guess. This one reads your documents first, and answers only from them.\n\nHow it works:\n1. Searches your files first: price list, delivery policy, FAQs\n2. Picks the few paragraphs that match the question\n3. Answers using only those, and can show the source\n4. Not in your documents? It says so and offers a human\n\nThe technical name is RAG (retrieval-augmented generation): find, then answer. Update your price list and the answers update too, with no retraining.\n\nWant one for your website or page? Message me “AUTOMATE” and send your FAQ.\n", "hashtags": ["AIchatbot", "n8n", "smallbusiness"], "sources": [], "production_notes": "Demo with a fictional shop's documents. If showing your 'Website AI Agent' workflow, confirm it actually retrieves document text (not just file names) before claiming 'answers from your documents'. Build a dedicated demo if needed.", "day": 20, "slot": "R2", "time": "21:00", "slot_no": 4, "date": "2026-10-31", "spec": "Reel 9:16 · 1080×1920 · H.264 MP4 · 30 fps · AAC 48 kHz · safe box x65–1015 / y270–1250 · burned-in captions y1050–1250 · cover title inside centre 1080×1350", "post_no": 80, "caption_full": "Most website chatbots guess. This one reads your documents first, and answers only from them.\n\nHow it works:\n1. Searches your files first: price list, delivery policy, FAQs\n2. Picks the few paragraphs that match the question\n3. Answers using only those, and can show the source\n4. Not in your documents? It says so and offers a human\n\nThe technical name is RAG (retrieval-augmented generation): find, then answer. Update your price list and the answers update too, with no retraining.\n\nWant one for your website or page? Message me “AUTOMATE” and send your FAQ.\n\n#AIchatbot #n8n #smallbusiness", "pillar_name": "Work with me (n8n services)", "src": [], "wps": 2.17}, {"id": "D21-I1", "type": "image", "series": "Steal This Prompt", "pillar": "PA", "format": "Prompt card", "topic": "The 'don't use these words' line for AI writing", "human_problem": "AI drafts that readers instantly recognise as AI.", "objective": "Saves; makes AI writing sound human", "hook": "Add this line to every AI writing prompt", "main_idea": "Banning the most common AI-cliché words and asking for a 'texting a colleague' tone makes AI drafts sound human.", "takeaway": "Ban AI's favourite filler words in your prompt and ask it to write like a person texting a colleague.", "value": "A ready-made ban list + replacement instruction.", "cta": "Save it.", "cta_type": "save", "visual_concept": "Words in a 'banned' style (struck-through chips) + one green instruction chip.", "allow_banned": true, "design": {"headline": "Add this line to every AI writing prompt", "subhead": "“Don't use these words:”", "body": ["delve · unlock · elevate · leverage · seamless", "game-changer · robust · cutting-edge · tapestry", "“In today's fast-paced world…”", "Ask instead: “Write like a person texting a colleague.”"], "footer": "Readers spot these words in a second.", "layout": "Dark background. Headline + subhead. Grid of red struck-through word chips. One green chip with the 'Ask instead' line. Footer bottom."}, "caption": "The fastest way to make AI writing sound less like AI: ban its favourite words.\n\nAdd this to your prompt:\n“Don't use these words: delve, unlock, elevate, leverage, seamless, game-changer, robust, cutting-edge, tapestry, ‘in today's fast-paced world’. Write like a person texting a colleague.”\n\nReaders spot these words in a second, and stop trusting the rest.\n", "hashtags": ["AIwriting", "copywriting", "AItips"], "sources": [], "production_notes": "This post intentionally lists banned words (allow_banned). Strike-through chips make it clear they are examples to avoid.", "day": 21, "slot": "I1", "time": "09:30", "slot_no": 1, "date": "2026-11-01", "spec": "Feed image 4:5 · 1440×1800 PNG (sRGB) · text ≥90 px from edges · headline ≥88 px, body ≥44 px · ≤75 words on image", "post_no": 81, "caption_full": "The fastest way to make AI writing sound less like AI: ban its favourite words.\n\nAdd this to your prompt:\n“Don't use these words: delve, unlock, elevate, leverage, seamless, game-changer, robust, cutting-edge, tapestry, ‘in today's fast-paced world’. Write like a person texting a colleague.”\n\nReaders spot these words in a second, and stop trusting the rest.\n\n#AIwriting #copywriting #AItips", "pillar_name": "Practical AI", "src": [], "wps": null}, {"id": "D21-R1", "type": "reel", "series": "Hidden Button", "pillar": "HF", "format": "Talking head + screen split", "topic": "Meta AI can dub your Reels into Bengali in your own voice", "human_problem": "Creators choosing between an English and a Bangla audience for every Reel.", "objective": "Shares among creators; reach for this page in Bengali", "hook": "Your Reel, in Bengali, in your voice.", "open_loop": "Does the dub really sound like me?", "main_idea": "Meta AI translates, dubs and lip-syncs Reels into Bengali and other languages for free; creators can review or turn it off.", "takeaway": "Meta AI can dub your Reels into Bengali in your own voice for free, so one Reel can reach two audiences.", "value": "How to find it, when to use lip sync, and why it doubles a Reel's potential audience.", "payoff": "13–29 s: a tone-matched dub, lip sync, and how to turn it on and review it.", "cta": "None. Ends with 'turn it on for your next Reel'.", "cta_type": "none", "visual_concept": "Split: Asif speaking English vs same clip labelled 'Bengali dub'; own screen capture of the composer option.", "runtime": 42, "retention": {"hook": "Hearing yourself in another language is a novel, slightly magical promise.", "novelty": "Bengali support is recent and many local creators don't know it exists.", "relatability": "Creators here constantly choose between English and Bangla audiences.", "usefulness": "Where to find the option, plus the lip-sync and review tips.", "save_share": "Creators share platform features in their groups."}, "script": [{"t": "0-3", "vo": "Your Reel, in Bengali, in your voice.", "ost": "English Reel → Bengali dub", "vis": "Split screen: Asif speaking English (left) and the same clip labelled 'বাংলা' (right)."}, {"t": "3-8", "vo": "Meta AI can now translate, dub, and even lip-sync your Reels.", "ost": "translate · dub · lip-sync", "vis": "Three icons."}, {"t": "8-13", "vo": "Bengali is supported, plus Hindi, Tamil, Spanish and more.", "ost": "Bengali ✓ Hindi ✓ +more", "vis": "Language list."}, {"t": "13-18", "vo": "It copies the tone of your voice, so it still sounds like you.", "ost": "Sounds like you", "vis": "Two matching waveforms."}, {"t": "18-23", "vo": "When you post a Reel, look for the Meta AI translation option.", "ost": "Look for: translate with Meta AI", "vis": "Own screen capture of the composer option."}, {"t": "23-29", "vo": "Turn on lip sync if your face is on screen. Review it before it goes live.", "ost": "Lip sync + review first", "vis": "Preview screen."}, {"t": "29-34", "vo": "It's free. You can switch it off anytime.", "ost": "Free · switch off anytime", "vis": "Toggle off animation."}, {"t": "34-39", "vo": "One English Reel can now reach people who scroll in Bengali.", "ost": "One Reel · two audiences", "vis": "Asif to camera."}, {"t": "39-42", "vo": "Send this to a creator friend.", "ost": "Send to a creator", "vis": "End card."}], "caption": "Your Reels can now speak Bengali in your own voice.\n\nMeta AI can translate, dub and optionally lip-sync Reels. Bengali is supported, along with Hindi, Tamil, Telugu, Marathi, Kannada, Spanish, Portuguese and English.\n\n• When you post a Reel, look for the Meta AI translation option\n• Turn on lip sync if your face is on screen\n• Review the dubbed version before keeping it on\n• It's free, and you can switch it off anytime\n\nOne English Reel can now reach people who scroll in Bengali (and the other way round).\n\nIf you make Reels, turn it on for your next one.\n", "hashtags": ["FacebookReels", "contentcreator", "MetaAI"], "sources": ["meta_translation_bn"], "production_notes": "First confirm the option appears for your Page. If it doesn't, change beat 5 to 'It's rolling out; look for it when you post' and don't show a UI you don't have. Turn it on for this Reel itself so the Bengali version demonstrates the feature.", "day": 21, "slot": "R1", "time": "13:30", "slot_no": 2, "date": "2026-11-01", "spec": "Reel 9:16 · 1080×1920 · H.264 MP4 · 30 fps · AAC 48 kHz · safe box x65–1015 / y270–1250 · burned-in captions y1050–1250 · cover title inside centre 1080×1350", "post_no": 82, "caption_full": "Your Reels can now speak Bengali in your own voice.\n\nMeta AI can translate, dub and optionally lip-sync Reels. Bengali is supported, along with Hindi, Tamil, Telugu, Marathi, Kannada, Spanish, Portuguese and English.\n\n• When you post a Reel, look for the Meta AI translation option\n• Turn on lip sync if your face is on screen\n• Review the dubbed version before keeping it on\n• It's free, and you can switch it off anytime\n\nOne English Reel can now reach people who scroll in Bengali (and the other way round).\n\nIf you make Reels, turn it on for your next one.\n\n#FacebookReels #contentcreator #MetaAI", "pillar_name": "Hidden features & tools", "src": [{"t": "Instagram Empowers Creators to Go Global with Local Voice Translations and Fonts", "u": "https://about.fb.com/news/2025/11/instagram-empowers-creators-to-go-global-with-local-voice-translations-and-fonts/", "p": "Meta Newsroom (expansion also reported by Business Standard, 2026-01-16)", "d": "2025-11", "v": true}], "wps": 2.21}, {"id": "D21-I2", "type": "image", "series": "Automate This", "pillar": "AU", "format": "Annotated spreadsheet", "topic": "Make your Google Sheet automation-ready: 5 rules", "human_problem": "Automations breaking because the spreadsheet behind them is messy.", "objective": "Saves; prepares buyers' data", "hook": "Make your Google Sheet automation-ready", "main_idea": "Clean structure (one header row, one record per row, stable column names, consistent formats, an ID column) prevents automation failures.", "takeaway": "One header row, one record per row, stable column names, one date format and an ID column keep a sheet automation-ready.", "value": "Five rules anyone can apply to their sheet today.", "cta": "Save it before you share a sheet with anyone who automates.", "cta_type": "save", "visual_concept": "Clean spreadsheet mock with numbered callouts on the header row, an ID column and date format.", "design": {"headline": "Make your Google Sheet automation-ready", "body": ["One header row. No merged cells.", "One row = one order, one customer, or one lead.", "Never rename a column without telling whoever built the automation.", "Dates in one format (2026-10-31). Phone numbers as text.", "Add an ID column so nothing gets counted twice."], "footer": "A clean sheet is half the automation.", "layout": "Light background. Mock spreadsheet top half with numbered callout circles pointing at header, a row, a column name, a date cell and an ID column. Rules listed below with matching numbers."}, "caption": "Automations read your Google Sheet like a machine. Make it easy:\n\n1. One header row. No merged cells.\n2. One row = one record (one order, one customer, one lead)\n3. Never rename a column without telling whoever built the automation\n4. Dates in one format (2026-10-31), phone numbers stored as text so the leading 0 stays\n5. Add an ID column so nothing gets counted twice\n\nA clean sheet is half the automation.\n\nSave this before you share a sheet with anyone who automates.\n", "hashtags": ["GoogleSheets", "automation", "n8n"], "sources": [], "production_notes": "Spreadsheet-mock template. Use fictional data; Bangladeshi phone format shown as text with leading 0.", "day": 21, "slot": "I2", "time": "18:30", "slot_no": 3, "date": "2026-11-01", "spec": "Feed image 4:5 · 1440×1800 PNG (sRGB) · text ≥90 px from edges · headline ≥88 px, body ≥44 px · ≤75 words on image", "post_no": 83, "caption_full": "Automations read your Google Sheet like a machine. Make it easy:\n\n1. One header row. No merged cells.\n2. One row = one record (one order, one customer, one lead)\n3. Never rename a column without telling whoever built the automation\n4. Dates in one format (2026-10-31), phone numbers stored as text so the leading 0 stays\n5. Add an ID column so nothing gets counted twice\n\nA clean sheet is half the automation.\n\nSave this before you share a sheet with anyone who automates.\n\n#GoogleSheets #automation #n8n", "pillar_name": "Automation & n8n", "src": [], "wps": null}, {"id": "D21-R2", "type": "reel", "series": "AI Myth Check", "pillar": "LIT", "format": "Green screen + talking head", "topic": "Is this viral photo real? Check the source, not the hands", "human_problem": "Seeing a shocking photo in a group chat and not knowing if it's real.", "objective": "Shares; protects the audience from AI fakes", "hook": "Stop checking the hands. Check the source.", "open_loop": "If not the hands, what should I check?", "main_idea": "AI images now get details right; tracing the image's origin, trusted outlets, dates and AI labels is more reliable.", "takeaway": "Trace where an image came from instead of zooming in on details, and don't share what you can't trace.", "value": "A 4-step check using Google Lens + the rule 'can't trace it, don't share it'.", "payoff": "13–39 s: Lens search, trusted outlets, dates, AI labels, then 'can't trace it, don't share it'.", "cta": "Send it to the group that shares everything.", "cta_type": "share", "visual_concept": "Asif on green screen in front of a labelled AI-generated example image → Lens search results → calendar → 'AI info' label mock.", "runtime": 42, "retention": {"hook": "Contradicts popular advice (look at the hands), which immediately raises curiosity.", "novelty": "Updates an outdated tip that many people still rely on.", "usefulness": "Four steps doable on any phone with Google Lens.", "relatability": "Everyone has a family or office group that forwards viral photos.", "save_share": "The closing CTA is tailored for group sharing."}, "script": [{"t": "0-3", "vo": "Stop checking the hands. Check the source.", "ost": "Don't zoom. Trace it.", "vis": "Asif; a viral-style image on screen with a small 'AI-generated example' label."}, {"t": "3-8", "vo": "Old advice: look for extra fingers. New AI images get hands right.", "ost": "Extra fingers? Not anymore.", "vis": "Zoom on correct-looking hands in the example."}, {"t": "8-13", "vo": "So ask a better question: where did this picture come from?", "ost": "Where did it come from?", "vis": "Question mark animation."}, {"t": "13-18.5", "vo": "Long-press it, search with Google Lens, and look for the earliest result.", "ost": "1 · Search it with Lens", "vis": "Own screen recording of a Lens search."}, {"t": "18.5-23.5", "vo": "Two: is any trusted news outlet showing the same thing?", "ost": "2 · Trusted outlet?", "vis": "News icon."}, {"t": "23.5-28.5", "vo": "Three: check the date. Many fakes are real photos from years ago.", "ost": "3 · Old photo, new story?", "vis": "Calendar flips back years."}, {"t": "28.5-34", "vo": "Four: look for an ‘AI info’ label. Meta adds it when it detects AI.", "ost": "4 · ‘AI info’ label", "vis": "Drawn label mock."}, {"t": "34-39", "vo": "No label doesn't prove it's real. Can't trace it? Don't share it.", "ost": "Can't trace it? Don't share.", "vis": "Asif to camera."}, {"t": "39-42", "vo": "Send this to the group that shares everything.", "ost": "Send to that group", "vis": "End card."}], "caption": "Stop zooming in on the hands. New AI images get them right. Check the source instead:\n\n1. Long-press the image → search with Google Lens → look for the earliest result\n2. Is any trusted news outlet showing the same thing?\n3. Check the date. Many “new” fakes are real photos from years ago.\n4. Look for an “AI info” label. Meta adds it when it detects AI signals or the poster discloses it.\n\nNo label doesn't prove it's real. Can't trace it? Don't share it.\n\nSend this to the group that shares everything.\n", "hashtags": ["factcheck", "AIliteracy", "deepfake"], "sources": ["meta_ai_label"], "production_notes": "Generate your own example image and keep an 'AI-generated example' label on it the whole time. Never use a real viral fake (it spreads it further).", "day": 21, "slot": "R2", "time": "21:00", "slot_no": 4, "date": "2026-11-01", "spec": "Reel 9:16 · 1080×1920 · H.264 MP4 · 30 fps · AAC 48 kHz · safe box x65–1015 / y270–1250 · burned-in captions y1050–1250 · cover title inside centre 1080×1350", "post_no": 84, "caption_full": "Stop zooming in on the hands. New AI images get them right. Check the source instead:\n\n1. Long-press the image → search with Google Lens → look for the earliest result\n2. Is any trusted news outlet showing the same thing?\n3. Check the date. Many “new” fakes are real photos from years ago.\n4. Look for an “AI info” label. Meta adds it when it detects AI signals or the poster discloses it.\n\nNo label doesn't prove it's real. Can't trace it? Don't share it.\n\nSend this to the group that shares everything.\n\n#factcheck #AIliteracy #deepfake", "pillar_name": "AI literacy & safety", "src": [{"t": "Our Approach to Labeling AI-Generated Content and Manipulated Media", "u": "https://about.fb.com/news/2024/04/metas-approach-to-labeling-ai-generated-content-and-manipulated-media/", "p": "Meta Newsroom", "d": "2024-04-05", "v": false}], "wps": 2.33}, {"id": "D22-I1", "type": "image", "series": "Steal This Prompt", "pillar": "WF", "format": "Flow diagram", "topic": "Research any topic in 20 minutes with AI", "human_problem": "Researching a topic for hours and ending up with 30 tabs instead of understanding.", "objective": "Saves among students and professionals", "hook": "Research any topic in 20 minutes with AI", "main_idea": "Four 5-minute steps (questions → searched sources → notebook → disagreements) give trustworthy research fast.", "takeaway": "Spend 20 minutes on key questions, searched sources, a notebook and the points where sources disagree.", "value": "A timed research workflow that ends with sources, not just an answer.", "cta": "Save it.", "cta_type": "save", "visual_concept": "A clock face split into four 5-minute segments, each with a step.", "design": {"headline": "Research any topic in 20 minutes with AI", "body": ["5 min: “Give me the 5 key questions about [topic].”", "5 min: search each one with web search ON. Save good sources.", "5 min: add those sources to a Gemini Notebook. Ask across them.", "5 min: “What do the sources disagree on? What's missing?”"], "footer": "You end with sources you trust, not just an answer.", "layout": "Light background. Large clock divided into four quarters, each quarter labelled with its step. Headline above, footer below."}, "caption": "Research any topic in 20 minutes with AI, and finish with sources you trust:\n\n0–5 min: “Give me the 5 key questions someone should answer about [topic].”\n5–10 min: search each question with web search ON. Save the sources that look reliable.\n10–15 min: add those sources to a Gemini Notebook and ask questions across them.\n15–20 min: “What do these sources disagree on? What's missing?”\n\nThe last question is where real understanding starts.\n", "hashtags": ["research", "AItips", "studytips"], "sources": ["google_notebook_rename"], "production_notes": "Clock-quarter template.", "day": 22, "slot": "I1", "time": "09:30", "slot_no": 1, "date": "2026-11-02", "spec": "Feed image 4:5 · 1440×1800 PNG (sRGB) · text ≥90 px from edges · headline ≥88 px, body ≥44 px · ≤75 words on image", "post_no": 85, "caption_full": "Research any topic in 20 minutes with AI, and finish with sources you trust:\n\n0–5 min: “Give me the 5 key questions someone should answer about [topic].”\n5–10 min: search each question with web search ON. Save the sources that look reliable.\n10–15 min: add those sources to a Gemini Notebook and ask questions across them.\n15–20 min: “What do these sources disagree on? What's missing?”\n\nThe last question is where real understanding starts.\n\n#research #AItips #studytips", "pillar_name": "Workflows & productivity", "src": [{"t": "NotebookLM is now Gemini Notebook", "u": "https://blog.google/innovation-and-ai/products/gemini-notebook/notebooklm-gemini-notebook/", "p": "Google Blog / Workspace Updates", "d": "2026-07-16", "v": false}], "wps": null}, {"id": "D22-R1", "type": "reel", "series": "Hidden Button", "pillar": "HF", "format": "Phone-in-hand demo", "topic": "Sketch a layout, get a finished flyer (ChatGPT Images 2.5)", "human_problem": "Describing a flyer layout to AI and getting something completely different.", "objective": "Shares among sellers and creators", "hook": "Draw a messy box. Get a finished flyer.", "open_loop": "Will it really follow my scribbles?", "main_idea": "ChatGPT Images 2.5's Sketch tool lets you draw the layout first, then fill it with your product, price and offer.", "takeaway": "Draw your layout with ChatGPT's Sketch tool so the image follows it, then check every word and price.", "value": "A faster way to get a layout you want, plus the habit of checking every word and price.", "payoff": "17.5–21.5 s: the result follows the drawn layout; 21.5–26.5 s: check every word and price.", "cta": "Save it for your next flyer.", "cta_type": "save", "visual_concept": "Finger drawing rough boxes on a phone → finished flyer; sketch and result side by side.", "runtime": 38, "retention": {"hook": "A visual transformation promise (messy box → flyer) that viewers want to see happen.", "novelty": "Sketch launched in September 2026; most viewers haven't tried it.", "visual_progression": "Drawing strokes become a polished design on screen.", "payoff": "The finished flyer keeps the creator's own layout.", "usefulness": "Useful for sellers making offer posts and event flyers."}, "script": [{"t": "0-3", "vo": "Draw a messy box. Get a finished flyer.", "ost": "Sketch → flyer", "vis": "Finger draws rough boxes on a phone; hard cut to the finished flyer."}, {"t": "3-7.5", "vo": "ChatGPT Images 2.5 added Sketch. You draw the layout yourself.", "ost": "New: Sketch (Sept 2026)", "vis": "Sketch tool on screen."}, {"t": "7.5-12.5", "vo": "Big box for the photo. Line for the title. Small box for the price.", "ost": "photo · title · price", "vis": "Each element drawn as it's mentioned."}, {"t": "12.5-17.5", "vo": "Then type what goes in it: product, price, offer, colours.", "ost": "Then: what goes where", "vis": "Prompt typed."}, {"t": "17.5-21.5", "vo": "It follows your layout, not a random one.", "ost": "Your layout, kept", "vis": "Sketch and result side by side."}, {"t": "21.5-26.5", "vo": "Check every word and price before you post it.", "ost": "Check text + prices", "vis": "Zoom on the flyer text."}, {"t": "26.5-31", "vo": "There are also templates for flyers and product photos.", "ost": "Templates: flyers · products", "vis": "Templates screen."}, {"t": "31-35", "vo": "Sketch first, then words. Much faster than describing a layout.", "ost": "Sketch > describe", "vis": "Asif to camera."}, {"t": "35-38", "vo": "Save this for your next flyer.", "ost": "Save it", "vis": "End card."}], "caption": "Stop describing layouts to AI. Draw them.\n\nChatGPT Images 2.5 (released 8 Sep 2026) added Sketch: draw directly in ChatGPT as a reference for your image.\n\n1. Draw rough boxes: photo here, title there, price in the corner\n2. Type what goes in each: product, price, offer, colours\n3. It follows your layout instead of inventing one\n4. Check every word and price before posting\n\nThere are also templates for flyers and product photos.\n\nTry it for your next offer post.\n", "hashtags": ["ChatGPT", "AIdesign", "smallbusiness"], "sources": ["openai_images25"], "production_notes": "Confirm Sketch is available on your account/plan before filming. If not, swap this slot for the Templates feature only. Use a fictional product and price; keep the flyer non-photorealistic or label it.", "day": 22, "slot": "R1", "time": "13:30", "slot_no": 2, "date": "2026-11-02", "spec": "Reel 9:16 · 1080×1920 · H.264 MP4 · 30 fps · AAC 48 kHz · safe box x65–1015 / y270–1250 · burned-in captions y1050–1250 · cover title inside centre 1080×1350", "post_no": 86, "caption_full": "Stop describing layouts to AI. Draw them.\n\nChatGPT Images 2.5 (released 8 Sep 2026) added Sketch: draw directly in ChatGPT as a reference for your image.\n\n1. Draw rough boxes: photo here, title there, price in the corner\n2. Type what goes in each: product, price, offer, colours\n3. It follows your layout instead of inventing one\n4. Check every word and price before posting\n\nThere are also templates for flyers and product photos.\n\nTry it for your next offer post.\n\n#ChatGPT #AIdesign #smallbusiness", "pillar_name": "Hidden features & tools", "src": [{"t": "Introducing ChatGPT Images 2.5", "u": "https://openai.com/index/introducing-chatgpt-images-2-5/", "p": "OpenAI", "d": "2026-09-08", "v": true}], "wps": 2.21}, {"id": "D22-I2", "type": "image", "series": "AI Myth Check", "pillar": "LIT", "format": "Three-tier card", "topic": "Posting AI images or voice? When to label them", "human_problem": "Posting AI-made images or voice without knowing when Facebook expects a label.", "objective": "Protect page owners from policy problems; trust", "hook": "Posting AI images or voice? When to label them", "main_idea": "Meta requires disclosure for photorealistic AI video and realistic audio, and may auto-label; labelling realistic AI images is a good habit; faking real people is never OK.", "takeaway": "Disclose photorealistic AI video and realistic audio, label realistic AI images anyway, and never fake real people.", "value": "Clear do/don't rules for AI media on Facebook.", "cta": "None. The closing line is the takeaway.", "cta_type": "none", "visual_concept": "Must / Should / Never three-tier card with a small 'AI info' tag icon.", "design": {"headline": "Posting AI images or voice? When to label them", "body": ["Must disclose: photorealistic video or realistic audio made or changed with AI.", "Use Meta's AI disclosure option when you post.", "Meta may also add an 'AI info' label automatically.", "Good habit: write 'AI-generated' on any realistic AI image.", "Never: fake a real person saying or doing something."], "footer": "Source: Meta's AI labelling policy (2024), checke
