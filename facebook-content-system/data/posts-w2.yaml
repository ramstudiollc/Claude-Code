- id: D12-I1
  type: image
  series: AI Myth Check
  pillar: LIT
  format: Myth vs fact
  topic: "Myth: 'Act as an expert' makes AI smarter"
  objective: "Correct a popular prompting myth; saves"
  hook: "Myth: “Act as an expert” makes AI smarter"
  main_idea: "A role changes tone, not knowledge; facts, goal, example and format do the heavy lifting."
  value: "Weak vs strong prompt comparison showing what actually improves answers."
  cta: "Save it."
  cta_type: save
  visual_concept: "Costume illustration (a hat labelled 'expert') crossed out vs a toolbox labelled 'context'."
  design:
    headline: "Myth: “Act as an expert” makes AI smarter"
    body:
      - "FACT: A role sets the tone. It doesn't add knowledge."
      - "What helps: your facts, your goal, an example, a format."
      - "Weak: “Act as a marketing expert. Write my ad.”"
      - "Strong: “Product, price, buyer and offer are… Write 3 ads under 40 words.”"
    footer: "Context beats costume."
    layout: "Top: MYTH tag + headline with the quoted phrase struck through. Middle: FACT rows. Bottom: weak (grey) vs strong (accent) prompt blocks side by side. Footer as a short bold line."
  caption: |
    “Act as an expert marketer…” is one of the most copied prompt openers online. It mostly changes the tone, not the quality.

    What actually improves answers:
    • your facts (product, price, buyer)
    • your goal (what should the reader do?)
    • an example of what good looks like
    • a format (3 options, under 40 words)

    Weak: “Act as a marketing expert. Write my ad.”
    Strong: “My product is…, price…, buyer…, offer… Write 3 ads under 40 words.”

    Context beats costume. Save this.
  hashtags: [AItips, PromptTips, ChatGPT]
  sources: []
  production_notes: "Myth-vs-fact template with the 'costume vs toolbox' doodle. Keep the claim modest: roles affect tone/focus, they don't add facts."

