  sources: [openai_memory]
  production_notes: "Verify the current menu path in both the mobile and web app the day before posting; update the breadcrumb if it changed. Draw the UI; don't screenshot it with real memories visible."

- id: D08-R2
  type: reel
  series: Steal This Prompt
  pillar: WF
  format: Talking head + screen split
  topic: "Tailor your CV to a job post without lying"
  human_problem: "Sending lots of job applications and hearing nothing back."
  objective: "Saves + shares among job seekers"
  hook: "Thirty applications. Zero calls. Look at your CV."
  open_loop: "What's wrong with my CV, and how do I fix it without lying?"
  main_idea: "Extract the job's requirements, match each to real evidence, rewrite matched bullets in the employer's words, and handle gaps honestly."
  takeaway: "Match your CV to each job's own requirements and words, honestly, instead of sending one CV everywhere."
  value: "A 4-step method + the 'don't invent anything, mark gaps' guardrail."
  payoff: "22–38 s: the match table shows strengths and gaps; matched bullets are rewritten honestly in the employer's words."
  cta: "Send to a friend who's job hunting."
  cta_type: share
  visual_concept: "Vertical split: Asif on the top half holding a printed CV, the screen on the bottom half: job post → requirement list → match table (green/red rows) → before/after bullet."
  runtime: 46
  retention:
    hook: "'Thirty applications, zero calls' is a painful, specific feeling job seekers recognise instantly."
    problem_solution: "Clear 4-step fix shown on screen, one step every ~6 seconds."
    visual_progression: "The match table fills with green and red rows, a visible map of strengths and gaps."
    usefulness: "Prompts are copy-paste and work in any AI tool; honest guardrail included."
    save_share: "Highly forwardable to friends applying for jobs."
  script:
    - t: "0-3"
      vo: "Thirty applications. Zero calls. Look at your CV."
      ost: "30 applications · 0 calls"
      vis: "Asif holding a printed CV; inbox with no replies behind him."
    - t: "3-6"
      vo: "Usually it's one CV sent to every job."
      ost: "Same CV, every job"
      vis: "The same CV copied onto a stack of different job posts."
    - t: "6-11.5"
      vo: "Step one: paste the job post. Ask for the top eight requirements."
      ost: "1 · Top 8 requirements"
      vis: "Screen half: job post pasted → list of 8."
    - t: "11.5-17.5"
      vo: "Step two: paste your CV. Ask it to match each requirement to proof in your CV."
      ost: "2 · Match each one to proof"
      vis: "Table forms: requirement | evidence | gap."
    - t: "17.5-22"
      vo: "And add this line: “Don't invent anything. Mark gaps.”"
      ost: "“Don't invent. Mark gaps.”"
      vis: "The line highlighted in yellow."
    - t: "22-27"
      vo: "Now you see it clearly. Six matches, two gaps."
      ost: "6 matches · 2 gaps"
      vis: "Table: six green rows, two red rows."
    - t: "27-32.5"
      vo: "Step three: rewrite your matched bullets using their keywords, only where it's true."
      ost: "3 · Their words, your truth"
      vis: "Before/after of one CV bullet."
    - t: "32.5-38"
      vo: "Step four: the gaps. Learn it, explain it in the cover letter, or apply anyway."
      ost: "4 · Gaps: learn · explain · accept"
      vis: "Three option cards."
    - t: "38-43.5"
      vo: "Many employers scan for the job's own words. Now your CV has them, honestly."
      ost: "Their keywords · honestly"
      vis: "Matching keywords glow in both documents."
    - t: "43.5-46"
      vo: "Send this to someone job hunting."
      ost: "Send to a job hunter"
      vis: "End card."
  caption: |
    Thirty applications, zero calls? Often it's one CV sent to every job. Tailor it in 10 minutes, honestly:

    1. Paste the job post: “List the top 8 requirements, using the employer's exact words.”
    2. Paste your CV: “Match each requirement to proof in my CV. Don't invent anything. Mark gaps.”
    3. Rewrite only the matched bullets using their keywords, where it's true.
    4. For each gap: learn it, explain it in your cover letter, or apply anyway.

    Many employers scan CVs for the job's own words. Now yours has them, without lying.

    Job hunting, or know someone who is? Pass this on.
  hashtags: [jobsearch, CVtips, AItips]
  sources: []
  production_notes: "Use a fictional CV and a real-looking but invented job post (no real company). Remove personal data. Keep the 'Don't invent anything' line visible for 2+ seconds."

