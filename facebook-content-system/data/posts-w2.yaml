- id: D11-R2
  type: reel
  series: Automate This
  pillar: AU
  format: Talking head + screen split
  topic: "Why automations break, and the alert that saves you"
  human_problem: "An automation silently stops working and you find out from an unhappy customer."
  objective: "Authority; differentiates Asif from 'quick bot' sellers"
  hook: "I build automations. Every one will break."
  open_loop: "When does it break, and how do I find out first?"
  main_idea: "Expired logins, changed data and silent failures break automations; an n8n error workflow alerts you immediately."
  takeaway: "Set an n8n error workflow so any failure sends you an alert instead of staying silent."
  value: "Three failure modes + how to set an error workflow in n8n."
  payoff: "22–38 s: an n8n error workflow messages you the moment a linked workflow fails."
  cta: "Ask n8n builders whether their workflows have an error workflow set."
  cta_type: question
  visual_concept: "Canvas nodes turning red for each failure; renamed column; calendar of silent days; Error Trigger → phone alert."
  runtime: 45
  retention:
    hook: "An automation builder admitting everything breaks is unexpected and builds trust instantly."
    curiosity: "Viewers want to know the three moments it breaks, especially 'the worst one'."
    relatability: "Renaming a sheet column is something every team does without thinking."
    problem_solution: "Each failure is followed by the n8n fix (error workflow) shown on screen."
    payoff: "A real alert message arrives on the phone with workflow, step and error."
  script:
    - t: "0-2.5"
      vo: "I build automations. Every one will break."
      ost: "Every automation breaks"
      vis: "Asif; behind him a canvas node flashes red."
    - t: "2.5-7"
      vo: "One: a login expires. A password changes, or a token runs out."
      ost: "1 · Logins expire"
      vis: "Key icon cracks."
    - t: "7-12.5"
      vo: "Two: the data changes. Someone renames a column in the sheet."
      ost: "2 · A column gets renamed"
      vis: "Sheet header 'Phone' edited to 'Mobile No.'; node turns red."
    - t: "12.5-17"
      vo: "Your workflow still looks for “Phone”. It finds nothing."
      ost: "Looks for 'Phone' → nothing"
      vis: "Empty output panel."
    - t: "17-22"
      vo: "Three, the worst one: it fails quietly, and nobody notices for a week."
      ost: "3 · It fails quietly"
      vis: "Calendar days flip; unread orders pile up."
    - t: "22-27.5"
      vo: "The fix in n8n: an error workflow. It starts the moment a workflow fails."
      ost: "Fix: an error workflow"
      vis: "Error Trigger node on canvas."
    - t: "27.5-33"
      vo: "It sends me a message: which workflow, which step, what went wrong."
      ost: "Which workflow · step · why"
      vis: "Telegram alert on phone."
    - t: "33-38"
      vo: "Set it once in workflow settings. It covers every workflow you link to it."
      ost: "Set once in Settings"
      vis: "Workflow Settings → 'Error workflow' dropdown."
    - t: "38-42"
      vo: "No alert means you find out from an angry customer."
      ost: "No alert = angry customer"
      vis: "Asif to camera."
    - t: "42-45"
      vo: "Test it: break one on purpose."
      ost: "Test the alert"
      vis: "End card."
  caption: |
    I build automations, and every one of them will break eventually. Usually for one of 3 reasons:

    1. A login expires (password changed, token ran out)
    2. The data changes (someone renames a sheet column, a form adds a question)
    3. It fails quietly, and nobody notices for a week. This is the worst one.

    The fix in n8n: an error workflow. Create a workflow that starts with the Error Trigger node and sends you a message (Telegram, email, chat). Then select it under Workflow Settings → Error workflow for each workflow you care about.

    No alert = you find out from an angry customer.

    If you build in n8n: does every workflow you care about have an error workflow set?
  hashtags: [n8n, automation, nocode]
  sources: [n8n_error_trigger]
