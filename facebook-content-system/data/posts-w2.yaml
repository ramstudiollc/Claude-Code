      vo: "So my first line names that worry. My second line shows proof I've solved it before."
      ost: "Line 1: their worry · Line 2: proof"
      vis: "Typing the two-line opener."
    - t: "29-34"
      vo: "Then AI checks it: “Is anything here generic? Cut it.”"
      ost: "“Cut anything generic.”"
      vis: "AI suggestions with two cuts."
    - t: "34-39"
      vo: "End with one smart question about their project. It starts a conversation."
      ost: "End with 1 smart question"
      vis: "Final proposal shown."
    - t: "39-43"
      vo: "Prompts are in the caption. Send this to a freelancer friend."
      ost: "Send to a freelancer"
      vis: "End card."
  caption: |
    Clients read the first two lines of your proposal, then decide.

    Use AI to read the job post, not to write your proposal:
    1. “What is this client worried about? Which words do they repeat? What's the real problem behind the task?”
    2. Write your opener yourself. Line 1: name their worry. Line 2: proof you've solved it before.
    3. “Is anything in my proposal generic? Cut it. Keep it under 120 words.”
    4. End with one smart question about their project.

    Skip “Dear Sir, I am an expert.” Every proposal says that.

    Send this to a freelancer friend.
