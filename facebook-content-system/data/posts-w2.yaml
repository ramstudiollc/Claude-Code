- id: D14-R2
  type: reel
  series: Steal This Prompt
  pillar: WF
  format: Before/after split screen
  topic: "Freelance proposals: let AI read the job post, you write the opener"
  objective: "Saves + shares among freelancers"
  hook: "Clients read two lines. Then decide."
  main_idea: "Use AI to analyse the client's worries and words; write a 2-line opener yourself (their worry + your proof); let AI cut generic lines."
  value: "A proposal method that avoids AI-sounding openers + three prompts."
  cta: "Send it to a freelancer friend."
  cta_type: share
  visual_concept: "Split screen: left = generic 'Dear Sir' proposal (crossed out), right = job-post analysis → typed two-line opener → AI edit suggestions; final full-width better proposal."
  runtime: 43
  retention:
    hook: "A hard truth in five words that every freelancer feels."
    relatability: "'Dear Sir, I am an expert' is a recognisable cliché for this audience."
    usefulness: "Three prompts that work on any job platform."
    problem_solution: "Shows the bad opener, the analysis and the better opener in sequence."
    save_share: "Freelancers share proposal tips in their groups."
  script:
    - t: "0-2.5"
      vo: "Clients read two lines. Then decide."
      ost: "2 lines. Then decide."
      vis: "Asif; a list of proposal previews behind him."
    - t: "2.5-7"
      vo: "Most proposals start with “Dear sir, I am an expert.” Skipped."
      ost: "“Dear Sir, I am expert…” ✗"
      vis: "Generic opener struck through."
    - t: "7-12.5"
      vo: "Use AI to read the job post first, not to write your proposal."
      ost: "AI reads. You write."
      vis: "Job post pasted into AI."
    - t: "12.5-18"
      vo: "Ask: “What is this client worried about? Which words do they repeat?”"
      ost: "Their worry · their words"
      vis: "AI answer listing worries and repeated words."
    - t: "18-23"
      vo: "Here: they're worried about deadlines and past freelancers disappearing."
      ost: "Worry: deadlines · ghosting"
      vis: "Two lines highlighted."
