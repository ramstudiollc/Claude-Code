      vo: "Five: send me a Telegram message with name, phone and what they want."
      ost: "5 · Alert on my phone"
      vis: "Telegram node → phone notification."
    - t: "32.5-38"
      vo: "Form to phone in a few seconds. Nobody copy-pastes anything."
      ost: "Seconds · zero copy-paste"
      vis: "Stopwatch overlay on a real run."
