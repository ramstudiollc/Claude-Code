- id: D08-R1
  type: reel
  series: Explain It Simply
  pillar: AU
  format: Diagram explainer + talking head
  topic: "Chatbot vs automation vs AI agent: the actual difference"
  objective: "Authority; helps buyers ask for the right thing"
  hook: "Chatbot, automation, agent: not the same thing."
  main_idea: "Chatbot talks; automation follows fixed steps; agent chooses its own steps with tools. Use the simplest that works and add human approval for money."
  value: "One shared example ('Where's my order?') across all three, plus a decision rule."
  cta: "Follow for more Explain It Simply."
  cta_type: follow
  visual_concept: "Three columns, one per type, each answering the same customer bubble; straight arrow vs branching arrows."
  runtime: 46
  retention:
