- id: D09-R1
  type: reel
  series: Steal This Prompt
  pillar: PA
  format: Talking head + screen split
  topic: "Make AI disagree with you"
  objective: "Saves + comments"
  hook: "AI agrees with you too easily. Try this."
  main_idea: "AI tends to agree with the user; asking it to argue against your plan surfaces risks you missed."
  value: "The 'strongest reasons it could fail' prompt + the follow-up 'what would make it work'."
  cta: "Save it before your next big decision."
  cta_type: save
  visual_concept: "Chat showing 'Great idea!' → flipped prompt → list of failure reasons with two highlighted."
  runtime: 32
  retention:
    hook: "Names a quiet flaw people have noticed (AI always says 'great idea') and promises a fix."
    novelty: "Using AI as a critic instead of a cheerleader is new to most viewers."
    relatability: "A price increase decision is something every seller faces."
    payoff: "Two real risks the creator hadn't considered appear on screen."
    usefulness: "Two short prompts that work in any AI tool, useful before any decision."
  script:
    - t: "0-3"
      vo: "AI agrees with you too easily. Try this."
      ost: "AI agrees too easily"
      vis: "Asif; chat screen with 'Great idea!' response."
    - t: "3-7.5"
      vo: "Ask “Is my plan good?” and it usually says yes."
      ost: "“Great idea!” 🙄"
      vis: "Highlight 'Great idea!' in yellow."
    - t: "7.5-11"
      vo: "So flip the question. Make it argue against you."
      ost: "Make it argue"
      vis: "Asif flips his hand; whoosh."
    - t: "11-16"
      vo: "“Give me the three strongest reasons this plan could fail.”"
      ost: "“3 strongest reasons it fails”"
      vis: "Prompt typed in large text."
    - t: "16-21"
      vo: "My plan: raise my price to 1,500 taka. Here's what came back."
      ost: "Plan: Tk 1,200 → 1,500"
      vis: "Screen: AI answer appears as a list."
    - t: "21-25.5"
      vo: "Two of these I hadn't thought about. That's the point."
      ost: "Risks I missed"
      vis: "Two items highlighted."
    - t: "25.5-29"
      vo: "Then ask: “What would make this plan work?”"
      ost: "“What would make it work?”"
      vis: "Second prompt typed."
    - t: "29-32"
      vo: "You decide. AI just tests the idea."
      ost: "You decide"
      vis: "Asif to camera; end."
  caption: |
    AI tends to agree with you. Ask “Is my plan good?” and you'll usually hear yes.

    Flip it:
    “Give me the 3 strongest reasons this plan could fail. Be specific to my situation: [details].”

    Then:
    “What would make this plan work?”

    I tried it on a price increase (Tk 1,200 → 1,500) and got two risks I hadn't considered.

    You still decide. AI just pressure-tests the idea.

    Save this for your next big decision.
  hashtags: [AItips, decisionmaking, smallbusiness]
  sources: []
  production_notes: "Run the prompt live on a real or realistic decision. Only say 'two of these I hadn't thought about' if true; otherwise change the line to 'Look at number two' and highlight that one."

- id: D09-I2
  type: image
  series: AI Myth Check
  pillar: LIT
  format: Checklist
  topic: "Use AI to prepare, not to decide: 4 areas"
  objective: "Trust + shares"
  hook: "Use AI to prepare, not to decide, these 4"
  main_idea: "In health, money transfers, legal papers and people decisions, AI should prepare you, not decide for you."
  value: "A clear boundary for high-stakes AI use, with what AI is still good for in each."
  cta: "Send it to someone who asks AI about everything."
  cta_type: share
  visual_concept: "Four quadrants with icons (heart, money, document, people) and a 'prepare ✓ decide ✗' tag."
  design:
    headline: "Use AI to prepare, not to decide, these 4"
    body:
      - "Health: use it to prepare questions for your doctor."
      - "Money transfers: never act on an AI or a voice you can't verify."
      - "Legal papers: use it to understand terms, then ask a lawyer."
      - "Hiring and firing: it can sort information, not judge people."
    footer: "AI is great at drafts and questions. You own the decision."
    layout: "2×2 grid of quadrants, each with an icon, label and one line. A small tag 'Prepare ✓ / Decide ✗' in each corner. Footer band at bottom."
  caption: |
    AI is useful in serious areas, as long as you use it to prepare, not to decide.

    Health: prepare questions for your doctor. Don't replace the doctor.
    Money transfers: never act on an AI instruction or a voice you can't verify.
    Legal papers: understand the terms, then ask a lawyer before signing.
    Hiring and firing: let it organise information, not judge people.

    AI is great at drafts and questions. You own the decision.

    Send this to someone who asks AI about everything.
  hashtags: [AIliteracy, AIsafety, AItips]
  sources: []
  production_notes: "Quadrant template. Calm colours. This is a trust post, not a scare post."

- id: D09-R2
