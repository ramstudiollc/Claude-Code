    curiosity: "Viewers want to know which of the three they actually need."
    visual_progression: "The same question flows through three different diagrams: chat bubble, straight line, branching tree."
    usefulness: "Ends with a 3-line decision rule (fixed rules, changing questions, money)."
    payoff: "The 'simplest one that works' rule cuts through the hype."
  script:
    - t: "0-3"
      vo: "Chatbot, automation, agent: not the same thing."
      ost: "Chatbot ≠ Automation ≠ Agent"
      vis: "Asif with three labelled icons appearing beside him."
    - t: "3-7"
      vo: "Same customer question for all three: “Where's my order?”"
      ost: "“Where's my order?”"
      vis: "Messenger bubble drops into each of three columns."
    - t: "7-13"
      vo: "A chatbot just talks. It answers from what it was told, but it can't check anything."
      ost: "Chatbot: talks, can't check"
      vis: "Column 1: reply 'Orders usually take 3–5 days.'"
    - t: "13-18.5"
      vo: "An automation follows fixed steps. Status changes, it sends an update. Every time."
      ost: "Automation: fixed path"
      vis: "Column 2: straight arrow 'status = shipped' → message."
    - t: "18.5-22"
      vo: "An agent chooses the path. It reads the question,"
      ost: "Agent: picks its own steps"
      vis: "Column 3: agent icon reads the bubble; branches appear."
    - t: "22-25"
      vo: "checks the order sheet and courier, then replies."
      ost: "sheet → courier → reply"
      vis: "Agent icon picks 'Sheet' then 'Courier' tools; reply bubble."
    - t: "25-29.5"
      vo: "So which one do you need? Use the simplest one that works."
      ost: "Use the simplest that works"
      vis: "Asif to camera."
    - t: "29.5-34"
      vo: "Fixed rules? Automation. Cheaper and more predictable."
      ost: "Fixed rules → automation"
      vis: "Column 2 glows."
    - t: "34-38.5"
      vo: "Questions that change every time? An agent, with limits."
      ost: "Changing questions → agent"
      vis: "Column 3 glows with a fence icon."
    - t: "38.5-43"
      vo: "Anything involving money? Add a human approval step."
      ost: "Money → a human approves"
      vis: "Approval checkmark node added."
    - t: "43-46"
      vo: "Follow for more Explain It Simply."
      ost: "Explain It Simply"
      vis: "End card with series tag."
  caption: |
    Chatbot, automation, AI agent: the difference in one example.

    Customer asks: “Where's my order?”
    • Chatbot: talks. Answers from what it was told, but can't check anything.
    • Automation: fixed steps. When the order status changes, it sends an update. Same path every time.
    • AI agent: chooses its own steps. Reads the question, checks your order sheet, then the courier, then replies.

    Which do you need? The simplest one that works.
    Fixed rules → automation. Changing questions → agent with limits. Money involved → add a human approval.

    Follow for more Explain It Simply.
  hashtags: [AIagents, automation, n8n]
  sources: []
  production_notes: "Three-column motion template. Keep each column's icon style identical so the only difference is the path shape."

- id: D08-I2
  type: image
  series: Hidden Button
  pillar: HF
  format: Hidden feature card
  topic: "See and delete what ChatGPT remembers about you"
  objective: "Saves + privacy trust"
  hook: "See what ChatGPT remembers about you"
  main_idea: "ChatGPT's memory is visible and editable; most users never check it."
  value: "Where to find memory, how to delete items, how to turn off chat-history reference."
  cta: "Save it, then check your list today."
  cta_type: save
  visual_concept: "Drawn settings path (breadcrumb style) + a list with a delete icon."
  design:
    headline: "See what ChatGPT remembers about you"
    body:
      - "Go to Settings → Personalization → Memory."
      - "Open the saved list. Delete anything wrong or too personal."
      - "Turn off 'reference chat history' if you don't want past chats used."
      - "Or say in chat: “Forget that I…”, then check the list."
    footer: "Menu names can change between app versions. Look for Memory under Personalization."
    layout: "Light background. Breadcrumb path drawn as three rounded chips with arrows at the top. Below, a mock list of three memory items with trash icons. Instructions as numbered rows. Footer small."
  caption: |
    ChatGPT may remember things about you across chats. You can see exactly what, and delete it.

    1. Settings → Personalization → Memory
    2. Open the saved list and delete anything wrong or too personal
    3. Turn off “reference chat history” if you don't want old chats used
    4. Or just say: “Forget that I…”, then check the list to confirm

    Menu names change between app versions; look for Memory under Personalization.

    Save this, then check your list today. Most people are surprised.
  hashtags: [ChatGPT, privacy, AItips]
  sources: [openai_memory]
  production_notes: "Verify the current menu path in both the mobile and web app the day before posting; update the breadcrumb if it changed. Draw the UI; don't screenshot it with real memories visible."

- id: D08-R2
  type: reel
  series: Steal This Prompt
  pillar: WF
  format: Talking head + screen split
  topic: "Tailor your CV to a job post without lying"
  objective: "Saves + shares among job seekers"
  hook: "One CV for every job? Here's the fix."
  main_idea: "Extract the job's requirements, match each to real evidence, rewrite matched bullets in the employer's words, and handle gaps honestly."
  value: "A 4-step method + the 'don't invent anything, mark gaps' guardrail."
  cta: "Send to a friend who's job hunting."
  cta_type: share
  visual_concept: "Vertical split: Asif on the top half holding a printed CV, the screen on the bottom half: job post → requirement list → match table (green/red rows) → before/after bullet."
  runtime: 43
  retention:
    hook: "Most job seekers send one CV everywhere, so the hook lands on a common habit."
    problem_solution: "Clear 4-step fix shown on screen, one step every ~6 seconds."
    visual_progression: "The match table fills with green and red rows, a visible map of strengths and gaps."
    usefulness: "Prompts are copy-paste and work in any AI tool; honest guardrail included."
    save_share: "Highly forwardable to friends applying for jobs."
  script:
    - t: "0-3"
      vo: "One CV for every job? Here's the fix."
      ost: "Same CV for every job?"
      vis: "Asif holding a printed CV."
    - t: "3-8.5"
      vo: "Step one: paste the job post. Ask for the top eight requirements, in their words."
      ost: "1 · Top 8 requirements"
      vis: "Screen: job post pasted → list of 8."
    - t: "8.5-14.5"
      vo: "Step two: paste your CV. Ask it to match each requirement to proof in your CV."
      ost: "2 · Match each one to proof"
      vis: "Table forms: requirement | evidence | gap."
    - t: "14.5-19"
      vo: "And add this line: “Don't invent anything. Mark gaps.”"
      ost: "“Don't invent. Mark gaps.”"
      vis: "The line highlighted in yellow."
    - t: "19-24"
      vo: "Now you see it clearly. Six matches, two gaps."
      ost: "6 matches · 2 gaps"
      vis: "Table: six green rows, two red rows."
    - t: "24-29.5"
      vo: "Step three: rewrite your matched bullets using their keywords, only where it's true."
      ost: "3 · Their words, your truth"
      vis: "Before/after of one CV bullet."
    - t: "29.5-35"
      vo: "Step four: the gaps. Learn it, explain it in the cover letter, or apply anyway."
      ost: "4 · Gaps: learn · explain · accept"
      vis: "Three option cards."
    - t: "35-40.5"
      vo: "Many employers scan for the job's own words. Now your CV has them, honestly."
      ost: "Their keywords · honestly"
      vis: "Matching keywords glow in both documents."
    - t: "40.5-43"
      vo: "Send this to someone job hunting."
      ost: "Send to a job hunter"
      vis: "End card."
  caption: |
    One CV for every job is why you're not getting calls. Tailor it in 10 minutes, honestly:

    1. Paste the job post: “List the top 8 requirements, using the employer's exact words.”
    2. Paste your CV: “Match each requirement to proof in my CV. Don't invent anything. Mark gaps.”
    3. Rewrite only the matched bullets using their keywords, where it's true.
    4. For each gap: learn it, explain it in your cover letter, or apply anyway.

    Many employers scan CVs for the job's own words. Now yours has them, without lying.

    Send this to someone who's job hunting.
  hashtags: [jobsearch, CVtips, AItips]
  sources: []
  production_notes: "Use a fictional CV and a real-looking but invented job post (no real company). Remove personal data. Keep the 'Don't invent anything' line visible for 2+ seconds."

