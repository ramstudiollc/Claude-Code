- id: D13-R1
  type: reel
  series: Steal This Prompt
  pillar: PA
  format: Talking head + screen split
  topic: "Make AI your tutor, not your answer key"
  objective: "Shares among students and parents"
  hook: "AI can do your homework. That's the problem."
  main_idea: "Ask AI to give one hint at a time and ask you the next step, so you build understanding instead of copying answers."
  value: "A tutor prompt that works in any AI tool + why it matters (no AI in exams)."
  cta: "Send it to a student who copies AI answers."
  cta_type: share
  visual_concept: "Student POV: full AI solution → tutor prompt → back-and-forth chat with hints."
  runtime: 36
  retention:
    hook: "Flips the usual 'AI helps homework' message into a problem, which is surprising and slightly provocative."
    relatability: "Students (and parents) recognise copying AI answers."
    problem_solution: "Shows the problem (no learning) then the exact fix prompt."
    usefulness: "One prompt, any subject, any AI tool."
    save_share: "Parents and teachers will forward this to students."
  script:
    - t: "0-3"
      vo: "AI can do your homework. That's the problem."
      ost: "That's the problem."
      vis: "Student POV: AI shows a full maths solution."
    - t: "3-7"
      vo: "You get the answer. Your brain gets nothing."
      ost: "Answer ✓ · Learning ✗"
      vis: "Asif to camera."
    - t: "7-11.5"
      vo: "In the exam hall, there's no AI. So change the deal."
      ost: "No AI in the exam"
      vis: "Illustration of an exam hall."
    - t: "11.5-17.5"
      vo: "Type: “Be my tutor. Don't give me the answer. Give me one hint at a time.”"
      ost: "“One hint at a time.”"
      vis: "Prompt typed."
    - t: "17.5-21.5"
      vo: "“Then ask what I think the next step is.”"
      ost: "“Ask me the next step.”"
      vis: "Prompt continues."
    - t: "21.5-27.5"
      vo: "Now it asks you. Stuck? It nudges. Wrong? It explains why."
      ost: "Stuck → hint · Wrong → why"
      vis: "Chat exchange: hint, student answer, correction."
    - t: "27.5-32"
      vo: "Slower, yes. But this time, the answer is in your head."
      ost: "Answer in YOUR head"
      vis: "Asif taps his head."
    - t: "32-36"
      vo: "Send this to a student who copies AI answers."
      ost: "Send to a student"
      vis: "End card."
  caption: |
    AI can do your homework. That's the problem. In the exam hall, there's no AI.

    Change the deal with one prompt:
    “Be my tutor. Don't give me the answer. Give me one hint at a time, then ask me what I think the next step is. If I'm wrong, explain why.”

    Works for maths, physics, accounting, coding. Any subject, any AI app.

    Slower, yes. But the answer ends up in your head.

    Send this to a student who copies AI answers.
  hashtags: [students, studytips, AItips]
  sources: []
  production_notes: "Use a simple algebra problem (e.g. 3x + 5 = 20). Record a real tutoring exchange; keep only the three clearest turns."

