      vo: "Why it matters: the first business to reply often gets the customer."
      ost: "Reply first"
      vis: "Asif to camera."
    - t: "43-48"
      vo: "Want this for your forms? Message me AUTOMATE."
      ost: "Message: AUTOMATE"
      vis: "Messenger icon animation."
