# ───────────────────────── DAY 10
- id: D10-I1
  type: image
  series: Steal This Prompt
  pillar: PA
  format: Prompt card
  topic: "Learn anything faster: ask for 3 levels of explanation"
  objective: "Saves among students and self-learners"
  hook: "Learn anything faster: ask for 3 levels"
  main_idea: "Asking for child, student and expert levels shows exactly where your understanding stops."
  value: "A copy-paste learning prompt + how to use the result."
  cta: "Save it."
  cta_type: save
  visual_concept: "Three stacked steps (small → medium → large) with a 'stop here' marker."
  design:
    headline: "Learn anything faster: ask for 3 levels"
    body:
      - "“Explain [topic] at 3 levels:"
      - "1. To a 10-year-old, in 3 sentences"
      - "2. To a university student, with one example"
      - "3. To an expert: what do beginners get wrong?”"
      - "Read level 1 first. Stop where it gets hard. That's your study point."
    footer: "Works for taxes, physics, marketing or n8n."
    layout: "Light background. Prompt in a quote block (top 55%). Below: three ascending step blocks labelled 1/2/3 with a flag 'stop here = study here'. Footer bottom."
  caption: |
    The fastest way I know to learn a new topic with AI:

    “Explain [topic] at 3 levels:
    1. To a 10-year-old, in 3 sentences
    2. To a university student, with one example
    3. To an expert: what do beginners usually get wrong?”

    Read level 1. Then level 2. The moment it gets hard is exactly where you should study.

    Level 3 is the bonus: it shows the mistakes before you make them.

    Save this.
  hashtags: [studytips, AItips, learning]
  sources: []
  production_notes: "Prompt-card template with step graphic. [topic] in accent colour."

