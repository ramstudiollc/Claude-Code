- id: D10-I1
  type: image
  series: Steal This Prompt
  pillar: PA
  format: "Staircase card"
  topic: "Learn anything faster: ask for 3 levels of explanation"
  human_problem: "Reading explanations that are either far too simple or far too advanced."
  objective: "Saves among students and self-learners"
  hook: "Confused by a topic? Ask AI for 3 levels"
  main_idea: "Asking for child, student and expert levels shows exactly where your understanding stops."
  takeaway: "Ask for three levels of explanation and study the point where it starts to feel hard."
  value: "A copy-paste learning prompt + how to use the result."
  cta: "Save it."
  cta_type: save
  visual_concept: "Three-step staircase: each step is one explanation level, with a flag where it gets hard."
  design:
    headline: "Confused by a topic? Ask AI for 3 levels"
    body:
      - "“Explain [topic] at 3 levels:"
      - "1. To a 10-year-old, in 3 sentences"
      - "2. To a university student, with one example"
      - "3. To an expert: what do beginners get wrong?”"
      - "Read level 1 first. Stop where it gets hard. That's your study point."
    footer: "Works for taxes, physics, marketing or n8n."
    layout: "Light background. Prompt block in the top half. Below, a three-step staircase (small → medium → tall), each step labelled with its level; a small flag on the step marked 'stop here = study here'. Footer bottom."
  caption: |
    Confused by a topic? The fastest way I know to learn it with AI:

    “Explain [topic] at 3 levels:
    1. To a 10-year-old, in 3 sentences
    2. To a university student, with one example
    3. To an expert: what do beginners usually get wrong?”

