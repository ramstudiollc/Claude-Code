- id: D14-R1
  type: reel
  series: AI Myth Check
  pillar: LIT
  format: Green screen + diagram
  topic: "Your AI might be living in the past (training cutoff)"
  objective: "Trust + shares; prevents a common mistake"
  hook: "Your AI might be living in the past."
  main_idea: "Models learn from data up to a cutoff; without web search they can state old information as current."
  value: "Two checks for time-sensitive questions: is search on, and are sources dated?"
  cta: "Follow for more AI Myth Checks."
  cta_type: follow
  visual_concept: "Timeline with a 'cutoff' line; right side greyed; search toggle and dated sources."
  loop: "Ends 'No dates? Then remember:' which flows into the opening 'Your AI might be living in the past.'"
  runtime: 30
  retention:
    hook: "A short, slightly eerie line that makes viewers question answers they've already trusted."
    novelty: "Many users don't know about training cutoffs."
    visual_progression: "A timeline animation with the cutoff line makes an abstract idea visible."
    usefulness: "Two quick checks viewers can apply to every time-sensitive answer."
    rewatch: "The ending line flows straight into the hook."
  script:
    - t: "0-3"
      vo: "Your AI might be living in the past."
      ost: "Living in the past?"
      vis: "Asif on green screen; behind him a chat answer stating an old 'latest version'."
    - t: "3-8"
      vo: "Every AI model learns from data up to a certain date. Its cutoff."
      ost: "Training cutoff"
      vis: "Timeline animation with a cutoff line."
    - t: "8-12.5"
      vo: "After that date, it knows nothing, unless it searches the web."
      ost: "After cutoff: blank"
      vis: "Right side of the timeline greys out."
    - t: "12.5-17"
      vo: "Without search, it can confidently describe old prices as current."
      ost: "Old info, stated as current"
      vis: "Example answer with an outdated price highlighted."
    - t: "17-22"
      vo: "So for news, prices, laws or ‘the latest’ anything, check two things."
      ost: "news · prices · laws · latest"
      vis: "Four icons."
    - t: "22-26.5"
      vo: "Is web search on? And does the answer show sources with dates?"
      ost: "Search on? Dated sources?"
      vis: "Search toggle; source links with dates highlighted."
    - t: "26.5-30"
      vo: "No dates? Then remember:"
      ost: ""
      vis: "Back to frame 1 composition (loop)."
  caption: |
    Your AI might be living in the past.

    Every AI model learns from data up to a cutoff date. After that, it knows nothing unless it searches the web, and without search it can describe old prices, laws or “the latest version” as if they're current.

    For anything time-sensitive, check 2 things:
    1. Is web search on?
    2. Does the answer show sources with dates?

    No dates, no trust.

    Follow for more AI Myth Checks.
  hashtags: [AIliteracy, ChatGPT, AItips]
  sources: []
  production_notes: "Generate a real outdated answer by asking a model with search off about a recent product; show it honestly. Don't single out one brand as 'bad'."

