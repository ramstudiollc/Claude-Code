- id: D15-I1
  type: image
  series: Steal This Prompt
  pillar: PA
  format: Prompt card
  topic: "Don't ask for a summary, ask for decisions"
  objective: "Saves; practical document reading"
  hook: "Don't ask for a summary. Ask for decisions."
  main_idea: "Asking AI for decisions, deadlines, amounts and consequences turns any document into an action list."
  value: "A 4-question document prompt that beats 'summarise this'."
  cta: "Save it for the next long document."
  cta_type: save
  visual_concept: "Long document icon → four question chips → checklist."
  design:
    headline: "Don't ask for a summary. Ask for decisions."
    body:
      - "“Read this document: [paste]."
      - "1. What decisions does it ask me to make?"
      - "2. What are the deadlines and amounts?"
      - "3. What happens if I do nothing?"
      - "4. What should I ask before agreeing?”"
    footer: "A summary tells you what it says. This tells you what to do."
    layout: "Light background. Left: tall document icon with lines. Right: four numbered question chips. Footer band."
  caption: |
    “Summarise this” gives you a shorter document. You still don't know what to do.

    Ask this instead:
    “Read this document: [paste].
    1. What decisions does it ask me to make?
    2. What are the deadlines and amounts?
    3. What happens if I do nothing?
    4. What should I ask before agreeing?”

    Works for school notices, bank letters, client briefs and policy updates.

    Save this for the next long document.
  hashtags: [AItips, productivity, ChatGPT]
  sources: []
  production_notes: "Prompt-card template."

- id: D15-R1
  type: reel
  series: Steal This Prompt
  pillar: PA
  format: Prop demo + screen inserts
  topic: "Can't decide? Make AI build a weighted scorecard"
  objective: "Saves; practical decision tool"
  hook: "Can't decide between two options? Score them."
  main_idea: "Give AI your priorities with weights and the real specs; get a scored table, then ask what would flip the result."
  value: "A decision method for laptops, phones, couriers or job offers that keeps you in control."
  cta: "Save it for your next decision."
  cta_type: save
  visual_concept: "Asif at a table with two real laptop boxes (props) → cut-in screen inserts: weights bar chart, scoring table with totals, 'what would flip it' answer → Asif picks up the winner."
  runtime: 41
  retention:
    hook: "Almost everyone is stuck between two choices at some point; the solution is named immediately."
    visual_progression: "Weights chart, then a scoring table, then highlighted totals."
    usefulness: "Works for any comparison: phones, laptops, couriers, job offers."
    novelty: "The 'what would have to change for A to win?' question is an unusual, smart step."
    payoff: "A clear winner with the reason (battery) shown in the totals."
  script:
    - t: "0-3"
      vo: "Can't decide between two options? Score them."
      ost: "Stuck between two?"
      vis: "Asif holding two laptop boxes."
    - t: "3-7.5"
      vo: "First, tell AI what matters to you, with weights."
      ost: "1 · Your priorities + weights"
      vis: "Screen: priorities typed."
    - t: "7.5-12"
      vo: "Battery forty percent, price thirty, weight twenty, ports ten."
      ost: "40 · 30 · 20 · 10"
      vis: "Animated bar chart of the weights."
    - t: "12-17.5"
      vo: "Second, paste the real specs from the shop pages. Don't trust its memory for specs."
      ost: "2 · Paste the real specs"
      vis: "Specs from two product pages pasted."
    - t: "17.5-22.5"
      vo: "Third: “Score each from one to ten, explain why, and give a weighted total.”"
      ost: "3 · Score · why · total"
      vis: "Scoring table appears."
    - t: "22.5-27"
      vo: "Laptop B wins, 7.6 to 6.9. Mostly because of battery."
      ost: "B wins: 7.6 vs 6.9"
      vis: "Totals highlighted; battery row glows."
    - t: "27-32.5"
      vo: "Fourth, the smart question: “What would have to change for A to win?”"
      ost: "4 · What would flip it?"
      vis: "AI answer appears."
    - t: "32.5-37.5"
      vo: "Now you know the trade-off. You choose, clearly."
      ost: "Clear trade-off"
      vis: "Asif to camera."
    - t: "37.5-41"
      vo: "Works for phones, couriers, job offers. Save it."
      ost: "phones · couriers · job offers"
      vis: "End card."
  caption: |
    Stuck between two options? Make AI build a weighted scorecard.

    1. Your priorities, with weights: “Battery 40%, price 30%, weight 20%, ports 10%.”
    2. Paste the real specs from the shop pages. Don't trust AI's memory for specs or prices.
    3. “Score each option 1–10 on each priority, explain why, and give a weighted total.”
    4. The smart question: “What would have to change for the other option to win?”

    You still choose, but now you know exactly what you're trading.

    Works for phones, laptops, courier services and job offers. Save it.
  hashtags: [AItips, decisionmaking, productivity]
  sources: []
  production_notes: "Use two real laptop listings (no brand logos needed on screen; blur if necessary). Use the actual totals AI returns; the 7.6 vs 6.9 in the script is a placeholder. Update the VO and on-screen text to match your real run."

