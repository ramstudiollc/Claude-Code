    visual_progression: "Weights chart, then a scoring table, then highlighted totals."
    usefulness: "Works for any comparison: phones, laptops, couriers, job offers."
    novelty: "The 'what would have to change for A to win?' question is an unusual, smart step."
    payoff: "A clear winner with the reason (battery) shown in the totals."
  script:
    - t: "0-3"
      vo: "Stuck between two laptops for a week?"
      ost: "Stuck between two?"
      vis: "Asif holding two laptop boxes."
    - t: "3-7.5"
      vo: "First, tell AI what matters to you, with weights."
      ost: "1 · Your priorities + weights"
      vis: "Screen: priorities typed."
    - t: "7.5-12"
      vo: "Battery forty percent, price thirty, weight twenty, ports ten."
      ost: "40 · 30 · 20 · 10"
      vis: "Animated bar chart of the weights."
    - t: "12-17.5"
      vo: "Second, paste the real specs from the shop pages. Don't trust its memory for specs."
      ost: "2 · Paste the real specs"
      vis: "Specs from two product pages pasted."
    - t: "17.5-22.5"
      vo: "Third: “Score each from one to ten, explain why, and give a weighted total.”"
      ost: "3 · Score · why · total"
      vis: "Scoring table appears."
    - t: "22.5-27"
      vo: "Laptop B wins, 7.6 to 6.9. Mostly because of battery."
      ost: "B wins: 7.6 vs 6.9"
      vis: "Totals highlighted; battery row glows."
    - t: "27-32.5"
      vo: "Fourth, the smart question: “What would have to change for A to win?”"
      ost: "4 · What would flip it?"
      vis: "AI answer appears."
    - t: "32.5-37.5"
      vo: "Now you know the trade-off. You choose, clearly."
      ost: "Clear trade-off"
      vis: "Asif to camera."
    - t: "37.5-41"
      vo: "Works for phones, couriers, even job offers."
      ost: "phones · couriers · job offers"
      vis: "End card."
  caption: |
    Stuck between two laptops (or phones, or job offers) for a week? Make AI build a weighted scorecard.

    1. Your priorities, with weights: “Battery 40%, price 30%, weight 20%, ports 10%.”
    2. Paste the real specs from the shop pages. Don't trust AI's memory for specs or prices.
    3. “Score each option 1–10 on each priority, explain why, and give a weighted total.”
    4. The smart question: “What would have to change for the other option to win?”

    You still choose, but now you know exactly what you're trading.

    What are you stuck choosing between right now?
  hashtags: [AItips, decisionmaking, productivity]
  sources: []
  production_notes: "Use two real laptop listings (no brand logos needed on screen; blur if necessary). The 7.6 vs 6.9 totals are example values from a test run; if your recorded run gives different totals, say yours in beat 6 and on screen. The scoring method doesn't change."

- id: D15-I2
  type: image
  series: Automate This
