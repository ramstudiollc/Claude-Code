    1. Copy the exact claim, one sentence
    2. Search it and open 2 sources you already know
    3. Check the date on each
    4. Do they agree? Good.
    5. Only the AI says it? Don't repeat it.

    Especially before forwarding it to a family or office group.

    Send this to a group where people forward everything.
