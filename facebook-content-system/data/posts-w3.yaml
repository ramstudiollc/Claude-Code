- id: D15-R2
  type: reel
  series: Automate This
  pillar: AU
  format: Screen demo + face cam
  topic: "Human-in-the-loop: AI drafts, you tap Approve"
  objective: "Trust in AI automation; buyer education"
  hook: "Don't let AI send messages alone. Do this."
  main_idea: "An n8n workflow drafts replies with AI, then waits for a human Approve/Decline on Telegram before sending; n8n agents can also require approval before using tools."
  value: "A safe pattern for adding AI to customer communication."
  cta: "Follow for more builds."
  cta_type: follow
  visual_concept: "Phone showing a Telegram approval message with buttons → canvas with Gmail trigger, AI node and 'send and wait' node → both branches."
  runtime: 45
  retention:
    hook: "Speaks to a real fear (AI saying the wrong thing to customers) and promises control."
    visual_progression: "Approve and Decline branches light up separately on the canvas."
    novelty: "Most viewers haven't seen AI automation that pauses for a human tap."
    usefulness: "Gives a clear rule for when to use approval: money, customers, reputation."
    payoff: "The 'automate the safe ones later' path shows a sensible way to scale."
  script:
    - t: "0-3"
      vo: "Don't let AI send messages alone. Do this."
      ost: "AI drafts. You approve."
      vis: "Phone: Telegram message with [Approve] [Decline] buttons."
    - t: "3-7.5"
      vo: "This workflow writes a reply to every customer email."
      ost: "AI writes the reply"
      vis: "n8n canvas: Gmail trigger → AI node."
    - t: "7.5-12"
      vo: "But before sending, it stops and asks me on Telegram."
      ost: "Then it waits for me"
      vis: "'Send and wait for response' node highlighted."
    - t: "12-17"
      vo: "I see the customer's message, the AI's reply, and two buttons."
      ost: "Approve · Decline"
      vis: "Phone close-up of the approval message."
    - t: "17-21.5"
      vo: "Approve, and it sends. Decline, and nothing goes out."
      ost: "✓ sends · ✗ stops"
      vis: "Both branches animate on the canvas."
    - t: "21.5-27"
      vo: "It's called human-in-the-loop. In n8n, even AI agents can ask before using a tool."
      ost: "Human-in-the-loop"
      vis: "AI Agent node with tool-approval setting shown."
    - t: "27-32"
      vo: "Use it for anything that touches money, customers or your reputation."
      ost: "money · customers · reputation"
      vis: "Three icons."
    - t: "32-37"
      vo: "After a few weeks, you'll know which replies are safe to automate fully."
      ost: "Then automate the safe ones"
      vis: "Asif to camera."
    - t: "37-42"
      vo: "That's how you add AI without the scary part."
      ost: "AI, without the scary part"
      vis: "Asif smiles."
    - t: "42-45"
      vo: "Follow for more builds like this."
      ost: "Follow"
      vis: "End card."
  caption: |
    Don't let AI send messages to customers on its own. Add a human tap.

    This n8n workflow:
    1. A customer email arrives
    2. AI drafts a reply
    3. The workflow pauses and sends me the draft on Telegram with Approve / Decline buttons
    4. Approve → it sends. Decline → nothing goes out.

    It's called human-in-the-loop. Newer n8n versions also let an AI agent ask for approval before it uses a tool.

    Use it for anything that touches money, customers or your reputation. After a few weeks you'll see which replies are safe to automate fully.

    Follow for more builds.
  hashtags: [n8n, AIautomation, humanintheloop]
  sources: [n8n_release_2x]
  production_notes: "Build on a demo Gmail account. Use the Telegram 'send message and wait for response' approval pattern. Show the agent tool-approval option only if your n8n version has it (2.6+); confirm before filming."

