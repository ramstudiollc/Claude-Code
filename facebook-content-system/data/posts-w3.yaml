- id: D21-R2
  type: reel
  series: AI Myth Check
  pillar: LIT
  format: Green screen + talking head
  topic: "Is this viral photo real? Check the source, not the hands"
  objective: "Shares; protects the audience from AI fakes"
  hook: "Stop checking the hands. Check the source."
  main_idea: "AI images now get details right; tracing the image's origin, trusted outlets, dates and AI labels is more reliable."
  value: "A 4-step check using Google Lens + the rule 'can't trace it, don't share it'."
  cta: "Send it to the group that shares everything."
  cta_type: share
  visual_concept: "Asif on green screen in front of a labelled AI-generated example image → Lens search results → calendar → 'AI info' label mock."
  runtime: 42
  retention:
    hook: "Contradicts popular advice (look at the hands), which immediately raises curiosity."
    novelty: "Updates an outdated tip that many people still rely on."
    usefulness: "Four steps doable on any phone with Google Lens."
    relatability: "Everyone has a family or office group that forwards viral photos."
    save_share: "The closing CTA is tailored for group sharing."
  script:
    - t: "0-3"
      vo: "Stop checking the hands. Check the source."
      ost: "Don't zoom. Trace it."
      vis: "Asif; a viral-style image on screen with a small 'AI-generated example' label."
    - t: "3-8"
      vo: "Old advice: look for extra fingers. New AI images get hands right."
      ost: "Extra fingers? Not anymore."
      vis: "Zoom on correct-looking hands in the example."
    - t: "8-13"
      vo: "So ask a better question: where did this picture come from?"
      ost: "Where did it come from?"
      vis: "Question mark animation."
    - t: "13-18.5"
      vo: "Long-press it, search with Google Lens, and look for the earliest result."
      ost: "1 · Search it with Lens"
      vis: "Own screen recording of a Lens search."
    - t: "18.5-23.5"
      vo: "Two: is any trusted news outlet showing the same thing?"
      ost: "2 · Trusted outlet?"
      vis: "News icon."
    - t: "23.5-28.5"
      vo: "Three: check the date. Many fakes are real photos from years ago."
      ost: "3 · Old photo, new story?"
      vis: "Calendar flips back years."
    - t: "28.5-34"
      vo: "Four: look for an ‘AI info’ label. Meta adds it when it detects AI."
      ost: "4 · ‘AI info’ label"
      vis: "Drawn label mock."
    - t: "34-39"
      vo: "No label doesn't prove it's real. Can't trace it? Don't share it."
      ost: "Can't trace it? Don't share."
      vis: "Asif to camera."
    - t: "39-42"
      vo: "Send this to the group that shares everything."
      ost: "Send to that group"
      vis: "End card."
  caption: |
    Stop zooming in on the hands. New AI images get them right. Check the source instead:

    1. Long-press the image → search with Google Lens → look for the earliest result
    2. Is any trusted news outlet showing the same thing?
    3. Check the date. Many “new” fakes are real photos from years ago.
    4. Look for an “AI info” label. Meta adds it when it detects AI signals or the poster discloses it.

    No label doesn't prove it's real. Can't trace it? Don't share it.

    Send this to the group that shares everything.
  hashtags: [factcheck, AIliteracy, deepfake]
  sources: [meta_ai_label]
  production_notes: "Generate your own example image and keep an 'AI-generated example' label on it the whole time. Never use a real viral fake (it spreads it further)."
