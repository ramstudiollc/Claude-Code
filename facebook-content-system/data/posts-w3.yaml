- id: D16-R2
  type: reel
  series: Steal This Prompt
  pillar: PA
  format: Numbered list + talking head
  topic: "The 4-part prompt: goal, context, example, format"
  objective: "Saves; core prompting framework"
  hook: "Good prompts have four parts. Yours has one."
  main_idea: "Most prompts contain only the task; adding goal, context, example and format produces dramatically better results."
  value: "A memorable framework (G-C-E-F) demonstrated on a real promo post."
  cta: "Save it."
  cta_type: save
  visual_concept: "Four letter blocks G, C, E, F fill one by one; before/after split at the end."
  runtime: 43
  retention:
    hook: "A mild challenge ('yours has one') makes viewers check their own habit."
    visual_progression: "Four letter blocks fill in sequence, each with a typed example."
    payoff: "The before/after split shows the difference visually."
    usefulness: "A four-part checklist that applies to any prompt."
    save_share: "Framework content gets saved for later reference."
  script:
    - t: "0-3"
      vo: "Good prompts have four parts. Yours has one."
      ost: "4 parts. You use 1."
      vis: "Asif; screen shows 'Write a post about my discount'."
    - t: "3-7"
      vo: "“Write a post about my discount.” That's just the task."
      ost: "Task only"
      vis: "Weak generic output appears."
    - t: "7-12"
      vo: "Part one, goal: what's it for, and who reads it?"
      ost: "G · Goal"
      vis: "Letter block G fills."
    - t: "12-16"
      vo: "“Get mothers in Dhaka to order before Friday.”"
      ost: "who + what action"
      vis: "Goal typed under G."
    - t: "16-21"
      vo: "Part two, context: the facts it can't guess. Price, product, delivery."
      ost: "C · Context"
      vis: "Block C fills; facts typed."
    - t: "21-26"
      vo: "Part three, example: paste a post that worked before."
      ost: "E · Example"
      vis: "Block E fills; example pasted."
    - t: "26-31"
      vo: "Part four, format: three options, under fifty words, one emoji max."
      ost: "F · Format"
      vis: "Block F fills."
    - t: "31-35"
      vo: "Same task, four parts. Look at the difference."
      ost: "Before → After"
      vis: "Split screen: weak output vs strong output."
    - t: "35-40"
      vo: "Goal, context, example, format. Add the ones you're missing."
      ost: "G · C · E · F"
      vis: "Four blocks line up."
    - t: "40-43"
      vo: "Save this for your next prompt."
      ost: "Save it"
      vis: "End card."
  caption: |
    Most prompts are just a task: “Write a post about my discount.” Good prompts have 4 parts:

    G: Goal: what's it for and who reads it? “Get mothers in Dhaka to order before Friday.”
    C: Context: facts it can't guess. Product, price, delivery, offer end date.
    E: Example: paste a post that worked before.
    F: Format: “3 options, under 50 words, max one emoji.”

    You don't need all 4 every time. Add the ones you're missing.

    Save this for your next prompt.
  hashtags: [AItips, PromptTips, ChatGPT]
  sources: []
  production_notes: "List template with 4 letter blocks. Generate both outputs live. Use a fictional shop and discount."

