    3. Never rename a column without telling whoever built the automation
    4. Dates in one format (2026-10-31), phone numbers stored as text so the leading 0 stays
    5. Add an ID column so nothing gets counted twice

    A clean sheet is half the automation.

    Save this before you share a sheet with anyone who automates.
  hashtags: [GoogleSheets, automation, n8n]
  sources: []
  production_notes: "Spreadsheet-mock template. Use fictional data; Bangladeshi phone format shown as text with leading 0."

