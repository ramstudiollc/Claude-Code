- id: D16-I1
  type: image
  series: Work With Me
  pillar: SVC
  format: FAQ card
  topic: "Will automation cost me every month? Honest answer"
  objective: "Remove a buying objection; Messenger leads"
  hook: "“Will automation cost me every month?” Honest answer"
  main_idea: "Running cost has four parts (hosting, AI usage, paid apps, maintenance); some setups run very cheaply."
  value: "A transparent cost breakdown and a promise of an estimate before building."
  cta: "Message 'AUTOMATE' for an estimate."
  cta_type: message
  visual_concept: "Receipt-style card listing four cost lines."
  design:
    headline: "“Will automation cost me every month?” Honest answer"
    body:
      - "1. Where it runs: an n8n Cloud plan, or your own server."
      - "2. AI usage: you pay the AI provider per use. Usually small at low volume."
      - "3. Paid apps: some tools you connect need their own plan."
      - "4. Maintenance: occasional fixes when apps change."
      - "No AI and self-hosted? Running costs can be very low."
    footer: "You get an estimate before any build. Message “AUTOMATE”."
    layout: "Light background. Receipt-style card (zig-zag bottom edge) with four line items and a 'TOTAL: depends on your setup' line. Footer CTA bar below the receipt."
  caption: |
    The question I get most: “Will this cost me every month?”

    Honest answer: it depends on 4 things.
    1. Where it runs: an n8n Cloud plan, or your own server (self-hosted)
    2. AI usage: if the workflow uses AI, you pay the AI provider per use. At low volume it's usually small.
    3. Paid apps: some tools you connect need their own subscription
    4. Maintenance: apps change, and occasionally something needs a fix

    No AI and self-hosted? Running costs can be very low.

    I give an estimate before building anything. Message me “AUTOMATE”.
  hashtags: [n8n, automation, smallbusiness]
  sources: [n8n_choose]
  production_notes: "Don't add prices to the image (they change and vary by country). Give real numbers only in private quotes."

