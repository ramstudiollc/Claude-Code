  takeaway: "A task with fixed steps, copy-paste, high frequency, costly mistakes or someone waiting is worth automating."
  value: "A self-scoring checklist (3+ signs = strong candidate) and the honest exception."
  payoff: "28–38 s: three or more signs means automate; needs judgment means keep it human."
  cta: "Comment which task scored highest."
  cta_type: question
  visual_concept: "Counter graphic 1–5 with icons; tally at the end; 'keep it human' card."
  runtime: 43
  retention:
    hook: "Calls out a daily chore viewers do and reframes it as a machine's job, which is mildly provocative and relatable."
    relatability: "Copy-pasting from Messenger to a sheet and waiting customers are daily realities for sellers."
    usefulness: "Viewers can score their own tasks right away (3+ = automate)."
    visual_progression: "A new numbered icon every ~4.5 s; tally animation at the end."
    payoff: "The 'keep it human' exception adds an honest twist that builds trust."
  script:
    - t: "0-3"
      vo: "Copy-pasting daily? That's a machine's job."
      ost: "Copy-paste daily = machine's job"
      vis: "Asif copy-pasting between two windows, then stops and looks at camera."
    - t: "3-5.5"
      vo: "Five signs to check."
      ost: "5 signs"
      vis: "Counter graphic appears."
    - t: "5.5-10"
      vo: "One: the steps are the same every time. Same apps, same order."
      ost: "1 · Same steps"
      vis: "Icon 1 with repeating arrows."
    - t: "10-14.5"
      vo: "Two: you copy-paste between apps. Messenger to sheet, sheet to email."
      ost: "2 · Copy-paste between apps"
      vis: "Animated cursor copy-pasting between two windows."
    - t: "14.5-18.5"
      vo: "Three: it happens every day or every week."
      ost: "3 · Daily or weekly"
      vis: "Calendar pages flip."
    - t: "18.5-23.5"
      vo: "Four: a small mistake costs you. A wrong price, a missed order."
      ost: "4 · Mistakes cost money"
      vis: "Red alert icon."
    - t: "23.5-28"
      vo: "Five: someone is waiting. A customer, a boss, a delivery man."
      ost: "5 · Someone is waiting"
      vis: "Clock ticking icon."
    - t: "28-33.5"
      vo: "Three or more signs? That task is a strong candidate."
      ost: "3+ signs = automate"
      vis: "Tally marks animate 1-2-3."
    - t: "33.5-38"
      vo: "But if it needs your judgment every single time, keep it human."
      ost: "Needs judgment? Keep it human."
      vis: "Asif to camera."
    - t: "38-43"
      vo: "Which task scored highest for you? Tell me below."
      ost: "Your task? ↓"
      vis: "End card."
  caption: |
    Copy-pasting the same thing every day? That's a machine's job. 5 signs a task should be automated:

    1. The steps are the same every time
    2. You copy-paste between apps (Messenger → sheet → email)
    3. It happens daily or weekly
    4. A small mistake costs money (wrong price, missed order)
    5. Someone is waiting (customer, boss, delivery)

    3 or more? Strong candidate.
    Needs your judgment every time? Keep it human. Automation handles rules; decisions stay with you.

    Which task scored highest for you?
