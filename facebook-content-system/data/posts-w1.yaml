    1) Trigger: something happens (a message, a form, 9 AM).
    2) Steps: what should happen next (save, check, write).
    3) Result: someone gets something (a reply, an alert, a file).

    If a task starts the same way and ends the same way every time, it can usually be automated.

    What's one task you repeat every day? Write it below and I'll reply with its trigger, steps and result.
