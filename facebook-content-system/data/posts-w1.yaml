- id: D05-R2
  type: reel
  series: Steal This Prompt
  pillar: PA
  format: Screen demo + face cam
  topic: "Spreadsheet formulas from plain English, plus the 3-row test"
  human_problem: "Needing a total from a spreadsheet but not knowing the formula."
  objective: "Saves + practical win for office workers and sellers"
  hook: "Can't write Excel formulas? Describe them instead."
  open_loop: "What's the part most people skip? (held until 17.5 s)"
  main_idea: "Describe the goal, columns and rows; get a formula with an explanation; always test on rows you can check by hand."
  takeaway: "Describe the result you need and test the AI's formula on rows you can check by hand."
  value: "Prompt template + the testing habit that makes AI formulas trustworthy."
  payoff: "21–31 s: the 3-row test proves the formula before it touches 500 rows."
  cta: "Save it for your next spreadsheet."
  cta_type: save
  visual_concept: "Google Sheet order list; AI prompt and answer; 3 highlighted rows with hand math overlay; green tick."
  runtime: 44
  retention:
    hook: "Speaks to a common insecurity (formulas) and removes it in one line."
    problem_solution: "A real sales question goes from blank to answered on screen."
    curiosity: "'The part most people skip' at second 17 holds viewers for the twist."
    payoff: "The formula result matches the hand-checked 4,500 with a green tick."
    save_share: "Prompt template in the caption is reusable for any spreadsheet question."
  script:
    - t: "0-3"
      vo: "Can't write Excel formulas? Describe them instead."
      ost: "Describe it. Don't memorise it."
      vis: "Asif face; a messy sheet behind him."
    - t: "3-7.5"
      vo: "Here's my order sheet: date, amount, status. I want October's delivered sales."
      ost: "Goal: Oct delivered sales"
      vis: "Screen: sheet with columns A Date, B Amount, C Status."
    - t: "7.5-13"
      vo: "So I tell AI exactly that, plus the column letters and where data starts."
      ost: "Say: goal + columns + rows"
      vis: "Prompt typed (same as caption)."
    - t: "13-17.5"
      vo: "It gives a formula, and explains each part in plain words."
      ost: "Formula + explanation"
      vis: "AI answer with SUMIFS formula; explanation lines highlighted."
    - t: "17.5-21"
      vo: "Now the important part most people skip."
      ost: "The part people skip ↓"
      vis: "Asif leans in."
    - t: "21-26.5"
      vo: "Test it on three rows you can check by hand. Here, I expect 4,500."
      ost: "Test on 3 rows"
      vis: "3-row test copy highlighted; overlay 1,200 + 2,000 + 1,300 = 4,500."
    - t: "26.5-31"
      vo: "It says 4,500. Now I can trust all 500 rows."
      ost: "✓ 4,500 = 4,500"
      vis: "Cell shows 4,500; green tick animation."
    - t: "31-36.5"
      vo: "If it's wrong, paste the error or the wrong result back. It fixes it."
      ost: "Wrong? Paste it back"
      vis: "Screen: error pasted into chat; corrected formula returned."
    - t: "36.5-41"
      vo: "Works in Google Sheets and Excel. The prompt is in the caption."
      ost: "Prompt in caption ↓"
      vis: "Asif points down."
    - t: "41-44"
      vo: "Save it for your next spreadsheet."
      ost: "Save for later"
      vis: "End card."
  caption: |
    Can't write spreadsheet formulas? Describe them instead.

    Prompt:
    “I have a sheet. Column A = order date, B = amount, C = status. Data is in rows 2–500. Write a Google Sheets formula for the total amount of orders with status ‘Delivered’ in October 2026. Explain each part in one line.”

    Then the step most people skip: test it on 3 rows where you already know the answer. If it matches, use it on the full sheet. If not, paste the wrong result back and ask it to fix the formula.

    Works for Excel too. Just say “Excel” instead.

    The 3-row test is the habit worth keeping. It works for any formula.
  hashtags: [GoogleSheets, Excel, AItips]
  sources: []
  production_notes: "Build a demo sheet with fake orders. Make a separate 3-row test tab where the known total is 4,500 (1,200 + 2,000 + 1,300, all Delivered, all October). Record the real AI answer; if the formula differs from SUMIFS, show what you actually got."

