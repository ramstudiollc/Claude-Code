- id: D06-I1
  type: image
  series: AI Myth Check
  pillar: AU
  format: Myth vs fact
  topic: "Myth: you need to code to automate"
  human_problem: "Believing automation is only for programmers."
  objective: "Lower the barrier; educate future buyers"
  hook: "Myth: you need to code to automate"
  main_idea: "Visual tools make automation about process thinking, not code; AI now writes the small code bits."
  takeaway: "If you can write a process down step by step, you can learn to automate it with visual tools."
  value: "Reframes the real skill (thinking in steps) and what you actually need."
  cta: "None. The closing line is the takeaway."
  cta_type: none
  visual_concept: "Myth (crossed out) vs Fact panels; small node-graph illustration."
  design:
    headline: "Myth: you need to code to automate"
    body:
      - "FACT: Tools like n8n, Make and Zapier are visual. You connect boxes."
      - "You need: a clear process, the apps' logins, and patience to test."
      - "Code helps for edge cases. AI can now write those small bits."
      - "The real skill is thinking in steps: trigger → steps → result."
    footer: "Can you write the steps on paper? You can learn to automate them."
    layout: "Top band red-tinted: 'MYTH' tag + headline with strike-through on 'you need to code'. Lower area green-tinted: 'FACT' rows. Small node-graph doodle bottom-right."
  caption: |
    Myth: you need to be a programmer to automate your work.

    Fact: n8n, Make and Zapier are visual tools. You connect boxes: “when this happens → do this → then this”.

    What you actually need:
    • a clear process (write it on paper first)
    • logins to the apps involved
    • patience to test with fake data

    Code helps with edge cases, and AI can now write those small pieces for you.

    If you can write the steps down, you can learn to automate them.
  hashtags: [automation, nocode, n8n]
  sources: []
  production_notes: "Myth-vs-fact template. Tool names as plain text, no logos."

