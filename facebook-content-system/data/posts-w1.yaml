- id: D07-R2
  type: reel
  series: Before → After
  pillar: PA
  format: Before/after split screen
  topic: "Write emails that don't sound like AI"
  human_problem: "Sending AI-written emails that sound stiff and fake to the people reading them."
  objective: "Saves + relatability for professionals"
  hook: "People can tell your email came from AI."
  open_loop: "What gives it away, and how do you fix it?"
  main_idea: "AI fills space with safe, long, polite filler; notes + your own sample + hard limits fix it."
  takeaway: "Give AI your notes, one real email you wrote and a word limit, then read the result aloud."
  value: "Three rules + read-aloud test + prompt in caption."
  payoff: "26–36.5 s: a half-length rewrite that sounds human, plus the read-aloud test."
  cta: "Save the prompt."
  cta_type: save
  visual_concept: "Generic email with filler highlighted in yellow → rewritten short email; split before/after."
  runtime: 40
  retention:
    hook: "Calls out something people suspect about their own emails, which creates mild discomfort and curiosity."
    relatability: "'I hope this email finds you well' is instantly recognised."
    problem_solution: "Three numbered rules, each shown on screen, then the fixed email."
    payoff: "Before/after: half the length and clearly human."
    save_share: "The prompt in the caption is reusable for every email."
  script:
    - t: "0-3"
      vo: "People can tell your email came from AI."
      ost: "They can tell."
      vis: "Asif reads a long generic email, winces."
    - t: "3-7.5"
      vo: "“I hope this email finds you well.” Nobody talks like that."
      ost: "“I hope this finds you well…”"
      vis: "Phrase highlighted in yellow."
    - t: "7.5-12"
      vo: "AI fills empty space with polite, safe, long sentences."
      ost: "polite · safe · long"
      vis: "More filler phrases highlight one by one."
    - t: "12-17"
      vo: "Fix it with three rules. One: give it your rough notes, not a topic."
      ost: "1 · Your notes, not a topic"
      vis: "Bullet notes typed."
    - t: "17-21.5"
      vo: "Two: paste one real email you wrote, so it copies your voice."
      ost: "2 · One email you wrote"
      vis: "Sample email pasted."
    - t: "21.5-26"
      vo: "Three: set limits. Under 100 words. No opening small talk."
      ost: "3 · Under 100 words"
      vis: "Limits typed."
    - t: "26-31.5"
      vo: "Before and after. Same message, half the length, and it sounds like a person."
      ost: "Before → After"
      vis: "Split screen: long generic email vs short clear one."
    - t: "31.5-36.5"
      vo: "Last step: read it out loud. If you wouldn't say it, delete it."
      ost: "Read it out loud"
      vis: "Asif mouthing the email."
    - t: "36.5-40"
      vo: "The prompt is in the caption. Save it."
      ost: "Prompt ↓ Save it"
      vis: "End card."
  caption: |
    People can tell when an email came from AI. It fills empty space with safe, polite, long sentences.

    Fix it with 3 rules:
    1. Give it your rough notes, not a topic
    2. Paste one real email you wrote, so it copies your voice
    3. Set limits: under 100 words, no opening small talk

    Prompt:
    “Write an email from these notes: [notes]. Match the style of this email I wrote: [paste]. Under 100 words. No ‘I hope this finds you well’. Plain, direct, friendly.”

    Then read it out loud. If you wouldn't say it, delete it. The prompt works for every email, so keep it handy.
  hashtags: [emailtips, AItips, productivity]
  sources: []
  production_notes: "Use a realistic but fictional email (supplier delay). Generate the 'before' with a bare prompt and the 'after' with the caption prompt, live."
