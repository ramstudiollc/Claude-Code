- id: D02-R2
  type: reel
  series: AI Myth Check
  pillar: LIT
  format: Green screen + diagram
  topic: "Why AI makes things up (and the one prompt that catches it)"
  human_problem: "Trusting a confident AI answer and repeating something that turns out to be fake."
  objective: "Trust + shares; teaches safe use"
  hook: "AI gave me a source. It doesn't exist."
  open_loop: "Why would AI invent a source that doesn't exist?"
  main_idea: "AI predicts likely words, so it can produce realistic-looking fake sources; grounding + asking for exact quotes catches it."
  takeaway: "AI predicts likely words, so ask it to quote the exact line behind every claim."
  value: "Simple explanation of hallucination, the five hot-spot types, and the 'quote the exact line' check."
  payoff: "3–16 s: it predicts what a source looks like; 25–35 s: the quote-the-line check catches it."
  cta: "Follow for more AI Myth Checks."
  cta_type: follow
  visual_concept: "Asif over a green-screen of a chat containing a fake citation; animated 'next-word' probability bars; 'NOT FOUND' stamp."
  runtime: 40
  retention:
    hook: "A personal, specific failure (a source that doesn't exist) that every AI user fears and wants explained."
    curiosity: "Viewers want to know why a tool would invent something; the reason arrives at second 3."
    visual_progression: "A fake citation assembles piece by piece, then gets stamped NOT FOUND."
    usefulness: "Ends with a concrete check prompt viewers can use today."
    novelty: "Most people think AI 'searches' facts; learning it predicts words reframes every answer they've seen."
    save_share: "Strong 'send to a friend who trusts ChatGPT blindly' energy."
  script:
    - t: "0-3"
      vo: "AI gave me a source. It doesn't exist."
      ost: "A source that doesn't exist"
      vis: "Asif holding his phone: an AI answer with a neat book citation; quick cut to an empty search result."
    - t: "3-7"
      vo: "It wasn't lying. It predicts the next likely word."
      ost: "It predicts the next word"
      vis: "Animation: a sentence builds word by word with small probability bars."
    - t: "7-12.5"
      vo: "Ask for a source it doesn't have, and it predicts what a source looks like."
      ost: "predicts what a source LOOKS like"
      vis: "A citation assembles: author → title → year → page."
    - t: "12.5-16"
      vo: "Real-looking author. Real-looking title. Doesn't exist."
      ost: "looks real ≠ is real"
      vis: "Search result page → 'NOT FOUND' stamp."
    - t: "16-20"
      vo: "That's a hallucination. Confident, fluent, and wrong."
      ost: "Hallucination = confident + wrong"
      vis: "Label slides in; Asif points at it."
    - t: "20-25"
      vo: "It happens most with exact numbers, dates, quotes, links and laws."
      ost: "numbers · dates · quotes · links · laws"
      vis: "Five icons pop in sequence."
    - t: "25-30"
      vo: "The fix: turn on web search, or give it your own document."
      ost: "Fix: search ON or give it the source"
      vis: "Screen recording: toggling search; uploading a PDF."
    - t: "30-35"
      vo: "Then ask: “Quote the exact line you used for each claim.”"
      ost: "“Quote the exact line for each claim.”"
      vis: "Typed prompt; answer shows quoted lines highlighted."
    - t: "35-40"
      vo: "No quote, no trust. Follow for more AI myth checks."
      ost: "No quote = no trust"
      vis: "Asif to camera; series tag 'AI Myth Check'."
  caption: |
    AI gave me a perfect-looking source. It doesn't exist.

    Language models generate the most likely next words. Ask for a source they don't have, and they can generate something that looks like a source: real-looking author, real-looking title, doesn't exist. That's a hallucination.

    Highest risk: exact numbers, dates, quotes, links and laws.

    The check I use:
    1. Turn on web search, or upload the document yourself.
    2. Ask: “Quote the exact line you used for each claim.”
    No quote, no trust.

    Follow for more AI Myth Checks.
