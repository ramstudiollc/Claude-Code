  type: image
  series: Automate This
  pillar: AU
  format: Decision tree
  topic: "Automate, delegate or delete? A 3-question filter"
  human_problem: "A to-do list full of repetitive tasks, and no idea which ones are worth automating."
  objective: "Saves + set the page's practical tone on Day 1"
  hook: "Automate it, delegate it, or delete it?"
  main_idea: "Before automating a task, check if it should exist and if its steps are fixed."
  takeaway: "Before automating a task, check that it should exist and that its steps are fixed."
  value: "A 3-question filter that stops people from automating broken or pointless processes."
  cta: "Save it and run your own to-do list through it."
  cta_type: save
  visual_concept: "Clean vertical decision tree with three diamond questions and colour-coded exits."
  design:
    headline: "Automate it, delegate it, or delete it?"
    subhead: "Ask these 3 questions before you build anything."
    body:
      - "1. Does this task need to happen at all? No → DELETE it."
      - "2. Are the steps the same every time? No → a person does it."
      - "3. Does it happen every week or more? Yes → AUTOMATE it."
    footer: "Automation makes a good process faster. It makes a bad process fail faster."
    layout: "Dark background. Headline top (2 lines). Three stacked diamond nodes down the centre; a 'No' arrow from each to a coloured tag on the right (red DELETE, amber PERSON, grey CHECKLIST for Q3 'No'); 'Yes' arrows go down; final green AUTOMATE pill at the bottom. Footer in small italic above the bottom margin."
  caption: |
    Before you automate anything, ask if it should exist at all.

    The 3-question filter I'd use before building any workflow:
    1. Does this task need to happen? If not, delete it.
    2. Are the steps the same every time? If not, a person should do it (or write the rules first).
    3. Does it happen every week or more? Then automation pays back the setup time.

    Automating a messy process just makes the mess faster.

    Run your to-do list through it this week. You might delete a task before you automate one.
  hashtags: [automation, productivity, n8n]
