      vo: "What if they order twice by mistake?"
      ost: "What if: ordered twice?"
      vis: "Third branch."
    - t: "19.5-24"
      vo: "What if they write in Bangla, with a voice note?"
      ost: "What if: voice note?"
      vis: "Fourth branch."
    - t: "24-29.5"
      vo: "For each one, pick a rule: ask the customer, wait, or alert a person."
      ost: "ask · wait · alert a person"
      vis: "Rule tags written on each branch."
    - t: "29.5-34.5"
      vo: "Ten minutes on paper saves days of fixing later."
      ost: "10 min on paper"
      vis: "Full map revealed."
    - t: "34.5-39.5"
      vo: "This map is the first thing I ask clients to make with me."
      ost: "Step 1 of every project"
