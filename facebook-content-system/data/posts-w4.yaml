- id: D23-I1
  type: image
  series: Automate This
  pillar: AU
  format: Checklist
  topic: "Your automation's keys are passwords: 5 security rules"
  objective: "Authority; protects DIY builders and buyers"
  hook: "Your automation's keys are passwords. Treat them that way."
  main_idea: "API keys, tokens and webhook URLs must be stored in credentials, never shown, minimally scoped, revoked if leaked, and verified on incoming webhooks."
  value: "Five concrete security rules for anyone building or buying automations."
  cta: "Send it to someone who builds automations."
  cta_type: share
  visual_concept: "Key icon with a padlock; five rule rows with shield icons."
  design:
    headline: "Your automation's keys are passwords. Treat them that way."
    body:
      - "Store keys in n8n Credentials, never typed inside a node."
      - "Never post a screenshot with a token or webhook URL visible."
      - "Give each app only the access it needs."
      - "Leaked a key? Revoke it and make a new one. Today."
      - "Check incoming webhooks really come from the sender (signatures)."
    layout: "Dark background. Large key + padlock illustration top. Five rows with shield icons. Series tag top-left. No footer."
  caption: |
    API keys, access tokens and webhook URLs are passwords. 5 rules I follow:

    1. Store them in n8n Credentials, never typed into a Set or Code node
    2. Never post a screenshot or video where a token or webhook URL is visible
    3. Give each app only the access it needs, nothing extra
    4. Leaked a key? Revoke it and create a new one today, not “later”
    5. Check that incoming webhooks really come from the sender (signature checks)

    Most automation “hacks” aren't clever. Someone just found a key.

    Send this to someone who builds automations.
  hashtags: [n8n, cybersecurity, automation]
  sources: []
  production_notes: "Security checklist template. This post reflects the filming rule for this whole plan: no tokens or webhook URLs on screen, ever."

