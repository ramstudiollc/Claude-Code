  objective: "Saves; practical understanding of context limits"
  hook: "Long AI chats get worse. Here's why."
  main_idea: "AI reads chats in tokens within a limit; as a chat grows, early instructions get buried or dropped; summarise and restart."
  value: "A simple mental model (a desk) + a restart-with-summary technique."
  cta: "Save it."
  cta_type: save
  visual_concept: "Real desk + real paper: Asif stacks printed 'messages' on a small desk until the first sheets slide off; then writes a summary card and moves it to a clean desk. Short screen inserts for the prompt."
  runtime: 37
  retention:
    hook: "Names an experience heavy users have noticed but can't explain."
    curiosity: "'Here's why' sets up a simple reveal (tokens and a limit)."
    visual_progression: "Paper-on-a-desk animation makes an invisible limit visible."
    usefulness: "A one-prompt fix viewers can use immediately."
    novelty: "Introduces 'tokens' and 'context limits' in plain language."
  script:
    - t: "0-3"
      vo: "Long AI chats get worse. Here's why."
      ost: "Long chat = worse answers?"
      vis: "Asif scrolling a very long chat."
    - t: "3-8.5"
      vo: "AI reads your chat in small pieces called tokens. And it has a limit."
      ost: "Tokens + a limit"
      vis: "Text breaks into small blocks."
    - t: "8.5-13"
      vo: "Think of it as a desk. Every message adds paper."
      ost: "Chat = a desk"
      vis: "Real desk: Asif adds printed message sheets one by one."
    - t: "13-18"
      vo: "When the desk is full, the oldest papers fall off, or get buried."
      ost: "Old instructions fall off"
      vis: "The first sheets slide off the back of the desk."
    - t: "18-22.5"
      vo: "Your first instructions are often the ones it forgets."
      ost: "First rules forgotten"
      vis: "First message greys out."
    - t: "22.5-28"
      vo: "Fix: ask for a summary. “List the goal, decisions and my preferences in ten bullets.”"
      ost: "Summary: goal · decisions · preferences"
      vis: "Summary appears."
    - t: "28-32"
      vo: "Start a new chat. Paste the summary. Clean desk."
      ost: "New chat + summary"
      vis: "Asif places one handwritten summary card on an empty desk."
    - t: "32-37"
      vo: "Rules you always want? Save them as custom instructions. Save this."
      ost: "Permanent rules → instructions"
      vis: "Settings mock; end card."
  caption: |
    Long AI chats get worse, and it's not your imagination.

    AI reads your chat in small pieces called tokens, and every chat has a limit. Think of a desk: every message adds paper. When it's full, older papers get buried or fall off, and often the first instructions you gave are the ones it forgets.

    Fix:
    1. “Summarise the goal, the decisions so far and my preferences in 10 bullets.”
    2. Start a new chat and paste the summary.
    3. Rules you always want → save them as custom instructions (or a skill).

    Save this.
