      vo: "Most frustration comes from using the first tool for the last job."
      ost: "Wrong tool = frustration"
      vis: "Asif to camera."
    - t: "35-40"
      vo: "Chat answers once. Automation keeps working."
      ost: "Chat answers once"
      vis: "Two cards side by side."
