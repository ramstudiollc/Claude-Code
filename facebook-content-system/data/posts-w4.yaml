    Not every AI task belongs in a chatbot. Quick map:

    • Drafting, rewriting, brainstorming → a normal AI chat
    • Today's prices, news, anything recent → chat with web search ON, then check the sources
    • Questions about your own documents → a notebook tool like Gemini Notebook
    • A real object or screen → voice + camera (Gemini Live)
    • Anything that must happen every day without you → automation (n8n)

    Chat answers once. Automation keeps working.

    Save this map. Which one do you use least?
