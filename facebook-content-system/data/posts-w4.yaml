    payoff: "The 'chat answers once, automation keeps working' line ties it together."
    save_share: "A reference map people save and revisit."
  script:
    - t: "0-3"
      vo: "Not every AI task belongs in a chatbot."
      ost: "Right tool, right job"
      vis: "Asif holding five cards."
    - t: "3-8"
      vo: "Drafting, rewriting, brainstorming? A normal AI chat is perfect."
      ost: "Draft · rewrite → chat"
      vis: "Card 1."
    - t: "8-13.5"
      vo: "Today's prices, news, or anything recent? Chat with web search on, and check the sources."
      ost: "Recent facts → search ON"
      vis: "Card 2."
    - t: "13.5-19"
      vo: "Questions about your own documents? Use a notebook tool that answers from your files."
      ost: "Your documents → notebook"
      vis: "Card 3."
    - t: "19-24"
      vo: "A real object or screen you can show? Use voice and camera."
      ost: "Show it → camera"
      vis: "Card 4."
